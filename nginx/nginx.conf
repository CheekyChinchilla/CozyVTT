# CozyVTT Nginx Reverse Proxy
# Mounted as /etc/nginx/templates/default.conf.template in the nginx container.
# The image's entrypoint substitutes ${NGINX_MAX_BODY_SIZE} and the two trusted
# proxy lines below (and nothing else; see NGINX_ENVSUBST_FILTER in
# docker-compose.yml) and writes the result to /etc/nginx/conf.d/default.conf
# at startup. The trusted proxy lines come from NGINX_TRUSTED_PROXIES in .env,
# through nginx/trusted-proxies.envsh.
#
# When you change this file, or another file docker-compose.yml mounts into the
# nginx container (nginx/locations.conf, nginx/trusted-proxies.envsh), set NGINX_CONF_STAMP in docker-compose.yml to the value the
# backend test keepInStep.test.ts prints (their hash), or a running instance
# keeps the old config after `docker compose up -d --build`.
#
# SSL / HTTPS:
#   1. Place certs in nginx/certs/ (server.crt + server.key)
#   2. Copy the nginx/conf.d/https.conf example from docs/DEPLOYMENT.md
#   You do not edit this file for it; see the end of the file.
#
# Cloudflare Tunnel / external TLS termination:
#   When an upstream proxy (Cloudflare Tunnel, Traefik, Caddy, etc.) terminates
#   TLS before reaching this Nginx, the connection from that proxy to Nginx is HTTP.
#   List that proxy's address in NGINX_TRUSTED_PROXIES in .env: the $real_proto
#   variable below then passes through its X-Forwarded-Proto header, so that
#   Express identifies the original connection as HTTPS and issues session
#   cookies with the Secure flag, and the visitor's own address is taken from
#   its X-Forwarded-For; see set_real_ip_from below.
#
# Let's Encrypt: docs/DEPLOYMENT.md uses certbot --webroot with a folder of
# your own, nginx/conf.d/acme, which a file you put in nginx/conf.d/ serves. The
# challenge location in the port-80 server below is not part of those steps.

# Upload size limit — must be >= the largest MAX_*_SIZE_MB in .env (plus a few MB
# of multipart overhead). Set NGINX_MAX_BODY_SIZE in .env; docker-compose mounts
# this file as an Nginx template and substitutes the value at container start.
# If you run this file directly as a plain config (no template processing),
# replace ${NGINX_MAX_BODY_SIZE} with a literal size such as 55M.
client_max_body_size ${NGINX_MAX_BODY_SIZE};

# Text is compressed on the way out, for every server here, HTTPS included:
# the backend's JSON (map tokens, walls, lights, fog, the roster) shrinks to a
# fraction of its size. The frontend container compresses the app itself;
# pictures, sounds, fonts and archives are compressed already. gzip_proxied
# compresses a request a tunnel in front has passed on, too.
gzip            on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_proxied    any;
gzip_vary       on;
gzip_types      application/json text/css application/javascript image/svg+xml text/plain;

# Error pages and the Server header leave out the nginx version.
server_tokens off;

# Docker's own name server. nginx looks up an address it is given as a
# variable ($cozyvtt_backend and $cozyvtt_frontend, in nginx/locations.conf) when a request
# needs it, keeping the answer for ten seconds. A name written straight into
# proxy_pass is looked up once, when nginx starts, so recreating only the
# backend or frontend container left nginx sending to an address nobody had
# any more, and the site answered 502 until nginx was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# The visitor's address, when a tunnel or another proxy stands in front of this
# one. Every request then reaches this nginx from that proxy's address, and the
# backend's per-address limits (five failed sign-ins in fifteen minutes, among
# others) would count every visitor as one: a few wrong passwords from anyone
# would lock everyone out. A proxy names its visitor in X-Forwarded-For, but
# anyone can send that header, so it is believed only on a connection from an
# address trusted here: loopback, and whatever NGINX_TRUSTED_PROXIES in .env
# lists (rendered into the line below it by nginx/trusted-proxies.envsh). A
# visitor connecting from anywhere else keeps their own address, whatever the
# header says.
#
# Nothing else is trusted by default, private ranges included: Docker relays a
# visitor who connects over IPv6 to an IPv4-only network from its own gateway,
# a private address, so trusting the private ranges let such a visitor choose
# the address the limits counted. A tunnel on this server reaches nginx from
# that same gateway, so it needs its line in .env, for example
# NGINX_TRUSTED_PROXIES=172.16.0.0/12; docs/DEPLOYMENT.md explains how to tell.
#
# real_ip_recursive reads the header from the right, past every trusted
# address, and takes the first address that is not one: the visitor as the
# outermost trusted proxy saw them.
#
# Each location in nginx/locations.conf then hands the backend that one
# address in X-Forwarded-For, which is where the backend (trusting exactly one
# proxy, this one) reads it.
set_real_ip_from  127.0.0.1;
set_real_ip_from  ::1;
${NGINX_REAL_IP_FROM}
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# Whether this connection comes from one of those trusted addresses, judged
# by the address it really came from.
geo $realip_remote_addr $cozyvtt_trusted_proxy {
    default   0;
    127.0.0.1 1;
    ::1       1;
    ${NGINX_TRUSTED_GEO}
}

# The protocol the visitor used, which decides whether the session cookie is
# marked Secure. A trusted proxy that ended HTTPS itself says so in
# X-Forwarded-Proto (Cloudflare sends "https"); from anyone else the header is
# ignored, and the protocol is that of the connection to this nginx ($scheme,
# "https" when this nginx serves HTTPS itself).
map "$cozyvtt_trusted_proxy:$http_x_forwarded_proto" $real_proto {
    default   $scheme;
    "1:https" https;
    "1:http"  http;
}

# ----------------------------------------------------------------
# HTTP
# ----------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Unused by the guide's Let's Encrypt steps. They answer the check from
    # nginx/conf.d/acme, in the port-80 server of your acme.conf and then your
    # https.conf, which takes the request for your domain before this server.
    # Nothing mounts /var/www/certbot into the container, so this location
    # finds no file.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # /api/ and /socket.io/ to the backend, everything else to the frontend.
    include /etc/nginx/cozyvtt/locations.conf;
}

# ----------------------------------------------------------------
# Your own settings: every .conf file in nginx/conf.d/
# ----------------------------------------------------------------
# HTTPS goes here, as a file of your own: docs/DEPLOYMENT.md ("SSL/TLS with
# Let's Encrypt") has a complete nginx/conf.d/https.conf to copy, which
# includes the same proxying rules as the server above. git ignores the
# folder's contents, so nothing you put there stops `git pull`, and nothing
# in this file needs editing. Read after the server above, which stays the
# one that answers requests no other server claims.
include /etc/nginx/cozyvtt.d/*.conf;
