# CozyVTT Nginx Reverse Proxy
# Mounted as /etc/nginx/templates/default.conf.template in the nginx container.
# The image's entrypoint substitutes ${NGINX_MAX_BODY_SIZE} (and nothing else —
# see NGINX_ENVSUBST_FILTER in docker-compose.yml) and writes the result to
# /etc/nginx/conf.d/default.conf at startup.
#
# When you change this file, set NGINX_CONF_STAMP in docker-compose.yml to the
# value the backend test keepInStep.test.ts prints (this file's hash), or a
# running instance keeps the old config after `docker compose up -d --build`.
#
# SSL / HTTPS:
#   1. Place certs in nginx/certs/ (server.crt + server.key)
#   2. Uncomment the HTTPS server block below
#   3. Uncomment the HTTP redirect inside the HTTP block
#
# Cloudflare Tunnel / external TLS termination:
#   When an upstream proxy (Cloudflare Tunnel, Traefik, Caddy, etc.) terminates
#   TLS before reaching this Nginx, the connection from that proxy to Nginx is HTTP.
#   The $real_proto variable below passes through the upstream's X-Forwarded-Proto
#   header so that Express correctly identifies the original connection as HTTPS
#   and issues session cookies with the Secure flag. The visitor's own address
#   is taken from the upstream's X-Forwarded-For; see set_real_ip_from below.
#
# Let's Encrypt: use certbot --webroot with the challenge block below.

# Upload size limit — must be >= the largest MAX_*_SIZE_MB in .env (plus a few MB
# of multipart overhead). Set NGINX_MAX_BODY_SIZE in .env; docker-compose mounts
# this file as an Nginx template and substitutes the value at container start.
# If you run this file directly as a plain config (no template processing),
# replace ${NGINX_MAX_BODY_SIZE} with a literal size such as 55M.
client_max_body_size ${NGINX_MAX_BODY_SIZE};

# Docker's own name server. nginx looks up an address it is given as a
# variable ($cozyvtt_backend and $cozyvtt_frontend below) when a request
# needs it, keeping the answer for ten seconds. A name written straight into
# proxy_pass is looked up once, when nginx starts, so recreating only the
# backend or frontend container left nginx sending to an address nobody had
# any more, and the site answered 502 until nginx was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

# Determine the real protocol:
#   - If an upstream proxy set X-Forwarded-Proto (e.g. Cloudflare sends "https"),
#     trust and pass it through.
#   - Otherwise fall back to $scheme (the scheme of the connection to this Nginx,
#     which is "https" when Nginx terminates TLS directly).
map $http_x_forwarded_proto $real_proto {
    default  $scheme;
    https    https;
    http     http;
}

# The visitor's address, when a tunnel or another proxy stands in front of this
# one. Every request then reaches this nginx from that proxy's address, and the
# backend's per-address limits (five failed sign-ins in fifteen minutes, among
# others) would count every visitor as one: a few wrong passwords from anyone
# would lock everyone out. A proxy names its visitor in X-Forwarded-For, but
# anyone can send that header, so it is believed only on a connection from a
# private or local address: a tunnel or proxy on this server, in Docker, or on
# your own network. A visitor who reaches this nginx straight from the internet
# keeps their own address, whatever the header says.
#
# real_ip_recursive reads the header from the right, past every private
# address, and takes the first address that is not one: the visitor as the
# outermost trusted proxy saw them. The cost is that a device on your own
# network can choose the address the backend sees for it. A proxy in front of
# this one on a public address (a CDN pointed at your server's public IP) has
# to be added here with its own set_real_ip_from lines, or every visitor
# through it shares its address.
#
# Each location below then hands the backend that one address in
# X-Forwarded-For, which is where the backend (trusting exactly one proxy,
# this one) reads it.
set_real_ip_from  127.0.0.1;
set_real_ip_from  10.0.0.0/8;
set_real_ip_from  172.16.0.0/12;
set_real_ip_from  192.168.0.0/16;
set_real_ip_from  ::1;
set_real_ip_from  fc00::/7;
real_ip_header    X-Forwarded-For;
real_ip_recursive on;

# ----------------------------------------------------------------
# HTTP
# ----------------------------------------------------------------
server {
    listen 80;
    server_name _;

    # Where the two containers are, looked up through the resolver above.
    set $cozyvtt_backend  http://backend:4000;
    set $cozyvtt_frontend http://frontend:80;

    # Let's Encrypt ACME challenge (keep even when redirecting to HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment to redirect all HTTP to HTTPS once SSL is configured:
    # return 301 https://$host$request_uri;

    # Backup restore — needs a large body limit (entire instance ZIP) and long timeout.
    # The upload streams straight to the backend, which refuses anyone but an
    # admin before reading it. Buffered, nginx would first take up to the whole
    # 4 GB from anyone onto its own disk.
    location /api/admin/backups/restore {
        proxy_pass              $cozyvtt_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $real_proto;
        client_max_body_size    4096M;
        proxy_request_buffering off;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # Campaign import, and its preview — a campaign archive is up to 500 MB,
    # far more than NGINX_MAX_BODY_SIZE allows other uploads. It streams
    # straight to the backend, which refuses anyone not signed in, and anyone
    # over their import limit, before reading it. Unpacking a large archive
    # takes minutes once it has arrived.
    location /api/campaigns/import {
        proxy_pass              $cozyvtt_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $real_proto;
        client_max_body_size    512M;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    # Backup create — long-running (pg_dump + zip); no body size concern
    location /api/admin/backups {
        proxy_pass              $cozyvtt_backend;
        proxy_http_version      1.1;
        proxy_set_header        Host              $host;
        proxy_set_header        X-Real-IP         $remote_addr;
        proxy_set_header        X-Forwarded-For   $remote_addr;
        proxy_set_header        X-Forwarded-Proto $real_proto;
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
    }

    # Backend health. An exact match, so it reaches the backend and never the
    # SPA, which answers 200 with a web page for any path it does not know and
    # would make a dead backend look healthy to an uptime monitor.
    location = /health {
        proxy_pass         $cozyvtt_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $real_proto;
        proxy_read_timeout 10s;
    }

    # API proxy
    location /api/ {
        proxy_pass         $cozyvtt_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $real_proto;
        proxy_read_timeout 60s;
    }

    # WebSocket proxy (Socket.io)
    location /socket.io/ {
        proxy_pass         $cozyvtt_backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $real_proto;
    }

    # Frontend (static SPA via inner nginx container)
    location / {
        proxy_pass         $cozyvtt_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $remote_addr;
        proxy_set_header   X-Forwarded-Proto $real_proto;
    }
}

