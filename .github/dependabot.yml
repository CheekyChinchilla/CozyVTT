# Dependabot: a pull request each week for the dependencies with a newer
# version, into dev, where work lands (main only takes releases). Minor and
# patch updates come grouped, one pull request per project. Each major
# version of an npm package comes as a pull request of its own, since it can
# change behaviour, apart from the ones named under ignore below, each with
# the reason it waits and when to remove it.
#
# Each new release waits before Dependabot proposes it, so a hijacked
# publish is usually caught and pulled first: an npm package 3 days for a
# patch, 7 for a minor and 14 for a major; an action or a base image, which
# have no such steps here, 7 days. The wait applies to these version updates
# only, never to a security update.
#
# Alerts for a published advisory are turned on in the repository's
# settings, and so are security update pull requests once a release is on
# main. GitHub opens those against the default branch whatever target-branch
# says.
version: 2
updates:
  - package-ecosystem: npm
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 cannot run under typescript-eslint or ts-jest yet. Remove
      # once both support it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # typescript-eslint accepts TypeScript below 6.1 only, so a grouped
      # minor update to 6.1 would fail to install. Remove once it accepts 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # @types/node moves with the Node major the images and CI run, by hand
      # and only to an even (long-term support) one; keepInStep.test.ts holds
      # them together. This entry stays.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # argon2 0.45 writes a new hash's parameters in m, p, t order, which
      # libsodium refuses (https://github.com/ranisalt/node-argon2/issues/559);
      # the parameter test in services/auth.test.ts fails on it. Later
      # versions are not held, so that test checks each one. Remove once a
      # release writes m, t, p again.
      - dependency-name: argon2
        versions: ["0.45.x"]
      # zod 4.6.6 and 4.6.7 change the message a list over its limit gives
      # inside a union. The fix (https://github.com/colinhacks/zod/pull/6662)
      # is not in a release yet. Remove once a release carries it.
      - dependency-name: zod
        versions: ["4.6.6", "4.6.7"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Tailwind CSS 4 changes how the styles are configured and built, a
      # move of its own. Remove when that work starts.
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      # TypeScript 7 cannot run under typescript-eslint yet. Remove once it
      # supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # typescript-eslint accepts TypeScript below 6.1 only, so a grouped
      # minor update to 6.1 would fail to install. Remove once it accepts 6.1.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # @types/node moves with the Node major, as the backend's does;
      # keepInStep.test.ts holds them together. This entry stays.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  # The actions CI runs, pinned to commit SHAs; Dependabot moves the SHA and
  # its version comment together.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # Base images. Node and nginx move to a new major or stable line by hand:
  # Node only to an even-numbered (long-term support) release, and nginx only
  # to an even minor (its stable lines), changed in docker-compose.yml and
  # frontend/Dockerfile.prod together, which a backend test holds in step.
  - package-ecosystem: docker
    directory: /backend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]

  # docker-compose.yml. A PostgreSQL major version cannot be taken by pulling
  # a new image: the data folder has to be dumped and restored, so that is a
  # release of its own.
  - package-ecosystem: docker-compose
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: postgres
        update-types: [version-update:semver-major]
      - dependency-name: nginx
        update-types: [version-update:semver-major, version-update:semver-minor]
