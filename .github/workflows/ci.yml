# Continuous integration.
#
# This exists because of how the `any` problem happened. Strict typing was a
# project requirement, the rule that enforces it was switched off, and 326
# explicit `any` accumulated over months — because nothing ever ran the checks.
# Every gate was someone remembering to run it locally, and a rule nobody runs
# is not a rule.
#
# Deliberately modest: the same commands a developer runs, on every push and
# pull request touching dev or main. No deployment, no publishing, no secrets.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # `npm test` is watch mode and would hang the runner.
      - run: npx vitest run
      - run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The suite talks to a real PostgreSQL rather than a mock, so CI provides
    # one on the port the tests expect.
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cozyvtt
          POSTGRES_PASSWORD: cozyvtt
          POSTGRES_DB: cozyvtt_test
        ports:
          - 55433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://cozyvtt:cozyvtt@localhost:55433/cozyvtt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The generated Prisma client is not committed, and typecheck depends on
      # it — without this, every column added since the last generate is a
      # compile error.
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npx jest
