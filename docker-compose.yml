# CozyVTT Production Docker Compose
# Usage: docker compose up -d --build
# Requires: .env file with all required variables set (see .env.example)
#
# For development (hot-reload, exposed ports), use:
#   docker compose -f docker-compose.dev.yml up
#
# Prefer not to edit this file: personal tweaks belong in docker-compose.override.yml,
# which Compose merges automatically and git ignores — so `git pull` never conflicts.
# Copy docker-compose.override.example.yml to get started.
#
# If you have a reverse proxy that handles INTERNAL routing too
# (Traefik, Caddy, an existing host-level Nginx): you can remove the bundled
# nginx service below. Then ALL of the following are required:
#   - Add `ports` to the BACKEND service (e.g. "127.0.0.1:4000:4000") — it is
#     `expose`-only by default, so nothing outside Docker can reach it and your
#     proxy would be pointing at a closed port
#   - Add `ports` to the FRONTEND service (e.g. "127.0.0.1:8080:80")
#   - Route /api/* AND /socket.io/* to the backend, everything else to the frontend
# Miss any of these and the site loads but the API is unreachable: a fresh install
# shows the login page instead of the setup wizard, or setup fails with a 502.
#
# Cloudflare Tunnel users: the simplest setup is to KEEP the bundled nginx —
# CF Tunnel handles public-facing TLS and origin hiding, but not the routing
# between the frontend SPA and the backend API/WebSocket. Point your
# `cloudflared` ingress at http://localhost:80 and you're done. To run without
# nginx you need path-based ingress rules (specific paths first, catch-all last).
# See docs/DEPLOYMENT.md → "Using an External Reverse Proxy" for all three setups.

# Docker's own log of each container, which `docker compose logs` reads, is
# kept to five files of 10 MB. Without a limit it grows until the disk is full.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  database:
    image: postgres:15-alpine
    container_name: cozyvtt-database
    logging: *logging
    restart: unless-stopped
    # Nothing in the container can gain privileges through a setuid program.
    security_opt:
      - no-new-privileges:true
    # Every Linux capability is dropped, and the image's start script gets back
    # only what it uses as root before it switches to the postgres user: giving
    # the data folder to postgres, looking inside it (it is postgres's alone),
    # and switching user. PostgreSQL itself runs with none.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - SETUID
      - SETGID
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-cozyvtt}
      POSTGRES_USER: ${DATABASE_USER:-cozyvtt}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-cozyvtt}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Database is NOT exposed externally — only reachable from within the internal network
    expose:
      - "5432"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    image: cozyvtt-backend:latest
    container_name: cozyvtt-backend
    logging: *logging
    restart: unless-stopped
    # How long Docker lets the backend stop on its own before killing it. A
    # backup the Admin Dashboard is writing when it is stopped, by an upgrade
    # for example, is let finish for up to ten minutes; with none running the
    # backend stops in a few seconds.
    stop_grace_period: 10m30s
    # Nothing in the container can gain privileges through a setuid program.
    security_opt:
      - no-new-privileges:true
    # Every Linux capability is dropped, and start.sh gets back only what it
    # uses as root before it switches to appuser: giving the mounted folders to
    # appuser, reading folders private to one account on the way (the backups
    # folder is appuser's alone), setting the backups folder's mode, and
    # switching user. The backend itself runs with none. Root in this
    # container cannot write appuser's files, so run commands in it as
    # appuser: docker compose exec -u appuser backend ...
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETUID
      - SETGID
    # Its files are read-only too: the backend writes only to the three
    # folders below and to /tmp, where a backup keeps its dump of the database
    # and a restore unpacks the archive. /tmp is the backend_tmp volume: in
    # memory a dump would count against the 512 MB below. start.sh removes
    # what a stopped backup or restore left there.
    read_only: true
    depends_on:
      database:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${DATABASE_USER:-cozyvtt}:${DATABASE_PASSWORD}@database:5432/${DATABASE_NAME:-cozyvtt}
      NODE_ENV: production
      PORT: 4000
      SESSION_SECRET: ${SESSION_SECRET}
      # Optional: the setup wizard's token; unset, the backend prints one in its log
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      APP_URL: ${APP_URL:-${CORS_ORIGIN}}
      # Upload limits
      MAX_MAP_SIZE_MB: ${MAX_MAP_SIZE_MB:-50}
      MAX_TOKEN_SIZE_MB: ${MAX_TOKEN_SIZE_MB:-5}
      MAX_AUDIO_SIZE_MB: ${MAX_AUDIO_SIZE_MB:-20}
      MAX_AVATAR_SIZE_MB: ${MAX_AVATAR_SIZE_MB:-2}
      MAX_DOCUMENT_SIZE_MB: ${MAX_DOCUMENT_SIZE_MB:-50}
      # Read-only here: lets the backend warn at startup when the Nginx body
      # cap is smaller than the limits above (it is applied by the nginx service)
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-55M}
      # Rate limiting
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-300}
      ASSET_UPLOAD_RATE_LIMIT: ${ASSET_UPLOAD_RATE_LIMIT:-30}
      CAMPAIGN_ARCHIVE_RATE_LIMIT: ${CAMPAIGN_ARCHIVE_RATE_LIMIT:-20}
      # Session timeouts (milliseconds) and logging. Every setting .env.example
      # offers is named here, or it never reaches the container: a test keeps
      # the two files in step.
      SESSION_MAX_AGE: ${SESSION_MAX_AGE:-3600000}
      REMEMBER_ME_MAX_AGE: ${REMEMBER_ME_MAX_AGE:-2592000000}
      LOG_LEVEL: ${LOG_LEVEL:-}
    volumes:
      # Uploads persist on the host — back this directory up regularly
      - ./backend/uploads:/app/uploads
      # Instance backups (full database dumps) live beside uploads, never inside it.
      - ./backend/backups:/app/backups
      # Logs persist on the host
      - ./backend/logs:/app/logs
      # Scratch files only: nothing in it needs a backup.
      - backend_tmp:/tmp
    # Backend is only accessible internally — Nginx terminates public traffic
    expose:
      - "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - internal
    # Resource limits — adjust based on your server capacity
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    image: cozyvtt-frontend:latest
    container_name: cozyvtt-frontend
    logging: *logging
    restart: unless-stopped
    # Nothing in the container can gain privileges through a setuid program.
    security_opt:
      - no-new-privileges:true
    # Every Linux capability is dropped, and nginx's master process, which
    # runs as root, gets back only what it uses: giving its scratch folders to
    # the nginx user, listening on port 80, and starting its workers as that
    # user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    # It only serves the built app, so its files are read-only, apart from
    # nginx's pid file and scratch folders, held in memory: nothing large
    # passes through it.
    read_only: true
    tmpfs:
      - /run
      - /var/cache/nginx
      - /tmp
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 128M

  nginx:
    # nginx's stable line, the same as the frontend image's (frontend/Dockerfile.prod).
    # A test keeps the two in step; move both together.
    image: nginx:1.30-alpine
    container_name: cozyvtt-nginx
    # TODO(shutdown): with a Socket.io connection open, `docker compose stop`
    # waits the full 10 s and then kills nginx (exit 137): the image's
    # SIGQUIT waits for websockets, which never close by themselves. Use
    # `stop_signal: SIGTERM` or set worker_shutdown_timeout so nginx exits
    # in about a second and players reconnect as they already do.
    logging: *logging
    restart: unless-stopped
    # Nothing in the container can gain privileges through a setuid program.
    security_opt:
      - no-new-privileges:true
    # Every Linux capability is dropped, and nginx's master process, which
    # runs as root, gets back only what it uses: giving its scratch folders to
    # the nginx user, listening on ports 80 and 443, starting its workers as
    # that user, and reading files only their owner may read, such as a TLS
    # key in nginx/certs that belongs to your own account.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - DAC_READ_SEARCH
    # Its files are read-only too. The entrypoint renders nginx/nginx.conf
    # into /etc/nginx/conf.d as it starts, and nginx writes its pid file in
    # /run; those are held in memory. Uploads and downloads too large to
    # hold in memory as they pass (a 50 MB map, a backup) go to
    # /var/cache/nginx, kept on the nginx_temp volume: in memory they would
    # count against the 64 MB below and stop nginx.
    read_only: true
    tmpfs:
      - /run
      - /tmp
      - /etc/nginx/conf.d
    depends_on:
      - frontend
      - backend
    environment:
      # Request body cap. Must be >= the largest MAX_*_SIZE_MB above plus a few
      # MB of multipart overhead, or large uploads fail with HTTP 413.
      NGINX_MAX_BODY_SIZE: ${NGINX_MAX_BODY_SIZE:-55M}
      # Proxies in front of this nginx (a tunnel on this server, Cloudflare,
      # a proxy on your network) whose word on the visitor's address and on
      # HTTPS is believed: IP addresses or ranges, separated by spaces or
      # commas. Empty, only this nginx's own loopback is believed. See
      # "Visitor addresses and sign-in limits" in docs/DEPLOYMENT.md.
      NGINX_TRUSTED_PROXIES: ${NGINX_TRUSTED_PROXIES:-}
      # Filled in from NGINX_TRUSTED_PROXIES by nginx/trusted-proxies.envsh
      # (mounted below); empty here so the template still renders where that
      # script cannot run.
      NGINX_REAL_IP_FROM: ""
      NGINX_TRUSTED_GEO: ""
      # Only substitute these variables: without the filter, envsubst would
      # also blank Nginx's own $host / $scheme / $remote_addr.
      NGINX_ENVSUBST_FILTER: "NGINX_MAX_BODY_SIZE|NGINX_REAL_IP_FROM|NGINX_TRUSTED_GEO"
      # The hash of the files mounted below (nginx/nginx.conf,
      # nginx/locations.conf and nginx/trusted-proxies.envsh): when one changes, set this to the value
      # backend/src/__tests__/keepInStep.test.ts prints, which fails until it
      # matches. The template is rendered when the container starts, and
      # `docker compose up -d --build` leaves a running container alone unless
      # its definition changed, so without a change here an upgrade keeps
      # serving the previous config.
      NGINX_CONF_STAMP: "d3fe8e6463a6"
    ports:
      # Change these if 80/443 are already in use on your host.
      # Example: HTTP_PORT=8080 in .env to access CozyVTT at http://yourserver:8080
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Mounted as a template: the nginx image renders it to
      # /etc/nginx/conf.d/default.conf at start, filling in NGINX_MAX_BODY_SIZE.
      - ./nginx/nginx.conf:/etc/nginx/templates/default.conf.template:ro
      # The proxying rules, included by the HTTP server and by your HTTPS one.
      - ./nginx/locations.conf:/etc/nginx/cozyvtt/locations.conf:ro
      # Run by the image's entrypoint before it renders the template above.
      - ./nginx/trusted-proxies.envsh:/docker-entrypoint.d/19-cozyvtt-trusted-proxies.envsh:ro
      - ./nginx/certs:/etc/nginx/certs:ro  # Place your SSL certs here
      # Your own nginx settings, such as HTTPS: every .conf file here is read.
      # git ignores this folder's contents, so `git pull` never stops at them.
      - ./nginx/conf.d:/etc/nginx/cozyvtt.d:ro
      # Scratch files only: nothing in it needs a backup.
      - nginx_temp:/var/cache/nginx
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 64M

volumes:
  postgres_data:
    driver: local
  # nginx's request and response scratch files; Compose makes it on the
  # first start, and nothing in it needs a backup.
  nginx_temp:
    driver: local
  # The backend's /tmp: a backup's database dump and a restore's unpacked
  # archive while they run. Compose makes it on the first start.
  backend_tmp:
    driver: local

networks:
  internal:
    driver: bridge
