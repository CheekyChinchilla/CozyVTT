      summary: Create a text or Markdown document from typed content
      description: >-
        The same rules as uploading decide who may place it at each scope:
        anyone into their own library, the DM into their campaign, an admin or
        global asset manager instance-wide. The content is checked to be text,
        bounded at 900 KB (typed content arrives as JSON; anything larger is a
        file to upload), written to disk exactly as sent, and never interpreted.
        A PDF cannot be typed. Counts against the upload rate limit, since it
        creates a file on disk exactly as an upload does.
      operationId: createDocument
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - format
                - content
              properties:
                name:
                  type: string
                  maxLength: 200
                description:
                  type: string
                  maxLength: 1000
                format:
                  type: string
                  enum: [txt, md]
                content:
                  type: string
                scope:
                  type: string
                  enum: [USER, CAMPAIGN, GLOBAL]
                  default: USER
                campaignId:
                  type: string
                  format: uuid
                  description: Required when scope is CAMPAIGN
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/assets/documents/{id}/content:
    put:
      tags:
        - Documents
      summary: Replace the text of a text or Markdown document
      description: >-
        The uploader or an admin. A document the caller may not edit answers
        404, so the reply does not confirm a private id exists. A PDF answers
        400: it is a file, and is replaced by uploading a new one. The recorded
        size is updated.
      operationId: updateDocumentContent
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assets/documents/{id}:
    get:
      tags:
        - Documents
      summary: Serve a document for reading inline
      description: >-
        A PDF, plain text or Markdown file. A document is private to its
        uploader unless a DM has shared it with a campaign the caller belongs
        to; anyone else gets 404, not 403, so the reply never confirms a
        private id exists. The content type is decided from the file's
        validated extension, never from what was declared at upload, and
        Markdown is served as text/plain so the browser never renders a
        document as a page. The response carries
        `X-Content-Type-Options: nosniff` and a
        `Content-Security-Policy: default-src 'none'; sandbox` that applies
        whenever the browser renders the response as a document. Note it does
        not sandbox a PDF; a client embedding one should sandbox the frame
        itself, as CozyVTT's reader does. Caching differs by format: a PDF
        cannot change under its id and is cacheable as immutable, while text
        and Markdown can be rewritten in place, so they are served
        `Cache-Control: private, no-cache` with an ETag that changes with the
        file. Send `If-None-Match` and an unchanged document answers 304.
      operationId: serveDocument
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The document, inline
        '304':
          description: Unchanged since the ETag in `If-None-Match`
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assets/maps/{id}:
    get:
      tags:
