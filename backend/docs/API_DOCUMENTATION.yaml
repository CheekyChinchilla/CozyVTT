      responses:
        '201':
          description: Character copied successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Character copied successfully }
                  character:
                    $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # ASSETS
  # ============================================

  /api/assets:
    get:
      tags:
        - Assets
      summary: List assets
      description: List assets with filtering and pagination
      operationId: listAssets
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [MAP, TOKEN, AUDIO, AVATAR]
        - name: scope
          in: query
          schema:
            type: string
            enum: [GLOBAL, CAMPAIGN]
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /api/assets/upload:
    post:
      tags:
        - Assets
      summary: Upload asset
      description: |
        Upload a new asset file. The file is validated by **magic-byte**
        inspection (not just MIME header or extension) and rejected if the
        detected type doesn't match the declared `type`.

        **File size limits** — set per type with the `MAX_<TYPE>_SIZE_MB`
        environment variables (defaults shown). The effective values are
        available from `GET /api/config`.
        | Type | Env var | Default limit |
        |------|---------|---------------|
        | MAP    | `MAX_MAP_SIZE_MB`    | 50 MB |
        | TOKEN  | `MAX_TOKEN_SIZE_MB`  | 5 MB |
        | AUDIO  | `MAX_AUDIO_SIZE_MB`  | 20 MB |
        | AVATAR | `MAX_AVATAR_SIZE_MB` | 2 MB |

        Image assets generate a 512×512 thumbnail server-side.

        **Rate limit**: 30 uploads per minute per user (configurable via
        `ASSET_UPLOAD_RATE_LIMIT`). Sized to allow legitimate bulk-upload
        during campaign setup while blocking obvious abuse loops.
      operationId: uploadAsset
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - type
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [MAP, TOKEN, AUDIO, AVATAR]
                scope:
                  type: string
                  enum: [GLOBAL, USER, CAMPAIGN]
                  default: USER
                campaignId:
                  type: string
                  format: uuid
                  description: Required if scope is CAMPAIGN
                name:
                  type: string
                description:
                  type: string
                tags:
                  type: string
                  description: Comma-separated tags
      responses:
        '201':
          description: Asset uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Asset uploaded successfully
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: |
            Validation failure — missing required field, file too large for
            its declared type, or magic-byte mismatch (file content does not
            match declared type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/assets/{id}:
    get:
      tags:
        - Assets
      summary: Get asset metadata
      operationId: getAssetById
      security:
