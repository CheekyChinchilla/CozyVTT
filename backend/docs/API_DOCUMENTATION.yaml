      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: List wall segments
      description: Returns all wall segments for the map. Available to any campaign member.
      operationId: listWalls
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All wall segments on the map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Walls & Lighting
      summary: Replace all wall segments
      description: |
        Replaces the map's entire wall list atomically. Used by the wall editor
        when committing a large batch of changes (e.g. after drawing a polygon
        room, or after undo/redo). DM only.
      operationId: replaceWalls
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  items:
                    $ref: '#/components/schemas/Wall'
              required: [segments]
      responses:
        '200':
          description: Updated wall list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Walls & Lighting
      summary: Add a wall segment
      description: |
        Append a single wall segment. The server assigns an `id` if the body
        omits one. Maps are capped at 5000 wall segments. DM only.
      operationId: addWall
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WallInput'
            example:
              x1: 240
              y1: 180
              x2: 400
              y2: 180
              type: wall
      responses:
        '201':
          description: Wall segment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:
                    $ref: '#/components/schemas/Wall'
                  total:
                    type: integer
                    description: Total wall count after this addition
                    example: 47
        '400':
          description: Validation failure or 5000-segment limit reached.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/walls/{sid}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/WallId'
    delete:
      tags:
        - Walls & Lighting
      summary: Delete a wall segment
      description: Remove a wall segment by id. DM only.
      operationId: deleteWall
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Segment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Wall segment deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Walls & Lighting
      summary: Update a wall segment's type
      description: |
        Change the `type` of a single wall segment — most commonly used to
        toggle a door open/closed. Geometry (`x1/y1/x2/y2`) is immutable;
        to move a wall, delete and re-add. DM only.
      operationId: updateWallType
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [wall, door-closed, door-open, window]
              required: [type]
            example:
              type: door-open
      responses:
        '200':
          description: Updated segment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:
                    $ref: '#/components/schemas/Wall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lights:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: List light sources
      description: Returns all placed lights on the map. Available to any campaign member.
      operationId: listLights
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All lights on the map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lights:
                    type: array
                    items:
                      $ref: '#/components/schemas/LightSource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Walls & Lighting
      summary: Replace all light sources
      description: |
        Replaces the map's entire light list atomically. Used when committing
        a large batch of changes or restoring saved lighting state. DM only.
      operationId: replaceLights
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lights:
                  type: array
                  items:
                    $ref: '#/components/schemas/LightSource'
              required: [lights]
      responses:
        '200':
          description: Updated light list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lights:
                    type: array
                    items:
                      $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Walls & Lighting
      summary: Add a light source
      description: Add a single light. Server assigns the `id`. DM only.
      operationId: addLight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightSourceInput'
            example:
              x: 320
              y: 240
              brightRadius: 4
              dimRadius: 8
              color: '#ffcc66'
              enabled: true
      responses:
        '201':
          description: Light created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  light:
                    $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lights/{lightId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/LightId'
    patch:
      tags:
        - Walls & Lighting
      summary: Update a light source
      description: |
        Partially update a light's position, radii, color, or enabled state.
        Send only the fields you want to change. DM only.
      operationId: updateLight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
                brightRadius: { type: number, minimum: 0 }
                dimRadius: { type: number, minimum: 0 }
                color:
                  type: string
                  pattern: '^#[0-9a-fA-F]{6}$'
                enabled: { type: boolean }
            example:
              enabled: false
      responses:
        '200':
          description: Updated light.
          content:
            application/json:
              schema:
                type: object
                properties:
                  light:
                    $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Walls & Lighting
      summary: Delete a light source
      description: Remove a light. DM only.
      operationId: deleteLight
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Light deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Light deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/fog:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: Get fog state (DM only)
      description: |
        Returns the full `FogState` for the map. Players do not see the raw
        fog state — they receive computed visibility via WebSocket events
        as the DM reveals areas. DM only.
      operationId: getFogState
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current fog state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fogState:
                    $ref: '#/components/schemas/FogState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/fog/operation:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    post:
      tags:
        - Walls & Lighting
      summary: Apply a fog reveal/hide operation
      description: |
        Mutate the fog state by either revealing/hiding a list of cell indices
        (`reveal` / `hide` with `cells: number[]`) or by revealing/hiding the
        entire map (`reveal_all` / `hide_all`). Returns the updated fog state.
        DM only.
      operationId: applyFogOperation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FogOperation'
            examples:
              revealCells:
                summary: Reveal specific cells
                value:
                  op: reveal
                  cells: [0, 1, 2, 50, 51]
              hideAll:
                summary: Re-fog the entire map
                value:
                  op: hide_all
      responses:
        '200':
          description: Updated fog state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fogState:
                    $ref: '#/components/schemas/FogState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lighting:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    put:
      tags:
        - Walls & Lighting
      summary: Toggle dynamic lighting
      description: |
        Enable or disable dynamic lighting for the map. When enabled,
        players see only what their tokens can — fog uses the wall and
        light data to compute visibility. When disabled, fog is the
        manual brush-controlled layer. DM only.

        Also broadcasts `map:lighting:updated` to all connected campaign
        clients so they refresh without a reload.
      operationId: setLightingEnabled
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
            example:
              enabled: true
      responses:
        '200':
          description: Updated lighting flag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lightingEnabled: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # CREATURE LIBRARY
  # ============================================

  /api/campaigns/{campaignId}/creatures:
    get:
      tags: [Creatures]
      summary: List creature templates
      description: |
        Returns SRD (global) + campaign-specific custom creature templates.
        Supports search, source filter, challenge rating filter, and pagination.
        Any campaign member can list.
      operationId: listCreatures
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: search
          in: query
          schema:
            type: string
          description: Filter by name (case-insensitive partial match)
        - name: source
          in: query
          schema:
            type: string
            enum: [srd, custom]
          description: Filter by source
        - name: cr
          in: query
          schema:
            type: string
          description: Filter by challenge rating
        - name: gameSystem
          in: query
          schema:
            type: string
          description: Filter by game system
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated creature list
          content:
            application/json:
              schema:
                type: object
                properties:
                  creatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatureTemplate'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Creatures]
      summary: Create custom creature
      description: Create a new campaign-specific custom creature template (DM only).
      operationId: createCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - statBlock
              properties:
                name:
                  type: string
                statBlock:
                  type: object
                gameSystem:
                  type: string
                challengeRating:
                  type: string
                creatureType:
                  type: string
                alignment:
                  type: string
                imageUrl:
                  type: string
                size:
                  type: object
                  properties:
                    width:
                      type: integer
                    height:
                      type: integer
                disposition:
                  type: string
                  enum: [hostile, friendly, neutral]
                displayMode:
                  type: string
                  enum: [pog, top-down, full-art]
      responses:
        '201':
          description: Creature template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/creatures/{creatureId}:
    get:
      tags: [Creatures]
      summary: Get creature template
      description: Get a single creature template by ID. Any campaign member can view.
      operationId: getCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Creature template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Creatures]
      summary: Update custom creature
      description: Update a campaign-specific custom creature template (DM only). Cannot edit SRD creatures (returns 403).
      operationId: updateCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                statBlock:
                  type: object
                challengeRating:
                  type: string
                creatureType:
                  type: string
                alignment:
                  type: string
                imageUrl:
                  type: string
                size:
                  type: object
                disposition:
                  type: string
                displayMode:
                  type: string
      responses:
        '200':
          description: Creature template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Creatures]
      summary: Delete custom creature
      description: Delete a campaign-specific custom creature template (DM only). Cannot delete SRD creatures (returns 403).
      operationId: deleteCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Creature deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/{creatureId}/duplicate:
    post:
      tags: [Creatures]
      summary: Duplicate creature
      description: Duplicate any creature (including SRD) as a new custom creature in this campaign (DM only).
      operationId: duplicateCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Duplicated creature template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/favorites/list:
    get:
      tags: [Creatures]
      summary: List creature favorites
      description: Returns creature IDs and full creature objects that the current user has favorited in this campaign.
      operationId: listCreatureFavorites
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Favorite creature list
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoriteIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  creatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatureTemplate'

  /api/campaigns/{campaignId}/creatures/{creatureId}/favorite:
    post:
      tags: [Creatures]
      summary: Toggle creature favorite
      description: Toggle favorite for the current user in this campaign. If already favorited, removes it; otherwise adds it.
      operationId: toggleCreatureFavorite
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Favorite toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorited:
                    type: boolean

  /api/campaigns/{campaignId}/creatures/seed/status:
    get:
      tags: [Creatures]
      summary: Check SRD seed status
      description: Returns whether SRD creatures have been seeded. Any campaign member can check.
      operationId: getSrdSeedStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Seed status
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded:
                    type: boolean
                  count:
                    type: integer
                  seedInProgress:
                    type: boolean

  /api/campaigns/{campaignId}/creatures/seed:
    post:
      tags: [Creatures]
      summary: Seed SRD creatures
      description: |
        Fetch SRD creatures from Open5e and populate the library (DM only).
        Safe to call multiple times — existing SRD creatures are not duplicated.

        Existing SRD creatures stored before hit points were tracked are updated
        in place with `hpMax` / `hitDice`; only those missing keys are added, and
        custom creatures are never modified.

        Returns 409 if seeding is already in progress.
      operationId: seedSrdCreatures
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Seeding complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  fetched:
                    type: integer
                    description: Monsters returned by Open5e
                  created:
                    type: integer
                    description: New SRD creatures inserted
                  updated:
                    type: integer
                    description: Existing SRD creatures backfilled with hit points
                  skipped:
                    type: integer
                    description: Existing SRD creatures left unchanged
                  alreadyExisted:
                    type: integer
        '409':
          description: Seeding already in progress

  # ============================================
  # TOKEN TEMPLATE ENDPOINTS
