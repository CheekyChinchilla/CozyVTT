  # ============================================
  # MAPS & TOKENS
  # ============================================

  /api/campaigns/{campaignId}/maps:
    get:
      tags:
        - Maps
      summary: List campaign maps
      description: |
        List the campaign's maps, newest first. The DM gets every map; a
        player or spectator is sent only the map the campaign is showing
        (`currentMapId`), or an empty list while it shows none. A map the DM
        has prepared but not switched to is the DM's alone.
      operationId: listMaps
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: >-
            List of maps. Each item is a summary of 14 fields, not the full
            Map object: no tokens, annotations, walls, lights, fog, spirit
            layer or `campaignId`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  maps:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        imageUrl: { type: string }
                        width: { type: integer }
                        height: { type: integer }
                        gridSize: { type: integer }
                        feetPerSquare: { type: integer }
                        diagonalRule: { type: string, enum: [flat, alternating] }
                        lightingEnabled: { type: boolean }
                        fogEnabled: { type: boolean }
                        globalIllumination: { type: boolean }
                        explorationEnabled: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Maps
      summary: Create map
      description: >-
        Create a new map for the campaign (DM only). The new map starts with
        lighting, fog of war, Global Illumination and exploration memory all
        off, and no tokens, walls or lights.


        `imageUrl` and `spiritLayerUrl` take an asset id or an asset's exact
        address (`/api/assets/<kind>/<id>`). A bare id is stored as
        `/api/assets/maps/<id>`. Anything else, an outside URL included, is
        given the same prefix and so answers 403. An address naming an
        existing asset must name one the caller can read, or the request
        answers 403 (`You do not have access to that image`), unless this
        campaign already stores that exact address somewhere, as a copy of a
        token, template or creature does. An address naming an asset that no
        longer exists is accepted.


        `gridSize`, `feetPerSquare` and `diagonalRule` are never rejected: a
        missing or out-of-range value is replaced with its default (50, 5,
        `flat`). Only `name`, `imageUrl`, `width` and `height` can make this
        route answer 400. A `width`, `height` or `gridSize` that is a positive
        number but not a whole one passes these checks and answers 500
        (`Failed to create map`), since the columns hold integers.
      operationId: createMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - imageUrl
                - width
                - height
              properties:
                name:
                  type: string
                  description: Trimmed; must not be blank.
                imageUrl:
                  type: string
                  description: Asset id or exact asset address.
                width:
                  type: integer
                  minimum: 1
                  description: In grid squares.
                height:
                  type: integer
                  minimum: 1
                  description: In grid squares.
                gridSize:
                  type: integer
                  default: 50
                  description: Pixels per grid square. Falls back to 50 when omitted or not a positive number.
                feetPerSquare:
                  type: integer
                  default: 5
                  description: Falls back to 5 when omitted or not an integer from 1 to 100.
                diagonalRule:
                  type: string
                  enum: [flat, alternating]
                  default: flat
                  description: Falls back to flat when omitted or not one of these two values.
                spiritLayerUrl:
                  type: string
                  description: Asset id or exact asset address. Omitted or empty means none.
      responses:
        '201':
          description: Map created
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/maps/{id}:
    get:
      tags:
        - Maps
      summary: Get map
      description: |
        Get a map with its tokens, annotations, walls and lights. The DM gets
        the stored map whole. Anyone else gets it filtered as the Map schema
        describes: only the tokens on their plane that are not hidden (and on
        a lit map only those in their sight plus their own), each cut down to
        the fields they may see; `spiritLayerUrl` null unless the spirit layer
        is visible to them; `fogData` always null. Walls, lights and
        annotations are sent to everyone.


        A player or spectator may fetch only the campaign's current map; any
        other map of the campaign answers 404 for them, as does everything
        under it (walls, lights). A map of another campaign answers 404
        (`Map not found in this campaign`) for everyone.
      operationId: getMapById
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Map details
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
                  spiritVisible:
                    type: boolean
                    description: >-
                      Whether the caller can currently see the spirit layer,
                      which decides `map.spiritLayerUrl` and which plane's
                      tokens they get. Always true for the DM. For anyone else
                      it is true while the DM has revealed the spirit layer to
                      the campaign, and for a player also while a visible
                      spirit-layer token they control stands on the current
                      map.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Maps
      summary: Update map
      description: |
        Update map settings (DM only). Send only the fields to change. Each
        field sent is checked and a bad one answers 400; unlike on create,
        nothing is replaced with a default. `feetPerSquare` must be an
        integer from 1 to 100 and `diagonalRule` `flat` or `alternating`. A
        `width`, `height` or `gridSize` that is a positive number but not a
        whole one passes the check and answers 500 (`Failed to update map`).

        A request carrying any of the four per-map flags broadcasts
        `map:settings:updated` with all four, to every member for the map the
        campaign is showing and to the DM's connections for any other. When
        `lightingEnabled` or `globalIllumination` actually changes, and the map
        is the one the campaign is showing, every member is also sent the map
        as they can now see it (`map.changed`), since those two decide which
        tokens a player is sent; editing another map in the library sends no
        `map.changed`.

        Turning `fogEnabled` on from off also pushes the map's fog at once,
        as a fog operation does: `fog:updated` with the whole grid to the DM,
        `fog:cells` with the revealed cells to everyone else who may read the
        map. Changing `gridSize`, `width` or `height` pushes nothing, but the
        stored fog no longer matches the map's grid, so from then on it is
        read as a fresh, fully hidden grid, and the next fog operation
        overwrites it.

        `imageUrl` and `spiritLayerUrl` take an asset id or an asset's exact
        address (`/api/assets/<kind>/<id>`); a bare id is stored as
        `/api/assets/maps/<id>`, and anything else, an outside URL included,
        answers 403. One naming an existing asset must name one the caller
        can read, or the request answers 403 (the right to read an asset
        follows its use, so storing a reference is checked like reading it),
        unless this campaign already stores that exact address somewhere, as
        a copy of a token, template or creature does. An address naming an
        asset that no longer exists is accepted, and so is the address
        already stored, sent back unchanged. `spiritLayerUrl` null or empty
        removes the spirit layer.
      operationId: updateMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
                gridSize:
                  type: integer
                  minimum: 1
                feetPerSquare:
                  type: integer
                  minimum: 1
                  maximum: 100
                diagonalRule:
                  type: string
                  enum: [flat, alternating]
                imageUrl:
                  type: string
                spiritLayerUrl:
                  type: string
                  nullable: true
                lightingEnabled:
                  type: boolean
                  description: Dynamic lighting on this map
                fogEnabled:
                  type: boolean
                  description: Manual fog of war on this map. Off means players see the whole map (dynamic lighting still applies). New maps are created with it off.
                globalIllumination:
                  type: boolean
                  description: With dynamic lighting on, everything in a token's line of sight counts as lit. Off, a player sees only what their tokens' sight radius reaches or a light source lights. Maps from before 1.5.0 have it on; new maps start with it off.
                explorationEnabled:
                  type: boolean
                  description: Remember the areas each player has seen on this map and grey them in when out of sight. Maps from before 1.5.0 have it on; new maps start with it off.
      responses:
        '200':
          description: Map updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Maps
      summary: Delete map
      description: >-
        Delete a map (DM only). The campaign's current map cannot be deleted:
        that answers 400 (`Cannot delete the current map. Set a different map
        as current first.`). The map's tokens, walls, lights and fog go with
        it, as does every player's explored-area memory of it; its image
        asset is kept. If any combatant stood on it, those combatants leave
        the initiative order and the order is sent again to every connected
        member (`initiative.state`).
      operationId: deleteMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Map deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/set-current:
    put:
      tags:
        - Maps
      summary: Set current map
      description: >-
        Set a map as the current map for the campaign (DM only). Which plane
        each player is on, and which combatants they are sent, follows the
        current map, so while anything is in the initiative order it is sent
        again to every connected member (`initiative.state`). The route sends
        no map event of its own, so open pages are not moved to the new map
        by it.
      operationId: setCurrentMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current map set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    allOf:
                      - $ref: '#/components/schemas/Campaign'
                    description: The updated campaign, with `currentMap` added, holding `{ id, name, imageUrl }` of the map just set.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/tokens:
    post:
      tags:
        - Maps
      summary: Add token to map
      description: |
        Add a new token to the map (DM only). Every field is checked against
        the token schema and stored as parsed: a position keeps only `x` and
        `y`, `rotation` is 0 to 360, the flags are booleans and the ids are
        UUIDs. A `characterId` must name a character of this campaign, or the
        request is refused with 400; a token bound to a character is
        controlled by that character's owner, while the owner is a player of
        this campaign, unless `controlledBy` says otherwise. A character
        owned by the DM or a spectator gives its token no controller.
        `name` and `position` are required, and the position must be on the
        map (`x` at least 0 and less than the map's width, `y` likewise with
        its height; 400 otherwise). The server assigns the token's `id`.

        `imageUrl` takes an asset id or an asset's exact address
        (`/api/assets/<kind>/<id>`); a bare id is stored as
        `/api/assets/tokens/<id>`, and anything else, an outside URL included,
        answers 403. Omitted or empty, the token has no picture and is drawn
        as a placeholder. One naming an existing asset must name one the
        caller can read, or the request answers 403 (the right to read an
        asset follows its use, so storing a reference is checked like reading
        it), unless this campaign already stores that exact address
        somewhere, as a copy of a token, template or creature does. An
        address naming an asset that no longer exists is accepted.

        While anything is in the initiative order it is sent again to every
        connected member (`initiative.state`), since a player's spirit-layer
        token placed on the current map moves them to the spirit plane. No
        map event is sent: other open pages see the new token only on their
        next map update or reload.
      operationId: addToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '201':
          description: Token added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    $ref: '#/components/schemas/Token'
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/tokens/{tokenId}:
    put:
      tags:
        - Maps
      summary: Update token
      description: |
        Update a token. The DM may update any token and any field. A player may
        update only a token that names them in `controlledBy`, and only its
        `position`, `rotation` and `conditions`; every other field, `size` and
        `sightRadius` included, answers 403 for a player. A spectator may not
        update a token at all, even one that still names them from before they
        were demoted. While the session is paused or has ended (campaign status
        `PAUSED` or `INACTIVE`), a player's `position` change answers 403; the
        DM may move tokens at any time. On a map the campaign is not showing, a
        player's update answers 404, as fetching that map does, even for a
        token they control; the DM may update tokens on any map. A token on
        the spirit plane answers 403 (`You cannot interact with spirit layer
        tokens`) for a player who cannot currently see that plane, even one
        that names them in `controlledBy`.

        `imageUrl` takes an asset id or an asset's exact address
        (`/api/assets/<kind>/<id>`); a bare id is stored as
        `/api/assets/tokens/<id>`, and anything else, an outside URL included,
        answers 403. Null or empty removes the picture. One naming an
        existing asset must name one the caller can read, or the request
        answers 403 (the right to read an asset follows its use, so storing a
        reference is checked like reading it), unless this campaign already
        stores that exact address somewhere, as a copy of a token, template
        or creature does. An address naming an asset that no longer exists is
        accepted, and so is the address already stored, sent back unchanged.

        `metadata` is merged into what the token already holds, and the
        merged object must stay within 8 KB. `characterId` cannot be changed
        here.

        The reply is filtered for the caller exactly as `GET /api/campaigns/{campaignId}/maps/{id}`
        is: a player receives only the tokens, and only the fields of each,
        that they may see (see the Token schema), and `token` is null when the
        map would not send them the updated token (hidden, or on the other plane); `fogData` is null for them, and
        `spiritLayerUrl` too unless they can see the spirit layer (crossed over, or
        revealed campaign-wide).

        A request carrying `layer`, `visible` or `controlledBy` can move a
        token's controller between planes, so it sends the initiative order
        again to every connected member (`initiative.state`), each as they
        may see it, whenever anything is in the order, whether or not this
        token is a combatant. Any other update sends the order again only if
        this token is in it. No map event is sent: other open pages see the
        change only on their next map update or reload.
      operationId: updateToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tokenId
          in: path
          required: true
          description: >-
            Not necessarily a UUID. A token's id is whatever is stored for
            it, and an older map can hold ids from before tokens were given
            UUIDs.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: DM only. An empty name is ignored.
                imageUrl:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: DM only.
                position:
                  type: object
                  required: [x, y]
                  description: Grid square, within the map (400 otherwise). Only x and y are stored.
                  properties:
                    x:
                      type: number
                    y:
                      type: number
                size:
                  type: object
                  required: [width, height]
                  description: Grid squares. DM only.
                  properties:
                    width:
                      type: integer
                      minimum: 1
                      maximum: 10
                    height:
                      type: integer
                      minimum: 1
                      maximum: 10
                layer:
                  type: string
                  enum: [token, spirit]
                  description: DM only.
                visible:
                  type: boolean
                  description: DM only.
                controlledBy:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Who controls the token. DM only. Stored as sent: null leaves
                    the token with no controller, and a value must name a player
                    of this campaign (400 otherwise); the character-owner default
                    applies only when the token is created.
                rotation:
                  type: number
                  minimum: 0
                  maximum: 360
                  description: Degrees
                conditions:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    minLength: 1
                    maxLength: 60
                  description: Each entry is trimmed and must not be blank.
                metadata:
                  type: object
                  description: DM only. Merged into the stored metadata; the result must stay within 8 KB.
                sightRadius:
                  type: number
                  minimum: 0
                  maximum: 200
                  description: Darkvision in grid squares (0 = none). DM only; it decides what the server sends this token's player.
                obscured:
                  type: boolean
                  description: Hide what the token is from players who do not control it. DM only; this route is the only way to change it after creation.
                type:
                  type: string
                  enum: [player, npc, object]
                  description: DM only.
                disposition:
                  type: string
                  enum: [friendly, neutral, hostile]
                  nullable: true
                  description: DM only.
                hp:
                  allOf:
                    - $ref: '#/components/schemas/TokenHp'
                  nullable: true
                  description: DM only.
                showHpBar:
                  type: boolean
                  description: DM only.
                notes:
                  type: string
                  maxLength: 5000
                  nullable: true
                  description: DM only; never sent to a player. Null stores an empty string.
                initiative:
                  type: number
                  nullable: true
                  description: DM only.
                displayMode:
                  type: string
                  enum: [pog, top-down, full-art]
                  description: DM only.
                statBlock:
                  type: object
                  nullable: true
                  description: DM only; never sent to a player.
                creatureTemplateId:
                  type: string
                  format: uuid
                  nullable: true
                  description: DM only.
      responses:
        '200':
          description: Token updated. The token and the map are filtered for the caller as the map fetch is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    allOf:
                      - $ref: '#/components/schemas/Token'
                    nullable: true
                    description: Null when the map would not send the caller this token (hidden from them, or on the other plane).
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Maps
      summary: Delete token
      description: >-
        Remove a token from the map (DM only). If it is a combatant, it
        leaves the initiative order and the order is sent again to every
        connected member (`initiative.state`), even when that empties it.
        Otherwise the order is sent again only while anything is in it, since
        removing a player's spirit-layer token can move them between planes.
        No map event is sent: other open pages see the token go only on their
        next map update or reload.
      operationId: deleteToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Not necessarily a UUID. A token's id is whatever is stored for
            it, and an older map can hold ids from before tokens were given
            UUIDs.
      responses:
        '200':
          description: Token removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # WALLS, LIGHTS, & FOG
  # Per-map dynamic lighting and fog-of-war state.
  # ============================================

  /api/campaigns/{campaignId}/maps/{id}/tokens/move:
    post:
      tags:
        - Maps
      summary: Move tokens to another map
      description: |
        Move tokens from this map to another map of the campaign in one step
        (DM only). Each token travels as it is stored, under its own id, with
        its position clamped onto the target map, and a combatant keeps its
        place in the initiative order. All named tokens move or none does: an
        id that is not on this map answers 404 (`Token not found on this map:
        <ids>`) and nothing changes, as does a `targetMapId` that is not a map
        of this campaign (`Target map not found in this campaign`).
        `targetMapId` naming the source map itself answers 400. Whichever of
        the two maps the campaign is showing is then sent again to every
        member as `map.changed`, as each may see it; the other stays the DM's
        until they switch. While anything is in the initiative order it is
        sent again too (`initiative.state`), since a spirit-layer token moving
        onto or off the current map can move its controller between planes.
      operationId: moveTokens
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          description: The map the tokens are on
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenIds
                - targetMapId
              properties:
                tokenIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    description: Not necessarily a UUID; an older map can hold ids from before tokens were given one.
                targetMapId:
                  type: string
                  format: uuid
                  description: Another map of the same campaign
      responses:
        '200':
          description: Tokens moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  moved:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/walls:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: List wall segments
      description: Returns all wall segments for the map. Available to the DM for any map, and to other members for the campaign's current map only (404 otherwise).
      operationId: listWalls
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All wall segments on the map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Walls & Lighting
      summary: Replace all wall segments
      description: |
        Replaces the map's entire wall list atomically. DM only. Every
        segment needs a UUID `id`, and a map holds at most 5000; a
        list over that, or any invalid segment, answers 400 and changes
        nothing.

        Each wall route tells connected clients of the change with the event
        the matching socket edit sends (`walls:replaced`, `wall:added`,
        `wall:updated`, `wall:removed`): to every member for the map the
        campaign is showing, and to the DM's connections for any other. On a
        lit map that the campaign is showing, each player is then sent
        `map.changed` with the map as they can now see it, since walls and
        doors decide which tokens a player is sent.
      operationId: replaceWalls
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/Wall'
              required: [segments]
      responses:
        '200':
          description: Updated wall list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Walls & Lighting
      summary: Add a wall segment
      description: |
        Append a single wall segment. The server assigns an `id` if the body
        omits one, and keeps one it sent, which must be a UUID. A map holds
        at most 5000 segments; adding to a full map answers 400 with
        `error: Limit Exceeded`. DM only. Connected clients are sent
        `wall:added` (see `replaceWalls`).
      operationId: addWall
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WallInput'
            example:
              x1: 240
              y1: 180
              x2: 400
              y2: 180
              type: wall
      responses:
        '201':
          description: Wall segment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:
                    $ref: '#/components/schemas/Wall'
                  total:
                    type: integer
                    description: Total wall count after this addition
                    example: 47
        '400':
          description: >-
            Validation failure (`error: Validation Error`), or the map
            already holds 5000 segments (`error: Limit Exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Limit Exceeded
                message: Maximum 5000 wall segments per map
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/walls/{sid}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/WallId'
    delete:
      tags:
        - Walls & Lighting
      summary: Delete a wall segment
      description: Remove a wall segment by id. DM only. Connected clients are sent `wall:removed` (see `replaceWalls`).
      operationId: deleteWall
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Segment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Wall segment deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Walls & Lighting
      summary: Update a wall segment's type
      description: |
        Change the `type` of a single wall segment, most commonly to open or
        close a door. Only `type` is read; any other field in the body is
        ignored, so the segment keeps its position. `door-locked` is refused
        with 400 here, although `PUT` and `POST` on the wall list and the
        DM's socket `wall:update` event accept it. DM only. Connected clients are
        sent `wall:updated` (see `replaceWalls`).
      operationId: updateWallType
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [wall, door-closed, door-open, window]
              required: [type]
            example:
              type: door-open
      responses:
        '200':
          description: Updated segment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:
                    $ref: '#/components/schemas/Wall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lights:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: List light sources
      description: Returns all placed lights on the map. Available to the DM for any map, and to other members for the campaign's current map only (404 otherwise).
      operationId: listLights
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All lights on the map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lights:
                    type: array
                    items:
                      $ref: '#/components/schemas/LightSource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Walls & Lighting
      summary: Replace all light sources
      description: |
        Replaces the map's entire light list atomically. Used when committing
        a large batch of changes or restoring saved lighting state. DM only.
        Every light needs a UUID `id` and a `dimRadius` at least its
        `brightRadius`, and a map holds at most 200; a list over that, or any
        invalid light, answers 400 and changes nothing.

        Each light route tells connected clients of the change with the event
        the matching socket edit sends (`lights:replaced`, `light:added`,
        `light:updated`, `light:removed`): to every member for the map the
        campaign is showing, and to the DM's connections for any other. On a
        lit map that the campaign is showing, each player is then sent
        `map.changed` with the map as they can now see it, since lights decide
        which tokens a player is sent.
      operationId: replaceLights
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lights:
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/LightSource'
              required: [lights]
      responses:
        '200':
          description: Updated light list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lights:
                    type: array
                    items:
                      $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Walls & Lighting
      summary: Add a light source
      description: >-
        Add a single light. The server assigns an `id` if the body omits
        one, and keeps one it sent, which must be a UUID. `dimRadius` must be
        at least `brightRadius`. A map holds at most 200 lights; adding to a
        full map answers 400 with `error: Limit Exceeded`. DM only. Connected
        clients are sent `light:added` (see `replaceLights`).
      operationId: addLight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightSourceInput'
            example:
              x: 320
              y: 240
              brightRadius: 4
              dimRadius: 8
              color: '#ffcc66'
              enabled: true
      responses:
        '201':
          description: Light created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  light:
                    $ref: '#/components/schemas/LightSource'
                  total:
                    type: integer
                    description: Total light count after this addition
                    example: 5
        '400':
          description: >-
            Validation failure (`error: Validation Error`), or the map
            already holds 200 lights (`error: Limit Exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Limit Exceeded
                message: Maximum 200 light sources per map
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lights/{lightId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/LightId'
    patch:
      tags:
        - Walls & Lighting
      summary: Update a light source
      description: |
        Partially update a light's position, radii, color, or enabled state.
        Send only the fields you want to change. Other fields, `id` included,
        are ignored, and a body with none of these six answers 400 (`At least
        one field must be provided`). `brightRadius` and `dimRadius` are each
        checked against their own limits but not against each other, so a
        patch can leave the light stored with a dim radius smaller than its
        bright radius, which `PUT` and `POST` on the light list refuse. DM
        only. Connected clients are sent `light:updated` (see
        `replaceLights`).
      operationId: updateLight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
                brightRadius: { type: number, minimum: 0, maximum: 100 }
                dimRadius: { type: number, minimum: 0.5, maximum: 100 }
                color:
                  type: string
                  pattern: '^#[0-9a-fA-F]{6}$'
                enabled: { type: boolean }
            example:
              enabled: false
      responses:
        '200':
          description: Updated light.
          content:
            application/json:
              schema:
                type: object
                properties:
                  light:
                    $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Walls & Lighting
      summary: Delete a light source
      description: Remove a light. DM only. Connected clients are sent `light:removed` (see `replaceLights`).
      operationId: deleteLight
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Light deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Light source deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/fog:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: Get fog state (DM only)
      description: |
        Returns the full `FogState` for the map, one cell per grid square,
        whether or not fog of war is on for it. A map with no stored fog, or
        whose stored fog no longer matches its `width`, `height` and
        `gridSize`, answers a fresh, fully hidden grid. Players do not see the
        raw fog state; they receive the revealed cells over WebSocket
        (`fog:cells`) as the DM reveals areas. DM only.
      operationId: getFogState
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current fog state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fogState:
                    $ref: '#/components/schemas/FogState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/fog/operation:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    post:
      tags:
        - Walls & Lighting
      summary: Apply a fog reveal/hide operation
      description: |
        Mutate the fog state by either revealing/hiding a list of cell indices
        (`reveal` / `hide` with `cells: number[]`) or by revealing/hiding the
        entire map (`reveal_all` / `hide_all`). A cell index past the end of
        the grid is ignored. Stored fog that no longer matches the map's grid
        is started again from fully hidden before the operation applies.
        Returns the updated fog state and broadcasts it exactly as the socket
        `fog:operation` event does: `fog:updated` with the whole grid to the
        DM, and `fog:cells` with the revealed cells to every other member,
        for the map the campaign is showing; for any other map, only the DM's
        connections are told. Refused with 409 (`Fog of war is off for this
        map`) while `fogEnabled` is off for the map, before the body is
        checked. DM only.
      operationId: applyFogOperation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FogOperation'
            examples:
              revealCells:
                summary: Reveal specific cells
                value:
                  op: reveal
                  cells: [0, 1, 2, 50, 51]
              hideAll:
                summary: Re-fog the entire map
                value:
                  op: hide_all
      responses:
        '200':
          description: Updated fog state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fogState:
                    $ref: '#/components/schemas/FogState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lighting:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    put:
      tags:
        - Walls & Lighting
      summary: Toggle dynamic lighting
      description: |
        Enable or disable dynamic lighting for the map, the same flag as
        `lightingEnabled` on `PUT /api/campaigns/{campaignId}/maps/{id}`. While
        it is on, a player is sent only their own tokens and those their
        tokens can see, judged from the map's walls and lights, and a
        spectator none. Manual fog of war is a separate setting
        (`fogEnabled`). DM only.

        Every request broadcasts `map:settings:updated`, carrying all four
        per-map flags, to every connected member for the map the campaign is
        showing and to the DM's connections for any other. When the flag
        actually changes on the map the campaign is showing, each member is
        also sent the map as they can now see it (`map.changed`), so nothing
        needs a reload; a map that is not being shown gets no `map.changed`.
      operationId: setLightingEnabled
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
            example:
              enabled: true
      responses:
        '200':
          description: Updated lighting flag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lightingEnabled: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # CREATURE LIBRARY
  # ============================================

  /api/campaigns/{campaignId}/creatures:
    get:
      tags: [Creatures]
      summary: List creature templates
      description: |
        Returns SRD (global) + campaign-specific custom creature templates.
        Supports search, source filter, challenge rating filter, and pagination.
        Campaign DM only: the library holds stat blocks and the DM's homebrew,
        and the client shows it to the DM alone.
      operationId: listCreatures
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: search
          in: query
          schema:
            type: string
          description: Filter by name (case-insensitive partial match)
        - name: source
          in: query
          schema:
            type: string
            enum: [srd, custom]
          description: Filter by source
        - name: cr
          in: query
          schema:
            type: string
          description: Filter by challenge rating
        - name: gameSystem
          in: query
          schema:
            type: string
          description: Filter by game system
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: Paginated creature list
          content:
            application/json:
              schema:
                type: object
                properties:
                  creatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatureTemplate'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Creatures]
      summary: Create custom creature
      description: Create a new campaign-specific custom creature template (DM only). An image address on this server must be an asset's exact address (`/api/assets/<kind>/<id>`), and one naming an existing asset must name one the caller can read (403 otherwise), unless this campaign already stores that exact address somewhere, as a copy of a token, template or creature does; an address naming an asset that no longer exists is accepted.
      operationId: createCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - statBlock
              properties:
                name:
                  type: string
                statBlock:
                  type: object
                gameSystem:
                  type: string
                challengeRating:
                  type: string
                creatureType:
                  type: string
                alignment:
                  type: string
                imageUrl:
                  type: string
                size:
                  type: object
                  properties:
                    width:
                      type: integer
                    height:
                      type: integer
                disposition:
                  type: string
                  enum: [hostile, friendly, neutral]
                displayMode:
                  type: string
                  enum: [pog, top-down, full-art]
      responses:
        '201':
          description: Creature template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/creatures/{creatureId}:
    get:
      tags: [Creatures]
      summary: Get creature template
      description: Get a single creature template by ID. Campaign DM only. A creature belonging to this campaign, or a global SRD creature; one belonging to another campaign answers 404.
      operationId: getCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Creature template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Creatures]
      summary: Update custom creature
      description: Update a campaign-specific custom creature template (DM only). Cannot edit SRD creatures (returns 403). An image address on this server must be an asset's exact address (`/api/assets/<kind>/<id>`), and one naming an existing asset must name one the caller can read (403 otherwise), unless this campaign already stores that exact address somewhere, as a copy of a token, template or creature does; an address naming an asset that no longer exists is accepted. The address already stored may be sent back unchanged.
      operationId: updateCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                statBlock:
                  type: object
                challengeRating:
                  type: string
                creatureType:
                  type: string
                alignment:
                  type: string
                imageUrl:
                  type: string
                size:
                  type: object
                disposition:
                  type: string
                displayMode:
                  type: string
      responses:
        '200':
          description: Creature template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Creatures]
      summary: Delete custom creature
      description: Delete a campaign-specific custom creature template (DM only). Cannot delete SRD creatures (returns 403).
      operationId: deleteCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Creature deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/{creatureId}/duplicate:
    post:
      tags: [Creatures]
      summary: Duplicate creature
      description: Duplicate a creature of this campaign, or a global SRD creature, as a new custom creature in this campaign (DM only). A creature belonging to another campaign answers 404.
      operationId: duplicateCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Duplicated creature template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/favorites/list:
    get:
      tags: [Creatures]
      summary: List creature favorites
      description: Returns creature IDs and full creature objects that the current user has favorited in this campaign. Campaign DM only, like the library it belongs to.
      operationId: listCreatureFavorites
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Favorite creature list
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoriteIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  creatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatureTemplate'

  /api/campaigns/{campaignId}/creatures/{creatureId}/favorite:
    post:
      tags: [Creatures]
      summary: Toggle creature favorite
      description: Toggle favorite for the current user in this campaign. Campaign DM only. If already favorited, removes it; otherwise adds it. Only a creature of this campaign or a global SRD creature can be favorited; another campaign's answers 404.
      operationId: toggleCreatureFavorite
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Favorite toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorited:
                    type: boolean

  /api/campaigns/{campaignId}/creatures/seed/status:
    get:
      tags: [Creatures]
      summary: Check SRD seed status
      description: Returns whether SRD creatures have been seeded. Any campaign member can check.
      operationId: getSrdSeedStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Seed status
          content:
            application/json:
              schema:
                type: object
                properties:
                  seeded:
                    type: boolean
                  count:
                    type: integer
                  seedInProgress:
                    type: boolean

  /api/campaigns/{campaignId}/creatures/seed:
    post:
      tags: [Creatures]
      summary: Seed SRD creatures
      description: |
        Fetch SRD creatures from Open5e and populate the library (DM only).
        Safe to call multiple times — existing SRD creatures are not duplicated.

        Existing SRD creatures stored before hit points were tracked are updated
        in place with `hpMax` / `hitDice`; only those missing keys are added, and
        custom creatures are never modified.

        Returns 409 if seeding is already in progress.
      operationId: seedSrdCreatures
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Seeding complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  fetched:
                    type: integer
                    description: Monsters returned by Open5e
                  created:
                    type: integer
                    description: New SRD creatures inserted
                  updated:
                    type: integer
                    description: Existing SRD creatures backfilled with hit points
                  skipped:
                    type: integer
                    description: Existing SRD creatures left unchanged
                  alreadyExisted:
                    type: integer
        '409':
          description: Seeding already in progress

  # ============================================
  # TOKEN TEMPLATE ENDPOINTS
  # ============================================

  /api/campaigns/{campaignId}/token-templates:
    get:
      tags: [Token Templates]
      summary: List token templates
      description: 'Get all token templates for a campaign. Supports search and type filtering. Campaign DM only: a template carries the notes, stat block and hit points the map keeps from players.'
      operationId: listTokenTemplates
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: search
          in: query
          schema:
            type: string
        - name: type
          in: query
          schema:
            type: string
            enum: [npc, player, object]
      responses:
        '200':
          description: List of token templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Token Templates]
      summary: Create token template
      description: Create a new token template (DM only). An image address on this server must be an asset's exact address (`/api/assets/<kind>/<id>`), and one naming an existing asset must name one the caller can read (403 otherwise), unless this campaign already stores that exact address somewhere, as a copy of a token, template or creature does; an address naming an asset that no longer exists is accepted.
      operationId: createTokenTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/token-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Token Templates]
      summary: Get token template
      description: Campaign DM only, like the list.
      operationId: getTokenTemplate
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Token Templates]
      summary: Update token template
      description: Update a token template (DM only). An image address on this server must be an asset's exact address (`/api/assets/<kind>/<id>`), and one naming an existing asset must name one the caller can read (403 otherwise), unless this campaign already stores that exact address somewhere, as a copy of a token, template or creature does; an address naming an asset that no longer exists is accepted. The address already stored may be sent back unchanged.
      operationId: updateTokenTemplate
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Token Templates]
      summary: Delete token template
      operationId: deleteTokenTemplate
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Template deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/token-templates/from-token:
    post:
      tags: [Token Templates]
      summary: Save token as template
      description: Create a token template from an existing map token's properties. An image address on this server must be an asset's exact address (`/api/assets/<kind>/<id>`), and one naming an existing asset must name one the caller can read (403 otherwise), unless this campaign already stores that exact address somewhere, as a copy of a token, template or creature does; an address naming an asset that no longer exists is accepted.
      operationId: saveTokenAsTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '201':
          description: Template created from token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/token-templates/{id}/copy-to/{targetCampaignId}:
    post:
      tags: [Token Templates]
      summary: Copy template to another campaign
      description: |
        Copy a token template to another campaign. The authenticated user must
        be the DM of **both** the source and target campaigns. The template's
        picture is checked as a new reference in the target campaign: an
        existing asset the caller cannot read, and the target campaign does
        not already use, answers 403 and nothing is copied.
      operationId: copyTokenTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/TemplateId'
        - name: targetCampaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Template copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          description: Cannot copy a template to the same campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # CAMPAIGN EXPORT/IMPORT ENDPOINTS
  # ============================================

  /api/campaigns/{campaignId}/export:
    get:
      tags: [Campaign Export/Import]
      summary: Export campaign
      description: |
        Export a campaign as a .cozyvtt ZIP archive (DM only).
        Rate limited to 1 per 5 minutes per user. The archive holds only the
        asset files the caller may read; a picture the campaign names that the
        caller cannot read, or that no longer exists, is left out, and the map,
        token, creature or template that used it is imported without a picture.
      operationId: exportCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: includeAudio
          in: query
          schema:
            type: boolean
            default: false
        - name: includeTokens
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '429':
          description: Rate limited

  /api/campaigns/import/preview:
    post:
      tags: [Campaign Export/Import]
      summary: Preview import archive
      description: Upload a .cozyvtt archive and return its manifest without creating anything.
      operationId: previewCampaignImport
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Archive preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    $ref: '#/components/schemas/CampaignImportPreview'
        '400':
          description: Invalid archive

  /api/campaigns/import:
    post:
      tags: [Campaign Export/Import]
      summary: Import campaign
      description: |
        Upload a .cozyvtt archive and create a new campaign.
        Rate limited to 1 per 5 minutes per user.
      operationId: importCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                campaignName:
                  type: string
                importTokens:
                  type: string
                  enum: ['true', 'false']
                  default: 'true'
      responses:
        '201':
          description: Campaign imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaignId:
                    type: string
                  campaignName:
                    type: string
                  mapCount:
                    type: integer
                  tokenCount:
                    type: integer
                  creatureCount:
                    type: integer
                  tokenTemplateCount:
                    type: integer
        '400':
          description: Import failed
        '429':
          description: Rate limited

  # ============================================
  # ADMIN ENDPOINTS
  # ============================================

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Get system statistics
      description: Returns aggregate counts for users, campaigns, characters, maps, and asset storage broken down by type.
      operationId: adminGetStats
      security:
        - cookieAuth: []
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  userCount:
                    type: integer
                  campaignCount:
                    type: integer
                  activeCampaignCount:
                    type: integer
                  totalStorageBytes:
                    type: integer
                  activeSessionCount:
                    type: integer
                  sessionCount:
                    type: integer
                  characterCount:
                    type: integer
                  mapCount:
                    type: integer
                  assetBreakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT, OTHER]
                        count:
                          type: integer
                        sizeBytes:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/settings:
    get:
      tags: [Admin]
      summary: Get system settings
      operationId: adminGetSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current system settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      id:
                        type: string
                      setupCompleted:
                        type: boolean
                      instanceName:
                        type: string
                      timezone:
                        type: string
                      allowRegistration:
                        type: boolean
                      requireAdminApproval:
                        type: boolean
                      themeId:
                        type: string
                      customThemeColors:
                        type: object
                        nullable: true
                        description: Map of theme token name to colour string, stored as the PUT request sent it.
                        additionalProperties:
                          type: string
                      fontId:
                        type: string
                      customLogoUrl:
                        type: string
                        nullable: true
                      customFaviconUrl:
                        type: string
                        nullable: true
                      customMascotUrl:
                        type: string
                        nullable: true
                      campaignExportSizeLimit:
                        type: integer
                        description: Byte ceiling for a campaign export; not changeable through this route.
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Admin]
      summary: Update system settings
      description: |
        Every field is optional; only the ones present are changed. `instanceName`,
        `timezone`, `themeId` and `fontId` are trimmed, stripped of `<` and `>`, then cut
        to their max length rather than rejected for being too long. `customThemeColors`
        is stored exactly as sent, with no validation of its keys or values.

        `customLogoUrl`, `customFaviconUrl` and `customMascotUrl` name a file this
        instance serves: `""` or `null` clears the override back to the default, and
        anything else must be a same-origin path starting with a single `/` (no scheme,
        no `//`, no backslash, no control characters) or the request answers 400. These
        images themselves are not uploaded here — replace the files in
        `frontend/public/` and rebuild to change what the path points at.
      operationId: adminUpdateSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceName:
                  type: string
                  maxLength: 100
                timezone:
                  type: string
                  maxLength: 50
                allowRegistration:
                  type: boolean
                requireAdminApproval:
                  type: boolean
                themeId:
                  type: string
                  maxLength: 50
                customThemeColors:
                  type: object
                  additionalProperties:
                    type: string
                fontId:
                  type: string
                  maxLength: 50
                customLogoUrl:
                  type: string
                  nullable: true
                  description: Same-origin path, or "" or null to clear.
                customFaviconUrl:
                  type: string
                  nullable: true
                  description: Same-origin path, or "" or null to clear.
                customMascotUrl:
                  type: string
                  nullable: true
                  description: Same-origin path, or "" or null to clear.
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  settings:
                    type: object
                    description: The full settings object, in the same shape as GET /api/admin/settings returns.
        '400':
          description: A branding URL was not a same-origin path
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/activity:
    get:
      tags: [Admin]
      summary: Get system activity
      description: |
        Returns currently-online users, recent admin actions (SystemLog), the 50 newest
        accounts, and the 20 most recent game sessions. "Online" means the user holds an
        unexpired row in the session table — up to 30 days away if they signed in with
        "remember me" — not that a socket is currently connected.
      operationId: adminGetActivity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: System activity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineUsers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        displayName:
                          type: string
                        platformRole:
                          type: string
                        lastLoginAt:
                          type: string
                          nullable: true
                        sessionExpiry:
                          type: string
                          nullable: true
                  recentLogs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        level:
                          type: string
                          enum: [INFO, WARNING, ERROR, CRITICAL]
                        message:
                          type: string
                        userId:
                          type: string
                          nullable: true
                        context:
                          type: object
                          nullable: true
                        createdAt:
                          type: string
                  recentUsers:
                    type: array
                    description: The 50 newest accounts. A select of seven fields, not the full User object.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        displayName:
                          type: string
                        platformRole:
                          type: string
                          enum: [ADMIN, USER]
                        mfaEnabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastLoginAt:
                          type: string
                          format: date-time
                          nullable: true
                  recentSessions:
                    type: array
                    description: The 20 most recently started game sessions, newest first.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        campaignId:
                          type: string
                        sessionNumber:
                          type: integer
                        startedAt:
                          type: string
                          format: date-time
                        endedAt:
                          type: string
                          format: date-time
                          nullable: true
                        savedState:
                          type: object
                          nullable: true
                          description: Token positions, map state and the like, as the session left them.
                        notes:
                          type: string
                          nullable: true
                        campaign:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/config:
    get:
      tags: [Admin]
      summary: Get server configuration
      description: Returns read-only server configuration — upload size limits, session timeouts, and SMTP status (no credentials exposed).
      operationId: adminGetConfig
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Server configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadLimits:
                    type: object
                    properties:
                      MAP:
                        type: integer
                        description: Max file size in bytes
                      TOKEN:
                        type: integer
                      AUDIO:
                        type: integer
                      AVATAR:
                        type: integer
                      DOCUMENT:
                        type: integer
                  sessionTimeoutMs:
                    type: integer
                  rememberMeTimeoutMs:
                    type: integer
                  smtp:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      host:
                        type: string
                        nullable: true
                      port:
                        type: integer
                      user:
                        type: string
                        nullable: true
                      secure:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users:
    post:
      tags: [Admin]
      summary: Create a new user
      description: |
        Creates a user with a generated temporary password. The account is flagged
        `mustChangePassword`, so that password can only be used to set a real one — every
        other endpoint returns 403 `PASSWORD_CHANGE_REQUIRED` until it is replaced.

        When SMTP is configured the credentials are emailed and `temporaryPassword` is
        **withheld** from the response; it is returned only when the email could not be
        sent, so the admin never holds a working credential unnecessarily. To create an
        account without any password at all, use `/api/admin/users/invite`.

        `displayName` defaults to the part of the email before `@` when omitted, is
        trimmed and stripped of `<` and `>`, then cut to 50 characters rather than
        rejected for being too long. `platformRole` is not validated against the enum:
        any value other than exactly `"ADMIN"`, including an unrecognised string,
        becomes `USER`.
      operationId: adminCreateUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  maxLength: 50
                platformRole:
                  type: string
                  enum: [USER, ADMIN]
                  default: USER
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  emailSent:
                    type: boolean
                    description: Whether the welcome email with the credentials was delivered
                  temporaryPassword:
                    type: string
                    description: >-
                      One-time temporary password. Present ONLY when emailSent is false —
                      share it securely; it is not retrievable afterwards.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use

  /api/admin/users/invite:
    post:
      tags: [Admin]
      summary: Invite a user by email
      description: |
        Creates an account with **no usable password** and emails the new user a link to
        choose one. The link expires in 7 days and is the only way into the account, so
        no credential is ever returned or shown to the inviting admin.

        Requires SMTP. If the invitation cannot be delivered the account is rolled back
        rather than left unreachable.

        The recipient completes setup at `/accept-invite?token=…`, which submits to
        `POST /api/auth/reset-password` — invitations and password resets share the same
        token machinery.

        `displayName` and `platformRole` are handled exactly as in `POST /api/admin/users`:
        the name is cut to 50 characters rather than rejected, and any `platformRole`
        other than exactly `"ADMIN"` becomes `USER`.
      operationId: adminInviteUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  maxLength: 50
                platformRole:
                  type: string
                  enum: [USER, ADMIN]
                  default: USER
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  expiresInDays:
                    type: integer
                    example: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use
        '502':
          description: The invitation email could not be delivered; no account was created
        '503':
          description: SMTP is not configured on this instance

  /api/admin/users/{id}/resend-invite:
    post:
      tags: [Admin]
      summary: Resend an invitation
      description: |
        Issues a fresh invitation link and invalidates any outstanding one. Useful when the
        original expired or never arrived. Requires SMTP. Works for any existing account,
        not only one that was originally created through `/api/admin/users/invite` — it
        sets a usable password-reset token regardless of how the account was created.
      operationId: adminResendInvite
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  expiresInDays:
                    type: integer
                    example: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The invitation email could not be sent
        '503':
          description: SMTP is not configured on this instance

  /api/admin/users/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending user registration
      description: Approves a user who registered while `requireAdminApproval` was enabled. Blocked users receive a 403 on login until approved.
      operationId: adminApproveUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User approved
        '400':
          description: User is already approved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users/{id}/reset-mfa:
    post:
      tags: [Admin]
      summary: Reset MFA for a locked-out user
      description: >-
        Disables TOTP and clears backup codes for a user who is locked out, turning MFA
        off for the account. This does not force the user to re-enroll: they sign in
        with just their password next time, and MFA stays off until they set it up
        again themselves.
      operationId: adminResetUserMfa
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MFA reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: MFA is not enabled for this user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/smtp/test:
    post:
      tags: [Admin]
      summary: Send a test email to verify SMTP configuration
      operationId: adminTestSmtp
      description: Sends a test email to the calling admin's own email address. Returns 400 if SMTP is not configured via environment variables.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Test email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: SMTP is not configured (missing env vars)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Failed to send email (SMTP connection error)

  /api/admin/backups:
    post:
      tags: [Admin]
      summary: Create a backup archive
      operationId: adminCreateBackup
      description: |
        Platform ADMIN only. Writes `backup-YYYY-MM-DDTHH-MM-SS.zip` (with a `-2`, `-3`
        suffix while that name is taken, so two backups asked for in the same
        second are both kept) to the server's backup directory (`backend/backups/` on the host under Docker, `BACKUP_DIR`
        on an install without Docker), holding `database.sql`, a `pg_dump` of the
        database without its ownership and privilege statements and without the
        login sessions, and the `uploads/` tree. Needs `pg_dump` in the backend
        image, which the Docker image provides; answers 500 when it is missing or
        the dump fails. The archive can be fetched with the download route and
        loaded back with the restore route.
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename:
                    type: string
                  sizeBytes:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: pg_dump not found or backup failed
    get:
      tags: [Admin]
      summary: List database backups
      operationId: adminListBackups
      description: Returns the backup archives (`backup-YYYY-MM-DDTHH-MM-SS.zip`, or the same with a `-2`, `-3` suffix) in the server's backup directory with filename, size and creation time, newest first. A backup is written under a temporary name and appears only once it is complete; an unfinished one left by a backend stopped partway through is deleted when the list is read. A backup directory that cannot be read answers 500, not an empty list.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        sizeBytes:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The backup directory could not be read (error `Backup Failed`; the message names the directory)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/backups/{filename}/download:
    get:
      tags: [Admin]
      summary: Download a backup file
      operationId: adminDownloadBackup
      description: Streams a backup `.zip` (the database dump and every uploaded file) as a download. Filename is strictly validated against the `backup-YYYY-MM-DDTHH-MM-SS.zip` pattern (an optional `-2`, `-3` suffix included) to prevent path traversal.
      security:
        - cookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: backup-2026-03-04T10-30-00.zip
      responses:
        '200':
          description: Backup file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filename format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/backups/{filename}:
    delete:
      tags: [Admin]
      summary: Delete a backup file
      operationId: adminDeleteBackup
      description: Deletes a backup `.zip` from the server. Filename is strictly validated. Action is logged to SystemLog.
      security:
        - cookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backup deleted
        '400':
          description: Invalid filename format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# WebSocket events are not described here. Their reference is
# backend/docs/WEBSOCKET_DOCUMENTATION.md, whose event table is generated from
# the handlers by scripts/websocket-events.py.

  # ---------------------------------------------------------------------------
  # Shared character sheets ("character templates")
  #
  # Server-wide starter sheets any signed-in user can copy. Creating, editing and
  # deleting one requires the `templateEditor` flag on the user, or platform
  # ADMIN. That check reads the database rather than the session, because
  # templateEditor is not carried in the session.
  # ---------------------------------------------------------------------------
  /api/character-templates:
    get:
      tags: [Character Templates]
      summary: List shared character sheets
      description: >-
        Every template is visible to every signed-in user. Sorted by name,
        A to Z, and paged with `limit` and `offset`; `total` counts every
        match. A `gameSystem` value that is neither `flexible` nor a known
        game system answers 500.
      operationId: listCharacterTemplates
      security:
        - cookieAuth: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring match on the template's name.
          schema:
            type: string
        - name: gameSystem
          in: query
          description: '`flexible` selects the system-agnostic templates (stored with a null gameSystem); otherwise a GameSystem value.'
          schema:
            type: string
            enum: [flexible, DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
        - name: mine
          in: query
          description: '`true` limits the list to templates the caller authored.'
          schema:
            type: string
            enum: ['true']
        - name: limit
          in: query
          description: Values above 100 are treated as 100 and negative values as 1; `0` or a non-number gives the default.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: A negative value or a non-number is treated as 0.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Matching templates, with the `limit` and `offset` actually applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        gameSystem:
                          type: string
                          enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                          nullable: true
                        tokenImageUrl: { type: string, nullable: true }
                        data:
                          type: object
                          description: The sheet.
                        createdById: { type: string, format: uuid, nullable: true }
                        createdBy:
                          type: object
                          nullable: true
                          properties:
                            id: { type: string, format: uuid }
                            displayName: { type: string }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Character Templates]
      summary: Publish a shared character sheet
      description: >-
        Any signed-in user may publish a template, and becomes its author.
        `name` is trimmed, 1 to 200 characters. `description` is trimmed, up
        to 2000 characters. When `gameSystem` is given, `data` must pass that
        system's sheet schema (an omitted `data` is checked as `{}` and so
        fails), but `data` is stored exactly as sent, so fields the schema
        does not declare are kept; the template is not stored as the schema's
        parsed output. Without a `gameSystem`, `data` is free-form and an
        omitted one is stored as `{}`. A `tokenImageUrl`, when given, must be
        an existing GLOBAL-scoped asset, named by its bare id (stored as
        `/api/assets/tokens/<id>`) or by its exact address
        (`/api/assets/<kind>/<id>`, with nothing after the id); anything else
        answers 400. An empty string or null leaves the template without an
        image.
      operationId: createCharacterTemplate
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                  maxLength: 2000
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                data:
                  type: object
                  description: The sheet. Free-form when gameSystem is null.
                tokenImageUrl:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  gameSystem:
                    type: string
                    enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                    nullable: true
                  tokenImageUrl: { type: string, nullable: true }
                  data:
                    type: object
                    description: The sheet, stored exactly as sent.
                  createdById: { type: string, format: uuid, nullable: true }
                  createdBy:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      displayName: { type: string }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/character-templates/{id}:
    get:
      tags: [Character Templates]
      summary: Get one shared character sheet
      operationId: getCharacterTemplate
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The template
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  gameSystem:
                    type: string
                    enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                    nullable: true
                  tokenImageUrl: { type: string, nullable: true }
                  data:
                    type: object
                    description: The sheet, stored exactly as sent.
                  createdById: { type: string, format: uuid, nullable: true }
                  createdBy:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      displayName: { type: string }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Character Templates]
      summary: Update a shared character sheet
      description: >-
        The template's author, a user with the `templateEditor` flag, or a
        platform ADMIN; anyone else gets 403. At least one of `name`,
        `description`, `data` and `tokenImageUrl` must be sent, or the answer
        is 400; other keys, `gameSystem` included, are ignored, since a
        template's game system is fixed at creation. `data` replaces the
        whole sheet; it is checked against the template's game system (free
        form if it has none) and stored as sent. `tokenImageUrl` follows the
        rule on create, and null or an empty string removes the image.
      operationId: updateCharacterTemplate
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                  maxLength: 2000
                data:
                  type: object
                tokenImageUrl:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  gameSystem:
                    type: string
                    enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                    nullable: true
                  tokenImageUrl: { type: string, nullable: true }
                  data:
                    type: object
                    description: The sheet, stored exactly as sent.
                  createdById: { type: string, format: uuid, nullable: true }
                  createdBy:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      displayName: { type: string }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Character Templates]
      summary: Delete a shared character sheet
      description: The template's author, a user with the `templateEditor` flag, or a platform ADMIN; anyone else gets 403.
      operationId: deleteCharacterTemplate
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Character template deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/characters/templates/{gameSystem}/{templateName}:
    get:
      tags: [Characters]
      summary: Get a factory starter sheet for a game system
      description: >
        The factory templates built into the server, as distinct from the
        user-published sheets under /api/character-templates.

        `gameSystem` is the literal text `null` or `undefined` for a flexible
        character's templates, or one of `DND_5E`, `PATHFINDER_2E`,
        `SHADOWRUN_6E`, `CALL_OF_CTHULHU_7E`; anything else answers 400.
        Template names are matched exactly. The flexible templates are
        `blank` and `basic`, and any other name answers 404. Every typed
        system has `blank`, plus `fighter` for `DND_5E` and `PATHFINDER_2E`,
        `streetsamurai` for `SHADOWRUN_6E`, and `privateinvestigator` (or
        `pi`) for `CALL_OF_CTHULHU_7E`; any other name returns that system's
        `blank` template with 200.
      operationId: getBuiltInCharacterTemplate
      security:
        - cookieAuth: []
      parameters:
        - name: gameSystem
          in: path
          required: true
          schema:
            type: string
          description: '`null`, `undefined`, or a GameSystem value.'
        - name: templateName
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The starter sheet
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  gameSystem:
                    type: string
                    enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                    nullable: true
                  data:
                    type: object
                    description: The sheet, in the shape that game system's data takes (null gameSystem is free-form JSON).
        '400':
          description: '`gameSystem` is neither `null`/`undefined` nor a recognised game system.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 'Flexible (`null`/`undefined`) `gameSystem` only: `templateName` is not `blank` or `basic`. The body''s `error` is `Template Not Found`.'

  /api/campaigns/{campaignId}/dice-rolls:
    get:
      tags: [Campaigns]
      summary: Roll history for a campaign
      description: >
        Newest first. Secret rolls are filtered server-side before anything is
        sent: a player receives public rolls plus their own secret ones, a DM
        receives everything. Rolls older than the last history clear are
        omitted; the rows themselves are kept, so a DM can still audit them.
      operationId: getCampaignDiceRolls
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: The rolls this caller is entitled to see
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/messages/join-leave:
    delete:
      tags: [Campaigns]
      summary: Clear the old join and leave chat messages
      description: >
        DM only. Those notices are no longer written, and nothing is removed on
        upgrade, so this is how a campaign clears the ones it already has.
      operationId: clearJoinLeaveMessages
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Messages removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/maps/import-uvtt:
    post:
      tags: [Maps]
      summary: Create a map from a Universal VTT file
      description: >-
        DM only. Accepts .uvtt, .dd2vtt and .df2vtt, bringing in the image along
        with its wall segments, doors and lights.


        A Universal VTT holds a single image, so one file is one map; a dungeon
        with several levels arrives as one file per level.


        `resolution.map_origin` is honoured: an export of a region of a larger
        map carries coordinates in that map's space, and the origin is
        subtracted so the geometry lands on the image.


        Walls the file keeps in `objects_line_of_sight` (furniture, pillars,
        crates) are left out unless `includeObjectWalls=true`. They block sight
        like any other wall, so whether they should is the DM's call.


        When the file needs an answer before it can become a map, the route
        answers **409** with `code: UVTT_IMPORT_NEEDS_CONFIRMATION` and creates
        nothing. Two things can prompt it: geometry outside the image, which
        happens when the exporting tool cropped the picture but wrote out the
        geometry for the whole map; and object walls it can offer. Send
        `confirm=true` with the answers to go ahead. Nothing is discarded for
        being out of bounds, since there it is the image that is incomplete and
        not the walls, and a wall counts as outside only when both of its ends
        are, so a wall on the map's edge does not trigger it.


        A file with more wall segments or lights than a map can hold (5000
        segments, 200 lights), or with a light the map editor could not save,
        is refused with **400**, because import used to write past the limits
        every later edit enforces, leaving a map that could not be saved. A
        light's `range` becomes its dim radius and half of it its bright
        radius, so a range over 100 squares, or under 0.5, answers 400. A
        file that is not JSON or lacks `resolution.map_size`, `image` or
        `line_of_sight` answers 400 with `error: Parse Error`.


        The embedded picture is checked by its bytes, not by what the file
        claims: anything that is not one of the types a map upload accepts
        (PNG, JPEG, WebP, PDF) is refused with 400, as is one over the
        `MAX_MAP_SIZE_MB` limit. It is saved as a new campaign map asset
        tagged `uvtt-import`, with a thumbnail. The route counts against the
        upload rate limit (429), since it writes a file to disk exactly as an
        upload does.


        The map is named after `name`, or the file's name without its
        extension when `name` is missing or blank. Its size in squares is the
        file's `map_size`, rounded. Lighting is turned on only when the file
        brings lights of its own; fog of war, Global Illumination and
        exploration memory start off. Doors become `door-closed` or
        `door-open` segments, as the file says.


        Some bad requests answer 500 with the generic `An unexpected error
        occurred`: a file whose name does not end in `.uvtt`, `.dd2vtt` or
        `.df2vtt` (unless it is sent as `application/json`), one over 100 MB,
        or a file sent under a field other than `file`. A `gridSize` with a
        fraction, or a `map_size` without a numeric `y`, answers 500 (`Failed
        to import UVTT file`) after the picture has already been saved as an
        asset. A negative `gridSize` is not refused.
      operationId: importUvttMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  description: The map's name. Defaults to the file's name without its extension.
                gridSize:
                  type: integer
                  default: 70
                  description: >-
                    Pixels per grid square on the new map, used to place the
                    file's walls and lights. Missing, zero or not a number
                    means 70. Other values are not range-checked.
                confirm:
                  type: string
                  enum: ['true']
                  description: >-
                    Go ahead with whatever the file raised. Without it such a
                    file answers 409.
                includeObjectWalls:
                  type: string
                  enum: ['true']
                  description: >-
                    Import the walls belonging to objects, from
                    objects_line_of_sight. Omitted means leave them out.
      responses:
        '201':
          description: Map created, with counts of what was imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
                  wallCount:
                    type: integer
                    description: Wall segments imported, object walls included when they were asked for.
                  portalCount:
                    type: integer
                    description: Doors imported.
                  lightCount:
                    type: integer
                    description: Lights imported.
                  totalSegments:
                    type: integer
                    description: Wall and door segments now on the map (`wallCount` plus `portalCount`).
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: >-
            The file needs the DM's answer first. Nothing was created. Resend
            with `confirm=true`, plus `includeObjectWalls` if it offered them.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  code:
                    type: string
                    enum: [UVTT_IMPORT_NEEDS_CONFIRMATION]
                  message:
                    type: string
                  outOfBounds:
                    type: object
                    description: How much of the geometry the image does not cover.
                    properties:
                      walls:
                        type: integer
                      doors:
                        type: integer
                      lights:
                        type: integer
                  objectWalls:
                    type: integer
                    description: >-
                      Wall segments the file keeps for its furniture, offered
                      but not imported. Zero when it has none.
              example:
                error: Confirmation Required
                code: UVTT_IMPORT_NEEDS_CONFIRMATION
                message: This file needs a decision before it can be imported.
                outOfBounds: { walls: 79, doors: 20, lights: 0 }
                objectWalls: 0
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/campaigns/{campaignId}/maps/{id}/export-uvtt:
    get:
      tags: [Maps]
      summary: Export a map as a Universal VTT file
      description: >-
        DM only. Downloads the map as a Universal VTT file (format 0.3): a
        JSON attachment named after the map (`<name>.uvtt`, with characters
        other than letters, digits, spaces, `_` and `-` removed) holding the
        map's picture as base64, its size in squares, its walls and windows as
        `line_of_sight`, its doors as `portals` (a locked door is written as
        closed), and its enabled lights, each with its dim radius as `range`.
        Tokens, fog and the spirit layer are not included.


        Answers 422 when the picture cannot be put in the file: the map's
        image address names no asset, an asset that no longer exists, or one
        the caller may not read (`Map image asset not found`), or the file is
        missing from disk (`Map image file not found on disk`).
      operationId: exportUvttMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'The .uvtt file, sent with `Content-Disposition: attachment`.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  format: { type: number, example: 0.3 }
                  resolution:
                    type: object
                    properties:
                      map_origin:
                        type: object
                        description: 'Always `{ x: 0, y: 0 }`.'
                      map_size:
                        type: object
                        description: The map's width and height in squares.
                      pixels_per_grid:
                        type: integer
                        description: The picture's width in pixels divided by the map's width in squares, rounded; the map's `gridSize` when the width cannot be read.
                  line_of_sight:
                    type: array
                    description: Walls and windows in grid units, joined into polylines where their ends meet.
                    items:
                      type: array
                      items:
                        type: object
                  portals:
                    type: array
                    items:
                      type: object
                  lights:
                    type: array
                    items:
                      type: object
                  image:
                    type: string
                    description: The picture's file, base64-encoded.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'

  /api/admin/backups/restore:
    post:
      tags: [Admin]
      summary: Restore the instance from a backup archive
      description: >
        Platform ADMIN only. The upload is capped at 4 GB and its filename must end in
        `.zip`. Once accepted, the archive is unpacked under a limit of 100,000 entries
        and 10 GiB of decompressed data, and an entry whose path could escape the
        destination folder is refused. An oversized or wrongly-named upload, an
        uploaded file that is not actually a ZIP despite its name, or one over an
        archive limit currently all surface as a generic 500 Internal Server Error
        rather than a 400, and nothing is changed in any of these cases. Replaces the
        database from an archive downloaded earlier and copies the archive's uploaded
        files over the existing ones (a file the archive does not have is left in
        place). Needs pg_dump and psql present in the backend image. The archive's
        database.sql is
        checked before anything runs: it must be a complete pg_dump of a
        CozyVTT database (pg_dump's closing line present, the User and
        _prisma_migrations tables created) holding nothing but SQL; a line
        that starts with a psql backslash command, a COPY that is not table
        data, or a transaction statement makes the archive invalid. These
        checks are not a sandbox: the SQL runs with the database owner's full
        rights, which on the Docker setup include running programs in the
        database container, so restore only archives made on an instance you
        trust. A refused archive answers 400 with the reason and changes
        nothing. A database-only backup of the current
        database is then written to the backup list, named in the response as
        safetyBackup, so the restore can be undone. The public schema is
        dropped and recreated from the archive in a single transaction that
        stops at the first failed statement, in psql's restricted mode, so an
        archive that cannot be applied in full leaves the existing database
        unchanged and answers 500. The transaction_timeout setting a newer
        pg_dump writes is skipped, as are the archive's ownership and privilege
        statements, so it restores under this instance's database user whatever
        user the archive came from. The login sessions are not restored: new
        archives carry none, and an older archive's are emptied in the same
        transaction. As soon as the load commits, every live socket is
        disconnected and the in-memory combat state is dropped, whether or not
        the steps after it succeed, so everyone signs in again. After a
        successful load the migrations run, so an archive from an older release
        comes up to date. If that step fails, or copying the uploaded files
        fails, the response is 500 Restore Incomplete and says what to do.
      operationId: restoreBackup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties:
                backup:
                  type: string
                  format: binary
                  description: ZIP archive, up to 4 GB. The filename must end in .zip.
      responses:
        '200':
          description: Restore completed. The session that made the request went with the old database.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  safetyBackup:
                    type: string
                    description: Filename, in the backup list, of the backup of the database as it was before the restore
        '400':
          description: No file, or a file that is not a complete CozyVTT backup; nothing was changed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: >
            Restore Failed (nothing changed), Restore Incomplete (the database was
            restored but migrating it or copying its files failed), a tool is not
            available in the image, or Internal Server Error for an oversized or
            wrongly-named upload, an uploaded file that is not actually a ZIP, or an
            archive over the entry-count or decompressed-size limit (nothing changed
            in any of these)

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cozyvtt.sid
      description: Session cookie obtained via /api/auth/login

  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Campaign UUID
    MapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Map UUID
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User UUID
    CharacterId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Character UUID
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Asset UUID
    TemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Token template UUID
    WallId:
      name: sid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Wall segment UUID
    LightId:
      name: lightId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Light source UUID
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Invitation UUID
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Items per page (max 100)

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        platformRole:
          type: string
          enum: [ADMIN, USER]
        mfaEnabled:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        globalAssetManager:
          type: boolean
          description: May manage the instance-wide (GLOBAL) asset library.
        templateEditor:
          type: boolean
          description: May edit and delete anyone's character template.
        mustChangePassword:
          type: boolean
          description: Set when an admin created the account or reset its password; see Forced password changes.
        isApproved:
          type: boolean
          description: False while the account waits for an admin's approval.
        rememberMe:
          type: boolean
        preferences:
          allOf:
            - $ref: '#/components/schemas/UserPreferences'
          nullable: true

    UserPreferences:
      type: object
      description: Per-user appearance preferences (theme + font). All fields optional; partial updates are merged into existing preferences.
      properties:
        themeId:
          type: string
          enum:
            - cozy-default
            - autumn-hearth
            - desert-sand
            - rose-garden
            - ocean-depths
            - northern-frost
            - enchanted-forest
            - twilight-vale
            - obsidian-night
            - shadow-realm
            - deep-dungeon
            - midnight-court
            - parchment-classic
            - slate-modern
            - dragonfire
            - arcane-storm
            - custom
          description: Preset theme identifier, or "custom" to use customThemeColors.
        customThemeColors:
          type: object
          nullable: true
          description: >
            The colours the "custom" theme uses. The server does not require them
            when themeId is "custom"; the client does. Set to null to clear.
            Unknown keys inside this object are refused with 400.
          properties:
            primary:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            accent:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            background:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            text:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
          required: [primary, accent, background, text]
        fontId:
          type: string
          enum:
            - default
            - medieval
            - elegant
            - modern
            - handwritten
            - clean
            - scholarly
            - gothic

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        gameSystem:
          type: string
          enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
          nullable: true
          description: Primary game system for this campaign (optional)
        ownerId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PREPARATION, ACTIVE, PAUSED, INACTIVE, COMPLETED, ARCHIVED]
          default: PREPARATION
        currentMapId:
          type: string
          format: uuid
          nullable: true
        vibeSettings:
          type: object
          description: Vibe periods with hues, filters, and audio
        currentVibe:
          type: string
          nullable: true
          description: Current time period name
        spiritLayerEnabled:
          type: boolean
          default: false
        spiritLayerStyle:
          type: string
          default: wispy
        chatCooldownEnabled:
          type: boolean
          default: false
        chatCooldownSeconds:
          type: integer
          default: 5
          description: 1 to 300 when written.
        rollHistoryClearedAt:
          type: string
          format: date-time
          nullable: true
          description: When the DM last cleared the dice history; older rolls are not returned.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true

    CampaignMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        role:
          type: string
          enum: [DM, PLAYER, SPECTATOR]
        characterIds:
          type: array
          items:
            type: string
            format: uuid
        joinedAt:
          type: string
          format: date-time
        user:
          type: object
          description: Included by the campaign and member routes that list members.
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
            avatarUrl:
              type: string
              nullable: true

    PersonalNoteSummary:
      type: object
      description: >
        A note in a listing. Carries no `content` on purpose — see the list
        endpoint.
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PersonalNote:
      allOf:
        - $ref: '#/components/schemas/PersonalNoteSummary'
        - type: object
          properties:
            userId:
              type: string
              format: uuid
            campaignId:
              type: string
              format: uuid
            content:
              type: string
              description: >
                Markdown source, stored exactly as typed. Rendered on the client
                with raw HTML disabled, so markup in a note is shown as text
                rather than executed.

    CampaignDocument:
      type: object
      description: A document as it appears in a campaign's shared list.
      properties:
        id:
          type: string
          format: uuid
          description: The asset id, used with GET /api/assets/documents/{id}
        name:
          type: string
        description:
          type: string
          nullable: true
        originalName:
          type: string
          example: players-handbook.pdf
        mimeType:
          type: string
          description: As declared at upload. Not what the file is served as.
        fileSize:
          type: integer
        createdAt:
          type: string
          format: date-time
        uploadedBy:
          nullable: true
          type: object
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        linkedAt:
          type: string
          format: date-time
        linkedBy:
          nullable: true
          description: >-
            Who shared it. For the campaign's own document (`shared: false`)
            this is its uploader, so it is null once that account is deleted.
          type: object
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        shared:
          type: boolean
          description: >-
            True when the document was shared into the campaign by link and the
            DM can stop sharing it. False when it is the campaign's own, created
            or uploaded at CAMPAIGN scope, where there is no link to remove.

    DiceMacro:
      type: object
      description: >
        A player's saved dice roll for one campaign — a name and an expression,
        shown as a one-click button in the dice panel. Private to whoever saved
        it, the DM included. The expression is validated when written against the
        same code that rolls it, so a stored macro can always be rolled.
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 60
          example: Wild magic surge
        expression:
          type: string
          maxLength: 200
          example: 4d6kh3
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        sessionNumber:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        savedState:
          type: object
          nullable: true
          description: Captured game state (token positions, map, vibe, spirit layer)
        notes:
          type: string
          nullable: true

    Character:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        gameSystem:
          type: string
          enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
          nullable: true
          description: Game system for this character (determines data structure)
        data:
          type: object
          description: Flexible JSON data for character stats (structure depends on gameSystem)
        tokenImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        campaign:
          type: object
          nullable: true
          description: >-
            The character's campaign, null when it has none. Included by
            GET /api/characters, GET and PUT /api/characters/{id}, and
            POST /api/characters/{id}/assign; absent from the create and copy
            responses. Only the assign response includes `gameSystem`;
            the others carry `id` and `name`.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            gameSystem:
              type: string
              enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
              nullable: true
        user:
          type: object
          description: >-
            The character's owner. Included only by GET /api/characters/{id}.
            It carries no email address.
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
            avatarUrl:
              type: string
              nullable: true

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT]
        scope:
          type: string
          enum: [GLOBAL, USER, CAMPAIGN]
          description: USER is a personal asset, and the scope every avatar is stored at.
        uploadedById:
          type: string
          format: uuid
          nullable: true
          description: Null once the uploader's account is deleted; the asset stays.
        campaignId:
          type: string
          format: uuid
          nullable: true
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        uploadedBy:
          type: object
          nullable: true
          description: Null once the uploader's account is deleted.
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        campaign:
          type: object
          nullable: true
          description: The campaign a CAMPAIGN-scope asset belongs to.
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string

    Map:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: string
        baseLayerUrl:
          type: string
        spiritLayerUrl:
          type: string
          nullable: true
          description: Null for anyone but the DM unless the spirit layer is visible to them.
        width:
          type: integer
        height:
          type: integer
        gridSize:
          type: integer
          default: 50
        feetPerSquare:
          type: integer
          default: 5
        diagonalRule:
          type: string
          enum: [flat, alternating]
          default: flat
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
          description: >
            The DM gets every token. Anyone else gets only the tokens on the
            plane they are on (only spirit tokens once the spirit layer is
            visible to them, otherwise only material ones), never a hidden
            (`visible: false`) one, and on a map with lighting on only the tokens
            in their sight plus their own; a player with no token on a lit map,
            and any spectator there, gets none. Each token's fields are cut down
            for them as the Token schema describes.
        annotations:
          type: array
          items:
            type: object
        lightingEnabled:
          type: boolean
          description: Dynamic lighting on this map (default off)
        fogEnabled:
          type: boolean
          description: Manual fog of war on this map. Off means players see the whole map. Maps from before 1.5.0 have it on; new maps start with it off.
        globalIllumination:
          type: boolean
          description: Everything in line of sight counts as lit. Maps from before 1.5.0 have it on; new maps start with it off.
        explorationEnabled:
          type: boolean
          description: Explored areas are remembered per player and greyed in when out of sight. Maps from before 1.5.0 have it on; new maps start with it off.
        wallSegments:
          type: array
          items:
            $ref: '#/components/schemas/Wall'
        lights:
          type: array
          items:
            $ref: '#/components/schemas/LightSource'
        fogData:
          allOf:
            - $ref: '#/components/schemas/FogState'
          nullable: true
          description: Always null for anyone but the DM.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TokenHp:
      type: object
      required: [current, max, temp]
      properties:
        current:
          type: integer
          minimum: 0
          maximum: 99999
        max:
          type: integer
          minimum: 1
          maximum: 99999
        temp:
          type: integer
          minimum: 0
          maximum: 99999

    Token:
      type: object
      description: |
        A token as the DM sees it. A player is sent a subset of each token they
        may see at all: never `notes` or `statBlock`; `hp` only for a token they
        control or one whose `showHpBar` is on; `sightRadius` and
        `creatureTemplateId` only for a token they control. A token whose `obscured` is true reaches anyone but its
        controller as a shape with no identity, built from a fixed list: `id`,
        `position`, `size`, `layer`, `visible` and `obscured: true` are kept,
        and every other field is neutral (`name` and `imageUrl` empty,
        `conditions` and `metadata` empty, `characterId`, `controlledBy`,
        `creatureTemplateId`, `disposition`, `hp` and `initiative` null, `type`
        `npc`, `rotation` 0, `showHpBar` false, `displayMode` `pog`). The DM
        receives it whole. The subset is decided on the server before sending.
      properties:
        id:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        imageUrl:
          type: string
        position:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
            y:
              type: number
        size:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
            height:
              type: number
        layer:
          type: string
          enum: [token, spirit]
          description: 'token = normal layer; spirit = spirit/astral layer (hidden from players by default)'
        visible:
          type: boolean
          description: If false, hidden from players (DM can still see)
        controlledBy:
          type: string
          format: uuid
          nullable: true
          description: User ID of the player who controls this token (null = DM-only)
        rotation:
          type: number
          minimum: 0
          maximum: 360
          default: 0
          description: Rotation in degrees
        conditions:
          type: array
          items:
            type: string
          description: Active status conditions (e.g. "Poisoned", "Prone")
        metadata:
          type: object
          description: Arbitrary custom data
        type:
          type: string
          enum: [player, npc, object]
          description: Token classification; affects context menu options and initiative behavior
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true
          description: NPC attitude toward the party
        hp:
          allOf:
            - $ref: '#/components/schemas/TokenHp'
          nullable: true
          description: Hit points / health for this token
        showHpBar:
          type: boolean
          default: false
          description: Whether to display the HP bar on the map canvas
        notes:
          type: string
          description: DM-only notes for this token
        initiative:
          type: number
          nullable: true
          description: Initiative roll result for combat turn ordering
        sightRadius:
          type: number
          minimum: 0
          maximum: 200
          description: Darkvision in grid squares (0 = none; 12 = 60 ft at 5 ft a square). How far the token makes things out with no light; never limits how far a lit thing is noticed.
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
          description: How the token's art is drawn on the map
        statBlock:
          type: object
          nullable: true
          description: The creature's stat block. DM only; never sent to a player.
        creatureTemplateId:
          type: string
          format: uuid
          nullable: true
          description: The creature library entry this token was placed from
        obscured:
          type: boolean
          default: false
          description: The DM has hidden what this token is. DM only on write; players who do not control it receive it masked (see the schema description).

    TokenInput:
      type: object
      description: >
        Every field is checked against the token rules shared with the update
        route and the token templates, and stored as parsed; a field outside
        them answers 400.
      required:
        - name
        - position
      properties:
        obscured:
          type: boolean
          description: Hide what the token is from players who do not control it. DM only.
        sightRadius:
          type: number
          minimum: 0
          maximum: 200
          description: Darkvision in grid squares (0 = none); stored as 0 when omitted
        characterId:
          type: string
          format: uuid
          nullable: true
          description: A character of this campaign; any other id is refused (400).
        name:
          type: string
          maxLength: 200
        imageUrl:
          type: string
          maxLength: 500
          nullable: true
          description: >
            An asset id or an asset's exact address (`/api/assets/tokens/<id>`);
            anything else, an external URL included, answers 403. Without one
            the token is drawn as a placeholder and stored with an empty string.
        position:
          type: object
          required:
            - x
            - y
          description: Grid square, within the map. Only x and y are stored.
          properties:
            x:
              type: number
            y:
              type: number
        size:
          type: object
          required: [width, height]
          description: Grid squares; defaults to 1 by 1.
          properties:
            width:
              type: integer
              minimum: 1
              maximum: 10
            height:
              type: integer
              minimum: 1
              maximum: 10
        layer:
          type: string
          enum: [token, spirit]
          default: token
        visible:
          type: boolean
          default: true
        controlledBy:
          type: string
          format: uuid
          nullable: true
          description: >
            Who controls the token. Omitted with a characterId naming a
            character of this campaign: that character's owner if the owner
            is a player of this campaign, otherwise nobody. Explicit null:
            nobody (the DM). A value must name a player of this campaign (400
            otherwise).
        rotation:
          type: number
          minimum: 0
          maximum: 360
          default: 0
          description: Degrees
        conditions:
          type: array
          maxItems: 50
          items:
            type: string
            minLength: 1
            maxLength: 60
          description: Each entry is trimmed; a blank one answers 400.
        metadata:
          type: object
          description: Free-form, at most 8000 characters as JSON.
        type:
          type: string
          enum: [player, npc, object]
          default: npc
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
          default: pog
        hp:
          allOf:
            - $ref: '#/components/schemas/TokenHp'
          nullable: true
        showHpBar:
          type: boolean
          default: false
        notes:
          type: string
          maxLength: 5000
          nullable: true
          default: ''
          description: DM-only. Null is stored as an empty string.
        initiative:
          type: number
          nullable: true
        statBlock:
          type: object
          nullable: true
          description: >
            A creature stat block. When present it must have `ac` (integer
            0-99), `speed` (string, at most 200 characters) and `abilities` with
            all six scores as integers. Traits, actions, bonus actions,
            reactions and legendary actions hold at most 50 entries each, with
            names up to 200 and descriptions up to 5000 characters. Unknown keys
            are kept.
        creatureTemplateId:
          type: string
          format: uuid
          nullable: true
          description: The creature library entry the token was placed from.

    CombatantEntry:
      type: object
      description: A single combatant in the initiative order
      properties:
        tokenId:
          type: string
          format: uuid
        mapId:
          type: string
          format: uuid
          description: The map the token is on.
        name:
          type: string
        imageUrl:
          type: string
        initiative:
          type: number
          nullable: true
        hp:
          allOf:
            - $ref: '#/components/schemas/TokenHp'
          nullable: true
        type:
          type: string
          enum: [player, npc, object]
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true

    CombatState:
      type: object
      description: Current initiative tracker state for a campaign
      properties:
        active:
          type: boolean
          description: Whether combat is currently running
        round:
          type: integer
          description: Current round number (0 if combat not started)
        currentTokenId:
          type: string
          format: uuid
          nullable: true
          description: Token ID of the combatant whose turn it is
        combatants:
          type: array
          items:
            $ref: '#/components/schemas/CombatantEntry'
          description: Ordered by initiative, highest first, combatants without one last. Equal values keep the order they were added in.

    CreatureTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        gameSystem:
          type: string
          nullable: true
        source:
          type: string
          enum: [srd, custom]
          description: "'srd' = imported from Open5e (global, read-only), 'custom' = campaign-specific"
        challengeRating:
          type: string
          nullable: true
        creatureType:
          type: string
          nullable: true
        alignment:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        statBlock:
          type: object
          description: |
            Game-system-agnostic stat block. Common keys: `ac`, `hpMax`, `hitDice`,
            `speed`, `abilities`, `traits`, `actions`. `hpMax` seeds the hit points
            of tokens placed from this creature (defaults to 10 when absent, as on
            stat blocks saved before hit points were tracked).
        size:
          type: object
          properties:
            width:
              type: integer
              default: 1
            height:
              type: integer
              default: 1
        disposition:
          type: string
          enum: [hostile, friendly, neutral]
          default: hostile
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
          default: pog
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: "null for SRD creatures (global), set for custom creatures"
        createdById:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        userName:
          type: string
          nullable: true
          description: The sender's display name; null for a system message or a deleted account.
        user:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        type:
          type: string
          enum: [PLAYER, DM, SYSTEM, DICE_ROLL, CHARACTER_ACTION]
          description: DICE_ROLL messages are never returned by the message history; dice have their own history.
        content:
          type: string
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    TokenTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
        type:
          type: string
          enum: [npc, player, object]
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
        size:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        notes:
          type: string
          nullable: true
        hp:
          allOf:
            - $ref: '#/components/schemas/TokenHp'
          nullable: true
        showHpBar:
          type: boolean
        statBlock:
          type: object
          nullable: true
        sightRadius:
          type: number
          nullable: true
        campaignId:
          type: string
        createdById:
          type: string
          nullable: true
          description: Null once the creator's account is deleted.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TokenTemplateInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Trimmed.
        imageUrl:
          type: string
          maxLength: 500
          nullable: true
        type:
          type: string
          enum: [npc, player, object]
          default: object
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
          default: pog
        size:
          type: object
          required: [width, height]
          description: Defaults to 1 by 1.
          properties:
            width:
              type: integer
              minimum: 1
              maximum: 10
            height:
              type: integer
              minimum: 1
              maximum: 10
        notes:
          type: string
          maxLength: 5000
          nullable: true
        hp:
          allOf:
            - $ref: '#/components/schemas/TokenHp'
          nullable: true
        showHpBar:
          type: boolean
          default: false
        statBlock:
          type: object
          nullable: true
          description: The same stat block rules as a token's (see TokenInput).
        sightRadius:
          type: number
          minimum: 0
          maximum: 200
          nullable: true

    TokenTemplateUpdate:
      type: object
      minProperties: 1
      description: >
        Any of the TokenTemplateInput fields, with the same rules, every one
        optional. At least one must be sent (400 otherwise). A field left out
        keeps its current value.

    CampaignImportPreview:
      type: object
      properties:
        formatVersion:
          type: integer
        exportedAt:
          type: string
        exportedFrom:
          type: string
        campaignName:
          type: string
        gameSystem:
          type: string
        mapCount:
          type: integer
        tokenCount:
          type: integer
        creatureCount:
          type: integer
        tokenTemplateCount:
          type: integer
        assetCount:
          type: integer
        includesAudio:
          type: boolean
        totalSizeBytes:
          type: integer

    Error:
      type: object
      description: >
        The `error` field is a short human-readable title such as
        "Validation Error" or "Not Found", not a stable identifier. Where a
        client has to act on an error the response carries a `code`, and
        clients should route on that.
      properties:
        error:
          type: string
          example: Validation Error
          description: Short human-readable title of the error
        message:
          type: string
          example: One or more fields failed validation.
          description: Human-readable error description
        code:
          type: string
          description: >
            Machine-readable code, sent only where a client has to act on it:
            PASSWORD_CHANGE_REQUIRED, CHARACTER_CHANGED, no_game_system,
            UVTT_IMPORT_NEEDS_CONFIRMATION.
        validationErrors:
          type: array
          description: Per-field problems with a character sheet or template.
          items:
            type: object
            properties:
              path:
                type: string
              message:
                type: string
              code:
                type: string
        errors:
          type: array
          description: Unmet password rules, from first-time setup.
          items:
            type: string
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Per-field problems, sent only by the user preferences update.

    Wall:
      type: object
      description: A wall segment that blocks vision (or a door/window variant).
      properties:
        id:
          type: string
          format: uuid
        x1:
          type: number
          description: Start X in map-space pixels (origin top-left)
          example: 240
        y1:
          type: number
          example: 180
        x2:
          type: number
          example: 400
        y2:
          type: number
          example: 180
        type:
          type: string
          enum: [wall, door-closed, door-open, door-locked, window]
          description: |
            * `wall` — blocks vision.
            * `door-closed` — blocks vision; clickable to open.
            * `door-open` — does not block vision.
            * `door-locked` — blocks vision; only DM can unlock.
            * `window` — does not block vision.
      required: [id, x1, y1, x2, y2, type]

    WallInput:
      type: object
      description: A wall segment. The server assigns `id` when none is sent.
      properties:
        id:
          type: string
          format: uuid
          description: Optional; kept when sent.
        x1: { type: number }
        y1: { type: number }
        x2: { type: number }
        y2: { type: number }
        type:
          type: string
          enum: [wall, door-closed, door-open, door-locked, window]
      required: [x1, y1, x2, y2, type]

    LightSource:
      type: object
      description: A point light placed by the DM with separate bright and dim radii.
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          description: X position in map-space pixels
          example: 320
        y:
          type: number
          example: 240
        brightRadius:
          type: number
          minimum: 0
          maximum: 100
          description: Full-visibility radius in grid squares
          example: 4
        dimRadius:
          type: number
          minimum: 0.5
          maximum: 100
          description: Dim-light radius in grid squares (must be ≥ brightRadius)
          example: 8
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: '#ffcc66'
        enabled:
          type: boolean
          description: Toggle without deleting (e.g. extinguished torch)
          example: true
      required: [id, x, y, brightRadius, dimRadius, color, enabled]

    LightSourceInput:
      type: object
      description: A light source. The server assigns `id` when none is sent.
      properties:
        id:
          type: string
          format: uuid
          description: Optional; kept when sent.
        x: { type: number }
        y: { type: number }
        brightRadius: { type: number, minimum: 0, maximum: 100 }
        dimRadius:
          type: number
          minimum: 0.5
          maximum: 100
          description: Must be at least brightRadius.
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        enabled:
          type: boolean
      required: [x, y, brightRadius, dimRadius, color, enabled]

    FogState:
      type: object
      description: |
        Fog-of-war state for a map. `revealed` is a flat boolean array;
        cell (col, row) maps to index `row * fogCols + col`.
      properties:
        fogCols:
          type: integer
          minimum: 1
          description: Number of fog cells horizontally
          example: 50
        fogRows:
          type: integer
          minimum: 1
          example: 30
        cellPx:
          type: integer
          minimum: 1
          description: Fog cell size in map pixels
          example: 32
        revealed:
          type: array
          items:
            type: boolean
          description: Length must equal `fogCols * fogRows`
      required: [fogCols, fogRows, cellPx, revealed]

    FogOperation:
      type: object
      description: A fog reveal/hide operation. The `op` field discriminates the variant.
      oneOf:
        - type: object
          properties:
            op: { type: string, enum: [reveal, hide] }
            cells:
              type: array
              items: { type: integer, minimum: 0 }
              description: Cell indices to flip
          required: [op, cells]
        - type: object
          properties:
            op: { type: string, enum: [reveal_all, hide_all] }
          required: [op]

    AppearanceSettings:
      type: object
      description: |
        Instance-wide appearance settings — used on public/unauthenticated pages
        and as the default for users who have not picked their own theme.
      properties:
        themeId:
          type: string
          example: cozy-default
        customThemeColors:
          type: object
          nullable: true
          description: >-
            The colours an administrator chose for the custom theme. The app
            sends these four keys; the server stores the object as sent.
          properties:
            primary:    { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            accent:     { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            text:       { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        fontId:
          type: string
          example: default
        customLogoUrl:
          type: string
          nullable: true
          description: >-
            A path this instance serves, such as /default-logo.png. An address
            on another host is refused with 400: the app page's
            Content-Security-Policy allows images from its own origin only, and
            an outside image would have every visitor contact that host before
            signing in. Branding is changed by replacing the files in
            frontend/public/ and rebuilding.
          example: /default-logo.png
        customFaviconUrl:
          type: string
          nullable: true
          description: A path this instance serves. Same rule as customLogoUrl.
          example: /favicon-32.png
        customMascotUrl:
          type: string
          nullable: true
          description: A path this instance serves. Same rule as customLogoUrl.
          example: /default-mascot.png

  responses:
    BadRequest:
      description: Bad Request - Invalid input or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Validation Error
            message: Name is required

    Unauthorized:
      description: Unauthorized - Not authenticated or MFA pending.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: You must be logged in to access this resource

    Forbidden:
      description: Forbidden - Authenticated but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: You do not have permission to perform this action.

    PasswordChangeRequired:
      description: >-
        Forbidden - The account must set a new password before it can do anything else
        (admin-created account, or an admin reset its password). Returned by every
        endpoint except change-password, logout, /auth/me, /auth/ping, /auth/appearance
        and /api/config. Route on `code`, not the message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Password Change Required
            code: PASSWORD_CHANGE_REQUIRED
            message: You must set a new password before continuing.

    NotFound:
      description: Not Found - Resource does not exist or you cannot see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Not Found
            message: Map not found

    Conflict:
      description: Conflict - Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Conflict
            message: A creature with this name already exists in this campaign.

    UnprocessableEntity:
      description: Unprocessable Entity - The request is valid but the resource cannot be turned into what was asked for.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unprocessable Entity
            message: Map has no image

    RateLimited:
      description: |
        Too Many Requests - Rate limit exceeded. Response includes
        `RateLimit-Limit`, `RateLimit-Remaining`, and `RateLimit-Reset` headers.
        The sign-in, registration and password-reset limiters answer with a
        plain-text body; the others answer with JSON.
      headers:
        RateLimit-Limit:
          schema: { type: integer }
          description: Maximum requests permitted in the current window
        RateLimit-Remaining:
          schema: { type: integer }
          description: Requests remaining in the current window
        RateLimit-Reset:
          schema: { type: integer }
          description: Seconds until the window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Too Many Requests
            message: Upload rate limit reached. Please slow down and try again in a minute.

    ServerError:
      description: Internal Server Error - Something went wrong on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Internal Server Error
            message: An unexpected error occurred
