openapi: 3.0.3
info:
  title: CozyVTT Backend Route Reference
  description: |
    The HTTP routes CozyVTT's own web client calls, described for people working
    on CozyVTT itself.

    ## No stability guarantee
    This is an internal surface, not a public API. It is **not versioned**, it
    carries **no compatibility promise**, and any route here may change shape or
    disappear in a point release without notice or a deprecation period.

    There are no API keys, no bearer tokens and no service accounts. The only
    credential is the session cookie described below — but a program can obtain
    one exactly as the web client does, by posting a user's own email and
    password to `/api/auth/login` and keeping the cookie it returns. That cookie
    also authenticates the Socket.io connection, which shares the same session.

    So scripting CozyVTT is possible, and people have done it. What it does not
    come with is a promise: a script authenticates **as a specific user** and can
    do only what that user could do in the browser, the session expires after an
    hour of inactivity by default (`SESSION_MAX_AGE`; 30 days when signing in
    with `rememberMe`), an account with MFA enabled needs
    the second step, and any route here may change shape in a point release
    without notice. Treat this document as a map of the current code rather than
    a contract.

    ## Authentication
    All endpoints (except `/health`, `/api/setup/*`, `/api/config` and the public auth routes) require authentication via session cookies.
    Login via `/api/auth/login` to obtain a session cookie.

    Until the setup wizard has run, every request except `/health` and
    `/api/setup/*` is refused with 403
    `{ error: 'Setup Required', message, setupUrl: '/api/setup/status' }`,
    the public routes included.

    A request that changes something (POST, PUT, PATCH or DELETE) and that a
    browser marks as sent from another site (`Sec-Fetch-Site` of `same-site`
    or `cross-site`, which includes another port of the same host) is refused
    with 403 unless its `Origin` is exactly `CORS_ORIGIN`. A client that is not
    a browser sends no such header and is unaffected. Request bodies are JSON;
    a form-encoded body is not read.

    ## MFA Flow
    If a user has MFA enabled, `/api/auth/login` returns `{ mfaRequired: true }` instead of a full session.
    The client must then call `/api/auth/mfa/verify-login` with a TOTP code or backup code to complete authentication.

    ## Authorization
    - **Platform roles**: `ADMIN` (full system access), `USER` (campaign access)
    - **Campaign roles**: `DM` (full campaign control), `PLAYER` (limited interaction), `SPECTATOR` (watches, chats and pings; keeps their own notes and dice macros; cannot roll dice or initiative, move or edit tokens, or edit a character)

    ## Rate Limiting
    The HTTP limits are counted per client address as the backend sees it: the
    last address in `X-Forwarded-For`, since the backend trusts one proxy. The
    bundled nginx puts the visitor's own address there, taken from a tunnel or
    proxy in front of it only when that connects from a private address. Behind
    a proxy that does not pass the visitor's address on, every client shares one
    allowance. Uploads and the WebSocket limits are counted per user.
    - Global API limit: 300 requests per minute (all `/api/*` routes; configurable via `RATE_LIMIT_MAX_REQUESTS`)
    - Credential endpoints (`POST /api/auth/login`, `/reset-password`, `/mfa/setup`,
      `/mfa/disable` and `/mfa/backup-codes`): one shared allowance of 5 **failed**
      requests per 15 minutes. Successful requests are not counted, so getting your
      password right never moves you towards a lockout.
    - `POST /api/auth/register`: 10 requests per hour, counted whether or not
      they succeed, since creating the account is what is being limited
    - `POST /api/auth/forgot-password`: 5 requests per 15 minutes, counted whether
      or not they succeed. That endpoint answers identically for a known and an
      unknown address, so successes cannot be skipped without removing the limit
      on the mail it sends
    - MFA setup verification (`POST /api/auth/mfa/verify`): 5 failed attempts per 15 minutes
    - MFA login verification (`POST /api/auth/mfa/verify-login`): 5 failed attempts
      per 15 minutes per address, and separately 5 failed attempts per 15 minutes
      for the account, from any address
    - Asset uploads, typed documents and Universal VTT imports (`POST /api/assets/upload`,
      `POST /api/assets/documents`, `POST /api/campaigns/{campaignId}/maps/import-uvtt`):
      30 requests per minute per user (configurable via `ASSET_UPLOAD_RATE_LIMIT`)
    - Chat messages (WebSocket): none unless the DM turns on the campaign's chat
      cooldown (off by default), which allows each member one message per 1 to
      300 seconds, as the DM sets it
    - Dice rolls: 30 per minute (WebSocket)
    - Token movement: 150 events per second per user (WebSocket), shared by
      `token.move.start`, `token.move` and `token.move.end`; events over the limit
      are dropped without an error

    Rate-limited responses return HTTP 429 with `RateLimit-*` standard headers.
    The body is JSON `{ error, message }` for the global limit, uploads and the
    MFA limits. The credential, registration and forgot-password limits answer
    with a plain-text message instead.

    ## Responses every route can give
    These are not repeated on each operation:
    - **401** `{ error: 'Unauthorized', message }` from any route that needs a
      session, when there is none or when the MFA step of a sign-in is still
      pending.
    - **403** `{ error: 'Forbidden', message: 'You are not a member of this campaign' }`
      from any `/api/campaigns/{campaignId}/...` route that needs membership,
      including for a campaign id that does not exist. Such routes never answer
      404 for an unknown campaign.
    - **403** with `code: PASSWORD_CHANGE_REQUIRED`, and the setup-gate 403, as
      described above.
    - **413** `{ error: 'Payload Too Large' }` for a JSON body over 1 MB, and
      **400** `{ error: 'Bad Request' }` for a body that is not valid JSON.
    - **500** `{ error, message }` on an unexpected error. In production the
      message does not describe the failure.

    ## Forced password changes
    Accounts an admin created, or whose password an admin reset, are flagged
    `mustChangePassword`. Until a new password is set, every endpoint except
    `POST /api/auth/change-password`, `POST /api/auth/logout`, `GET /api/auth/me`,
    `GET /api/auth/ping`, `GET /api/auth/appearance` and `GET /api/config` returns
    HTTP 403 with `code: PASSWORD_CHANGE_REQUIRED`. WebSocket connections are refused
    on the same basis. Clients should route on `code` rather than the message.

    ## Real-time Events
    Real-time campaign features (token movement, dice, chat, initiative, etc.) use Socket.io.
    The event reference is `backend/docs/WEBSOCKET_DOCUMENTATION.md`.

  version: 1.5.0
  contact:
    name: CozyVTT
    url: https://cozyvtt.com
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://vtt.example.com
    description: Your instance's address. Every path below already starts with /api.
  - url: http://localhost:4000
    description: Local development (the backend's own port)

# Default security — every endpoint requires the session cookie unless it
# explicitly overrides with `security: []` (used for public endpoints like
# /health, /api/setup/*, and the unauthenticated auth routes).
security:
  - cookieAuth: []

tags:
  - name: Health
    description: System health checks
  - name: Setup
    description: Initial system setup wizard
  - name: Authentication
    description: User authentication, password reset, and session management
  - name: MFA
    description: Multi-Factor Authentication (TOTP + backup codes)
  - name: Users
    description: User management endpoints
  - name: Campaigns
    description: Campaign management
  - name: Sessions
    description: Game session lifecycle management
  - name: Characters
    description: Character creation and management
  - name: Assets
    description: File upload and asset management
  - name: Maps
    description: Map management and token manipulation
  - name: Creatures
    description: Creature template library — SRD and custom creatures, favorites, seeding
  - name: Token Templates
    description: Reusable token configurations savable per-campaign and copyable across campaigns the DM owns
  - name: Walls & Lighting
    description: Per-map wall segments, light sources, and fog-of-war state (DM-only writes)
  - name: Invitations
    description: Campaign invitation lifecycle (send, list, accept, decline)
  - name: Campaign Export/Import
    description: Export and import campaigns as portable `.cozyvtt` archives
  - name: Messages
    description: Chat message history
  - name: Documents
    description: PDF, text and Markdown files uploaded as assets, shared with a campaign by its DM and read inline
  - name: Dice Macros
    description: A player's own saved dice rolls for one campaign, private to whoever saved them
  - name: Admin
    description: Admin-only platform management endpoints (requires ADMIN platform role)
  - name: Notes
    description: A member's own private notes in a campaign
  - name: Character Templates
    description: Shared starter character sheets any signed-in user can copy

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API server is running. Accessible before setup.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      api: { type: string, example: ok }
                      database: { type: string, example: ok }
        '503':
          description: 'The database cannot be reached; the body carries `status: degraded`'

  # ============================================
  # CLIENT CONFIG
  # ============================================

  /api/config:
    get:
      tags:
        - Health
      summary: Get public client configuration
      description: |
        Public endpoint — returns the upload size limits the server enforces,
        derived from the `MAX_<TYPE>_SIZE_MB` environment variables, and whether
        this instance can send email. The SPA is built ahead of time, so it
        reads the limits from here at runtime rather than baking them into the
        bundle. No authentication required.
      operationId: getClientConfig
      security: []
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadLimits:
                    type: object
                    description: Maximum upload size in bytes, per asset type
                    properties:
                      MAP:
                        type: integer
                      TOKEN:
                        type: integer
                      AUDIO:
                        type: integer
                      AVATAR:
                        type: integer
                      DOCUMENT:
                        type: integer
                  maxUploadBytes:
                    type: integer
                    description: Largest configured limit — the cap enforced before the asset type is known
                  smtp:
                    type: object
                    description: >-
                      Whether this instance can send email. Host, port and
                      credentials stay on the admin-only `GET /api/admin/config`;
                      this bare boolean lets a non-admin DM tell whether an
                      invitation's "also email them" option will do anything.
                    properties:
                      configured:
                        type: boolean
                        description: >-
                          True when `SMTP_HOST`, `SMTP_USER` and `SMTP_PASS` are
                          all set. The mail server is not contacted to check.
              example:
                uploadLimits:
                  MAP: 52428800
                  TOKEN: 5242880
                  AUDIO: 20971520
                  AVATAR: 2097152
                  DOCUMENT: 52428800
                maxUploadBytes: 52428800
                smtp:
                  configured: true

  # ============================================
  # SETUP
  # ============================================

  /api/setup/status:
    get:
      tags:
        - Setup
      summary: Check setup status
      description: Check if the system setup wizard needs to be run. Accessible before setup.
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupCompleted:
                    type: boolean
                  hasUsers:
                    type: boolean
                  needsSetup:
                    type: boolean

  /api/setup/init:
    post:
      tags:
        - Setup
      summary: Initialize system
      description: >-
        Create the first admin account, apply the wizard's instance settings,
        mark setup complete, and sign the new admin in (the response sets a
        fresh session cookie). Only works while setup is not yet complete and
        no account exists; both are checked before the body is read. The
        password must be at least 12 characters with an uppercase letter, a
        lowercase letter, a number and a special character, the same rule
        enforced on register, reset-password and change-password.
      operationId: initializeSystem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: >-
                    Trimmed, and angle brackets removed, before the length is
                    checked. Anything else, including a value that is not a
                    string, is refused with 400 `Setup Failed`.
                instanceName:
                  type: string
                  default: CozyVTT
                  description: >-
                    Shown in browser tabs and page titles. Angle brackets are
                    removed, the value is trimmed, and anything past 100
                    characters is cut off. Blank, missing or non-string values
                    leave the default in place rather than failing setup, which
                    can only be run once.
                timezone:
                  type: string
                  default: UTC
                  description: >-
                    IANA timezone name, used for timestamps. Not checked against
                    the timezone list. Treated like `instanceName`, cut off at
                    50 characters.
                allowRegistration:
                  type: boolean
                  default: false
                  description: >-
                    Whether people may create their own accounts. A value that
                    is not a boolean is ignored. Changeable afterwards from
                    Admin → Settings.
      responses:
        '201':
          description: Setup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: >-
            `Setup Already Completed`; `Users Exist` when any account exists;
            `Validation Error` for a missing field, an invalid email, or a
            password that does not meet the strength rule (that case alone
            carries an `errors` array listing each rule not met); or
            `Setup Failed` with the reason, for a display name that is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Password does not meet requirements
                errors:
                  - Password must contain at least one uppercase letter
                  - Password must contain at least one special character

  # ============================================
  # AUTHENTICATION
  # ============================================

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: >-
        Create a new user account. Refused with 403 if the instance has
        registration disabled. If the instance requires admin approval (the
        default), the account is created unapproved and no session is started
        (201 with `pendingApproval: true` and no `user`); otherwise the account
        is approved and signed in on a fresh session. The email is lowercased
        and has angle brackets removed before it is stored. Should no account
        exist at all (setup normally creates the first), the account becomes
        ADMIN, approved and signed in, and the registration and approval
        settings are not consulted. Rate limited to 10 requests per hour per
        address, counted whether or not they succeed.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Trimmed, and angle brackets removed, before the length is checked. Anything else, including a value that is not a string, is refused with 400.
      responses:
        '201':
          description: Registered, or submitted pending admin approval.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                  - type: object
                    description: When the instance requires admin approval. No session is created.
                    properties:
                      message:
                        type: string
                      pendingApproval:
                        type: boolean
                        example: true
        '400':
          description: >-
            `Validation Error` when a field is missing. Otherwise
            `Registration Failed`, with the reason as `message`: an invalid
            email, a password that does not meet the strength rule (the unmet
            rules joined with ", ", with no `errors` array), a refused display
            name, or `Email already registered`. The missing-field check runs
            before the 403; the others after it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Registration Failed
                message: Email already registered
        '403':
          description: Registration is disabled on this instance.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Registration Disabled
                message: Registration is currently disabled. Please contact an administrator.
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticate user and create a session on a fresh session id. Rate limited (5 failed requests per 15 minutes, shared with the other credential endpoints; a 403 counts as failed).
        If MFA is enabled, returns `{ mfaRequired: true }` and the client must call `/api/auth/mfa/verify-login`; the session is not signed in until then.
        If `mustChangePassword` is true in response, frontend should redirect to password change.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                rememberMe:
                  type: boolean
                  default: false
                  description: >-
                    Keeps the session for `REMEMBER_ME_MAX_AGE` of inactivity
                    (30 days by default) instead of `SESSION_MAX_AGE`. With MFA,
                    it takes effect when `/api/auth/mfa/verify-login` succeeds.
            example:
              email: dm@example.com
              password: hunter2-correct-horse-battery
              rememberMe: true
      responses:
        '200':
          description: Login successful (or MFA required)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                      mustChangePassword:
                        type: boolean
                  - type: object
                    properties:
                      mfaRequired:
                        type: boolean
                        example: true
                      message:
                        type: string
        '400':
          description: >-
            `Validation Error` when the email or password is missing. An email
            that is not a string answers `Login Failed`, with the internal
            error text as `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Email and password are required
        '401':
          description: >-
            No account has that email, or the password is wrong. The answer is
            the same for both.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication Failed
                message: Invalid email or password
        '403':
          description: >-
            The account is pending admin approval. Given only once the password
            has been checked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Account Pending Approval
                message: Your account is pending admin approval. Please contact an administrator.
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: >-
        Destroy session and clear cookie. Needs no session: a client that is
        already signed out, or partway through an MFA sign-in, gets the same
        200. Ends only this sign-in's live WebSocket connections; the same
        account signed in elsewhere is unaffected.
      operationId: logoutUser
      security: []
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '500':
          description: The session could not be destroyed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Logout Failed
                message: Failed to destroy session

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: >-
        Get the signed-in user, read fresh from the database rather than from
        the session.
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          description: >-
            No signed-in session (`Not authenticated`), or the session's
            account no longer exists (`User not found`), in which case the
            session is also destroyed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Unauthorized
                message: Not authenticated

  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Request a password reset email. Always returns 200 regardless of whether the email exists (prevents enumeration). The response does not wait for the email to be sent, and a failed send is only logged.
        The address is matched case-insensitively. A link is valid for 1 hour.
        If SMTP is not configured, returns a message to contact the administrator.
        For a known address, the account's earlier unused links (a pending invitation included) stop working, so only the newest one does. This happens even when SMTP is not configured and no email is sent.
        Rate limited to 5 requests per 15 minutes; every request counts, successful or not.
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Response (always 200 to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
              examples:
                smtpConfigured:
                  value:
                    message: If an account with that email exists, a password reset link has been sent.
                smtpNotConfigured:
                  value:
                    message: Password reset is not available. Contact your administrator.
        '400':
          description: The email is missing or is not text.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Email is required
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal Server Error
                message: An unexpected error occurred

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: >-
        Reset password using a valid token from a password reset email or
        invitation. Token must not be expired or used. A token sets the
        password once, even when two requests carry it at the same moment,
        and using it voids the account's other unused tokens. Clears
        `mustChangePassword`, and ends every login session and live WebSocket
        connection of the account; the request itself does not sign anyone
        in. Rate limited (5 failed requests per 15 minutes, shared with the
        other credential endpoints).
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  format: uuid
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: >-
            `Validation Error` when the token or new password is missing or
            is not text, or the password does not meet the strength rule (the unmet rules
            joined with ", " as `message`); `Invalid Token` when the token is
            unknown, used or expired, including when another request used it
            first. The token is checked before the password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid Token
                message: This password reset link is invalid or has expired
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal Server Error
                message: An unexpected error occurred

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change own password
      description: Change password for the authenticated user. Requires current password verification. Sets mustChangePassword to false, for this session too, so the forced-change gate lifts at once. Ends the user's other login sessions and their live WebSocket connections; the session making the request stays signed in. Voids the user's unused password-reset and invitation links. Wrong current passwords count only towards the general API rate limit.
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: >-
            A field is missing, or the new password does not meet the strength
            rule (the unmet rules joined with ", " as `message`). The current
            password is checked before the strength rule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Password must contain at least one number
        '401':
          description: Not authenticated, or the current password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication Failed
                message: Current password is incorrect
        '404':
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User not found

  # ============================================
  # MFA
  # ============================================

  /api/auth/mfa/setup:
    post:
      tags:
        - MFA
      summary: Begin MFA setup
      description: Generate TOTP secret and QR code for authenticator app. User must not already have MFA enabled. Requires the current password, so a session alone cannot enrol an authenticator. MFA is not on until `/api/auth/mfa/verify` succeeds; calling this again before then replaces the pending secret. Rate limited (5 failures/15min, shared with the other credential endpoints).
      operationId: mfaSetup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: The user's current password
      responses:
        '200':
          description: MFA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  qrCodeUrl:
                    type: string
                    description: Data URL of QR code image
                  secret:
                    type: string
                    description: TOTP secret for manual entry
        '400':
          description: >-
            The password is missing or not a string, or MFA is already enabled
            (checked before the password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: MFA is already enabled. Disable it first to set it up again.
        '401':
          description: Not authenticated, or the password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication Failed
                message: Incorrect password
        '404':
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User not found
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/verify:
    post:
      tags:
        - MFA
      summary: Complete MFA setup
      description: Verify TOTP code to complete MFA setup, which needs a pending secret from `/api/auth/mfa/setup`. Generates 10 backup codes (shown only once). Ends the user's other login sessions and their live WebSocket connections; the session making the request stays signed in. The code counts as used, so it cannot then sign in. Rate limited (5 failures/15min, on its own allowance).
      operationId: mfaVerifySetup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code from authenticator app
      responses:
        '200':
          description: MFA enabled, backup codes returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
                    description: 10 backup codes in XXXX-XXXX format (shown only once)
        '400':
          description: >-
            The code is missing, no setup is in progress (call
            `/api/auth/mfa/setup` first), or MFA is already enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: No MFA setup in progress. Call /mfa/setup first.
        '401':
          description: Not authenticated, or the verification code is invalid or already used.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid Code
                message: Invalid verification code. Please try again.
        '404':
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User not found
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/verify-login:
    post:
      tags:
        - MFA
      summary: Verify MFA during login
      description: |
        Complete MFA verification during login flow. Requires a pending MFA session from `/api/auth/login`.
        At least one of `token` and `backupCode` is required; sending both is not refused: a non-empty `token` is checked and the backup code is ignored. Backup codes are compared ignoring hyphens, spaces and letter case. They are consumed on use, exactly once even when two requests carry the same code; the second is answered 401.
        A TOTP code is accepted once: one from the same 30-second step as a code already accepted for the account, or an earlier step, is refused.
        On success the session is signed in on a fresh session id, with the `rememberMe` choice made at `/api/auth/login`.
        Rate limited (5 failures/15min per address, separate from setup verification, and 5 failures/15min per account from any address).
      operationId: mfaVerifyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code
                backupCode:
                  type: string
                  description: Backup code in XXXX-XXXX format
      responses:
        '200':
          description: MFA verified, fully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  mustChangePassword:
                    type: boolean
                  backupCodeUsed:
                    type: boolean
                    description: Present, as true, only when a backup code was used.
                  remainingBackupCodes:
                    type: integer
                    description: Present only when a backup code was used.
                  warning:
                    type: string
                    description: Present when a backup code was used and 3 or fewer remain.
        '400':
          description: >-
            Neither a token nor a backup code was sent, or one that was sent is
            not a string. Checked only once a sign-in is pending.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Either a TOTP token or backup code is required
        '401':
          description: >-
            No MFA sign-in is pending in this session (`Unauthorized`), the
            account no longer has MFA on (`Unauthorized`, `Invalid MFA state`),
            or the token or backup code is invalid or already used
            (`Invalid Code`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid Code
                message: Invalid authentication code. Please try again.
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/disable:
    post:
      tags:
        - MFA
      summary: Disable MFA
      description: Disable MFA for the authenticated user. Requires current password and a valid TOTP code not already used; a backup code is not accepted here. Admin accounts cannot disable MFA, and are refused before anything else is checked. Clears the secret and the backup codes. Ends the user's other login sessions and their live WebSocket connections; the session making the request stays signed in. Rate limited (5 failures/15min, shared with the other credential endpoints).
      operationId: mfaDisable
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - token
              properties:
                password:
                  type: string
                token:
                  type: string
                  description: 6-digit TOTP code
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Password or token missing, or MFA is not enabled on the account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: MFA is not enabled
        '401':
          description: >-
            Not authenticated, the password is incorrect (`Authentication
            Failed`), or the TOTP code is invalid or already used
            (`Invalid Code`). The password is checked first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Invalid Code
                message: Invalid authentication code
        '403':
          description: Admin accounts cannot disable MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Admin accounts must keep MFA enabled.
        '404':
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User not found
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/backup-codes:
    post:
      tags:
        - MFA
      summary: Regenerate backup codes
      description: Generate new set of 10 backup codes. Requires current password. Replaces all existing codes, and requires MFA to already be enabled. Signs no one out. Rate limited (5 failures/15min, shared with the other credential endpoints).
      operationId: mfaRegenerateBackupCodes
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: New backup codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
                    description: 10 backup codes in XXXX-XXXX format (shown only once)
        '400':
          description: >-
            Password missing, or MFA is not enabled on the account (checked
            before the password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: MFA is not enabled
        '401':
          description: Not authenticated, or the password is incorrect.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Authentication Failed
                message: Incorrect password
        '404':
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User not found
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/account:
    delete:
      tags:
        - Authentication
      summary: Delete own account
      description: |
        Self-service permanent account deletion. Requires the current
        password as confirmation. Deletes the user's memberships, pending
        invitations, characters, personal notes and dice macros. Their chat
        messages, dice rolls and uploaded assets stay, with the user field
        set to null, and documents they shared into a campaign stay shared
        (the share passes to the campaign's DM, or its owner).

        Only campaigns the user owns are checked. One whose DM seat another
        member holds passes to that DM. One where the user holds the DM seat,
        or where nobody does, refuses the deletion with 409 and nothing
        changes. A campaign the user is DM of but does not own (after a DM
        handover) is not checked: the deletion goes ahead and leaves that
        campaign with no DM.

        Wrong passwords count only towards the general API rate limit.
      operationId: deleteOwnAccount
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  description: Current password (for confirmation)
              required: [password]
            example:
              password: hunter2-correct-horse-battery
      responses:
        '200':
          description: >-
            Account deleted; every login session and live WebSocket
            connection of the account ended, on every device. Each campaign
            the account was a member of gets a `roster.updated` broadcast
            (`member.left`).
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Account deleted successfully }
        '400':
          description: The password is missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: Password is required to delete your account
        '401':
          description: |
            Either not authenticated, or password did not match
            (`Authentication Failed`, `Incorrect password`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: The session's account no longer exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User not found
        '409':
          description: >-
            The caller is the instance's only admin (another user has to be
            promoted to admin first), or owns a campaign whose DM seat is
            theirs or empty (the message names each one). Checked after the
            password. Nothing was changed. The body is `{ error, message }`
            only; unlike `DELETE /api/users/{id}` it carries no `campaigns`
            list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Conflict
                message: You run "Curse of the Lantern". Hand the DM seat to someone else in the campaign's settings, or delete the campaign, then delete your account.
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/registration-status:
    get:
      tags:
        - Authentication
      summary: Get registration availability
      description: |
        Public endpoint — returns whether public self-registration is currently
        enabled on this instance. Used by the frontend to show/hide the register
        link on the login page. No authentication required. Answers `true`
        when no account exists yet, and `false` (still 200) when the settings
        cannot be read.
      operationId: getRegistrationStatus
      security: []
      responses:
        '200':
          description: Registration status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowRegistration:
                    type: boolean
                    description: |
                      `true` if anonymous users may register accounts via
                      `/api/auth/register`. `false` means an admin must
                      manually create accounts.
              example:
                allowRegistration: true

  /api/auth/appearance:
    get:
      tags:
        - Authentication
      summary: Get instance appearance settings
      description: |
        Public endpoint — returns the instance's theme, font, and branding
        URLs. The frontend calls this on every page load so the login page
        can paint with the correct theme before authentication. No
        authentication required, and reachable during a forced password
        change. Until setup has run it is refused with the setup 403 like
        other routes, so the setup wizard shows the built-in defaults.
      operationId: getAppearanceSettings
      security: []
      responses:
        '200':
          description: Appearance settings. On internal error, safe defaults are returned (still 200) so the login page is always renderable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettings'
              example:
                themeId: cozy-default
                customThemeColors: null
                fontId: default
                customLogoUrl: null
                customFaviconUrl: null
                customMascotUrl: null

  /api/auth/ping:
    get:
      tags:
        - Authentication
      summary: Session keepalive
      description: |
        Extends the rolling session cookie without fetching user data.
        Called periodically by the frontend during active gameplay so a long
        session doesn't expire mid-roll. Cheap — just touches the session.
      operationId: pingSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # USER MANAGEMENT
  # ============================================

  /api/users:
    get:
      tags:
        - Users
      summary: List all users
      description: Get list of all users, newest account first, including unapproved ones (Admin only)
      operationId: listUsers
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Get specific user (own profile or admin)
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          description: >-
            A non-admin asked for an id other than their own, whether or not
            that user exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: You do not have permission to view this user
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user
      description: |
        Update user profile (own profile or admin). Every field is optional; only those sent are changed, and every check runs before anything is written. Admin can change platformRole, which ends every login session and live WebSocket connection the target has, because the role is carried in the session; an admin changing their own role is signed out too. Setting the role it already has signs no one out. The globalAssetManager and templateEditor flags are read from the database at the point of use, so changing those takes effect on the next request and does not sign anyone out.

        Changing your own email needs `currentPassword` (400 without it, 401 when wrong), checked before the new address is looked up; an admin changing someone else's does not. When the email changes, the user's unused password-reset and invitation links are voided, and the old address is emailed a notice if SMTP is configured (a failed send does not fail the change).
      operationId: updateUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Trimmed, and angle brackets removed, before the length is checked. Anything else, including a value that is not a string, is refused with 400.
                email:
                  type: string
                  format: email
                  description: >-
                    Stored lowercased. An address that differs from the
                    current one only in letter case changes nothing.
                avatarUrl:
                  type: string
                  nullable: true
                  description: >-
                    Either `/api/assets/avatars/{id}` for the user being
                    updated (the address the web client sets after an avatar
                    upload) or `null` to clear it. Anything else answers 400.
                bio:
                  type: string
                  nullable: true
                  description: >-
                    Any value other than `null` is converted to text, has angle
                    brackets removed, is trimmed and is cut off at 500
                    characters; a longer bio is not refused. Sending `null`
                    clears it.
                platformRole:
                  type: string
                  enum: [ADMIN, USER]
                  description: Admin only
                globalAssetManager:
                  type: boolean
                  description: Admin only. 403 for a non-admin caller, 400 if sent and not a boolean.
                templateEditor:
                  type: boolean
                  description: Admin only. 403 for a non-admin caller, 400 if sent and not a boolean.
                currentPassword:
                  type: string
                  description: Required when changing your own email
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: >-
            Invalid display name, an avatarUrl other than this user's
            avatar address or null, invalid email, email already in use,
            missing current password for an email change, invalid
            platformRole, or `globalAssetManager`/`templateEditor` sent as
            something other than a boolean.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: Email already in use
        '401':
          description: Not authenticated, or the current password given for an email change is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            A non-admin tried to update another user (checked first, so also
            for an id that does not exist), or sent `platformRole`,
            `globalAssetManager` or `templateEditor`, even for their own
            account and even unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only admins can update platform roles
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Setting platformRole to USER would leave the instance without an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal Server Error
                message: Failed to update user

    delete:
      tags:
        - Users
      summary: Delete user
      description: >-
        Delete user account (Admin only; an admin naming their own id is
        refused with 400, and uses `DELETE /api/auth/account` instead). Ends
        every login session and live WebSocket connection the deleted user
        had, and broadcasts `roster.updated` (`member.left`) to each campaign
        they were a member of. What stays and what goes, which campaigns are
        checked, and the 409 for a user who owns a campaign whose DM seat is
        theirs or empty, are as for `DELETE /api/auth/account`. No
        password is asked for.
      operationId: deleteUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  deletedUserAssetCount:
                    type: integer
                    description: >-
                      Count of the user's personal-scope assets, taken before
                      deletion. The assets themselves are not deleted; they
                      stay, owned by no one, readable by admins only. Assets
                      of other scopes also stay but are not counted.
        '400':
          description: >-
            The calling admin named their own id. Checked after the admin
            check, so a non-admin gets 403 instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: You cannot delete your own account
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The user owns a campaign whose DM seat is theirs or empty.
            `campaigns` lists each such campaign with its other members,
            so the admin can hand the DM seat over (`PUT
            /api/campaigns/{campaignId}/dm`) or delete the campaign and try
            again. Nothing was changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              userId: { type: string, format: uuid }
                              displayName: { type: string }
                              role: { type: string, enum: [PLAYER, SPECTATOR] }

  /api/users/{id}/reset-password:
    post:
      tags:
        - Users
      summary: Admin reset user password
      description: Generate temporary password for user (Admin only). Sets mustChangePassword flag so user is forced to change on next login. Voids the user's unused password-reset and invitation links, and ends every login session and live connection the user already has open. There is no self check, so an admin naming their own id signs themselves out everywhere. MFA on the account is left as it is.
      operationId: adminResetUserPassword
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Password reset with temporary password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  temporaryPassword:
                    type: string
                    description: 16 random letters and digits in four groups of four, shown only in this response.
                    example: aB3d-Ef9h-Jk2m-Np4q
                  mustChangePassword:
                    type: boolean
                    example: true
                  notice:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/preferences:
    get:
      tags:
        - Users
      summary: Get user preferences
      description: |
        Returns the user's per-user appearance preferences: theme id, custom theme colors, and font id.
        Returns an empty object if the user has not customized any preferences yet — the frontend layers
        these on top of the system defaults from `GET /api/auth/appearance`.
        Users can fetch their own preferences; admins can fetch any user's.
      operationId: getUserPreferences
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user preferences (partial merge)
      description: |
        Partial-merge update of the user's appearance preferences (theme id, custom theme colors,
        font id). Send any subset of fields and the server merges them into the stored JSON blob.
        Users can update their own preferences; admins can update any user's.
        Unknown fields are stripped silently. Empty payloads, including one with only unknown fields, are rejected with 400.
        The body is validated before the user is looked up, so an invalid body for an unknown id answers 400.
      operationId: updateUserPreferences
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '400':
          description: >-
            The body is empty or a field is invalid. `details` is the
            validator's flattened error, with `formErrors` and `fieldErrors`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Bad Request
                message: Invalid preferences payload
                details:
                  formErrors:
                    - At least one preference field must be provided
                  fieldErrors: {}
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/send-reset-link:
    post:
      tags:
        - Users
      summary: Admin send password reset link
      description: |
        Send a password reset email to the user (Admin only).
        Invalidates any existing unused reset or invitation links and creates a new one (expires in 1 hour).
        The email is sent before the response. If sending fails, the answer is 500, and the earlier links have already been voided.
        Requires SMTP to be configured — returns 503 if SMTP is not set up, checked before the user is looked up.
      operationId: adminSendUserResetLink
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset link sent to player@example.com.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The reset email could not be sent. The new link exists but was not delivered.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal Server Error
                message: Failed to send password reset link
        '503':
          description: SMTP not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service Unavailable
                  message:
                    type: string
                    example: SMTP is not configured on this instance. Configure SMTP in your .env to use this feature.

  # ============================================
  # CAMPAIGNS
  # ============================================

  /api/campaigns:
    get:
      tags:
        - Campaigns
      summary: List user campaigns
      description: Get all campaigns the user is a member of, each carrying its owner, full membership list, the caller's own role, and the character ids they have assigned in it.
      operationId: listCampaigns
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Campaign'
                        - type: object
                          properties:
                            owner:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                displayName: { type: string }
                                avatarUrl: { type: string, nullable: true }
                            memberships:
                              type: array
                              items:
                                $ref: '#/components/schemas/CampaignMembership'
                            userRole:
                              type: string
                              enum: [DM, PLAYER, SPECTATOR]
                            characterIds:
                              type: array
                              items: { type: string, format: uuid }

    post:
      tags:
        - Campaigns
      summary: Create campaign
      description: |
        Create a new campaign. The caller becomes its owner and its DM, and it
        starts with the default atmosphere periods (dawn, day, dusk, night).
        The optional `gameSystem` field can also be set later. A validation
        failure is a 400 whose `message` names the first problem found.
      operationId: createCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Trimmed before the length is checked and before it is stored.
                description:
                  type: string
                  maxLength: 5000
                  description: Optional, stored as an empty string when omitted. Null is refused here, although the update route accepts it.
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Optional game system for the campaign
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    allOf:
                      - $ref: '#/components/schemas/Campaign'
                      - type: object
                        properties:
                          memberships:
                            type: array
                            items:
                              $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/campaigns/{campaignId}:
    get:
      tags:
        - Campaigns
      summary: Get campaign details
      description: |
        Get campaign with owner, members, map and character metadata, the
        active session, and the caller's own role (requires campaign
        membership). An unknown campaign id answers the membership 403.

        `maps` lists every map to the DM and only the campaign's current map
        to other members (none when no map is current). It carries metadata
        only, not the token, wall, fog or light data a map fetch
        (`GET /api/maps/{id}`) returns. `spiritLayerUrl` is filled in for the
        DM, for every member while the campaign's spirit layer is switched on,
        and for a player who has a visible token of their own on the spirit
        layer of the current map. Everyone else gets `null`, so a map's spirit
        image is never addressable by someone who should not see it.

        `characters` lists the metadata of every character whose `campaignId`
        is this campaign and whose owner is still a member.
      operationId: getCampaignById
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    allOf:
                      - $ref: '#/components/schemas/Campaign'
                      - type: object
                        properties:
                          owner:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              displayName: { type: string }
                              avatarUrl: { type: string, nullable: true }
                          memberships:
                            type: array
                            items:
                              $ref: '#/components/schemas/CampaignMembership'
                          maps:
                            type: array
                            description: Metadata only. See the description above for which maps are included and when `spiritLayerUrl` is null.
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                campaignId: { type: string, format: uuid }
                                name: { type: string }
                                imageUrl: { type: string, nullable: true }
                                width: { type: number }
                                height: { type: number }
                                gridSize: { type: number }
                                feetPerSquare: { type: number }
                                diagonalRule: { type: string }
                                baseLayerUrl: { type: string, nullable: true }
                                spiritLayerUrl: { type: string, nullable: true }
                                lightingEnabled: { type: boolean }
                                fogEnabled: { type: boolean }
                                globalIllumination: { type: number }
                                explorationEnabled: { type: boolean }
                                createdAt: { type: string, format: date-time }
                                updatedAt: { type: string, format: date-time }
                          characters:
                            type: array
                            items:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                userId: { type: string, format: uuid }
                                campaignId: { type: string, format: uuid, nullable: true }
                                gameSystem: { type: string, nullable: true }
                                name: { type: string }
                                tokenImageUrl: { type: string, nullable: true }
                                createdAt: { type: string, format: date-time }
                                updatedAt: { type: string, format: date-time }
                          activeSession:
                            type: object
                            nullable: true
                            description: The campaign's most recently started session that has not ended, or null.
                            properties:
                              id: { type: string, format: uuid }
                              sessionNumber: { type: integer }
                              startedAt: { type: string, format: date-time }
                          userRole:
                            type: string
                            enum: [DM, PLAYER, SPECTATOR]
        '403':
          $ref: '#/components/responses/Forbidden'

    put:
      tags:
        - Campaigns
      summary: Update campaign
      description: |
        Update campaign settings (DM only). Every field is optional and is
        validated when present; a bad value is a 400 with a message naming it.
        Unknown fields are ignored. Changing `gameSystem` after characters
        have been created logs a warning, but the change is still allowed.
        Nothing is broadcast; open pages see the change on their next fetch.
      operationId: updateCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                  nullable: true
                status:
                  type: string
                  enum: [PREPARATION, ACTIVE, PAUSED, INACTIVE, COMPLETED, ARCHIVED]
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Game system for the campaign (warning logged if characters exist)
                vibeSettings:
                  type: object
                  description: >-
                    Replaces the campaign's atmosphere settings. Validated more
                    loosely than `PUT /api/campaigns/{campaignId}/vibe`: only
                    `periods` is required (0 to 20 entries), `enabled` and any
                    other top-level field are stored as sent without a check,
                    a period needs no `audio` field, names need not be unique,
                    and a period `audio` is not checked against the asset
                    library (switching to a period whose track the DM may not
                    open plays nothing). Unknown fields inside a period are
                    dropped. `atmosphereAudio` is ignored and the stored value
                    kept. The current period is not cleared when it disappears
                    from the list, unlike on the dedicated vibe route.
                  required: [periods]
                  properties:
                    periods:
                      type: array
                      maxItems: 20
                      items:
                        type: object
                        required: [name, hue, filter]
                        properties:
                          name:
                            type: string
                            maxLength: 100
                            description: May be empty here; the dedicated vibe route requires 1 to 50 characters.
                          hue:
                            type: string
                            pattern: '^#[0-9A-Fa-f]{6}$'
                          filter:
                            type: string
                            maxLength: 200
                            description: Allowlisted CSS filter, as on the dedicated vibe route.
                          audio:
                            type: string
                            maxLength: 500
                            nullable: true
                spiritLayerEnabled:
                  type: boolean
                spiritLayerStyle:
                  type: string
                  maxLength: 100
                  description: One of `wispy`, `ethereal`, `shadow`, `dream`, or `custom:#RRGGBB` with an optional `:<look>` naming one of those four
                chatCooldownEnabled:
                  type: boolean
                chatCooldownSeconds:
                  type: integer
                  minimum: 1
                  maximum: 300
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Campaigns
      summary: Delete campaign
      description: >-
        Delete campaign (owner or admin only; anyone else, including for an
        unknown campaign, gets 403). The campaign's library assets become
        their uploaders' personal (`USER`) assets in the same transaction as
        the delete, so a failed delete changes neither, and an asset written
        into the campaign while it is being deleted goes the same way.
        Characters are kept, with their `campaignId` set to null; the rest of
        what the campaign holds (maps, memberships, invitations, sessions,
        chat, dice rolls, personal notes, macros, creatures, token templates
        and document links) is deleted with it. Afterwards
        every open connection in the campaign leaves it and receives an
        `error` event saying the campaign was deleted, and its combat state is
        discarded. An admin naming a campaign that does not exist gets a 500.
      operationId: deleteCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/characters:
    get:
      tags:
        - Campaigns
      summary: List campaign roster
      description: |
        Returns all memberships for the campaign with each member's assigned
        characters (the characters named in that membership's
        `characterIds`). Each character carries summarized info (name, token
        image, game system and extracted HP) but never the raw character
        `data`. Requires campaign membership.
      operationId: listCampaignRoster
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        userName: { type: string }
                        userAvatar: { type: string, nullable: true }
                        role:
                          type: string
                          enum: [DM, PLAYER, SPECTATOR]
                        joinedAt: { type: string, format: date-time }
                        characters:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
                              tokenImageUrl: { type: string, nullable: true }
                              gameSystem: { type: string, nullable: true }
                              userId: { type: string, format: uuid }
                              hp:
                                type: object
                                nullable: true
                                description: >-
                                  Null unless the sheet records a positive maximum,
                                  and always null for a character with no game
                                  system or one other than D&D 5e, Pathfinder 2e
                                  and Call of Cthulhu 7e. `current` falls back to
                                  the maximum when unset; `temp` is 0 when unset
                                  and always 0 for Call of Cthulhu.
                                properties:
                                  current: { type: number }
                                  max: { type: number }
                                  temp: { type: number }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/invitable-users:
    get:
      tags:
        - Campaigns
      summary: List users eligible to invite
      description: |
        Returns all users on the instance who are *not* already a member of
        the campaign and have no pending invitation to it. Used by the
        DM-side invite picker. DM only.
      operationId: listInvitableUsers
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Users available to invite.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      description: Never includes `email`, so a DM cannot collect addresses through the invite picker. Ordered by display name.
                      properties:
                        id: { type: string, format: uuid }
                        displayName: { type: string }
                        avatarUrl: { type: string, nullable: true }
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/invite:
    post:
      tags:
        - Campaigns
      summary: Invite user to campaign
      description: >-
        Create a PENDING invitation for a user (DM only). This route does not
        create a membership; the user joins as PLAYER once they accept it with
        `POST /api/invitations/{id}/accept`. 400 when `userId` is missing or
        not text, `expiresInDays` is not a whole number up to 365, the user is
        already a member, or they already have a pending invitation.
        A user whose earlier invitation was accepted or declined (and who is
        no longer a member) gets that same invitation back as PENDING, with a
        new `createdAt` and expiry. The invited user's open connections
        receive `invitation.received` (`{ invitationId, campaignId,
        campaignName, invitedBy, timestamp }`).
      operationId: inviteUserToCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
                  description: Not checked for format. An id that names no user is a 404; a missing, empty or non-string value is a 400.
                expiresInDays:
                  type: integer
                  nullable: true
                  maximum: 365
                  description: >-
                    A whole number of days, at most 365: the invitation expires
                    that many days from now. Omitted, null, zero or negative, it
                    never expires. A string, a fraction or more than 365 answers
                    400.
                sendEmail:
                  type: boolean
                  default: false
                  description: Email the invitation if the instance has SMTP configured. Anything other than exactly `true` is treated as no email.
      responses:
        '201':
          description: >-
            Invitation created. `message` is "Invitation sent successfully",
            or says it was also emailed when `emailSent` is true.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  invitation:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      campaignId: { type: string, format: uuid }
                      userId: { type: string, format: uuid }
                      status:
                        type: string
                        enum: [PENDING]
                      createdAt: { type: string, format: date-time }
                      expiresAt: { type: string, format: date-time, nullable: true }
                      campaign:
                        type: object
                        properties:
                          id: { type: string, format: uuid }
                          name: { type: string }
                  emailSent:
                    type: boolean
                    description: True only when `sendEmail` was `true`, SMTP is configured, and the send succeeded within a 10 second timeout. A failed or slow send still leaves the invitation created.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The invited user does not exist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/{campaignId}/members/{userId}:
    delete:
      tags:
        - Campaigns
      summary: Remove member
      description: >-
        Remove a member from campaign (DM only). The sitting DM and the
        campaign owner cannot be removed; both return 400. The member's
        characters are taken out of the campaign in the same step (their
        `campaignId` becomes null), and a character still naming a campaign
        its owner has left is readable and editable by its owner alone. The
        removed member's open connections leave the campaign and receive an
        `error` event saying they are no longer a member, and the campaign
        receives `roster.updated` (`{ action: 'member.left', userId,
        campaignId }`).
      operationId: removeMember
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user is not a member of this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/{campaignId}/members/{userId}/role:
    put:
      tags:
        - Campaigns
      summary: Change member role
      description: >-
        Switch a member between PLAYER and SPECTATOR (DM only). The DM seat
        cannot be moved here: naming the DM as the member, or asking for
        `DM`, is always a 400 because the campaign already has its DM; use
        `PUT /api/campaigns/{campaignId}/dm`. The member keeps their assigned
        characters. Their open connections take the new role at once, and
        `campaign.role.changed` (`{ campaignId, userId, role }`) goes to
        everyone in the campaign so open pages follow it, with a
        `roster.updated`; the initiative order and the map on screen are sent
        again as the new role sees it.
      operationId: changeMemberRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [DM, PLAYER, SPECTATOR]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The user is not a member of this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/{campaignId}/dm:
    put:
      tags:
        - Campaigns
      summary: Transfer the DM role
      description: >-
        Hand the Dungeon Master seat to another member of the campaign. The
        outgoing DM becomes a PLAYER and the named member becomes DM, as a single
        atomic change, so the campaign is never observable with two DMs or none.
        The campaign's owner is NOT changed: ownership and the DM role are
        separate, which lets an owner hand the game to someone else and remain at
        the table as a player. Callable by the sitting DM, the campaign owner
        (even when they are not the DM), or a platform admin. Both members'
        open connections take their new roles at once; `campaign.dm.transferred`
        and a `roster.updated` for each go to the campaign, and the initiative
        order and the map on screen are sent again as each new role sees it.
        The caller need not be a member, so an unknown campaign is a 404 here,
        as is a `userId` that is not a member; naming the sitting DM is a 400.
        The response lists every membership with its `user`.
      operationId: transferDM
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
                  description: The campaign member who should become DM
      responses:
        '200':
          description: DM role transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/vibe:
    put:
      tags:
        - Campaigns
      summary: Update atmosphere (vibe) settings
      description: |
        Replace the campaign's atmosphere periods (DM only). Changing which
        period is *current* is done over the socket (`vibe.update`), not here.
        Each period's `hue` must be a `#RRGGBB` colour and its `filter` may use
        only `brightness()`, `saturate()`, `contrast()` and `hue-rotate()`,
        the functions the atmosphere editor produces; anything else is a 400.
        A period's `audio` must be present: null for no track, or the id of
        an audio asset the DM can read (their admin rights are not counted)
        that does not belong to another campaign. Anything else is a 400
        naming the period. Switching to a period plays its track for
        everyone; a period without one silences the table. Period names must
        be unique ignoring case. If the current period no longer exists in
        the new list it is cleared (matched ignoring case). Other fields, at
        the top level or in a period, are stored as sent, except
        `atmosphereAudio`, which is ignored in favour of the stored value.
        Nothing is broadcast.
      operationId: updateVibe
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vibeSettings
              properties:
                vibeSettings:
                  type: object
                  required: [enabled, periods]
                  properties:
                    enabled:
                      type: boolean
                    periods:
                      type: array
                      minItems: 1
                      maxItems: 20
                      description: At least one period; names must be unique ignoring case.
                      items:
                        type: object
                        required: [name, hue, filter, audio]
                        properties:
                          name:
                            type: string
                            minLength: 1
                            maxLength: 50
                            description: Must contain something other than whitespace.
                          hue:
                            type: string
                            pattern: '^#[0-9A-Fa-f]{6}$'
                          filter:
                            type: string
                            maxLength: 200
                            description: Allowlisted CSS filter, e.g. `brightness(0.85) saturate(1.3) hue-rotate(10deg)`
                          audio:
                            type: string
                            nullable: true
                            format: uuid
                            description: >-
                              The id of an audio asset to play for the whole
                              table while this period is the vibe, or null
                              for no audio.
      responses:
        '200':
          description: Atmosphere settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  vibeSettings:
                    type: object
                    description: The stored settings, with any atmosphere audio state preserved
                  currentVibe:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/admin/all:
    get:
      tags:
        - Campaigns
      summary: List all campaigns (Admin)
      description: >-
        Get every campaign on the instance, unpaged and in no particular order
        (platform admin only). Each carries its owner, email included, and
        counts of its members, maps and characters.
      operationId: listAllCampaigns
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/Campaign'
                        - type: object
                          properties:
                            owner:
                              type: object
                              properties:
                                id: { type: string, format: uuid }
                                displayName: { type: string }
                                email: { type: string, format: email }
                            _count:
                              type: object
                              properties:
                                memberships: { type: integer }
                                maps: { type: integer }
                                characters:
                                  type: integer
                                  description: Characters whose `campaignId` is this campaign.
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # INVITATIONS
  # ============================================

  /api/invitations:
    get:
      tags:
        - Invitations
      summary: List my pending invitations
      description: |
        Returns the authenticated user's pending campaign invitations (status
        `PENDING`), ordered newest first, with the inviting campaign's summary
        info included so the UI can render an invitation card without
        additional fetches. An invitation whose `expiresAt` has passed is
        still listed; accepting it answers 400.

        The errors this route and `/accept` and `/decline` below send
        themselves (400, 403, 404 and 500) carry only `message`, without the
        `error` field most other routes send. The exceptions are `/accept`'s
        400 for a malformed `characterIds`, and the 401 from the shared
        sign-in check, which carry both.
      operationId: listMyInvitations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    campaignId: { type: string, format: uuid }
                    userId: { type: string, format: uuid }
                    status:
                      type: string
                      enum: [PENDING, ACCEPTED, DECLINED]
                      description: >-
                        Only `PENDING` invitations are returned here. There is
                        no `EXPIRED` status: a past `expiresAt` is checked and
                        refused at accept time, not transitioned in the
                        database.
                    createdAt: { type: string, format: date-time }
                    expiresAt: { type: string, format: date-time, nullable: true }
                    campaign:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        gameSystem: { type: string, nullable: true }
                        status:
                          type: string
                          enum: [PREPARATION, ACTIVE, PAUSED, INACTIVE, COMPLETED, ARCHIVED]
                        owner:
                          type: object
                          description: >-
                            The campaign's owner. After a DM handover this need
                            not be the member who holds the DM seat.
                          properties:
                            displayName: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: The invitations could not be read.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to fetch invitations

  /api/invitations/{id}/accept:
    post:
      tags:
        - Invitations
      summary: Accept a campaign invitation
      description: |
        Accept the invitation and join the campaign as a `PLAYER`. Optionally
        assigns one or more of the accepting user's characters to the campaign
        in the same transaction.

        Validation, in this order:
        - `characterIds`, when sent, must be a list of at most 50 non-empty ids.
          This is checked before the invitation is looked up.
        - The invitation must belong to the authenticated user and be `PENDING`.
          It is accepted once: a second accept, even one sent at the same moment,
          answers 400 `Invitation already processed`.
        - Expired invitations are rejected.
        - All `characterIds` must belong to the user and not already be assigned
          to a campaign; a list naming the same id twice is refused too. One
          assigned elsewhere while the accept runs makes it answer 400 and
          change nothing.
        - Each character's `gameSystem` must be the campaign's: a character with
          a system joins only a campaign with the same one, and a character with
          none (Flexible) only a campaign with none. The same rule as
          `POST /api/characters/{id}/assign`.

        On success, also broadcasts a `roster.updated` event
        (`{ action: 'member.joined', userId, campaignId, characterIds }`) over
        the WebSocket to all current campaign members.
      operationId: acceptInvitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      requestBody:
        required: false
        description: |
          Optional list of characters to bring into the campaign. Omit or send
          `{ "characterIds": [] }` to join without assigning any characters.
        content:
          application/json:
            schema:
              type: object
              properties:
                characterIds:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
            example:
              characterIds:
                - 4fbd7b27-c5cd-4d6f-9c80-0f7f30c75c2f
      responses:
        '200':
          description: Invitation accepted; campaign membership created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invitation accepted }
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          description: |
            Invitation already processed, expired, `characterIds` malformed, or
            character validation failed (not owned by user, already assigned, or
            game-system mismatch). Only the `characterIds` case carries an
            `error` field (`Validation Error`); the rest are `{ message }` only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invitation expired
        '403':
          description: The invitation does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Not authorized
        '404':
          description: No invitation with that id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invitation not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to accept invitation

  /api/invitations/{id}/decline:
    post:
      tags:
        - Invitations
      summary: Decline a campaign invitation
      description: |
        Marks the invitation as `DECLINED`. The invitation must belong to
        the authenticated user and currently be `PENDING`; an expired one can
        still be declined. Does not create any campaign membership, and sends
        no WebSocket event. A DM can invite the same user again afterwards,
        which sets the same invitation back to `PENDING`.
      operationId: declineInvitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation declined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invitation declined }
        '400':
          description: Invitation already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invitation already processed
        '403':
          description: The invitation does not belong to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Not authorized
        '404':
          description: No invitation with that id exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Invitation not found
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Failed to decline invitation

  # ============================================
  # MESSAGES
  # ============================================

  /api/campaigns/{campaignId}/messages:
    get:
      tags:
        - Messages
      summary: Get message history
      description: >
        Chat history for a campaign, newest first, for a campaign member.

        Paging is by keyset, not offset: take `pagination.nextCursor` from one
        response and send it back as `cursor` to get the page before it. Repeat
        until `hasMore` is false to reach the first message in the campaign.
        Messages arriving while someone pages back cannot shift the window,
        which is what an offset would allow.

        Do not construct a cursor. It is opaque and its shape may change; one
        this server did not issue is a 400 ("Invalid cursor"), as is a `limit`
        outside 1 to 100.

        Dice rolls are not chat messages and are never returned here — they are
        served by `GET /api/campaigns/{campaignId}/dice-rolls`, which is the
        only path that applies the secret-roll rules.
      operationId: getMessages
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: From the previous response's `pagination.nextCursor`. Omit for the newest page.
          schema:
            type: string
      responses:
        '200':
          description: A page of chat history
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      hasMore:
                        type: boolean
                      nextCursor:
                        type: string
                        nullable: true
                        description: Send as `cursor` for the next page. Null when the history is exhausted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # PERSONAL NOTES
  #
  # Private to the signed-in user. Every route scopes its query by the session's
  # own user id as well as the campaign, never by an id from the request, and a
  # note belonging to somebody else answers 404 rather than 403 — a 403 would
  # confirm the id exists. The DM has no access to a player's notes.
  # ============================================

  /api/campaigns/{campaignId}/documents:
    get:
      tags:
        - Documents
      summary: List documents shared with a campaign
      description: >-
        Every member can list. Two kinds appear: documents shared into the
        campaign by the DM, and the campaign's own, created or uploaded at
        CAMPAIGN scope. Either way, appearing here means members may read it
        through `GET /api/assets/documents/{id}`.
      operationId: listCampaignDocuments
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: >-
            Documents shared in by link come first, oldest share first,
            followed by the campaign's own documents not also shared by link,
            oldest upload first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Documents
      summary: Share a document with a campaign
      description: >-
        DM only, and only for a document the DM uploaded or wrote themselves,
        or a global one. A document the caller cannot read answers 404, so
        sharing cannot be used to grant a table access to a stranger's private
        file from nothing but its id. A document the caller can read but did
        not upload answers 403: being shared into one campaign does not let a
        member who runs another pass it on. Admins may share anything. An
        asset that is not a document answers 404. Sharing a document that is
        already shared answers 201 with the existing link, unchanged.
      operationId: linkCampaignDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetId
              properties:
                assetId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Shared
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      campaignId:
                        type: string
                        format: uuid
                      assetId:
                        type: string
                        format: uuid
                      linkedById:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/documents/{assetId}:
    delete:
      tags:
        - Documents
      summary: Stop sharing a document with a campaign
      description: >-
        DM only. The document itself is untouched; only the share is removed.
        A campaign's own document (`shared: false` in the list) has no share
        to remove and answers 404, as does an id that is not shared here.
      operationId: unlinkCampaignDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unshared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/macros:
    get:
      tags:
        - Dice Macros
      summary: List your own saved macros
      description: >
        The caller's macros for this campaign, **oldest first** — so a macro keeps
        its place in the row of buttons. These are things people aim at without
        looking, and ordering by last edit would move one every time it changed.
        Private to the caller; a DM sees only their own.
      operationId: listDiceMacros
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Your macros, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  macros:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiceMacro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dice Macros
      summary: Save a macro
      description: >
        The expression is rolled once and the result discarded, to prove it can be
        rolled at all. An expression that only looks like dice — `2d6+`, `dddd` —
        is refused here, with 400, and does not become a button that fails every
        time it is pressed. Both fields are trimmed and must not be empty. Any
        member, spectators included, may save macros. A player may keep 50 per
        campaign; saving another answers 400.
      operationId: createDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - expression
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                expression:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: Macro saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  macro:
                    $ref: '#/components/schemas/DiceMacro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/macros/{macroId}:
    get:
      tags:
        - Dice Macros
      summary: Read one of your macros
      description: >
        A macro belonging to someone else answers `404`, not `403`, so the
        response cannot be used to confirm that an id exists.
      operationId: getDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: macroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The macro
          content:
            application/json:
              schema:
                type: object
                properties:
                  macro:
                    $ref: '#/components/schemas/DiceMacro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Dice Macros
      summary: Rename a macro or correct its expression
      description: >
        Either field alone is a valid edit; a body with neither answers 400. A
        new expression is checked the same way it was on creation, so an edit
        cannot make a macro unrollable. A macro belonging to someone else
        answers 404.
      operationId: updateDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: macroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                expression:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Macro updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  macro:
                    $ref: '#/components/schemas/DiceMacro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Dice Macros
      summary: Delete a macro
      description: Only the caller's own macro; anyone else's answers 404.
      operationId: deleteDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: macroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Macro deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/notes:
    get:
      tags:
        - Notes
      summary: List your own notes
      description: >
        The caller's notes for this campaign, most recently edited first.
        **Titles only** — `content` is deliberately not returned. A note may run
        to 100,000 characters, and a list carrying every body would move
        megabytes each time the panel opened; fetch one note to read it.
      operationId: listPersonalNotes
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Your notes, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonalNoteSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Notes
      summary: Create a note
      description: >
        Starts a note. `content` may be omitted — notes are usually created
        empty and written into afterwards. Refused once you hold 200 notes in
        this campaign.
      operationId: createPersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Trimmed before it is checked and stored.
                content:
                  type: string
                  maxLength: 100000
                  description: Markdown source.
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/PersonalNote'
        '400':
          description: Invalid title or content, or the per-campaign limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/notes/{noteId}:
    get:
      tags:
        - Notes
      summary: Read one of your notes
      description: >
        The note with its Markdown source. Answers 404 for a note that is not
        yours — including to the campaign's DM — rather than 403, so the
        response does not confirm that the id exists.
      operationId: getPersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/PersonalNote'
        '404':
          description: No such note of yours in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Notes
      summary: Rename a note, replace its body, or both
      operationId: updatePersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of the two must be present.
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Trimmed before it is checked and stored.
                content:
                  type: string
                  maxLength: 100000
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/PersonalNote'
        '400':
          description: Invalid values, or a body that changes nothing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such note of yours in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Notes
      summary: Delete a note
      operationId: deletePersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: No such note of yours in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # SESSIONS
  # ============================================

  /api/campaigns/{campaignId}/sessions:
    get:
      tags:
        - Sessions
      summary: List past sessions
      description: >
        Sessions for the campaign, newest first, with the notes the DM recorded
        when each one ended. Any campaign member may read them — the notes
        describe what happened at the table, which is what the session history
        panel shows a player before the next game.


        `savedState` is deliberately not returned: it is a large blob of token
        positions kept for resuming a session, and nothing reading history needs
        it. Capped at the 50 most recent sessions.
      operationId: listSessions
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sessionNumber:
                          type: integer
                        startedAt:
                          type: string
                          format: date-time
                        endedAt:
                          type: string
                          format: date-time
                          nullable: true
                        notes:
                          type: string
                          nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Sessions
      summary: Start new session
      description: >-
        Start a new game session for the campaign (DM only), numbered one
        past the highest session number so far. Sets the campaign ACTIVE and
        its `lastPlayedAt` to now, posts a "Session N has started!" system
        message to chat, and broadcasts `session.started` (`{ sessionId,
        sessionNumber, startedAt }`) to the campaign. Refused only while the
        campaign's status is ACTIVE. A PAUSED campaign is not refused: the
        paused session is left without an end time and the new one becomes
        the campaign's `activeSession`.
      operationId: startSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      sessionNumber: { type: integer }
                      startedAt: { type: string, format: date-time }
        '400':
          description: The campaign's status is already ACTIVE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/sessions/{sessionId}/pause:
    put:
      tags:
        - Sessions
      summary: Pause session
      description: >-
        Pause a session that has not ended (DM only). Captures the current
        map's tokens and annotations, the current map id, vibe and spirit
        layer setting into the session's saved state (replacing any earlier
        snapshot), sets the campaign PAUSED, posts a "Session N has been
        paused" system message, and broadcasts `session.paused`
        (`{ sessionId, sessionNumber }`). The campaign's status is not
        checked. The session keeps no end time, so `PUT .../resume` reopens
        it. 400 when the session has already ended.
      operationId: pauseSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stateSaved:
                    type: boolean
                    description: Always true.
        '400':
          description: The session has already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No session with this id in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/{campaignId}/sessions/{sessionId}/end:
    put:
      tags:
        - Sessions
      summary: End session
      description: >-
        End a session that has not ended (DM only). Sets its end time, sets
        the campaign INACTIVE, posts a "Session N has ended." system message
        (adding "Game state saved!" when it was), and broadcasts
        `session.ended` (`{ sessionId, sessionNumber }`). With `saveState`
        the current game state (the current map's tokens and annotations,
        map id, vibe and spirit layer setting) is captured into the session;
        without it the session's saved state is set to null, discarding any
        snapshot taken at pause. The body is not schema-validated. 400 when
        the session has already ended.
      operationId: endSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                saveState:
                  type: boolean
                  default: true
                  description: Any truthy value saves the state, and so does omitting the field.
                notes:
                  type: string
                  description: >-
                    The session recap. Any truthy value is converted to a
                    string and cut to its first 2000 characters, without
                    trimming; an empty or missing value leaves the existing
                    notes alone. Editing them afterwards uses
                    `PUT .../sessions/{sessionId}/notes`, which refuses an
                    over-long recap instead of cutting it.
      responses:
        '200':
          description: Session ended
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stateSaved:
                    type: boolean
                    description: The `saveState` value as sent (true when omitted).
        '400':
          description: The session has already ended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No session with this id in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/{campaignId}/sessions/{sessionId}/notes:
    put:
      tags:
        - Sessions
      summary: Edit or clear a past session's notes
      description: >-
        Rewrite the recap recorded for a session, or clear it by sending an
        empty string. DM only. The session need not have ended. It must
        belong to the campaign in the path; one that does not answers 404,
        not 403, so the response cannot be used to discover which session ids
        exist. The recap is trimmed before it is stored. Nothing is
        broadcast.
      operationId: updateSessionNotes
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                notes:
                  type: string
                  maxLength: 2000
                  description: >-
                    The recap. Empty, or only whitespace, clears it and stores
                    null.
      responses:
        '200':
          description: Notes updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      sessionNumber: { type: integer }
                      startedAt: { type: string, format: date-time }
                      endedAt: { type: string, format: date-time, nullable: true }
                      notes: { type: string, nullable: true }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No session with this id in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/{campaignId}/resume:
    put:
      tags:
        - Sessions
      summary: Resume last session
      description: >
        Reopen the campaign's most recently started session (DM only), whether
        it was paused or ended: its end time is cleared, the campaign is set
        ACTIVE with `lastPlayedAt` now, a "Session N has been resumed!"
        system message is posted, and `session.resumed` (`{ sessionId,
        sessionNumber, startedAt }`) is broadcast. The campaign's current
        status is not checked, so a call while a session is running succeeds
        too and posts another "resumed" message. The table is left exactly
        as it is: everything is stored as it is played, and the snapshot taken
        at pause is a record kept with the session, never written back.
      operationId: resumeSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Session resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      sessionNumber:
                        type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The campaign has never had a session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # CHARACTERS
  # ============================================

  /api/characters:
    get:
      tags:
        - Characters
      summary: List user characters
      description: >-
        Every character the caller owns, newest first, each with its
        `campaign` as `{ id, name }` (null when unassigned). Characters owned
        by other members of the caller's campaigns are not included.
      operationId: listCharacters
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  characters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Character'

    post:
      tags:
        - Characters
      summary: Create character
      description: |
        Create a new character.
        - `name` is trimmed and must be 1 to 200 characters.
        - If `campaignId` is provided and `gameSystem` is omitted or null, the
          character inherits the campaign's `gameSystem`. A `gameSystem`
          sent together with `campaignId` is not checked against the
          campaign's own system, so a character can be created straight into a
          campaign it does not match; `POST /api/characters/{id}/assign`
          refuses that combination, but this endpoint does not.
        - For a typed game system, `name` is written into the sheet's own name
          field (`characterName`, or `investigatorName` for
          `CALL_OF_CTHULHU_7E`) and the caller's display name into
          `playerName`, overwriting whatever `data` held there, before the
          sheet is validated. A flexible sheet is stored as sent.
        - With a game system (sent or inherited), `data` is validated against
          that system's sheet schema and stored as the schema's parsed output,
          so a key the schema does not declare is dropped. Sheet fields from
          before version 1.3.0 are moved to their current names first. The
          top-level fields each system requires are: `DND_5E` `class`,
          `level`, `race`, `proficiencyBonus`, `stats`; `PATHFINDER_2E`
          `class`, `level`, `ancestry`, `heritage`, `attributes`;
          `SHADOWRUN_6E` `metatype`, `archetype`, `attributes`;
          `CALL_OF_CTHULHU_7E` `occupation`, `era`, `characteristics` (the
          name field is filled in from `name`). `GET
          /api/characters/templates/{gameSystem}/blank` returns a sheet that
          passes.
        - With no game system, `data` is not validated (flexible character).
        - If `campaignId` is provided, the campaign must exist (404) and the
          caller must already be a member of it (403); otherwise nothing is
          created. The character is added to the caller's membership as well
          as carrying the `campaignId` column, in one transaction, because the
          campaign roster and the token permission checks read the membership.
        - `tokenImageUrl` is optional and nullable; an empty string is stored
          as null. A bare asset id is stored as `/api/assets/tokens/<id>`; any
          other value must be an asset's exact address,
          `/api/assets/<maps|tokens|avatars|audio|documents>/<id>` with nothing
          after the id. The asset must be one the caller can read, or one that
          does not exist; otherwise the answer is 403 and nothing is created.
      operationId: createCharacter
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Optional game system (auto-inherited from campaign if campaignId provided)
                campaignId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional campaign to assign character to immediately
                data:
                  type: object
                  description: |
                    The character sheet. When `gameSystem` is set it is validated against that system's sheet schema and stored as parsed, so keys the schema does not declare are dropped. `themeColor` is accepted on every system: either empty, `#` followed by 6 hex digits, or a name starting with a letter and up to 39 more letters, digits or spaces.
                tokenImageUrl:
                  type: string
                  nullable: true
                  description: A bare asset id, or an asset's exact `/api/assets/<kind>/<id>` address.
      responses:
        '201':
          description: Character created. The `character` carries no `campaign` object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: >-
            The body fails its shape check (`name` missing, empty or over 200
            characters, an unknown `gameSystem`, a non-string `campaignId` or
            `tokenImageUrl`), answered with `message` alone; or `data` does not
            match the game system's sheet schema, answered with
            `validationErrors` listing each problem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation Error
                  message:
                    type: string
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        code:
                          type: string
        '403':
          description: >
            The caller is not a member of the campaign named by `campaignId`,
            or `tokenImageUrl` names a picture the caller may not use. Nothing
            is created.
        '404':
          description: No campaign exists with the id given in `campaignId`

  /api/characters/{id}:
    get:
      tags:
        - Characters
      summary: Get character
      description: >-
        The owner can always read it. If it is in a campaign, any member of
        that campaign (DM, player or spectator) can read it too, as long as
        the owner is still a member there; otherwise anyone else gets 403.
        The response includes `campaign` (`id`, `name`) and the owner as
        `user` (`id`, `displayName`, `avatarUrl`).
      operationId: getCharacterById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Character details
          content:
            application/json:
              schema:
                type: object
                properties:
                  character:
                    $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Characters
      summary: Update character
      description: |
        The owner may edit it. The DM of the character's campaign may edit it
        too, but only while the character's owner is still a member of that
        campaign. A spectator in the character's campaign may not edit it,
        even when it is their own.
        - `gameSystem` in the body is only compared with the character's
          current value: the same value is accepted and ignored, a different
          one (or null on a typed character) answers 400. A character's game
          system cannot change. This comparison happens after the permission
          check, so a caller who may not edit the character gets 403 whatever
          they send.
        - If the character has a `gameSystem`, `data` is validated against
          that system's sheet schema (after moving sheet fields from before
          version 1.3.0 to their current names) and stored as the schema's
          parsed output. `data` replaces the whole sheet; it is not merged.
        - If the character has no `gameSystem`, `data` is stored unvalidated.
        - If `name` is omitted, `data` is sent, the character has a game
          system, and the sheet's own name field (`characterName`, or
          `investigatorName` for `CALL_OF_CTHULHU_7E`) holds a non-blank value
          different from the stored `name`, the `name` column is set to that
          value, trimmed. An explicit `name` in the body always wins.
        - A new `tokenImageUrl` follows the rule on create (403 otherwise); the
          address already stored may be sent back unchanged.
        - Send `updatedAt` exactly as the character was loaded with, as a UTC
          ISO timestamp ending in `Z`, to have the save refused with 409 if the
          character has changed since, by another save or by a hit point or
          hit dice change made over the socket. Without it the save is made
          whatever changed in between. A 200 response carries the new
          `updatedAt` for the next save.
        - When the saved `tokenImageUrl` actually changes, every map token
          bound to this character (found by its `characterId`, in any
          campaign, not only this character's own) has its picture set to the
          new address, or to an empty string when it was cleared, except in a
          campaign where the caller is a spectator. The token's name is not
          touched. Each campaign whose tokens changed has its initiative
          state resent. A failure here is logged and does not fail the save.
        - If the character is in a campaign and its owner is still a member,
          the update broadcasts `character.updated` to that campaign with
          `characterId`, `character`, `userId` and `tokensChanged`, and also
          `character.hp.updated` with `characterId` and `hp` when the sheet's
          hit points changed. Any other campaign whose tokens were repainted
          gets `character.updated` with only `characterId` and
          `tokensChanged: true`, without the sheet.
      operationId: updateCharacter
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                data:
                  type: object
                  description: |
                    The character sheet. When `gameSystem` is set it is validated against that system's sheet schema and stored as parsed, so keys the schema does not declare are dropped. `themeColor` is accepted on every system: either empty, `#` followed by 6 hex digits, or a name starting with a letter and up to 39 more letters, digits or spaces.
                tokenImageUrl:
                  type: string
                  nullable: true
                  description: A bare asset id, or a full `/api/assets/<kind>/<id>` address; the address already stored may be sent back unchanged.
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  deprecated: true
                  description: Optional. If sent it must equal the character's current gameSystem (null for a flexible character), or the request answers 400. It is never written.
                updatedAt:
                  type: string
                  format: date-time
                  description: |
                    The character's `updatedAt` as the caller loaded it, as a UTC ISO timestamp ending in `Z`. Optional. When sent and the character has changed since, the save is refused with 409 and nothing is written.
      responses:
        '200':
          description: Character updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: >-
            The body fails its shape check (`name` empty or over 200
            characters, an unknown `gameSystem`, an `updatedAt` that is not a
            UTC ISO timestamp ending in `Z`), answered with `message` alone;
            `gameSystem` differs from the character's, answered with `error:
            Bad Request`; or `data` does not match the game system's sheet
            schema, answered with `validationErrors`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation Error
                  message:
                    type: string
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        code:
                          type: string
        '403':
          description: >-
            The caller is neither the owner nor the DM of the character's
            campaign (or is that DM but the owner has left the campaign), or is
            a spectator in the character's campaign, or `tokenImageUrl` names a
            picture the caller may not use.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The character changed after the `updatedAt` sent. Nothing was saved; load the character again and reapply the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                  code:
                    type: string
                    example: CHARACTER_CHANGED
                  message:
                    type: string

    delete:
      tags:
        - Characters
      summary: Delete character
      description: >-
        Owner only. Deletes the character row. No event is broadcast, and map
        tokens placed from the character stay on their maps.
      operationId: deleteCharacter
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Character deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/characters/{id}/assign:
    post:
      tags:
        - Characters
      summary: Assign character to campaign, or unassign it
      description: |
        Owner only. A `campaignId` that is not a string or null answers 400
        (`Validation Error`) before anything is looked up.
        - Omitting `campaignId`, or sending it as `null` or `""`, unassigns the
          character: its `campaignId` column is cleared and it is removed from
          the caller's membership `characterIds` in its previous campaign, if
          it had one. No campaign membership is needed for this.
        - Sending a `campaignId` assigns the character to that campaign. The
          campaign must exist (404 otherwise) and the caller must already be a
          member of it (403 otherwise). The character's `gameSystem` must
          match the campaign's (both flexible, or the same typed system), or
          the request answers 400 and nothing changes. If the character was
          assigned to another campaign, it is removed from the caller's
          membership there first.
        - Assigning broadcasts `roster.updated` to the new campaign, with
          `action` set to `character.assigned` and `characterId`, `userId`
          and `campaignId`. Unassigning a character that had a campaign
          broadcasts `roster.updated` to that campaign, with `action` set to
          `character.unassigned` and `characterId` and `userId`.
      operationId: assignCharacterToCampaign
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Omit, or send null/"", to unassign instead of assign.
      responses:
        '200':
          description: >-
            Character assigned or unassigned. Its `campaign` is `{ id, name,
            gameSystem }`, or null after unassigning.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: >-
            `campaignId` names a campaign whose game system does not match the
            character's (`Game System Mismatch`), or is not a string or null
            (`Validation Error`). Nothing is changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Game System Mismatch
                  message:
                    type: string
                    example: Cannot assign a DND_5E character to a flexible campaign. Character and campaign game systems must match.
        '403':
          description: >-
            The caller does not own the character, or (when assigning) is not
            a member of the target campaign.
        '404':
          description: >-
            The character does not exist, or (when assigning) no campaign
            exists with the given `campaignId`.

  /api/characters/{id}/validate:
    get:
      tags:
        - Characters
      summary: Validate character data against its game system schema
      description: |
        Re-runs the Zod schema for the character's `gameSystem` against its
        current `data` blob. Useful after editing a character to surface fields
        that no longer satisfy the schema (e.g. missing required ability
        scores after a game-system update).

        Returns `200 OK` with `isValid: false` and a list of field-level errors
        even when validation fails — this is not an error condition for the
        client. Only character owners can validate (prevents info leakage).
      operationId: validateCharacter
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CharacterId'
      responses:
        '200':
          description: "Validation result — note that an invalid character returns 200 with isValid=false (not an error)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    description: Present only when `isValid` is false. A problem at the top level of the sheet has `path` set to `root`.
                    items:
                      type: object
                      properties:
                        path: { type: string, example: 'stats.strength' }
                        message: { type: string, example: 'Invalid input: expected number, received string' }
                        code: { type: string, example: 'invalid_type' }
              examples:
                valid:
                  summary: All fields pass
                  value:
                    isValid: true
                invalid:
                  summary: Schema mismatch
                  value:
                    isValid: false
                    errors:
                      - path: 'stats.strength'
                        message: 'Invalid input: expected number, received string'
                        code: 'invalid_type'
        '400':
          description: Character has no game system assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: { type: boolean, example: false }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        message: { type: string }
                        code: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/characters/{id}/copy:
    post:
      tags:
        - Characters
      summary: Duplicate a character
      description: |
        Creates a copy of the character for the same owner, with the same
        `gameSystem`, sheet and `tokenImageUrl`. The copy is unassigned
        (`campaignId: null`), its name is the original's followed by a space
        and `(Copy)`, and the response carries no `campaign` object. Only the
        character's owner may copy it.
      operationId: copyCharacter
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CharacterId'
      responses:
        '201':
          description: Character copied successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Character copied successfully }
                  character:
                    $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # ASSETS
  # ============================================

  /api/assets:
    get:
      tags:
        - Assets
      summary: List assets
      description: |
        List assets with filtering and pagination, newest first. With no
        `type`, documents are left out: they have their own section, and are
        fetched by asking for `type=DOCUMENT` explicitly.

        Which assets are listed: with `campaignId`, every asset filed in that
        campaign's library (the caller must be a member, 403 otherwise; a
        platform admin may name any campaign, and `usable` is then ignored).
        Without it, a non-admin sees GLOBAL assets, their own USER assets and
        the libraries of the campaigns they belong to; a platform admin sees
        every asset on the instance unless `usable=true` asks for the same
        rule. A personal asset that is only *used* in one of the caller's
        campaigns is not listed, though the file routes serve it to them.

        Except for an admin naming a campaign, a spirit-layer image of a map
        in a campaign where the caller is not the DM, and whose spirit plane
        is still closed to them, is left out.

        A `type` or `scope` outside its enum, or either sent more than once,
        answers 400. A `page` below 1 is treated as 1, and `limit` is clamped
        into 1-100.
      operationId: listAssets
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT, OTHER]
        - name: scope
          in: query
          schema:
            type: string
            enum: [GLOBAL, USER, CAMPAIGN]
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
        - name: search
          in: query
          description: Filter by name (case-insensitive partial match)
          schema:
            type: string
        - name: uploadedBy
          in: query
          description: Filter by uploader. Platform admins only; ignored for anyone else.
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: usable
          in: query
          description: >-
            `true` lists only assets the caller may put on a map, token or
            creature: global ones, their own personal ones, and those of
            campaigns they belong to. Without it, a platform admin is listed
            every asset on the instance; for anyone else the two are the same.
            Ignored when `campaignId` is given.
          schema:
            type: boolean
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer
        '400':
          description: A `type` or `scope` outside its enum, or sent more than once.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: 'type must be one of: MAP, TOKEN, AUDIO, AVATAR, DOCUMENT, OTHER'
        '403':
          description: '`campaignId` names a campaign the caller is not a member of, including one that does not exist.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: You do not have access to this campaign

  /api/assets/upload:
    post:
      tags:
        - Assets
      summary: Upload asset
      description: |
        Upload a new asset file. The file is validated by **magic-byte**
        inspection (not just MIME header or extension) and rejected if the
        detected type doesn't match the declared `type`; the stored file's
        extension is then forced to match the detected type, regardless of
        what the original filename claimed.

        **Who may upload to which scope:**
        | Scope | Who |
        |-------|-----|
        | USER | Anyone signed in, into their own library |
        | GLOBAL | A platform admin, or a user granted `globalAssetManager` |
        | CAMPAIGN | That campaign's DM; a player may upload only TOKEN art (their own character's); a spectator never |

        `type: AVATAR` is always placed at USER scope, whatever `scope` is
        sent: an avatar is always personal. A `campaignId` sent with a USER
        or GLOBAL upload is ignored.

        **Accepted content per asset type**, decided by what the bytes are,
        not by the filename:
        | Type | Content |
        |------|---------|
        | MAP | PNG, JPEG, WebP, PDF |
        | TOKEN | PNG, JPEG, WebP, GIF |
        | AUDIO | MPEG audio (MP3), Ogg audio, WAV |
        | AVATAR | PNG, JPEG, WebP |
        | DOCUMENT | PDF; plain text or Markdown |

        The original filename's extension matters only where the bytes
        cannot be identified: a MAP named `.pdf` that starts with `%PDF-`, an
        AUDIO named `.mp3` that starts with an ID3 tag or an MPEG frame sync,
        and a DOCUMENT named `.txt` or `.md` whose bytes are valid UTF-8 text
        with no control characters besides tab, line feed, form feed and
        carriage return. "Ogg audio" includes Ogg FLAC and Speex, stored as
        `.oga` and `.spx`, and MPEG audio includes layers I and II, stored as
        `.mp1` and `.mp2`; these upload successfully but
        `GET /api/assets/audio/{id}` answers 404 for them. Ogg Opus is
        refused.

        The stored row's `mimeType` is the content type the client declared
        for the file part, not the detected one; the file routes do not use
        it.

        **File size limits** — set per type with the `MAX_<TYPE>_SIZE_MB`
        environment variables (defaults shown). The effective values are
        available from `GET /api/config`.
        | Type | Env var | Default limit |
        |------|---------|---------------|
        | MAP    | `MAX_MAP_SIZE_MB`    | 50 MB |
        | TOKEN  | `MAX_TOKEN_SIZE_MB`  | 5 MB |
        | AUDIO  | `MAX_AUDIO_SIZE_MB`  | 20 MB |
        | AVATAR | `MAX_AVATAR_SIZE_MB` | 2 MB |
        | DOCUMENT | `MAX_DOCUMENT_SIZE_MB` | 50 MB |

        A MAP or TOKEN upload whose declared content type starts with
        `image/` also gets a thumbnail stored beside the file, scaled to fit
        inside 512×512 with its aspect ratio kept and never enlarged. A
        thumbnail that cannot be made does not fail the upload. No route
        serves thumbnails and no response mentions them; deleting the asset
        deletes its thumbnail.

        **Rate limit**: 30 uploads per minute per user (configurable via
        `ASSET_UPLOAD_RATE_LIMIT`), one budget shared with
        `POST /api/assets/documents` and the UVTT map import. Sized to allow
        legitimate bulk-upload during campaign setup while blocking obvious
        abuse loops.
      operationId: uploadAsset
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - type
              properties:
                file:
                  type: string
                  format: binary
                  description: Exactly one file, in a part named `file`.
                type:
                  type: string
                  enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT]
                  description: Case-sensitive.
                scope:
                  type: string
                  enum: [GLOBAL, USER, CAMPAIGN]
                  default: USER
                campaignId:
                  type: string
                  format: uuid
                  description: Required if scope is CAMPAIGN
                name:
                  type: string
                  description: Defaults to the uploaded file's original name when omitted.
                description:
                  type: string
                tags:
                  type: string
                  description: Comma-separated tags; each is trimmed and empty ones are dropped.
      responses:
        '201':
          description: Asset uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Asset uploaded successfully
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: >-
            `error` is `Validation Error` for: `type` missing or not one of
            the five values; `scope` not one of GLOBAL, USER or CAMPAIGN;
            `campaignId` missing for a CAMPAIGN upload; no file; a file in a
            part not named `file`; content that cannot be identified ("Could
            not determine file type...") or is not accepted for the declared
            `type` ("Invalid file type..."). `error` is `File Too Large` when
            the file exceeds its type's limit. Other multipart problems, such
            as more than one file, a body that is cut off or malformed, more
            than 100 text fields, a field name longer than 100 characters, or
            a name such as `a[b][c]` nested more than five levels deep or
            with a number above 1000 between the brackets, answer with
            `Upload Error` or `Validation Error`. A refused file is deleted,
            and so is the part of one the client stopped sending. The same
            field limits apply to every route that accepts an upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            GLOBAL without being an admin or global asset manager; CAMPAIGN in
            a campaign the caller is not a member of (or that does not exist),
            or as a player uploading anything but TOKEN, or as a spectator.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: Only the Dungeon Master can upload campaign assets
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/assets/{id}:
    get:
      tags:
        - Assets
      summary: Get asset metadata
      description: >-
        This route checks access on its own terms, not the shared read rule
        the file-serving routes below use: a USER-scoped asset only to its
        uploader or an admin, a CAMPAIGN-scoped one only to a member of that
        campaign (with the spirit-layer check for a non-DM member), GLOBAL to
        anyone signed in. It does not extend access to a caller whose
        campaign merely *uses* the asset (a DM's personal map shown to the
        table, a document shared with the campaign, the atmosphere track), so
        the metadata can answer 403 for an asset whose file the same caller
        may read.
      operationId: getAssetById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Asset metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Assets
      summary: Delete asset
      description: |
        Delete asset. A personal asset, its owner or an admin; a campaign
        asset, its uploader while still a member of that campaign, the
        campaign's DM, or an admin; a global asset, an admin or the uploading
        global asset manager.

        Removes the database row, the file and its thumbnail (if any), and
        for a document every share of it with a campaign. Deleting a user's
        newest avatar makes their previous one current.

        While a map (its image, base layer or spirit layer), a token on a map,
        a character's token picture, a character template, a creature, a token
        template or a campaign's atmosphere track still names the asset, the
        route answers **409** with `code: ASSET_IN_USE` and the list of uses,
        and deletes nothing. Those records are not told when an asset goes, so
        deleting one anyway leaves them pointing at nothing. Send
        `force=true` to delete it regardless; any other value of `force` is
        ignored. Permissions are checked first, so only someone who may delete
        the asset is told where it is used. An admin sees every record by name;
        anyone else sees a name and campaign only for what is in a campaign
        they are the DM of, a character they own, or a character template. The
        rest is counted per kind with `name` and `campaignName` null. Only an
        address that names this asset counts: one that merely contains its id
        (a longer id, a query string) is not a use. Profile pictures are not
        checked.
      operationId: deleteAsset
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: force
          in: query
          required: false
          description: >-
            `true` deletes the asset even though something still uses it. Any
            other value, or none, leaves an in-use asset alone and answers 409.
          schema:
            type: string
            enum: ['true']
      responses:
        '200':
          description: Asset deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Asset deleted successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            Something still uses the asset, and the request did not carry
            `force=true`. Nothing was deleted. Route on `code`, not the message.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                  code:
                    type: string
                    example: ASSET_IN_USE
                  message:
                    type: string
                  usage:
                    type: array
                    description: >-
                      At most 100 entries; `omitted` counts the rest. Each is
                      one map, character, template, creature or campaign, or a
                      map's tokens together (`count`), or, where the caller may
                      not see the record, every use of one kind folded into a
                      single entry with `name`, `campaignId` and `campaignName`
                      null.
                    items:
                      type: object
                      properties:
                        kind:
                          type: string
                          enum: [map, token, character, characterTemplate, creature, tokenTemplate, campaignSetting]
                        name:
                          type: string
                          nullable: true
                          description: The map, character, template, creature or campaign.
                        campaignId:
                          type: string
                          nullable: true
                        campaignName:
                          type: string
                          nullable: true
                        count:
                          type: integer
                          description: How many tokens (kind `token`) or folded entries it stands for; 1 otherwise.
                  omitted:
                    type: integer
                    description: Uses past the 100 listed.

  /api/assets/{id}/scope:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    patch:
      tags:
        - Assets
      summary: Change asset scope
      description: |
        Move an asset between the three scopes (`GLOBAL`, `USER`, `CAMPAIGN`).
        A platform admin may make any move; the rules below are for everyone
        else, and combine when a move touches more than one of their cases.

        **Permission matrix (non-admin):**
        | Case | Requirement |
        |------|-------------|
        | Either the current or the new scope is GLOBAL | Caller has `globalAssetManager` |
        | Current scope is USER | Caller is the asset's owner |
        | Current scope is CAMPAIGN | Caller is the asset's owner and still a member of that campaign, or is that campaign's DM |
        | New scope is CAMPAIGN | Caller may place an asset of this type in the target campaign: its DM, or a player placing TOKEN art only |

        So, for example, CAMPAIGN → CAMPAIGN needs both the "current scope is
        CAMPAIGN" and "new scope is CAMPAIGN" rows; a non-admin
        `globalAssetManager` moving a GLOBAL asset into a campaign also has to
        satisfy that campaign's placement rule, the same as uploading there
        directly.

        When `scope: CAMPAIGN`, `campaignId` is required and the campaign must
        exist (404 otherwise, checked before the ownership and placement
        rows); for
        any other scope `campaignId` is ignored and cleared. The asset's file
        does not move on disk: only the DB record's scope and `campaignId` are
        updated, and the uploader stays as recorded. Moving an asset to USER
        therefore makes it personal to its uploader, who may not be the
        caller.
      operationId: changeAssetScope
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [GLOBAL, USER, CAMPAIGN]
                campaignId:
                  type: string
                  format: uuid
                  description: Required when scope is CAMPAIGN
              required: [scope]
            examples:
              userToCampaign:
                summary: Move from personal library to a campaign
                value:
                  scope: CAMPAIGN
                  campaignId: 7f4cda04-2b08-4f7d-9b6f-2c2d7d0d0a01
              promoteToGlobal:
                summary: Admin moves a campaign asset into the global library
                value:
                  scope: GLOBAL
      responses:
        '200':
          description: Asset moved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Asset scope updated successfully
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/assets/{id}/download:
    get:
      tags:
        - Assets
      summary: Download asset file
      description: >-
        Any asset type. Uses the same read rule as the map, token, audio and
        document routes below (see `GET /api/assets/maps/{id}`), including
        the grants for an asset used in a campaign the caller shares with its
        uploader and for a document shared with the caller's campaign, so it
        can serve a file whose metadata `GET /api/assets/{id}` refuses.
        Served with `Content-Disposition: attachment` and the asset's
        original filename. The content type is chosen from the stored file's
        extension, which the upload forced to match the content. 404 also
        when the row exists but the file is missing from disk.
      operationId: downloadAsset
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File download
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assets/documents:
    post:
      tags:
        - Documents
      summary: Create a text or Markdown document from typed content
      description: >-
        The same rules as uploading decide who may place it at each scope:
        anyone into their own library, the DM into their campaign, an admin or
        global asset manager instance-wide. The content is checked to be text,
        bounded at 900 KB (typed content arrives as JSON; anything larger is a
        file to upload), written to disk exactly as sent, and never interpreted.
        A PDF cannot be typed. Counts against the upload rate limit, since it
        creates a file on disk exactly as an upload does. The new asset's
        `originalName` is `<name>.<format>` and its `mimeType` is
        `text/plain` or `text/markdown`. A `campaignId` sent with a USER or
        GLOBAL document is ignored.
      operationId: createDocument
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - format
                - content
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Trimmed.
                description:
                  type: string
                  maxLength: 1000
                  description: Trimmed.
                format:
                  type: string
                  enum: [txt, md]
                content:
                  type: string
                  description: >-
                    At most 900 KB once encoded as UTF-8, with no NUL or
                    control characters besides tab, line feed, form feed and
                    carriage return.
                scope:
                  type: string
                  enum: [USER, CAMPAIGN, GLOBAL]
                  default: USER
                campaignId:
                  type: string
                  format: uuid
                  description: Required when scope is CAMPAIGN
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: >-
            `error` is `Validation Error` and `message` names the first problem
            found: a missing or over-long name, a format other than txt or md,
            content too long or not text, an unknown scope, a `campaignId` that
            is not a UUID, or a CAMPAIGN document with no `campaignId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: That is too long to save as typed text. Upload it as a file instead.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: >-
            GLOBAL without being an admin or global asset manager; CAMPAIGN
            without being that campaign's DM (a player or spectator, a
            non-member, or a campaign that does not exist).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: The JSON body is over 1 MB.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Payload Too Large
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/assets/documents/{id}/content:
    put:
      tags:
        - Documents
      summary: Replace the text of a text or Markdown document
      description: >-
        The uploader or an admin. A document the caller may not edit answers
        404, so the reply does not confirm a private id exists. A PDF answers
        400: it is a file, and is replaced by uploading a new one. The recorded
        size is updated. Not counted against the upload rate limit.
      operationId: updateDocumentContent
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - content
              properties:
                content:
                  type: string
                  description: The same rules as when creating a typed document.
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assets/documents/{id}:
    get:
      tags:
        - Documents
      summary: Serve a document for reading inline
      description: >-
        A PDF, plain text or Markdown file. Who may read it follows the
        asset's scope: a GLOBAL document anyone signed in, a CAMPAIGN one
        that campaign's members, a USER (personal) one its uploader. Beyond
        that, a document shared with a campaign is readable by that
        campaign's members, and a platform admin may read any. Anyone else
        gets 404, not 403, so the reply never confirms a private id exists;
        404 also when the file is missing from disk. The content type is
        decided from the file's validated extension, never from what was
        declared at upload, and
        Markdown is served as text/plain so the browser never renders a
        document as a page. The response carries
        `X-Content-Type-Options: nosniff` and a
        `Content-Security-Policy: default-src 'none'; sandbox` that applies
        whenever the browser renders the response as a document. Note it does
        not sandbox a PDF; a client embedding one should sandbox the frame
        itself, as CozyVTT's reader does. Caching differs by format: a PDF
        cannot change under its id and is cacheable as immutable, while text
        and Markdown can be rewritten in place, so they are served
        `Cache-Control: private, no-cache` with an ETag that changes with the
        file. Send `If-None-Match` and an unchanged document answers 304.
      operationId: serveDocument
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 'The document, inline (`Content-Disposition: inline`)'
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '304':
          description: Unchanged since the ETag in `If-None-Match`. No body.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assets/maps/{id}:
    get:
      tags:
        - Assets
      summary: Serve map image
      description: |
        Serves a MAP asset's file. This is the read rule the token, audio,
        document and download routes share:

        - a platform admin may read any asset;
        - GLOBAL: anyone signed in;
        - CAMPAIGN: any member of that campaign, except that a non-DM member
          is refused a spirit-layer image of one of its maps while the spirit
          plane is closed to them (unless the same image is a layer of the
          map the campaign is showing);
        - USER: its uploader.

        Beyond its scope, an asset is readable by someone who shares a
        campaign with its uploader in which the asset is in use: as a map's
        image or base layer, a spirit layer they may see, a token's art,
        a character's token picture, a creature or token template's
        picture, or the campaign's atmosphere track. Among maps, a non-DM
        member counts only the one the campaign is currently showing. A document
        shared with one of the caller's campaigns is also readable.

        A refused read answers 403 here and on the token route. The file is
        served with its content type chosen from its stored extension
        (`image/png`, `image/jpeg`, `image/webp`, `image/gif`, or
        `application/pdf`, since a map may be a PDF; anything else as
        `application/octet-stream`) and `X-Content-Type-Options: nosniff`.
        It is cached as `private, max-age=31536000, immutable` with the ETag
        `"<asset id>"`; send that in `If-None-Match` for a 304.
      operationId: serveMap
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Map image
          content:
            image/*:
              schema:
                type: string
                format: binary
            application/pdf:
              schema:
                type: string
                format: binary
        '304':
          description: Unchanged since the ETag in `If-None-Match`. No body.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No MAP asset with this id, or its file is missing from disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assets/tokens/{id}:
    get:
      tags:
        - Assets
      summary: Serve token image
      description: >-
        Serves a TOKEN asset's file, with the same read rule, 403, content
        types, caching and 304 as `GET /api/assets/maps/{id}`.
      operationId: serveToken
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Token image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '304':
          description: Unchanged since the ETag in `If-None-Match`. No body.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No TOKEN asset with this id, or its file is missing from disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/assets/audio/{id}:
    get:
      tags:
        - Assets
      summary: Stream audio file
      description: |
        Stream audio with HTTP range request support. Read access is the
        shared asset rule described under `GET /api/assets/maps/{id}`: a
        platform admin any track, GLOBAL anyone signed in, CAMPAIGN that
        campaign's members, USER its uploader. For audio the usual "in use"
        grant is a campaign's atmosphere track, since each player's browser
        fetches the sound itself: while a campaign's atmosphere is set to
        this track, its members may read it, provided the uploader is a
        member of that campaign too. Anyone else gets 404, not 403. The
        Content-Type comes from the file's extension (`audio/mpeg`,
        `audio/ogg` or `audio/wav`), never from the type declared at upload,
        and the response carries `X-Content-Type-Options: nosniff`. A track
        stored under any other extension (`.oga`, `.spx`, `.mp1`, `.mp2`,
        which the upload accepts) answers 404. No caching headers or ETag
        are sent.

        A `Range` header is read as `bytes=<start>-<end>`, end optional, and
        answers 206 with `Content-Range`. A suffix range (`bytes=-500`), or an
        open range whose start is beyond the end of the file, answers 500;
        there is no 416. An end beyond the file is not clamped, so the
        declared `Content-Length` can exceed what is sent.
      operationId: streamAudio
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (range request)
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: A suffix range, or an open range starting beyond the end of the file.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal Server Error
                message: Failed to stream audio

  /api/assets/avatars/{userId}:
    get:
      tags:
        - Assets
      summary: Serve user avatar
      description: >-
        Any signed-in user may fetch anyone's avatar. Serves the newest
        AVATAR asset that user uploaded, with the content type chosen from
        its stored extension and `X-Content-Type-Options: nosniff`. Because
        the address names the user, not the asset, it is cached as
        `private, max-age=300` with the ETag `"<asset id>"`, which changes
        when a new avatar is uploaded; send it in `If-None-Match` for a 304.
      operationId: serveAvatar
      security:
        - cookieAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Avatar image
          content:
            image/*:
              schema:
                type: string
                format: binary
        '304':
          description: Unchanged since the ETag in `If-None-Match`. No body.
        '404':
          description: The user has no avatar, or its file is missing from disk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: User avatar not found

  # ============================================
  # MAPS & TOKENS
  # ============================================

  /api/campaigns/{campaignId}/maps:
    get:
      tags:
        - Maps
      summary: List campaign maps
      description: |
        List the campaign's maps, newest first. The DM gets every map; a
        player or spectator is sent only the map the campaign is showing
        (`currentMapId`), or an empty list while it shows none. A map the DM
        has prepared but not switched to is the DM's alone.
      operationId: listMaps
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: >-
            List of maps. Each item is a summary of 14 fields, not the full
            Map object: no tokens, annotations, walls, lights, fog, spirit
            layer or `campaignId`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  maps:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        imageUrl: { type: string }
                        width: { type: integer }
                        height: { type: integer }
                        gridSize: { type: integer }
                        feetPerSquare: { type: integer }
                        diagonalRule: { type: string, enum: [flat, alternating] }
                        lightingEnabled: { type: boolean }
                        fogEnabled: { type: boolean }
                        globalIllumination: { type: boolean }
                        explorationEnabled: { type: boolean }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Maps
      summary: Create map
      description: >-
        Create a new map for the campaign (DM only). The new map starts with
        lighting, fog of war, Global Illumination and exploration memory all
        off, and no tokens, walls or lights.


        `imageUrl` and `spiritLayerUrl` take an asset id or an asset's exact
        address (`/api/assets/<kind>/<id>`). A bare id is stored as
        `/api/assets/maps/<id>`. Anything else, an outside URL included, is
        given the same prefix and so answers 403. An address naming an
        existing asset must name one the caller can read, or the request
        answers 403 (`You do not have access to that image`), unless this
        campaign already stores that exact address somewhere, as a copy of a
        token, template or creature does. An address naming an asset that no
        longer exists is accepted.


        `gridSize`, `feetPerSquare` and `diagonalRule` are never rejected: a
        missing or out-of-range value is replaced with its default (50, 5,
        `flat`); a `gridSize` that is not a positive whole number counts as
        out of range. Only `name`, `imageUrl`, `width` and `height` can make
        this route answer 400; `width` and `height` must be positive whole
        numbers.
      operationId: createMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - imageUrl
                - width
                - height
              properties:
                name:
                  type: string
                  description: Trimmed; must not be blank.
                imageUrl:
                  type: string
                  description: Asset id or exact asset address.
                width:
                  type: integer
                  minimum: 1
                  description: In grid squares.
                height:
                  type: integer
                  minimum: 1
                  description: In grid squares.
                gridSize:
                  type: integer
                  default: 50
                  description: Pixels per grid square. Falls back to 50 when omitted or not a positive whole number.
                feetPerSquare:
                  type: integer
                  default: 5
                  description: Falls back to 5 when omitted or not an integer from 1 to 100.
                diagonalRule:
                  type: string
                  enum: [flat, alternating]
                  default: flat
                  description: Falls back to flat when omitted or not one of these two values.
                spiritLayerUrl:
                  type: string
                  description: Asset id or exact asset address. Omitted or empty means none.
      responses:
        '201':
          description: Map created
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/maps/{id}:
    get:
      tags:
        - Maps
      summary: Get map
      description: |
        Get a map with its tokens, annotations, walls and lights. The DM gets
        the stored map whole. Anyone else gets it filtered as the Map schema
        describes: only the tokens on their plane that are not hidden (and on
        a lit map only those in their sight plus their own), each cut down to
        the fields they may see; `spiritLayerUrl` null unless the spirit layer
        is visible to them; `fogData` always null. Walls, lights and
        annotations are sent to everyone.


        A player or spectator may fetch only the campaign's current map; any
        other map of the campaign answers 404 for them, as does everything
        under it (walls, lights). A map of another campaign answers 404
        (`Map not found in this campaign`) for everyone.
      operationId: getMapById
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Map details
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
                  spiritVisible:
                    type: boolean
                    description: >-
                      Whether the caller can currently see the spirit layer,
                      which decides `map.spiritLayerUrl` and which plane's
                      tokens they get. Always true for the DM. For anyone else
                      it is true while the DM has revealed the spirit layer to
                      the campaign, and for a player also while a visible
                      spirit-layer token they control stands on the current
                      map.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Maps
      summary: Update map
      description: |
        Update map settings (DM only). Send only the fields to change. Each
        field sent is checked and a bad one answers 400; unlike on create,
        nothing is replaced with a default. `feetPerSquare` must be an
        integer from 1 to 100, `diagonalRule` `flat` or `alternating`, and
        `width`, `height` and `gridSize` positive whole numbers.

        A request carrying any of the four per-map flags broadcasts
        `map:settings:updated` with all four, to every member for the map the
        campaign is showing and to the DM's connections for any other. When
        `lightingEnabled` or `globalIllumination` actually changes, and the map
        is the one the campaign is showing, every member is also sent the map
        as they can now see it (`map.changed`), since those two decide which
        tokens a player is sent; editing another map in the library sends no
        `map.changed`.

        Turning `fogEnabled` on from off also pushes the map's fog at once,
        as a fog operation does: `fog:updated` with the whole grid to the DM,
        `fog:cells` with the revealed cells to everyone else who may read the
        map. Changing `gridSize`, `width` or `height` pushes nothing, but the
        stored fog no longer matches the map's grid, so from then on it is
        read as a fresh, fully hidden grid, and the next fog operation
        overwrites it.

        `imageUrl` and `spiritLayerUrl` take an asset id or an asset's exact
        address (`/api/assets/<kind>/<id>`); a bare id is stored as
        `/api/assets/maps/<id>`, and anything else, an outside URL included,
        answers 403. One naming an existing asset must name one the caller
        can read, or the request answers 403 (the right to read an asset
        follows its use, so storing a reference is checked like reading it),
        unless this campaign already stores that exact address somewhere, as
        a copy of a token, template or creature does. An address naming an
        asset that no longer exists is accepted, and so is the address
        already stored, sent back unchanged. `spiritLayerUrl` null or empty
        removes the spirit layer.
      operationId: updateMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                width:
                  type: integer
                  minimum: 1
                height:
                  type: integer
                  minimum: 1
                gridSize:
                  type: integer
                  minimum: 1
                feetPerSquare:
                  type: integer
                  minimum: 1
                  maximum: 100
                diagonalRule:
                  type: string
                  enum: [flat, alternating]
                imageUrl:
                  type: string
                spiritLayerUrl:
                  type: string
                  nullable: true
                lightingEnabled:
                  type: boolean
                  description: Dynamic lighting on this map
                fogEnabled:
                  type: boolean
                  description: Manual fog of war on this map. Off means players see the whole map (dynamic lighting still applies). New maps are created with it off.
                globalIllumination:
                  type: boolean
                  description: With dynamic lighting on, everything in a token's line of sight counts as lit. Off, a player sees only what their tokens' sight radius reaches or a light source lights. Maps from before 1.5.0 have it on; new maps start with it off.
                explorationEnabled:
                  type: boolean
                  description: Remember the areas each player has seen on this map and grey them in when out of sight. Maps from before 1.5.0 have it on; new maps start with it off.
      responses:
        '200':
          description: Map updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Maps
      summary: Delete map
      description: >-
        Delete a map (DM only). The campaign's current map cannot be deleted:
        that answers 400 (`Cannot delete the current map. Set a different map
        as current first.`). The map's tokens, walls, lights and fog go with
        it, as does every player's explored-area memory of it; its image
        asset is kept. If any combatant stood on it, those combatants leave
        the initiative order and the order is sent again to every connected
        member (`initiative.state`).
      operationId: deleteMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Map deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/set-current:
    put:
      tags:
        - Maps
      summary: Set current map
      description: >-
        Set a map as the current map for the campaign (DM only). Which plane
        each player is on, and which combatants they are sent, follows the
        current map, so while anything is in the initiative order it is sent
        again to every connected member (`initiative.state`). The route sends
        no map event of its own, so open pages are not moved to the new map
        by it.
      operationId: setCurrentMap
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Current map set
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    allOf:
                      - $ref: '#/components/schemas/Campaign'
                    description: The updated campaign, with `currentMap` added, holding `{ id, name, imageUrl }` of the map just set.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/tokens:
    post:
      tags:
        - Maps
      summary: Add token to map
      description: |
        Add a new token to the map (DM only). Every field is checked against
        the token schema and stored as parsed: a position keeps only `x` and
        `y`, `rotation` is 0 to 360, the flags are booleans and the ids are
        UUIDs. A `characterId` must name a character of this campaign, or the
        request is refused with 400; a token bound to a character is
        controlled by that character's owner, while the owner is a player of
        this campaign, unless `controlledBy` says otherwise. A character
        owned by the DM or a spectator gives its token no controller.
        `name` and `position` are required, and the position must be on the
        map (`x` at least 0 and less than the map's width, `y` likewise with
        its height; 400 otherwise). The server assigns the token's `id`.

        `imageUrl` takes an asset id or an asset's exact address
        (`/api/assets/<kind>/<id>`); a bare id is stored as
        `/api/assets/tokens/<id>`, and anything else, an outside URL included,
        answers 403. Omitted or empty, the token has no picture and is drawn
        as a placeholder. One naming an existing asset must name one the
        caller can read, or the request answers 403 (the right to read an
        asset follows its use, so storing a reference is checked like reading
        it), unless this campaign already stores that exact address
        somewhere, as a copy of a token, template or creature does. An
        address naming an asset that no longer exists is accepted.

        While anything is in the initiative order it is sent again to every
        connected member (`initiative.state`), since a player's spirit-layer
        token placed on the current map moves them to the spirit plane. No
        map event is sent: other open pages see the new token only on their
        next map update or reload.
      operationId: addToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenInput'
      responses:
        '201':
          description: Token added
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    $ref: '#/components/schemas/Token'
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/tokens/{tokenId}:
    put:
      tags:
        - Maps
      summary: Update token
      description: |
        Update a token. The DM may update any token and any field. A player may
        update only a token that names them in `controlledBy`, and only its
        `position`, `rotation` and `conditions`; every other field, `size` and
        `sightRadius` included, answers 403 for a player. A spectator may not
        update a token at all, even one that still names them from before they
        were demoted. While the session is paused or has ended (campaign status
        `PAUSED` or `INACTIVE`), a player's `position` change answers 403; the
        DM may move tokens at any time. On a map the campaign is not showing, a
        player's update answers 404, as fetching that map does, even for a
        token they control; the DM may update tokens on any map. A token on
        the spirit plane answers 403 (`You cannot interact with spirit layer
        tokens`) for a player who cannot currently see that plane, even one
        that names them in `controlledBy`.

        `imageUrl` takes an asset id or an asset's exact address
        (`/api/assets/<kind>/<id>`); a bare id is stored as
        `/api/assets/tokens/<id>`, and anything else, an outside URL included,
        answers 403. Null or empty removes the picture. One naming an
        existing asset must name one the caller can read, or the request
        answers 403 (the right to read an asset follows its use, so storing a
        reference is checked like reading it), unless this campaign already
        stores that exact address somewhere, as a copy of a token, template
        or creature does. An address naming an asset that no longer exists is
        accepted, and so is the address already stored, sent back unchanged.

        `metadata` is merged into what the token already holds, and the
        merged object must stay within 8 KB. `characterId` cannot be changed
        here.

        The reply is filtered for the caller exactly as `GET /api/campaigns/{campaignId}/maps/{id}`
        is: a player receives only the tokens, and only the fields of each,
        that they may see (see the Token schema), and `token` is null when the
        map would not send them the updated token (hidden, or on the other plane); `fogData` is null for them, and
        `spiritLayerUrl` too unless they can see the spirit layer (crossed over, or
        revealed campaign-wide).

        A request carrying `layer`, `visible` or `controlledBy` can move a
        token's controller between planes, so it sends the initiative order
        again to every connected member (`initiative.state`), each as they
        may see it, whenever anything is in the order, whether or not this
        token is a combatant. Any other update sends the order again only if
        this token is in it. No map event is sent: other open pages see the
        change only on their next map update or reload.
      operationId: updateToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tokenId
          in: path
          required: true
          description: >-
            Not necessarily a UUID. A token's id is whatever is stored for
            it, and an older map can hold ids from before tokens were given
            UUIDs.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                  description: DM only. An empty name is ignored.
                imageUrl:
                  type: string
                  maxLength: 500
                  nullable: true
                  description: DM only.
                position:
                  type: object
                  required: [x, y]
                  description: Grid square, within the map (400 otherwise). Only x and y are stored.
                  properties:
                    x:
                      type: number
                    y:
                      type: number
                size:
                  type: object
                  required: [width, height]
                  description: Grid squares. DM only.
                  properties:
                    width:
                      type: integer
                      minimum: 1
                      maximum: 10
                    height:
                      type: integer
                      minimum: 1
                      maximum: 10
                layer:
                  type: string
                  enum: [token, spirit]
                  description: DM only.
                visible:
                  type: boolean
                  description: DM only.
                controlledBy:
                  type: string
                  format: uuid
                  nullable: true
                  description: >
                    Who controls the token. DM only. Stored as sent: null leaves
                    the token with no controller, and a value must name a player
                    of this campaign (400 otherwise); the character-owner default
                    applies only when the token is created.
                rotation:
                  type: number
                  minimum: 0
                  maximum: 360
                  description: Degrees
                conditions:
                  type: array
                  maxItems: 50
                  items:
                    type: string
                    minLength: 1
                    maxLength: 60
                  description: Each entry is trimmed and must not be blank.
                metadata:
                  type: object
                  description: DM only. Merged into the stored metadata; the result must stay within 8 KB.
                sightRadius:
                  type: number
                  minimum: 0
                  maximum: 200
                  description: Darkvision in grid squares (0 = none). DM only; it decides what the server sends this token's player.
                obscured:
                  type: boolean
                  description: Hide what the token is from players who do not control it. DM only; this route is the only way to change it after creation.
                type:
                  type: string
                  enum: [player, npc, object]
                  description: DM only.
                disposition:
                  type: string
                  enum: [friendly, neutral, hostile]
                  nullable: true
                  description: DM only.
                hp:
                  allOf:
                    - $ref: '#/components/schemas/TokenHp'
                  nullable: true
                  description: DM only.
                showHpBar:
                  type: boolean
                  description: DM only.
                notes:
                  type: string
                  maxLength: 5000
                  nullable: true
                  description: DM only; never sent to a player. Null stores an empty string.
                initiative:
                  type: number
                  nullable: true
                  description: DM only.
                displayMode:
                  type: string
                  enum: [pog, top-down, full-art]
                  description: DM only.
                statBlock:
                  type: object
                  nullable: true
                  description: DM only; never sent to a player.
                creatureTemplateId:
                  type: string
                  format: uuid
                  nullable: true
                  description: DM only.
      responses:
        '200':
          description: Token updated. The token and the map are filtered for the caller as the map fetch is.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    allOf:
                      - $ref: '#/components/schemas/Token'
                    nullable: true
                    description: Null when the map would not send the caller this token (hidden from them, or on the other plane).
                  map:
                    $ref: '#/components/schemas/Map'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Maps
      summary: Delete token
      description: >-
        Remove a token from the map (DM only). If it is a combatant, it
        leaves the initiative order and the order is sent again to every
        connected member (`initiative.state`), even when that empties it.
        Otherwise the order is sent again only while anything is in it, since
        removing a player's spirit-layer token can move them between planes.
        No map event is sent: other open pages see the token go only on their
        next map update or reload.
      operationId: deleteToken
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
          description: >-
            Not necessarily a UUID. A token's id is whatever is stored for
            it, and an older map can hold ids from before tokens were given
            UUIDs.
      responses:
        '200':
          description: Token removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # WALLS, LIGHTS, & FOG
  # Per-map dynamic lighting and fog-of-war state.
  # ============================================

  /api/campaigns/{campaignId}/maps/{id}/tokens/move:
    post:
      tags:
        - Maps
      summary: Move tokens to another map
      description: |
        Move tokens from this map to another map of the campaign in one step
        (DM only). Each token travels as it is stored, under its own id, with
        its position clamped onto the target map, and a combatant keeps its
        place in the initiative order. All named tokens move or none does: an
        id that is not on this map answers 404 (`Token not found on this map:
        <ids>`) and nothing changes, as does a `targetMapId` that is not a map
        of this campaign (`Target map not found in this campaign`).
        `targetMapId` naming the source map itself answers 400. Whichever of
        the two maps the campaign is showing is then sent again to every
        member as `map.changed`, as each may see it; the other stays the DM's
        until they switch. While anything is in the initiative order it is
        sent again too (`initiative.state`), since a spirit-layer token moving
        onto or off the current map can move its controller between planes.
      operationId: moveTokens
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: id
          in: path
          required: true
          description: The map the tokens are on
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - tokenIds
                - targetMapId
              properties:
                tokenIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    type: string
                    minLength: 1
                    maxLength: 100
                    description: Not necessarily a UUID; an older map can hold ids from before tokens were given one.
                targetMapId:
                  type: string
                  format: uuid
                  description: Another map of the same campaign
      responses:
        '200':
          description: Tokens moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  moved:
                    type: array
                    items:
                      $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/maps/{id}/walls:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: List wall segments
      description: Returns all wall segments for the map. Available to the DM for any map, and to other members for the campaign's current map only (404 otherwise).
      operationId: listWalls
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All wall segments on the map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Walls & Lighting
      summary: Replace all wall segments
      description: |
        Replaces the map's entire wall list atomically. DM only. Every
        segment needs a UUID `id`, and a map holds at most 5000; a
        list over that, or any invalid segment, answers 400 and changes
        nothing.

        Each wall route tells connected clients of the change with the event
        the matching socket edit sends (`walls:replaced`, `wall:added`,
        `wall:updated`, `wall:removed`): to every member for the map the
        campaign is showing, and to the DM's connections for any other. On a
        lit map that the campaign is showing, each player is then sent
        `map.changed` with the map as they can now see it, since walls and
        doors decide which tokens a player is sent.
      operationId: replaceWalls
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segments:
                  type: array
                  maxItems: 5000
                  items:
                    $ref: '#/components/schemas/Wall'
              required: [segments]
      responses:
        '200':
          description: Updated wall list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segments:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Walls & Lighting
      summary: Add a wall segment
      description: |
        Append a single wall segment. The server assigns an `id` if the body
        omits one, and keeps one it sent, which must be a UUID. A map holds
        at most 5000 segments; adding to a full map answers 400 with
        `error: Limit Exceeded`. DM only. Connected clients are sent
        `wall:added` (see `replaceWalls`).
      operationId: addWall
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WallInput'
            example:
              x1: 240
              y1: 180
              x2: 400
              y2: 180
              type: wall
      responses:
        '201':
          description: Wall segment created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:
                    $ref: '#/components/schemas/Wall'
                  total:
                    type: integer
                    description: Total wall count after this addition
                    example: 47
        '400':
          description: >-
            Validation failure (`error: Validation Error`), or the map
            already holds 5000 segments (`error: Limit Exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Limit Exceeded
                message: Maximum 5000 wall segments per map
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/walls/{sid}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/WallId'
    delete:
      tags:
        - Walls & Lighting
      summary: Delete a wall segment
      description: Remove a wall segment by id. DM only. Connected clients are sent `wall:removed` (see `replaceWalls`).
      operationId: deleteWall
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Segment deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Wall segment deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
        - Walls & Lighting
      summary: Update a wall segment's type
      description: |
        Change the `type` of a single wall segment, most commonly to open or
        close a door. Only `type` is read; any other field in the body is
        ignored, so the segment keeps its position. `door-locked` is refused
        with 400 here, although `PUT` and `POST` on the wall list and the
        DM's socket `wall:update` event accept it. DM only. Connected clients are
        sent `wall:updated` (see `replaceWalls`).
      operationId: updateWallType
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  enum: [wall, door-closed, door-open, window]
              required: [type]
            example:
              type: door-open
      responses:
        '200':
          description: Updated segment.
          content:
            application/json:
              schema:
                type: object
                properties:
                  segment:
                    $ref: '#/components/schemas/Wall'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lights:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: List light sources
      description: Returns all placed lights on the map. Available to the DM for any map, and to other members for the campaign's current map only (404 otherwise).
      operationId: listLights
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All lights on the map.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lights:
                    type: array
                    items:
                      $ref: '#/components/schemas/LightSource'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags:
        - Walls & Lighting
      summary: Replace all light sources
      description: |
        Replaces the map's entire light list atomically. Used when committing
        a large batch of changes or restoring saved lighting state. DM only.
        Every light needs a UUID `id` and a `dimRadius` at least its
        `brightRadius`, and a map holds at most 200; a list over that, or any
        invalid light, answers 400 and changes nothing.

        Each light route tells connected clients of the change with the event
        the matching socket edit sends (`lights:replaced`, `light:added`,
        `light:updated`, `light:removed`): to every member for the map the
        campaign is showing, and to the DM's connections for any other. On a
        lit map that the campaign is showing, each player is then sent
        `map.changed` with the map as they can now see it, since lights decide
        which tokens a player is sent.
      operationId: replaceLights
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lights:
                  type: array
                  maxItems: 200
                  items:
                    $ref: '#/components/schemas/LightSource'
              required: [lights]
      responses:
        '200':
          description: Updated light list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lights:
                    type: array
                    items:
                      $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags:
        - Walls & Lighting
      summary: Add a light source
      description: >-
        Add a single light. The server assigns an `id` if the body omits
        one, and keeps one it sent, which must be a UUID. `dimRadius` must be
        at least `brightRadius`. A map holds at most 200 lights; adding to a
        full map answers 400 with `error: Limit Exceeded`. DM only. Connected
        clients are sent `light:added` (see `replaceLights`).
      operationId: addLight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LightSourceInput'
            example:
              x: 320
              y: 240
              brightRadius: 4
              dimRadius: 8
              color: '#ffcc66'
              enabled: true
      responses:
        '201':
          description: Light created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  light:
                    $ref: '#/components/schemas/LightSource'
                  total:
                    type: integer
                    description: Total light count after this addition
                    example: 5
        '400':
          description: >-
            Validation failure (`error: Validation Error`), or the map
            already holds 200 lights (`error: Limit Exceeded`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Limit Exceeded
                message: Maximum 200 light sources per map
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lights/{lightId}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
      - $ref: '#/components/parameters/LightId'
    patch:
      tags:
        - Walls & Lighting
      summary: Update a light source
      description: |
        Partially update a light's position, radii, color, or enabled state.
        Send only the fields you want to change. Other fields, `id` included,
        are ignored, and a body with none of these six answers 400 (`At least
        one field must be provided`). `brightRadius` and `dimRadius` are each
        checked against their own limits but not against each other, so a
        patch can leave the light stored with a dim radius smaller than its
        bright radius, which `PUT` and `POST` on the light list refuse. DM
        only. Connected clients are sent `light:updated` (see
        `replaceLights`).
      operationId: updateLight
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                x: { type: number }
                y: { type: number }
                brightRadius: { type: number, minimum: 0, maximum: 100 }
                dimRadius: { type: number, minimum: 0.5, maximum: 100 }
                color:
                  type: string
                  pattern: '^#[0-9a-fA-F]{6}$'
                enabled: { type: boolean }
            example:
              enabled: false
      responses:
        '200':
          description: Updated light.
          content:
            application/json:
              schema:
                type: object
                properties:
                  light:
                    $ref: '#/components/schemas/LightSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
        - Walls & Lighting
      summary: Delete a light source
      description: Remove a light. DM only. Connected clients are sent `light:removed` (see `replaceLights`).
      operationId: deleteLight
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Light deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Light source deleted }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/fog:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    get:
      tags:
        - Walls & Lighting
      summary: Get fog state (DM only)
      description: |
        Returns the full `FogState` for the map, one cell per grid square,
        whether or not fog of war is on for it. A map with no stored fog, or
        whose stored fog no longer matches its `width`, `height` and
        `gridSize`, answers a fresh, fully hidden grid. Players do not see the
        raw fog state; they receive the revealed cells over WebSocket
        (`fog:cells`) as the DM reveals areas. DM only.
      operationId: getFogState
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current fog state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fogState:
                    $ref: '#/components/schemas/FogState'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/fog/operation:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    post:
      tags:
        - Walls & Lighting
      summary: Apply a fog reveal/hide operation
      description: |
        Mutate the fog state by either revealing/hiding a list of cell indices
        (`reveal` / `hide` with `cells: number[]`) or by revealing/hiding the
        entire map (`reveal_all` / `hide_all`). A cell index past the end of
        the grid is ignored. Stored fog that no longer matches the map's grid
        is started again from fully hidden before the operation applies.
        Returns the updated fog state and broadcasts it exactly as the socket
        `fog:operation` event does: `fog:updated` with the whole grid to the
        DM, and `fog:cells` with the revealed cells to every other member,
        for the map the campaign is showing; for any other map, only the DM's
        connections are told. Refused with 409 (`Fog of war is off for this
        map`) while `fogEnabled` is off for the map, before the body is
        checked. DM only.
      operationId: applyFogOperation
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FogOperation'
            examples:
              revealCells:
                summary: Reveal specific cells
                value:
                  op: reveal
                  cells: [0, 1, 2, 50, 51]
              hideAll:
                summary: Re-fog the entire map
                value:
                  op: hide_all
      responses:
        '200':
          description: Updated fog state.
          content:
            application/json:
              schema:
                type: object
                properties:
                  fogState:
                    $ref: '#/components/schemas/FogState'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/maps/{id}/lighting:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/MapId'
    put:
      tags:
        - Walls & Lighting
      summary: Toggle dynamic lighting
      description: |
        Enable or disable dynamic lighting for the map, the same flag as
        `lightingEnabled` on `PUT /api/campaigns/{campaignId}/maps/{id}`. While
        it is on, a player is sent only their own tokens and those their
        tokens can see, judged from the map's walls and lights, and a
        spectator none. Manual fog of war is a separate setting
        (`fogEnabled`). DM only.

        Every request broadcasts `map:settings:updated`, carrying all four
        per-map flags, to every connected member for the map the campaign is
        showing and to the DM's connections for any other. When the flag
        actually changes on the map the campaign is showing, each member is
        also sent the map as they can now see it (`map.changed`), so nothing
        needs a reload; a map that is not being shown gets no `map.changed`.
      operationId: setLightingEnabled
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enabled: { type: boolean }
              required: [enabled]
            example:
              enabled: true
      responses:
        '200':
          description: Updated lighting flag.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lightingEnabled: { type: boolean }
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # CREATURE LIBRARY
  # ============================================

  /api/campaigns/{campaignId}/creatures:
    get:
      tags: [Creatures]
      summary: List creature templates
      description: |
        Returns SRD (global) + this campaign's custom creature templates,
        ordered by name. Supports search, source filter, challenge rating
        filter, game system filter and pagination; the filters combine.
        Campaign DM only (403 for any other member): the library holds stat
        blocks and the DM's homebrew, and the client shows it to the DM alone.
      operationId: listCreatures
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: search
          in: query
          schema:
            type: string
          description: Filter by name (case-insensitive partial match)
        - name: source
          in: query
          schema:
            type: string
            enum: [srd, custom]
          description: Filter by source. Any other value matches nothing.
        - name: cr
          in: query
          schema:
            type: string
          description: Filter by challenge rating, matched exactly (`1/4`, `5`).
        - name: gameSystem
          in: query
          schema:
            type: string
            enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
          description: >-
            Filter by game system. A creature with no system recorded is
            system-agnostic and is always included, regardless of this filter.
            A value outside the enum answers 400.
        - name: limit
          in: query
          description: Clamped into 1-100; 0 or a non-number gives the default.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: A negative value is treated as 0.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Paginated creature list
          content:
            application/json:
              schema:
                type: object
                properties:
                  creatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatureTemplate'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: A `gameSystem` outside the enum.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: 'gameSystem must be one of: DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags: [Creatures]
      summary: Create custom creature
      description: >-
        Create a new campaign-specific custom creature template (DM only),
        with `source: custom`. `imageUrl` is normalised before it is checked
        and stored: a bare asset id becomes `/api/assets/tokens/<id>`, an
        address starting `/api/assets/` is kept, and anything else is
        prefixed with `/api/assets/tokens/`, so an address on another site
        is refused. The result must be an asset's exact address
        (`/api/assets/<kind>/<id>`), and one naming an existing asset must
        name one the caller can read (403 otherwise), unless this campaign
        already stores that exact address somewhere, as a copy of a token,
        template or creature does; an address naming an asset that no longer
        exists is accepted. An empty `imageUrl` means no picture.
      operationId: createCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - statBlock
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Trimmed.
                statBlock:
                  type: object
                  description: >
                    Must have `ac` (integer 0-99), `speed` (string, at most 200
                    characters) and `abilities` with all six scores as
                    integers. Traits, actions, bonus actions, reactions and
                    legendary actions hold at most 50 entries each, with names
                    up to 200 and descriptions up to 5000 characters. Unknown
                    keys are kept.
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                challengeRating:
                  type: string
                  maxLength: 10
                  nullable: true
                creatureType:
                  type: string
                  maxLength: 200
                  nullable: true
                alignment:
                  type: string
                  maxLength: 100
                  nullable: true
                imageUrl:
                  type: string
                  maxLength: 500
                  nullable: true
                size:
                  type: object
                  required: [width, height]
                  description: Defaults to 1 by 1.
                  properties:
                    width:
                      type: integer
                      minimum: 1
                      maximum: 10
                    height:
                      type: integer
                      minimum: 1
                      maximum: 10
                disposition:
                  type: string
                  enum: [hostile, friendly, neutral]
                  default: hostile
                displayMode:
                  type: string
                  enum: [pog, top-down, full-art]
                  default: pog
      responses:
        '201':
          description: Creature template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '400':
          description: >-
            `error` is `Validation Error`; `message` joins every validation
            problem with `; `.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the campaign's DM, or an image the caller may not reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Forbidden
                message: You do not have access to that image

  /api/campaigns/{campaignId}/creatures/{creatureId}:
    get:
      tags: [Creatures]
      summary: Get creature template
      description: Get a single creature template by ID. Campaign DM only. A creature belonging to this campaign, or a global SRD creature; one belonging to another campaign answers 404.
      operationId: getCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Creature template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags: [Creatures]
      summary: Update custom creature
      description: >-
        Update a campaign-specific custom creature template (DM only). A
        field left out keeps its value; `null` clears a nullable one. An SRD
        creature, or a creature of another campaign, answers 403 (not 404,
        unlike the read routes); only an unknown id answers 404. The body is
        validated before the creature is looked up. `imageUrl` is normalised
        and checked as on create, and `""` or `null` clears it; the address
        already stored may be sent back unchanged.
      operationId: updateCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Every field optional, but at least one is required (400 otherwise).
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Trimmed.
                statBlock:
                  type: object
                  description: >
                    Must have `ac` (integer 0-99), `speed` (string, at most 200
                    characters) and `abilities` with all six scores as
                    integers. Traits, actions, bonus actions, reactions and
                    legendary actions hold at most 50 entries each, with names
                    up to 200 and descriptions up to 5000 characters. Unknown
                    keys are kept.
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                challengeRating:
                  type: string
                  maxLength: 10
                  nullable: true
                creatureType:
                  type: string
                  maxLength: 200
                  nullable: true
                alignment:
                  type: string
                  maxLength: 100
                  nullable: true
                imageUrl:
                  type: string
                  maxLength: 500
                  nullable: true
                size:
                  type: object
                  required: [width, height]
                  properties:
                    width:
                      type: integer
                      minimum: 1
                      maximum: 10
                    height:
                      type: integer
                      minimum: 1
                      maximum: 10
                disposition:
                  type: string
                  enum: [hostile, friendly, neutral]
                displayMode:
                  type: string
                  enum: [pog, top-down, full-art]
      responses:
        '200':
          description: Creature template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '400':
          description: >-
            `error` is `Validation Error`; `message` joins every validation
            problem with `; `. An empty body is refused.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: >-
            Not the campaign's DM; an SRD creature ("Cannot edit SRD
            creatures. Duplicate it first to create a custom version."); a
            creature of another campaign; or an image the caller may not
            reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags: [Creatures]
      summary: Delete custom creature
      description: >-
        Delete a campaign-specific custom creature template (DM only). An SRD
        creature, or a creature of another campaign, answers 403; only an
        unknown id answers 404. Everyone's favourites of it are removed with
        it. Tokens already placed from it are not changed.
      operationId: deleteCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Creature deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/{creatureId}/duplicate:
    post:
      tags: [Creatures]
      summary: Duplicate creature
      description: >-
        Duplicate a creature of this campaign, or a global SRD creature, as a
        new custom creature in this campaign (DM only). The copy is named
        `<name> (Custom)`, with `source: custom`, and copies the stat block
        and every other field; an older bare-id
        `imageUrl` is normalised to `/api/assets/tokens/<id>`. A creature
        belonging to another campaign answers 404.
      operationId: duplicateCreature
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Duplicated creature template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatureTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/favorites/list:
    get:
      tags: [Creatures]
      summary: List creature favorites
      description: Returns creature IDs and full creature objects that the current user has favorited in this campaign. Campaign DM only, like the library it belongs to.
      operationId: listCreatureFavorites
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Favorite creature list
          content:
            application/json:
              schema:
                type: object
                properties:
                  favoriteIds:
                    type: array
                    items:
                      type: string
                      format: uuid
                  creatures:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreatureTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/creatures/{creatureId}/favorite:
    post:
      tags: [Creatures]
      summary: Toggle creature favorite
      description: Toggle favorite for the current user in this campaign. Campaign DM only. If already favorited, removes it; otherwise adds it. Only a creature of this campaign or a global SRD creature can be favorited; another campaign's, or an unknown id, answers 404.
      operationId: toggleCreatureFavorite
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: creatureId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Favorite toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  favorited:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/creatures/seed/status:
    get:
      tags: [Creatures]
      summary: Check SRD seed status
      description: >-
        Returns how many SRD and custom creatures are stored, from which a
        client tells whether SRD creatures have been seeded, and whether a
        seed is running on this server. Any campaign member can check (not
        DM-only, unlike the rest of this library).
      operationId: getSrdSeedStatus
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Seed status
          content:
            application/json:
              schema:
                type: object
                properties:
                  srdCount:
                    type: integer
                    description: Creature templates with source 'srd', across the whole instance.
                  customCount:
                    type: integer
                    description: >-
                      Creature templates with source 'custom' that this
                      campaign's library shows: those with no campaign plus
                      this campaign's own.
                  seedInProgress:
                    type: boolean
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/creatures/seed:
    post:
      tags: [Creatures]
      summary: Seed SRD creatures
      description: |
        Fetch SRD creatures from Open5e and populate the library (DM only).
        Safe to call multiple times — existing SRD creatures, matched by name,
        are not duplicated. SRD creatures belong to no campaign, so seeding
        from one campaign fills the library of every campaign on the
        instance. They are stored with `gameSystem: DND_5E`. The request
        waits until seeding finishes.

        Existing SRD creatures stored before hit points were tracked are updated
        in place with `hpMax` / `hitDice`; only those missing keys are added, and
        custom creatures are never modified.

        Returns 409 if seeding is already in progress on this server. A
        creature that fails to insert is logged and left out of every count.
      operationId: seedSrdCreatures
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Seeding complete
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  fetched:
                    type: integer
                    description: Monsters returned by Open5e
                  created:
                    type: integer
                    description: New SRD creatures inserted
                  updated:
                    type: integer
                    description: Existing SRD creatures backfilled with hit points
                  skipped:
                    type: integer
                    description: Existing SRD creatures left unchanged
                  alreadyExisted:
                    type: integer
                    description: SRD creatures already stored before this run
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Seeding already in progress
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Conflict
                message: SRD seeding is already in progress. Please wait.
        '500':
          description: The fetch from Open5e failed, or another error stopped the run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Internal Server Error
                message: Failed to seed SRD creatures. Check that the server can reach api.open5e.com.

  # ============================================
  # TOKEN TEMPLATE ENDPOINTS
  # ============================================

  /api/campaigns/{campaignId}/token-templates:
    get:
      tags: [Token Templates]
      summary: List token templates
      description: >-
        Get this campaign's token templates, ordered by name, with search,
        type filtering and pagination. Campaign DM only: a template carries
        the notes, stat block and hit points the map keeps from players.
      operationId: listTokenTemplates
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: search
          in: query
          description: Filter by name (case-insensitive partial match)
          schema:
            type: string
        - name: type
          in: query
          description: Filter by token type. Any other value is ignored, not refused.
          schema:
            type: string
            enum: [npc, player, object]
        - name: limit
          in: query
          description: Clamped into 1-100; 0 or a non-number gives the default.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: A negative value is treated as 0.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: List of token templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenTemplate'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Token Templates]
      summary: Create token template
      description: >-
        Create a new token template (DM only). An image address on this server
        must be an asset's exact address (`/api/assets/<kind>/<id>`), and one
        naming an existing asset must name one the caller can read (403
        otherwise), unless this campaign already stores that exact address
        somewhere, as a copy of a token, template or creature does; an address
        naming an asset that no longer exists is accepted. `imageUrl` is
        stored exactly as sent, not normalised: a bare asset id is checked as
        that asset, and an address on another site is accepted unchecked.
      operationId: createTokenTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/token-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Token Templates]
      summary: Get token template
      description: >-
        Campaign DM only, like the list. A template of another campaign
        answers 403 ("Token template belongs to another campaign").
      operationId: getTokenTemplate
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Token Templates]
      summary: Update token template
      description: >-
        Update a token template (DM only). A field left out keeps its value.
        An unknown id answers 404 and another campaign's template 403, both
        before the body is validated. An image address on this server must be
        an asset's exact address (`/api/assets/<kind>/<id>`), and one naming
        an existing asset must name one the caller can read (403 otherwise),
        unless this campaign already stores that exact address somewhere, as a
        copy of a token, template or creature does; an address naming an asset
        that no longer exists is accepted. The address already stored may be
        sent back unchanged. `imageUrl` is stored exactly as sent, not
        normalised: a bare asset id is checked as that asset, and an address
        on another site is accepted unchecked.
      operationId: updateTokenTemplate
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateUpdate'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Token Templates]
      summary: Delete token template
      operationId: deleteTokenTemplate
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Template deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/token-templates/from-token:
    post:
      tags: [Token Templates]
      summary: Save token as template
      description: >-
        Create a token template from a map token's properties, sent in the
        body: the server does not read the token, and the body has the same
        fields, rules and defaults as `POST .../token-templates`. An image
        address on this server must be an asset's exact address
        (`/api/assets/<kind>/<id>`), and one naming an existing asset must
        name one the caller can read (403 otherwise), unless this campaign
        already stores that exact address somewhere, as a copy of a token,
        template or creature does; an address naming an asset that no longer
        exists is accepted. `imageUrl` is stored exactly as sent, not
        normalised: a bare asset id is checked as that asset, and an address
        on another site is accepted unchecked.
      operationId: saveTokenAsTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '201':
          description: Template created from token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/token-templates/{id}/copy-to/{targetCampaignId}:
    post:
      tags: [Token Templates]
      summary: Copy template to another campaign
      description: |
        Copy a token template to another campaign as an independent copy
        created by the caller. The authenticated user must be the DM of
        **both** the source and target campaigns; a target they are not DM
        of, including one that does not exist, answers 403. The template's
        picture is checked as a new reference in the target campaign: an
        existing asset the caller cannot read, and the target campaign does
        not already use, answers 403 and nothing is copied.

        Checked in this order: the same campaign as source and target (400);
        DM of the target (403); the template exists (404); it belongs to the
        source campaign (403); the picture (403).
      operationId: copyTokenTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/TemplateId'
        - name: targetCampaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Template copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          description: Cannot copy a template to the same campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The template does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Not Found
                message: Token template not found

  # ============================================
  # CAMPAIGN EXPORT/IMPORT ENDPOINTS
  # ============================================

  /api/campaigns/{campaignId}/export:
    get:
      tags: [Campaign Export/Import]
      summary: Export campaign
      description: |
        Export a campaign as a .cozyvtt ZIP archive (DM only). The archive is
        built in memory and sent whole, with no size limit of its own. It
        holds only the asset files the caller may read; a picture the campaign
        names that the caller cannot read, or that no longer exists, is left
        out, and the map, token, creature or template that used it is imported
        without a picture. Only the API-wide rate limit applies.
      operationId: exportCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: includeAudio
          in: query
          description: Audio files are included only for exactly `true`.
          schema:
            type: boolean
            default: false
        - name: includeTokens
          in: query
          description: Map tokens are left out only for exactly `false`.
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: >-
            ZIP archive, sent with `Content-Disposition: attachment` and a file
            name of the campaign's name (characters other than letters, digits,
            `_` and `-` replaced by `_`, cut to 50) followed by
            `-export.cozyvtt`.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The export failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Export Failed
                message: Failed to export campaign. Please try again.

  /api/campaigns/import/preview:
    post:
      tags: [Campaign Export/Import]
      summary: Preview import archive
      description: >-
        Upload a .cozyvtt archive and return its manifest without creating
        anything. Only `manifest.json` is read and validated. Any signed-in
        user may call it. The upload is one file in the `file` field, at most
        500 MB, accepted when its MIME type is `application/zip`,
        `application/x-zip-compressed` or `application/octet-stream`, or its
        name ends in `.cozyvtt`. The archive must also be no larger than the
        instance's `campaignExportSizeLimit` setting (500 MB unless an admin
        has changed it).
      operationId: previewCampaignImport
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Archive preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    $ref: '#/components/schemas/CampaignImportPreview'
        '400':
          description: >-
            No file (`Validation Error`), a file over 500 MB (`File Too
            Large`), another upload problem such as a refused file type or a
            malformed body (`Upload Error`), or an archive that cannot be read, is over the
            size setting, or has a missing or invalid manifest (`Invalid
            Archive`, with the reason in `message`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/campaigns/import:
    post:
      tags: [Campaign Export/Import]
      summary: Import campaign
      description: |
        Upload a .cozyvtt archive and create a new campaign from it. Any
        signed-in user may call it; they become the new campaign's owner and
        DM. The upload rules are those of the preview route, and the
        `campaignExportSizeLimit` setting bounds both the archive and the
        total size of the files read out of it. Only the API-wide rate limit
        applies.

        The campaign starts in PREPARATION with the first imported map as its
        current map. Assets whose content does not match their declared type,
        and maps, creatures or templates that fail validation, are skipped.
        Imported tokens are linked to no character and controlled by no one.

        The import is not one transaction. A failure after the campaign has
        been created answers 400 and leaves the partly imported campaign in
        place.
      operationId: importCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                campaignName:
                  type: string
                  minLength: 1
                  maxLength: 200
                  description: Replaces the archive's campaign name. Trimmed, then 1 to 200 characters.
                importTokens:
                  type: string
                  enum: ['true', 'false']
                  default: 'true'
                  description: Map tokens are left out only for exactly `false`.
      responses:
        '201':
          description: Campaign imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaignId:
                    type: string
                    format: uuid
                  campaignName:
                    type: string
                  mapCount:
                    type: integer
                    description: The count the archive's manifest declares, including any map that was skipped.
                  tokenCount:
                    type: integer
                  creatureCount:
                    type: integer
                  tokenTemplateCount:
                    type: integer
        '400':
          description: >-
            The upload errors of the preview route, a `campaignName` out of
            range (`Validation Error`), or any failure while importing
            (`Import Failed`, with the reason in `message`). Every import
            failure, including a database error, answers 400.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # ADMIN ENDPOINTS
  # ============================================

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Get system statistics
      description: Returns aggregate counts for users, campaigns, characters, maps, and asset storage broken down by type.
      operationId: adminGetStats
      security:
        - cookieAuth: []
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  userCount:
                    type: integer
                  campaignCount:
                    type: integer
                  activeCampaignCount:
                    type: integer
                  totalStorageBytes:
                    type: integer
                  activeSessionCount:
                    type: integer
                  sessionCount:
                    type: integer
                  characterCount:
                    type: integer
                  mapCount:
                    type: integer
                  assetBreakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT, OTHER]
                        count:
                          type: integer
                        sizeBytes:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/settings:
    get:
      tags: [Admin]
      summary: Get system settings
      operationId: adminGetSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current system settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      id:
                        type: string
                      setupCompleted:
                        type: boolean
                      instanceName:
                        type: string
                      timezone:
                        type: string
                      allowRegistration:
                        type: boolean
                      requireAdminApproval:
                        type: boolean
                      themeId:
                        type: string
                      customThemeColors:
                        type: object
                        nullable: true
                        description: Map of theme token name to colour string, stored as the PUT request sent it.
                        additionalProperties:
                          type: string
                      fontId:
                        type: string
                      customLogoUrl:
                        type: string
                        nullable: true
                      customFaviconUrl:
                        type: string
                        nullable: true
                      customMascotUrl:
                        type: string
                        nullable: true
                      campaignExportSizeLimit:
                        type: integer
                        description: Largest campaign archive accepted on import, in bytes. Exports are not limited by it. Not changeable through this route.
                      createdAt:
                        type: string
                        format: date-time
                      updatedAt:
                        type: string
                        format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Admin]
      summary: Update system settings
      description: |
        Every field is optional; only the ones present are changed. `instanceName`,
        `timezone`, `themeId` and `fontId` are trimmed, stripped of `<` and `>`, then cut
        to their max length rather than rejected for being too long. `customThemeColors`
        is stored exactly as sent, with no validation of its keys or values.

        `customLogoUrl`, `customFaviconUrl` and `customMascotUrl` name a file this
        instance serves: `""` or `null` clears the override back to the default, and
        anything else must be a same-origin path starting with a single `/` (no scheme,
        no `//`, no backslash, no control characters) or the request answers 400. These
        images themselves are not uploaded here — replace the files in
        `frontend/public/` and rebuild to change what the path points at.
      operationId: adminUpdateSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceName:
                  type: string
                  maxLength: 100
                timezone:
                  type: string
                  maxLength: 50
                allowRegistration:
                  type: boolean
                requireAdminApproval:
                  type: boolean
                themeId:
                  type: string
                  maxLength: 50
                customThemeColors:
                  type: object
                  additionalProperties:
                    type: string
                fontId:
                  type: string
                  maxLength: 50
                customLogoUrl:
                  type: string
                  nullable: true
                  description: Same-origin path, or "" or null to clear.
                customFaviconUrl:
                  type: string
                  nullable: true
                  description: Same-origin path, or "" or null to clear.
                customMascotUrl:
                  type: string
                  nullable: true
                  description: Same-origin path, or "" or null to clear.
      responses:
        '200':
          description: Settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  settings:
                    type: object
                    description: The full settings object, in the same shape as GET /api/admin/settings returns.
        '400':
          description: A branding URL was not a same-origin path
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/activity:
    get:
      tags: [Admin]
      summary: Get system activity
      description: |
        Returns currently-online users, recent admin actions (SystemLog), the 50 newest
        accounts, and the 20 most recent game sessions. "Online" means the user holds an
        unexpired row in the session table — up to 30 days away if they signed in with
        "remember me" — not that a socket is currently connected.
      operationId: adminGetActivity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: System activity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineUsers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        displayName:
                          type: string
                        platformRole:
                          type: string
                        lastLoginAt:
                          type: string
                          nullable: true
                        sessionExpiry:
                          type: string
                          nullable: true
                  recentLogs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        level:
                          type: string
                          enum: [INFO, WARNING, ERROR, CRITICAL]
                        message:
                          type: string
                        userId:
                          type: string
                          nullable: true
                        context:
                          type: object
                          nullable: true
                        createdAt:
                          type: string
                  recentUsers:
                    type: array
                    description: The 50 newest accounts. A select of seven fields, not the full User object.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        displayName:
                          type: string
                        platformRole:
                          type: string
                          enum: [ADMIN, USER]
                        mfaEnabled:
                          type: boolean
                        createdAt:
                          type: string
                          format: date-time
                        lastLoginAt:
                          type: string
                          format: date-time
                          nullable: true
                  recentSessions:
                    type: array
                    description: The 20 most recently started game sessions, newest first.
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        campaignId:
                          type: string
                        sessionNumber:
                          type: integer
                        startedAt:
                          type: string
                          format: date-time
                        endedAt:
                          type: string
                          format: date-time
                          nullable: true
                        savedState:
                          type: object
                          nullable: true
                          description: Token positions, map state and the like, as the session left them.
                        notes:
                          type: string
                          nullable: true
                        campaign:
                          type: object
                          properties:
                            id:
                              type: string
                            name:
                              type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/config:
    get:
      tags: [Admin]
      summary: Get server configuration
      description: Returns read-only server configuration — upload size limits, session timeouts, and SMTP status (no credentials exposed).
      operationId: adminGetConfig
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Server configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadLimits:
                    type: object
                    properties:
                      MAP:
                        type: integer
                        description: Max file size in bytes
                      TOKEN:
                        type: integer
                      AUDIO:
                        type: integer
                      AVATAR:
                        type: integer
                      DOCUMENT:
                        type: integer
                  sessionTimeoutMs:
                    type: integer
                  rememberMeTimeoutMs:
                    type: integer
                  smtp:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      host:
                        type: string
                        nullable: true
                      port:
                        type: integer
                      user:
                        type: string
                        nullable: true
                      secure:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users:
    post:
      tags: [Admin]
      summary: Create a new user
      description: |
        Creates a user with a generated temporary password. The account is flagged
        `mustChangePassword`, so that password can only be used to set a real one — every
        other endpoint returns 403 `PASSWORD_CHANGE_REQUIRED` until it is replaced.

        When SMTP is configured the credentials are emailed and `temporaryPassword` is
        **withheld** from the response; it is returned only when the email could not be
        sent, so the admin never holds a working credential unnecessarily. To create an
        account without any password at all, use `/api/admin/users/invite`.

        `displayName` defaults to the part of the email before `@` when omitted, is
        trimmed and stripped of `<` and `>`, then cut to 50 characters rather than
        rejected for being too long. `platformRole` is not validated against the enum:
        any value other than exactly `"ADMIN"`, including an unrecognised string,
        becomes `USER`.
      operationId: adminCreateUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  maxLength: 50
                platformRole:
                  type: string
                  enum: [USER, ADMIN]
                  default: USER
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  emailSent:
                    type: boolean
                    description: Whether the welcome email with the credentials was delivered
                  temporaryPassword:
                    type: string
                    description: >-
                      One-time temporary password. Present ONLY when emailSent is false —
                      share it securely; it is not retrievable afterwards.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use

  /api/admin/users/invite:
    post:
      tags: [Admin]
      summary: Invite a user by email
      description: |
        Creates an account with **no usable password** and emails the new user a link to
        choose one. The link expires in 7 days and is the only way into the account, so
        no credential is ever returned or shown to the inviting admin.

        Requires SMTP. If the invitation cannot be delivered the account is rolled back
        rather than left unreachable.

        The recipient completes setup at `/accept-invite?token=…`, which submits to
        `POST /api/auth/reset-password` — invitations and password resets share the same
        token machinery.

        `displayName` and `platformRole` are handled exactly as in `POST /api/admin/users`:
        the name is cut to 50 characters rather than rejected, and any `platformRole`
        other than exactly `"ADMIN"` becomes `USER`.
      operationId: adminInviteUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  maxLength: 50
                platformRole:
                  type: string
                  enum: [USER, ADMIN]
                  default: USER
      responses:
        '201':
          description: Invitation sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  expiresInDays:
                    type: integer
                    example: 7
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use
        '502':
          description: The invitation email could not be delivered; no account was created
        '503':
          description: SMTP is not configured on this instance

  /api/admin/users/{id}/resend-invite:
    post:
      tags: [Admin]
      summary: Resend an invitation
      description: |
        Issues a fresh invitation link and invalidates any outstanding one. Useful when the
        original expired or never arrived. Requires SMTP. Works for any existing account,
        not only one that was originally created through `/api/admin/users/invite` — it
        sets a usable password-reset token regardless of how the account was created.
      operationId: adminResendInvite
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation resent
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  expiresInDays:
                    type: integer
                    example: 7
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: The invitation email could not be sent
        '503':
          description: SMTP is not configured on this instance

  /api/admin/users/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending user registration
      description: Approves a user who registered while `requireAdminApproval` was enabled. Blocked users receive a 403 on login until approved.
      operationId: adminApproveUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User approved
        '400':
          description: User is already approved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users/{id}/reset-mfa:
    post:
      tags: [Admin]
      summary: Reset MFA for a locked-out user
      description: >-
        Disables TOTP and clears backup codes for a user who is locked out, turning MFA
        off for the account. This does not force the user to re-enroll: they sign in
        with just their password next time, and MFA stays off until they set it up
        again themselves.
      operationId: adminResetUserMfa
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MFA reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: MFA is not enabled for this user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/smtp/test:
    post:
      tags: [Admin]
      summary: Send a test email to verify SMTP configuration
      operationId: adminTestSmtp
      description: Sends a test email to the calling admin's own email address. Returns 400 if SMTP is not configured via environment variables.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Test email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: SMTP is not configured (missing env vars)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Failed to send email (SMTP connection error)

  /api/admin/backups:
    post:
      tags: [Admin]
      summary: Create a backup archive
      operationId: adminCreateBackup
      description: |
        Platform ADMIN only. Writes `backup-YYYY-MM-DDTHH-MM-SS.zip` (with a `-2`, `-3`
        suffix while that name is taken, so two backups asked for in the same
        second are both kept) to the server's backup directory (`backend/backups/` on the host under Docker, `BACKUP_DIR`
        on an install without Docker), holding `database.sql`, a `pg_dump` of the
        database without its ownership and privilege statements and without the
        login sessions, and the `uploads/` tree. Needs `pg_dump` in the backend
        image, which the Docker image provides; answers 500 when it is missing or
        the dump fails. The archive can be fetched with the download route and
        loaded back with the restore route.
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  filename:
                    type: string
                  sizeBytes:
                    type: integer
                  createdAt:
                    type: string
                    format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: pg_dump not found or backup failed
    get:
      tags: [Admin]
      summary: List database backups
      operationId: adminListBackups
      description: Returns the backup archives (`backup-YYYY-MM-DDTHH-MM-SS.zip`, or the same with a `-2`, `-3` suffix) in the server's backup directory with filename, size and creation time, newest first. A backup is written under a temporary name and appears only once it is complete; an unfinished one left by a backend stopped partway through is deleted when the list is read. A backup directory that cannot be read answers 500, not an empty list.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        sizeBytes:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: The backup directory could not be read (error `Backup Failed`; the message names the directory)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/admin/backups/{filename}/download:
    get:
      tags: [Admin]
      summary: Download a backup file
      operationId: adminDownloadBackup
      description: Streams a backup `.zip` (the database dump and every uploaded file) as a download. Filename is strictly validated against the `backup-YYYY-MM-DDTHH-MM-SS.zip` pattern (an optional `-2`, `-3` suffix included) to prevent path traversal.
      security:
        - cookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: backup-2026-03-04T10-30-00.zip
      responses:
        '200':
          description: Backup file download
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filename format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/backups/{filename}:
    delete:
      tags: [Admin]
      summary: Delete a backup file
      operationId: adminDeleteBackup
      description: Deletes a backup `.zip` from the server. Filename is strictly validated. Action is logged to SystemLog.
      security:
        - cookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backup deleted
        '400':
          description: Invalid filename format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# WebSocket events are not described here. Their reference is
# backend/docs/WEBSOCKET_DOCUMENTATION.md, whose event table is generated from
# the handlers by scripts/websocket-events.py.

  # ---------------------------------------------------------------------------
  # Shared character sheets ("character templates")
  #
  # Server-wide starter sheets any signed-in user can copy. Creating, editing and
  # deleting one requires the `templateEditor` flag on the user, or platform
  # ADMIN. That check reads the database rather than the session, because
  # templateEditor is not carried in the session.
  # ---------------------------------------------------------------------------
  /api/character-templates:
    get:
      tags: [Character Templates]
      summary: List shared character sheets
      description: >-
        Every template is visible to every signed-in user. Sorted by name,
        A to Z, and paged with `limit` and `offset`; `total` counts every
        match. A `gameSystem` value that is neither `flexible` nor a known
        game system answers 400.
      operationId: listCharacterTemplates
      security:
        - cookieAuth: []
      parameters:
        - name: search
          in: query
          description: Case-insensitive substring match on the template's name.
          schema:
            type: string
        - name: gameSystem
          in: query
          description: '`flexible` selects the system-agnostic templates (stored with a null gameSystem); otherwise a GameSystem value.'
          schema:
            type: string
            enum: [flexible, DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
        - name: mine
          in: query
          description: '`true` limits the list to templates the caller authored.'
          schema:
            type: string
            enum: ['true']
        - name: limit
          in: query
          description: Values above 100 are treated as 100 and negative values as 1; `0` or a non-number gives the default.
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
        - name: offset
          in: query
          description: A negative value or a non-number is treated as 0.
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: Matching templates, with the `limit` and `offset` actually applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        gameSystem:
                          type: string
                          enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                          nullable: true
                        tokenImageUrl: { type: string, nullable: true }
                        data:
                          type: object
                          description: The sheet.
                        createdById: { type: string, format: uuid, nullable: true }
                        createdBy:
                          type: object
                          nullable: true
                          properties:
                            id: { type: string, format: uuid }
                            displayName: { type: string }
                        createdAt: { type: string, format: date-time }
                        updatedAt: { type: string, format: date-time }
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer
        '400':
          description: A `gameSystem` that is neither `flexible` nor a known game system.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: Validation Error
                message: 'gameSystem must be one of: DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E, flexible'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Character Templates]
      summary: Publish a shared character sheet
      description: >-
        Any signed-in user may publish a template, and becomes its author.
        `name` is trimmed, 1 to 200 characters. `description` is trimmed, up
        to 2000 characters. When `gameSystem` is given, `data` must pass that
        system's sheet schema (an omitted `data` is checked as `{}` and so
        fails), but `data` is stored exactly as sent, so fields the schema
        does not declare are kept; the template is not stored as the schema's
        parsed output. Without a `gameSystem`, `data` is free-form and an
        omitted one is stored as `{}`. A `tokenImageUrl`, when given, must be
        an existing GLOBAL-scoped asset, named by its bare id (stored as
        `/api/assets/tokens/<id>`) or by its exact address
        (`/api/assets/<kind>/<id>`, with nothing after the id); anything else
        answers 400. An empty string or null leaves the template without an
        image.
      operationId: createCharacterTemplate
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  nullable: true
                  maxLength: 2000
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                data:
                  type: object
                  description: The sheet. Free-form when gameSystem is null.
                tokenImageUrl:
                  type: string
                  nullable: true
                  maxLength: 500
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  name: { type: string }
                  description: { type: string, nullable: true }
                  gameSystem:
                    type: string
                    enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                    nullable: true
                  tokenImageUrl: { type: string, nullable: true }
                  data:
                    type: object
                    description: The sheet, stored exactly as sent.
                  createdById: { type: string, format: uuid, nullable: true }
                  createdBy:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      displayName: { type: string }
                  createdAt: { type: string, format: date-time }
                  updatedAt: { type: string, format: date-time }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

