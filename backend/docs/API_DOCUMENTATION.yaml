openapi: 3.0.3
info:
  title: CozyVTT Backend Route Reference
  description: |
    The HTTP routes CozyVTT's own web client calls, described for people working
    on CozyVTT itself.

    ## No stability guarantee
    This is an internal surface, not a public API. It is **not versioned**, it
    carries **no compatibility promise**, and any route here may change shape or
    disappear in a point release without notice or a deprecation period.

    There are no API keys, no bearer tokens and no service accounts. The only
    credential is the session cookie described below — but a program can obtain
    one exactly as the web client does, by posting a user's own email and
    password to `/api/auth/login` and keeping the cookie it returns. That cookie
    also authenticates the Socket.io connection, which shares the same session.

    So scripting CozyVTT is possible, and people have done it. What it does not
    come with is a promise: a script authenticates **as a specific user** and can
    do only what that user could do in the browser, the session expires after an
    hour of inactivity by default (`SESSION_MAX_AGE`; 30 days when signing in
    with `rememberMe`), an account with MFA enabled needs
    the second step, and any route here may change shape in a point release
    without notice. Treat this document as a map of the current code rather than
    a contract.

    ## Authentication
    All endpoints (except `/health`, `/api/setup/*`, `/api/config` and the public auth routes) require authentication via session cookies.
    Login via `/api/auth/login` to obtain a session cookie.

    Until the setup wizard has run, every request except `/health` and
    `/api/setup/*` is refused with 403
    `{ error: 'Setup Required', message, setupUrl: '/api/setup/status' }`,
    the public routes included.

    A request that changes something (POST, PUT, PATCH or DELETE) and that a
    browser marks as sent from another site (`Sec-Fetch-Site` of `same-site`
    or `cross-site`, which includes another port of the same host) is refused
    with 403 unless its `Origin` is exactly `CORS_ORIGIN`. A client that is not
    a browser sends no such header and is unaffected. Request bodies are JSON;
    a form-encoded body is not read.

    ## MFA Flow
    If a user has MFA enabled, `/api/auth/login` returns `{ mfaRequired: true }` instead of a full session.
    The client must then call `/api/auth/mfa/verify-login` with a TOTP code or backup code to complete authentication.

    ## Authorization
    - **Platform roles**: `ADMIN` (full system access), `USER` (campaign access)
    - **Campaign roles**: `DM` (full campaign control), `PLAYER` (limited interaction), `SPECTATOR` (watches, chats and pings; keeps their own notes and dice macros; cannot roll dice or initiative, move or edit tokens, or edit a character)

    ## Rate Limiting
    The HTTP limits are counted per client address as the backend sees it: the
    last address in `X-Forwarded-For`, since the backend trusts one proxy. The
    bundled nginx puts the visitor's own address there, taken from a tunnel or
    proxy in front of it only when that connects from a private address. Behind
    a proxy that does not pass the visitor's address on, every client shares one
    allowance. Uploads and the WebSocket limits are counted per user.
    - Global API limit: 300 requests per minute (all `/api/*` routes; configurable via `RATE_LIMIT_MAX_REQUESTS`)
    - Credential endpoints (`POST /api/auth/login`, `/reset-password`, `/mfa/setup`,
      `/mfa/disable` and `/mfa/backup-codes`): one shared allowance of 5 **failed**
      requests per 15 minutes. Successful requests are not counted, so getting your
      password right never moves you towards a lockout.
    - `POST /api/auth/register`: 10 requests per hour, counted whether or not
      they succeed, since creating the account is what is being limited
    - `POST /api/auth/forgot-password`: 5 requests per 15 minutes, counted whether
      or not they succeed. That endpoint answers identically for a known and an
      unknown address, so successes cannot be skipped without removing the limit
      on the mail it sends
    - MFA setup verification (`POST /api/auth/mfa/verify`): 5 failed attempts per 15 minutes
    - MFA login verification (`POST /api/auth/mfa/verify-login`): 5 failed attempts
      per 15 minutes per address, and separately 5 failed attempts per 15 minutes
      for the account, from any address
    - Asset uploads, typed documents and Universal VTT imports (`POST /api/assets/upload`,
      `POST /api/assets/documents`, `POST /api/campaigns/{campaignId}/maps/import-uvtt`):
      30 requests per minute per user (configurable via `ASSET_UPLOAD_RATE_LIMIT`)
    - Chat messages (WebSocket): none unless the DM turns on the campaign's chat
      cooldown (off by default), which allows each member one message per 1 to
      300 seconds, as the DM sets it
    - Dice rolls: 30 per minute (WebSocket)
    - Token movement: 150 events per second per user (WebSocket), shared by
      `token.move.start`, `token.move` and `token.move.end`; events over the limit
      are dropped without an error

    Rate-limited responses return HTTP 429 with `RateLimit-*` standard headers.
    The body is JSON `{ error, message }` for the global limit, uploads and the
    MFA limits. The credential, registration and forgot-password limits answer
    with a plain-text message instead.

    ## Responses every route can give
    These are not repeated on each operation:
    - **401** `{ error: 'Unauthorized', message }` from any route that needs a
      session, when there is none or when the MFA step of a sign-in is still
      pending.
    - **403** `{ error: 'Forbidden', message: 'You are not a member of this campaign' }`
      from any `/api/campaigns/{campaignId}/...` route that needs membership,
      including for a campaign id that does not exist. Such routes never answer
      404 for an unknown campaign.
    - **403** with `code: PASSWORD_CHANGE_REQUIRED`, and the setup-gate 403, as
      described above.
    - **413** `{ error: 'Payload Too Large' }` for a JSON body over 1 MB, and
      **400** `{ error: 'Bad Request' }` for a body that is not valid JSON.
    - **500** `{ error, message }` on an unexpected error. In production the
      message does not describe the failure.

    ## Forced password changes
    Accounts an admin created, or whose password an admin reset, are flagged
    `mustChangePassword`. Until a new password is set, every endpoint except
    `POST /api/auth/change-password`, `POST /api/auth/logout`, `GET /api/auth/me`,
    `GET /api/auth/ping`, `GET /api/auth/appearance` and `GET /api/config` returns
    HTTP 403 with `code: PASSWORD_CHANGE_REQUIRED`. WebSocket connections are refused
    on the same basis. Clients should route on `code` rather than the message.

    ## Real-time Events
    Real-time campaign features (token movement, dice, chat, initiative, etc.) use Socket.io.
    The event reference is `backend/docs/WEBSOCKET_DOCUMENTATION.md`.

  version: 1.5.0
  contact:
    name: CozyVTT
    url: https://cozyvtt.com
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://vtt.example.com
    description: Your instance's address. Every path below already starts with /api.
  - url: http://localhost:4000
    description: Local development (the backend's own port)

# Default security — every endpoint requires the session cookie unless it
# explicitly overrides with `security: []` (used for public endpoints like
# /health, /api/setup/*, and the unauthenticated auth routes).
security:
  - cookieAuth: []

tags:
  - name: Health
    description: System health checks
  - name: Setup
    description: Initial system setup wizard
  - name: Authentication
    description: User authentication, password reset, and session management
  - name: MFA
    description: Multi-Factor Authentication (TOTP + backup codes)
  - name: Users
    description: User management endpoints
  - name: Campaigns
    description: Campaign management
  - name: Sessions
    description: Game session lifecycle management
  - name: Characters
    description: Character creation and management
  - name: Assets
    description: File upload and asset management
  - name: Maps
    description: Map management and token manipulation
  - name: Creatures
    description: Creature template library — SRD and custom creatures, favorites, seeding
  - name: Token Templates
    description: Reusable token configurations savable per-campaign and copyable across campaigns the DM owns
  - name: Walls & Lighting
    description: Per-map wall segments, light sources, and fog-of-war state (DM-only writes)
  - name: Invitations
    description: Campaign invitation lifecycle (send, list, accept, decline)
  - name: Campaign Export/Import
    description: Export and import campaigns as portable `.cozyvtt` archives
  - name: Messages
    description: Chat message history
  - name: Documents
    description: PDF, text and Markdown files uploaded as assets, shared with a campaign by its DM and read inline
  - name: Dice Macros
    description: A player's own saved dice rolls for one campaign, private to whoever saved them
  - name: Admin
    description: Admin-only platform management endpoints (requires ADMIN platform role)
  - name: Notes
    description: A member's own private notes in a campaign
  - name: Character Templates
    description: Shared starter character sheets any signed-in user can copy

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API server is running. Accessible before setup.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time
                  services:
                    type: object
                    properties:
                      api: { type: string, example: ok }
                      database: { type: string, example: ok }
        '503':
          description: 'The database cannot be reached; the body carries `status: degraded`'

  # ============================================
  # CLIENT CONFIG
  # ============================================

  /api/config:
    get:
      tags:
        - Health
      summary: Get public client configuration
      description: |
        Public endpoint — returns the upload size limits the server enforces,
        derived from the `MAX_<TYPE>_SIZE_MB` environment variables. The SPA is
        built ahead of time, so it reads the limits from here at runtime rather
        than baking them into the bundle. No authentication required.
      operationId: getClientConfig
      security: []
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadLimits:
                    type: object
                    description: Maximum upload size in bytes, per asset type
                    properties:
                      MAP:
                        type: integer
                      TOKEN:
                        type: integer
                      AUDIO:
                        type: integer
                      AVATAR:
                        type: integer
                      DOCUMENT:
                        type: integer
                  maxUploadBytes:
                    type: integer
                    description: Largest configured limit — the cap enforced before the asset type is known
              example:
                uploadLimits:
                  MAP: 52428800
                  TOKEN: 5242880
                  AUDIO: 20971520
                  AVATAR: 2097152
                  DOCUMENT: 52428800
                maxUploadBytes: 52428800

  # ============================================
  # SETUP
  # ============================================

  /api/setup/status:
    get:
      tags:
        - Setup
      summary: Check setup status
      description: Check if the system setup wizard needs to be run. Accessible before setup.
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupCompleted:
                    type: boolean
                  hasUsers:
                    type: boolean
                  needsSetup:
                    type: boolean

  /api/setup/init:
    post:
      tags:
        - Setup
      summary: Initialize system
      description: Create first admin account and complete setup wizard. Only works if setup is not yet complete.
      operationId: initializeSystem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                displayName:
                  type: string
                instanceName:
                  type: string
                  maxLength: 100
                  default: CozyVTT
                  description: >-
                    Shown in browser tabs and page titles. Blank, missing or
                    non-string values leave the default in place rather than
                    failing setup, which can only be run once.
                timezone:
                  type: string
                  maxLength: 50
                  default: UTC
                  description: IANA timezone name, used for timestamps.
                allowRegistration:
                  type: boolean
                  default: false
                  description: >-
                    Whether people may create their own accounts. Changeable
                    afterwards from Admin → Settings.
      responses:
        '201':
          description: Setup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================
  # AUTHENTICATION
  # ============================================

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account. First user automatically becomes ADMIN. Rate limited (5/15min).
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Trimmed, and angle brackets removed, before the length is checked. Anything else, including a value that is not a string, is refused with 400.
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticate user and create session. Rate limited (5/15min).
        If MFA is enabled, returns `{ mfaRequired: true }` and the client must call `/api/auth/mfa/verify-login`.
        If `mustChangePassword` is true in response, frontend should redirect to password change.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                rememberMe:
                  type: boolean
                  default: false
                  description: Extends session to 30 days
            example:
              email: dm@example.com
              password: hunter2-correct-horse-battery
              rememberMe: true
      responses:
        '200':
          description: Login successful (or MFA required)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                      mustChangePassword:
                        type: boolean
                  - type: object
                    properties:
                      mfaRequired:
                        type: boolean
                        example: true
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Destroy session and clear cookie
      operationId: logoutUser
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get currently authenticated user from session
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Request a password reset email. Always returns 200 regardless of whether the email exists (prevents enumeration).
        If SMTP is not configured, returns a message to contact the administrator.
        For a known address, the account's earlier unused links (a pending invitation included) stop working, so only the newest one does.
        Rate limited (5/15min).
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Response (always 200 to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: Reset password using a valid token from a password reset email or invitation. Token must not be expired or used. A token sets the password once, even when two requests carry it at the same moment, and using it voids the account's other unused tokens. Rate limited (5/15min).
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  format: uuid
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change own password
      description: Change password for the authenticated user. Requires current password verification. Sets mustChangePassword to false. Ends the user's other login sessions; the session making the request stays signed in. Voids the user's unused password-reset and invitation links.
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # MFA
  # ============================================

  /api/auth/mfa/setup:
    post:
      tags:
        - MFA
      summary: Begin MFA setup
      description: Generate TOTP secret and QR code for authenticator app. User must not already have MFA enabled. Requires the current password, so a session alone cannot enrol an authenticator. Rate limited (5 failures/15min).
      operationId: mfaSetup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
                  description: The user's current password
      responses:
        '200':
          description: MFA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  qrCodeUrl:
                    type: string
                    description: Data URL of QR code image
                  secret:
                    type: string
                    description: TOTP secret for manual entry
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Not authenticated, or the password is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/verify:
    post:
      tags:
        - MFA
      summary: Complete MFA setup
      description: Verify TOTP code to complete MFA setup. Generates 10 backup codes (shown only once). Ends the user's other login sessions; the session making the request stays signed in. The code counts as used, so it cannot then sign in. Rate limited (5/15min).
      operationId: mfaVerifySetup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code from authenticator app
      responses:
        '200':
          description: MFA enabled, backup codes returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
                    description: 10 backup codes in XXXX-XXXX format (shown only once)
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/verify-login:
    post:
      tags:
        - MFA
      summary: Verify MFA during login
      description: |
        Complete MFA verification during login flow. Requires a pending MFA session from `/api/auth/login`.
        Accepts either a TOTP token or a backup code (not both). Backup codes are consumed on use, exactly once even when two requests carry the same code; the second is answered 401.
        A TOTP code is accepted once: one from the same 30-second step as a code already accepted for the account, or an earlier step, is refused.
        Rate limited (5 failures/15min per address, separate from setup verification, and 5 failures/15min per account from any address).
      operationId: mfaVerifyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code
                backupCode:
                  type: string
                  description: Backup code in XXXX-XXXX format
      responses:
        '200':
          description: MFA verified, fully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  mustChangePassword:
                    type: boolean
                  backupCodeUsed:
                    type: boolean
                  remainingBackupCodes:
                    type: integer
                  warning:
                    type: string
                    description: Warning when backup codes are running low (<=3)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/disable:
    post:
      tags:
        - MFA
      summary: Disable MFA
      description: Disable MFA for the authenticated user. Requires current password and a valid TOTP code not already used. Admin accounts cannot disable MFA. Ends the user's other login sessions; the session making the request stays signed in.
      operationId: mfaDisable
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - token
              properties:
                password:
                  type: string
                token:
                  type: string
                  description: 6-digit TOTP code
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin accounts cannot disable MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/backup-codes:
    post:
      tags:
        - MFA
      summary: Regenerate backup codes
      description: Generate new set of 10 backup codes. Requires current password. Replaces all existing codes.
      operationId: mfaRegenerateBackupCodes
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: New backup codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/account:
    delete:
      tags:
        - Authentication
      summary: Delete own account
      description: |
        Self-service permanent account deletion. Requires the current
        password as confirmation. Deletes the user's memberships, characters,
        personal notes and dice macros. Their chat messages, dice rolls and
        uploaded assets stay, with the user field set to null, and documents
        they shared into a campaign stay shared (the share passes to the
        campaign's DM, or its owner). A campaign the
        user owns passes to its sitting DM; while the user is that DM the
        deletion is refused with 409 and nothing changes.
      operationId: deleteOwnAccount
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  description: Current password (for confirmation)
              required: [password]
            example:
              password: hunter2-correct-horse-battery
      responses:
        '200':
          description: Account deleted; every login session of the account ended, on every device.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Account deleted successfully }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Either not authenticated, or password did not match. The error message
            distinguishes the two cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The caller is the instance's only admin (another user has to be promoted
            to admin first), or runs a campaign they own (the message names it).
            Nothing was changed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/registration-status:
    get:
      tags:
        - Authentication
      summary: Get registration availability
      description: |
        Public endpoint — returns whether public self-registration is currently
        enabled on this instance. Used by the frontend to show/hide the register
        link on the login page. No authentication required.
      operationId: getRegistrationStatus
      security: []
      responses:
        '200':
          description: Registration status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowRegistration:
                    type: boolean
                    description: |
                      `true` if anonymous users may register accounts via
                      `/api/auth/register`. `false` means an admin must
                      manually create accounts.
              example:
                allowRegistration: true

  /api/auth/appearance:
    get:
      tags:
        - Authentication
      summary: Get instance appearance settings
      description: |
        Public endpoint — returns the instance's theme, font, and branding
        URLs. The frontend calls this on every page load so the login and
        setup pages can paint with the correct theme before authentication.
        No authentication required.
      operationId: getAppearanceSettings
      security: []
      responses:
        '200':
          description: Appearance settings. On internal error, safe defaults are returned (still 200) so the login page is always renderable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettings'
              example:
                themeId: cozy-default
                customThemeColors: null
                fontId: default
                customLogoUrl: null
                customFaviconUrl: null
                customMascotUrl: null

  /api/auth/ping:
    get:
      tags:
        - Authentication
      summary: Session keepalive
      description: |
        Extends the rolling session cookie without fetching user data.
        Called periodically by the frontend during active gameplay so a long
        session doesn't expire mid-roll. Cheap — just touches the session.
      operationId: pingSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # USER MANAGEMENT
  # ============================================

  /api/users:
    get:
      tags:
        - Users
      summary: List all users
      description: Get list of all users (Admin only)
      operationId: listUsers
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Get specific user (own profile or admin)
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user
      description: |
        Update user profile (own profile or admin). Admin can change platformRole, which ends every login session the target has, because the role is carried in the session. The globalAssetManager and templateEditor flags are read from the database at the point of use, so changing those takes effect on the next request and does not sign anyone out.

        Changing your own email needs `currentPassword` (400 without it, 401 when wrong), checked before the new address is looked up; an admin changing someone else's does not. When the email changes, the user's unused password-reset and invitation links are voided, and the old address is emailed a notice if SMTP is configured (a failed send does not fail the change).
      operationId: updateUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Trimmed, and angle brackets removed, before the length is checked. Anything else, including a value that is not a string, is refused with 400.
                email:
                  type: string
                  format: email
                avatarUrl:
                  type: string
                platformRole:
                  type: string
                  enum: [ADMIN, USER]
                  description: Admin only
                currentPassword:
                  type: string
                  description: Required when changing your own email
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Not authenticated, or the current password given for an email change is incorrect
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Setting platformRole to USER would leave the instance without an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete user account (Admin only, cannot delete self). Ends every login session the deleted user had. What stays and what goes, and the 409 for a user who runs a campaign they own, are as for `DELETE /api/auth/account`.
      operationId: deleteUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: >-
            The user runs a campaign they own. `campaigns` lists each such
            campaign with its other members,
            so the admin can hand the DM seat over (`PUT
            /api/campaigns/{campaignId}/dm`) or delete the campaign and try
            again. Nothing was changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  message: { type: string }
                  campaigns:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        members:
                          type: array
                          items:
                            type: object
                            properties:
                              userId: { type: string, format: uuid }
                              displayName: { type: string }
                              role: { type: string, enum: [PLAYER, SPECTATOR] }

  /api/users/{id}/reset-password:
    post:
      tags:
        - Users
      summary: Admin reset user password
      description: Generate temporary password for user (Admin only). Sets mustChangePassword flag so user is forced to change on next login. Voids the user's unused password-reset and invitation links.
      operationId: adminResetUserPassword
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Password reset with temporary password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  temporaryPassword:
                    type: string
                  mustChangePassword:
                    type: boolean
                    example: true
                  notice:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/preferences:
    get:
      tags:
        - Users
      summary: Get user preferences
      description: |
        Returns the user's per-user preferences blob (theme, font, dice color, sound effects, notifications).
        Returns an empty object if the user has not customized any preferences yet — the frontend layers
        these on top of the system defaults from `GET /api/auth/appearance`.
        Users can fetch their own preferences; admins can fetch any user's.
      operationId: getUserPreferences
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user preferences (partial merge)
      description: |
        Partial-merge update of the user's preferences. Send any subset of fields and the server
        merges them into the stored JSON blob.
        Users can update their own preferences; admins can update any user's.
        Unknown fields are stripped silently. Empty payloads are rejected with 400.
      operationId: updateUserPreferences
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/send-reset-link:
    post:
      tags:
        - Users
      summary: Admin send password reset link
      description: |
        Send a password reset email to the user (Admin only).
        Invalidates any existing unused reset tokens and creates a new one (expires in 1 hour).
        Requires SMTP to be configured — returns 503 if SMTP is not set up.
      operationId: adminSendUserResetLink
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset email sent successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SMTP not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service Unavailable
                  message:
                    type: string
                    example: SMTP is not configured on this instance.

  # ============================================
  # CAMPAIGNS
  # ============================================

  /api/campaigns:
    get:
      tags:
        - Campaigns
      summary: List user campaigns
      description: Get all campaigns the user is a member of
      operationId: listCampaigns
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'

    post:
      tags:
        - Campaigns
      summary: Create campaign
      description: |
        Create a new campaign (creator automatically becomes DM). The optional
        `gameSystem` field is preferred but not required; it can be set later.
      operationId: createCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Optional game system for the campaign
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'

  /api/campaigns/{campaignId}:
    get:
      tags:
        - Campaigns
      summary: Get campaign details
      description: Get campaign with members, maps, and characters (requires campaign membership). `maps` lists every map to the DM and only the current map to other members.
      operationId: getCampaignById
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Campaigns
      summary: Update campaign
      description: |
        Update campaign settings (DM only). Every field is optional and is
        validated when present; a bad value is a 400 with a message naming it.
        Note: Changing `gameSystem` after characters have been created logs a
        warning, but the change is still allowed.
      operationId: updateCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                description:
                  type: string
                  maxLength: 5000
                  nullable: true
                status:
                  type: string
                  enum: [PREPARATION, ACTIVE, PAUSED, INACTIVE, COMPLETED, ARCHIVED]
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Game system for the campaign (warning logged if characters exist)
                vibeSettings:
                  type: object
                  description: Custom vibe periods with hues, filters, and audio
                spiritLayerEnabled:
                  type: boolean
                spiritLayerStyle:
                  type: string
                  maxLength: 100
                  description: One of `wispy`, `ethereal`, `shadow`, `dream`, or `custom:#RRGGBB` with an optional `:<look>` naming one of those four
                chatCooldownEnabled:
                  type: boolean
                chatCooldownSeconds:
                  type: integer
                  minimum: 1
                  maximum: 300
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Campaigns
      summary: Delete campaign
      description: Delete campaign (owner or admin only). The campaign's library assets become their uploaders' personal (`USER`) assets in the same transaction as the delete, so a failed delete changes neither, and an asset written into the campaign while it is being deleted goes the same way.
      operationId: deleteCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/characters:
    get:
      tags:
        - Campaigns
      summary: List campaign roster
      description: |
        Returns all memberships for the campaign with each member's assigned
        characters. The response includes summarized character info — name,
        token image, game system, and extracted HP — but never raw character
        `data`. Requires campaign membership.
      operationId: listCampaignRoster
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        userName: { type: string }
                        userAvatar: { type: string, nullable: true }
                        role:
                          type: string
                          enum: [DM, PLAYER, SPECTATOR]
                        joinedAt: { type: string, format: date-time }
                        characters:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
                              tokenImageUrl: { type: string, nullable: true }
                              gameSystem: { type: string, nullable: true }
                              userId: { type: string, format: uuid }
                              hp:
                                type: object
                                nullable: true
                                properties:
                                  current: { type: integer }
                                  max: { type: integer }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/invitable-users:
    get:
      tags:
        - Campaigns
      summary: List users eligible to invite
      description: |
        Returns all users on the instance who are *not* already a member of
        the campaign and have no pending invitation to it. Used by the
        DM-side invite picker. DM only.
      operationId: listInvitableUsers
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Users available to invite.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/invite:
    post:
      tags:
        - Campaigns
      summary: Invite user to campaign
      description: Add a user to the campaign as PLAYER (DM only)
      operationId: inviteUserToCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/members/{userId}:
    delete:
      tags:
        - Campaigns
      summary: Remove member
      description: Remove a member from campaign (DM only). The sitting DM and the campaign owner cannot be removed; both return 400. The member's characters are taken out of the campaign in the same step (their `campaignId` becomes null), and a character still naming a campaign its owner has left is readable and editable by its owner alone.
      operationId: removeMember
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/members/{userId}/role:
    put:
      tags:
        - Campaigns
      summary: Change member role
      description: Change a member's role (DM only, one DM per campaign enforced). The member's open connections take the new role at once, and `campaign.role.changed` (`{ campaignId, userId, role }`) goes to everyone in the campaign so open pages follow it, with a `roster.updated`; the initiative order and the map on screen are sent again as the new role sees it.
      operationId: changeMemberRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [DM, PLAYER, SPECTATOR]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/dm:
    put:
      tags:
        - Campaigns
      summary: Transfer the DM role
      description: >-
        Hand the Dungeon Master seat to another member of the campaign. The
        outgoing DM becomes a PLAYER and the named member becomes DM, as a single
        atomic change, so the campaign is never observable with two DMs or none.
        The campaign's owner is NOT changed: ownership and the DM role are
        separate, which lets an owner hand the game to someone else and remain at
        the table as a player. Callable by the sitting DM, the campaign owner
        (even when they are not the DM), or a platform admin. Both members'
        open connections take their new roles at once; `campaign.dm.transferred`
        and a `roster.updated` for each go to the campaign, and the initiative
        order and the map on screen are sent again as each new role sees it.
      operationId: transferDM
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
                  description: The campaign member who should become DM
      responses:
        '200':
          description: DM role transferred
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/vibe:
    put:
      tags:
        - Campaigns
      summary: Update atmosphere (vibe) settings
      description: |
        Replace the campaign's atmosphere periods (DM only). Changing which
        period is *current* is done over the socket (`vibe.update`), not here.
        Each period's `hue` must be a `#RRGGBB` colour and its `filter` may use
        only `brightness()`, `saturate()`, `contrast()` and `hue-rotate()`,
        the functions the atmosphere editor produces; anything else is a 400.
        A period's `audio`, when set, must be the id of an audio asset the DM
        may open to the table: their own, this campaign's, or a global track.
        Anything else is a 400 naming the period. Switching to a period plays
        its track for everyone; a period without one silences the table.
        If the current period no longer exists in the new list it is cleared.
      operationId: updateVibe
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - vibeSettings
              properties:
                vibeSettings:
                  type: object
                  required: [enabled, periods]
                  properties:
                    enabled:
                      type: boolean
                    periods:
                      type: array
                      minItems: 1
                      maxItems: 20
                      description: At least one period; names must be unique.
                      items:
                        type: object
                        required: [name, hue, filter]
                        properties:
                          name:
                            type: string
                            maxLength: 50
                          hue:
                            type: string
                            pattern: '^#[0-9A-Fa-f]{6}$'
                          filter:
                            type: string
                            maxLength: 200
                            description: Allowlisted CSS filter, e.g. `brightness(0.85) saturate(1.3) hue-rotate(10deg)`
                          audio:
                            type: string
                            nullable: true
                            format: uuid
                            description: >-
                              The id of an audio asset to play for the whole
                              table while this period is the vibe, or null
                              for no audio.
      responses:
        '200':
          description: Atmosphere settings updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  vibeSettings:
                    type: object
                    description: The stored settings, with any atmosphere audio state preserved
                  currentVibe:
                    type: string
                    nullable: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/admin/all:
    get:
      tags:
        - Campaigns
      summary: List all campaigns (Admin)
      description: Get all campaigns in the system (Admin only)
      operationId: listAllCampaigns
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # INVITATIONS
  # ============================================

  /api/invitations:
    get:
      tags:
        - Invitations
      summary: List my pending invitations
      description: |
        Returns the authenticated user's pending campaign invitations (status
        `PENDING`), ordered newest first, with the inviting campaign's summary
        info included so the UI can render an invitation card without
        additional fetches.
      operationId: listMyInvitations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    campaignId: { type: string, format: uuid }
                    userId: { type: string, format: uuid }
                    status:
                      type: string
                      enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
                    createdAt: { type: string, format: date-time }
                    expiresAt: { type: string, format: date-time, nullable: true }
                    campaign:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        gameSystem: { type: string, nullable: true }
                        status:
                          type: string
                          enum: [PREPARATION, ACTIVE, PAUSED, INACTIVE, COMPLETED, ARCHIVED]
                        owner:
                          type: object
                          properties:
                            displayName: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/invitations/{id}/accept:
    post:
      tags:
        - Invitations
      summary: Accept a campaign invitation
      description: |
        Accept the invitation and join the campaign as a `PLAYER`. Optionally
        assigns one or more of the accepting user's characters to the campaign
        in the same transaction.

        Validation:
        - `characterIds`, when sent, must be a list of at most 50 non-empty ids.
        - The invitation must belong to the authenticated user and be `PENDING`.
          It is accepted once: a second accept, even one sent at the same moment,
          answers 400 `Invitation already processed`.
        - Expired invitations are rejected.
        - All `characterIds` must belong to the user and not already be assigned
          to a campaign. One assigned elsewhere while the accept runs makes it
          answer 400 and change nothing.
        - Each character's `gameSystem` must be the campaign's: a character with
          a system joins only a campaign with the same one, and a character with
          none (Flexible) only a campaign with none. The same rule as
          `POST /api/characters/{id}/assign`.

        On success, also broadcasts a `roster.updated` event over the WebSocket
        to all current campaign members.
      operationId: acceptInvitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      requestBody:
        required: false
        description: |
          Optional list of characters to bring into the campaign. Omit or send
          `{ "characterIds": [] }` to join without assigning any characters.
        content:
          application/json:
            schema:
              type: object
              properties:
                characterIds:
                  type: array
                  maxItems: 50
                  items: { type: string, format: uuid }
            example:
              characterIds:
                - 4fbd7b27-c5cd-4d6f-9c80-0f7f30c75c2f
      responses:
        '200':
          description: Invitation accepted; campaign membership created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invitation accepted }
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          description: |
            Invitation already processed, expired, `characterIds` malformed, or
            character validation failed (not owned by user, already assigned, or
            game-system mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/invitations/{id}/decline:
    post:
      tags:
        - Invitations
      summary: Decline a campaign invitation
      description: |
        Marks the invitation as `DECLINED`. The invitation must belong to
        the authenticated user and currently be `PENDING`. Does not create
        any campaign membership.
      operationId: declineInvitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation declined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invitation declined }
        '400':
          description: Invitation already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # MESSAGES
  # ============================================

  /api/campaigns/{campaignId}/messages:
    get:
      tags:
        - Messages
      summary: Get message history
      description: >
        Chat history for a campaign, newest first, for a campaign member.

        Paging is by keyset, not offset: take `pagination.nextCursor` from one
        response and send it back as `cursor` to get the page before it. Repeat
        until `hasMore` is false to reach the first message in the campaign.
        Messages arriving while someone pages back cannot shift the window,
        which is what an offset would allow.

        Do not construct a cursor. It is opaque and its shape is not part of
        this contract.

        Dice rolls are not chat messages and are never returned here — they are
        served by `GET /api/campaigns/{campaignId}/dice-rolls`, which is the
        only path that applies the secret-roll rules.
      operationId: getMessages
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          description: From the previous response's `pagination.nextCursor`. Omit for the newest page.
          schema:
            type: string
      responses:
        '200':
          description: A page of chat history
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  pagination:
                    type: object
                    properties:
                      limit:
                        type: integer
                      hasMore:
                        type: boolean
                      nextCursor:
                        type: string
                        nullable: true
                        description: Send as `cursor` for the next page. Null when the history is exhausted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # PERSONAL NOTES
  #
  # Private to the signed-in user. Every route scopes its query by the session's
  # own user id as well as the campaign, never by an id from the request, and a
  # note belonging to somebody else answers 404 rather than 403 — a 403 would
  # confirm the id exists. The DM has no access to a player's notes.
  # ============================================

  /api/campaigns/{campaignId}/documents:
    get:
      tags:
        - Documents
      summary: List documents shared with a campaign
      description: >-
        Every member can list. Two kinds appear: documents shared into the
        campaign by the DM, and the campaign's own, created or uploaded at
        CAMPAIGN scope. Either way, appearing here means members may read it
        through `GET /api/assets/documents/{id}`.
      operationId: listCampaignDocuments
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: >-
            Documents shared in by link come first, oldest share first,
            followed by the campaign's own documents not also shared by link,
            oldest upload first.
          content:
            application/json:
              schema:
                type: object
                properties:
                  documents:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Documents
      summary: Share a document with a campaign
      description: >-
        DM only, and only for a document the DM uploaded or wrote themselves,
        or a global one. A document the caller cannot read answers 404, so
        sharing cannot be used to grant a table access to a stranger's private
        file from nothing but its id. A document the caller can read but did
        not upload answers 403: being shared into one campaign does not let a
        member who runs another pass it on. Admins may share anything. An
        asset that is not a document answers 404. Sharing a document that is
        already shared answers 201 with the existing link, unchanged.
      operationId: linkCampaignDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - assetId
              properties:
                assetId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Shared
          content:
            application/json:
              schema:
                type: object
                properties:
                  link:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      campaignId:
                        type: string
                        format: uuid
                      assetId:
                        type: string
                        format: uuid
                      linkedById:
                        type: string
                        format: uuid
                      createdAt:
                        type: string
                        format: date-time
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/documents/{assetId}:
    delete:
      tags:
        - Documents
      summary: Stop sharing a document with a campaign
      description: >-
        DM only. The document itself is untouched; only the share is removed.
        A campaign's own document (`shared: false` in the list) has no share
        to remove and answers 404, as does an id that is not shared here.
      operationId: unlinkCampaignDocument
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: assetId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Unshared
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/macros:
    get:
      tags:
        - Dice Macros
      summary: List your own saved macros
      description: >
        The caller's macros for this campaign, **oldest first** — so a macro keeps
        its place in the row of buttons. These are things people aim at without
        looking, and ordering by last edit would move one every time it changed.
        Private to the caller; a DM sees only their own.
      operationId: listDiceMacros
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Your macros, oldest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  macros:
                    type: array
                    items:
                      $ref: '#/components/schemas/DiceMacro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Dice Macros
      summary: Save a macro
      description: >
        The expression is rolled once and the result discarded, to prove it can be
        rolled at all. An expression that only looks like dice — `2d6+`, `dddd` —
        is refused here, with 400, and does not become a button that fails every
        time it is pressed. Both fields are trimmed and must not be empty. Any
        member, spectators included, may save macros. A player may keep 50 per
        campaign; saving another answers 400.
      operationId: createDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - expression
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                expression:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '201':
          description: Macro saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  macro:
                    $ref: '#/components/schemas/DiceMacro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/macros/{macroId}:
    get:
      tags:
        - Dice Macros
      summary: Read one of your macros
      description: >
        A macro belonging to someone else answers `404`, not `403`, so the
        response cannot be used to confirm that an id exists.
      operationId: getDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: macroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The macro
          content:
            application/json:
              schema:
                type: object
                properties:
                  macro:
                    $ref: '#/components/schemas/DiceMacro'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
        - Dice Macros
      summary: Rename a macro or correct its expression
      description: >
        Either field alone is a valid edit; a body with neither answers 400. A
        new expression is checked the same way it was on creation, so an edit
        cannot make a macro unrollable. A macro belonging to someone else
        answers 404.
      operationId: updateDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: macroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                expression:
                  type: string
                  minLength: 1
                  maxLength: 200
      responses:
        '200':
          description: Macro updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  macro:
                    $ref: '#/components/schemas/DiceMacro'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
        - Dice Macros
      summary: Delete a macro
      description: Only the caller's own macro; anyone else's answers 404.
      operationId: deleteDiceMacro
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: macroId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Macro deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/notes:
    get:
      tags:
        - Notes
      summary: List your own notes
      description: >
        The caller's notes for this campaign, most recently edited first.
        **Titles only** — `content` is deliberately not returned. A note may run
        to 100,000 characters, and a list carrying every body would move
        megabytes each time the panel opened; fetch one note to read it.
      operationId: listPersonalNotes
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Your notes, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  notes:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonalNoteSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
        - Notes
      summary: Create a note
      description: >
        Starts a note. `content` may be omitted — notes are usually created
        empty and written into afterwards. Refused once you hold 200 notes in
        this campaign.
      operationId: createPersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title:
                  type: string
                  maxLength: 120
                content:
                  type: string
                  maxLength: 100000
                  description: Markdown source.
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/PersonalNote'
        '400':
          description: Invalid title or content, or the per-campaign limit reached
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/notes/{noteId}:
    get:
      tags:
        - Notes
      summary: Read one of your notes
      description: >
        The note with its Markdown source. Answers 404 for a note that is not
        yours — including to the campaign's DM — rather than 403, so the
        response does not confirm that the id exists.
      operationId: getPersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The note
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/PersonalNote'
        '404':
          description: No such note of yours in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags:
        - Notes
      summary: Rename a note, replace its body, or both
      operationId: updatePersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one of the two must be present.
              properties:
                title:
                  type: string
                  maxLength: 120
                content:
                  type: string
                  maxLength: 100000
      responses:
        '200':
          description: The updated note
          content:
            application/json:
              schema:
                type: object
                properties:
                  note:
                    $ref: '#/components/schemas/PersonalNote'
        '400':
          description: Invalid values, or a body that changes nothing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such note of yours in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    delete:
      tags:
        - Notes
      summary: Delete a note
      operationId: deletePersonalNote
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: noteId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '404':
          description: No such note of yours in this campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # SESSIONS
  # ============================================

  /api/campaigns/{campaignId}/sessions:
    get:
      tags:
        - Sessions
      summary: List past sessions
      description: >
        Sessions for the campaign, newest first, with the notes the DM recorded
        when each one ended. Any campaign member may read them — the notes
        describe what happened at the table, which is what the session history
        panel shows a player before the next game.


        `savedState` is deliberately not returned: it is a large blob of token
        positions kept for resuming a session, and nothing reading history needs
        it. Capped at the 50 most recent sessions.
      operationId: listSessions
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Sessions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  sessions:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        sessionNumber:
                          type: integer
                        startedAt:
                          type: string
                          format: date-time
                        endedAt:
                          type: string
                          format: date-time
                          nullable: true
                        notes:
                          type: string
                          nullable: true
        '403':
          $ref: '#/components/responses/Forbidden'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
        - Sessions
      summary: Start new session
      description: Start a new game session for the campaign (DM only). Auto-increments session number.
      operationId: startSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    $ref: '#/components/schemas/Session'
        '400':
          description: Active session already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/sessions/{sessionId}/pause:
    put:
      tags:
        - Sessions
      summary: Pause session
      description: Pause an active game session (DM only)
      operationId: pauseSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stateSaved:
                    type: boolean
                    description: Whether the map's current state was written to the session record.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/sessions/{sessionId}/end:
    put:
      tags:
        - Sessions
      summary: End session
      description: End a game session and save the current game state (token positions, map, vibe, spirit layer). DM only.
      operationId: endSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session ended with state saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  stateSaved:
                    type: boolean
                    description: Whether the map's current state was written to the session record.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/sessions/{sessionId}/notes:
    put:
      tags:
        - Sessions
      summary: Edit or clear a past session's notes
      description: >-
        Rewrite the recap recorded for a session, or clear it by sending an
        empty string. DM only. The session must belong to the campaign in the
        path; one that does not answers 404 rather than 403, so the response
        cannot be used to discover which session ids exist.
      operationId: updateSessionNotes
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                notes:
                  type: string
                  maxLength: 2000
                  description: >-
                    The recap. Empty, or only whitespace, clears it and stores
                    null.
      responses:
        '200':
          description: Notes updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  session:
                    $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/resume:
    put:
      tags:
        - Sessions
      summary: Resume last session
      description: >
        Reopen the campaign's most recently started session (DM only), whether
        it was paused or ended: its end time is cleared, the campaign is set
        ACTIVE, and `session.resumed` is broadcast. The campaign's current
        status is not checked, so a call while a session is running succeeds
        too and posts another "resumed" message. The table is left exactly
        as it is: everything is stored as it is played, and the snapshot taken
        at pause is a record kept with the session, never written back.
      operationId: resumeSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Session resumed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    type: object
                    properties:
                      id:
                        type: string
                      sessionNumber:
                        type: integer
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: The campaign has never had a session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ============================================
  # CHARACTERS
  # ============================================

  /api/characters:
    get:
      tags:
        - Characters
      summary: List user characters
      description: >-
        Every character the caller owns, newest first, each with its
        `campaign` as `{ id, name }` (null when unassigned). Characters owned
        by other members of the caller's campaigns are not included.
      operationId: listCharacters
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  characters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Character'

    post:
      tags:
        - Characters
      summary: Create character
      description: |
        Create a new character.
        - `name` is trimmed and must be 1 to 200 characters.
        - If `campaignId` is provided and `gameSystem` is omitted or null, the
          character inherits the campaign's `gameSystem`. A `gameSystem`
          sent together with `campaignId` is not checked against the
          campaign's own system, so a character can be created straight into a
          campaign it does not match; `POST /api/characters/{id}/assign`
          refuses that combination, but this endpoint does not.
        - For a typed game system, `name` is written into the sheet's own name
          field (`characterName`, or `investigatorName` for
          `CALL_OF_CTHULHU_7E`) and the caller's display name into
          `playerName`, overwriting whatever `data` held there, before the
          sheet is validated. A flexible sheet is stored as sent.
        - With a game system (sent or inherited), `data` is validated against
          that system's sheet schema and stored as the schema's parsed output,
          so a key the schema does not declare is dropped. Sheet fields from
          before version 1.3.0 are moved to their current names first. The
          top-level fields each system requires are: `DND_5E` `class`,
          `level`, `race`, `proficiencyBonus`, `stats`; `PATHFINDER_2E`
          `class`, `level`, `ancestry`, `heritage`, `attributes`;
          `SHADOWRUN_6E` `metatype`, `archetype`, `attributes`;
          `CALL_OF_CTHULHU_7E` `occupation`, `era`, `characteristics` (the
          name field is filled in from `name`). `GET
          /api/characters/templates/{gameSystem}/blank` returns a sheet that
          passes.
        - With no game system, `data` is not validated (flexible character).
        - If `campaignId` is provided, the campaign must exist (404) and the
          caller must already be a member of it (403); otherwise nothing is
          created. The character is added to the caller's membership as well
          as carrying the `campaignId` column, in one transaction, because the
          campaign roster and the token permission checks read the membership.
        - `tokenImageUrl` is optional and nullable; an empty string is stored
          as null. A bare asset id is stored as `/api/assets/tokens/<id>`; any
          other value must be an asset's exact address,
          `/api/assets/<maps|tokens|avatars|audio|documents>/<id>` with nothing
          after the id. The asset must be one the caller can read, or one that
          does not exist; otherwise the answer is 403 and nothing is created.
      operationId: createCharacter
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Optional game system (auto-inherited from campaign if campaignId provided)
                campaignId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional campaign to assign character to immediately
                data:
                  type: object
                  description: |
                    The character sheet. When `gameSystem` is set it is validated against that system's sheet schema and stored as parsed, so keys the schema does not declare are dropped. `themeColor` is accepted on every system: either empty, `#` followed by 6 hex digits, or a name starting with a letter and up to 39 more letters, digits or spaces.
                tokenImageUrl:
                  type: string
                  nullable: true
                  description: A bare asset id, or an asset's exact `/api/assets/<kind>/<id>` address.
      responses:
        '201':
          description: Character created. The `character` carries no `campaign` object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: >-
            The body fails its shape check (`name` missing, empty or over 200
            characters, an unknown `gameSystem`, a non-string `campaignId` or
            `tokenImageUrl`), answered with `message` alone; or `data` does not
            match the game system's sheet schema, answered with
            `validationErrors` listing each problem.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation Error
                  message:
                    type: string
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        code:
                          type: string
        '403':
          description: >
            The caller is not a member of the campaign named by `campaignId`,
            or `tokenImageUrl` names a picture the caller may not use. Nothing
            is created.
        '404':
          description: No campaign exists with the id given in `campaignId`

  /api/characters/{id}:
    get:
      tags:
        - Characters
      summary: Get character
      description: >-
        The owner can always read it. If it is in a campaign, any member of
        that campaign (DM, player or spectator) can read it too, as long as
        the owner is still a member there; otherwise anyone else gets 403.
        The response includes `campaign` (`id`, `name`) and the owner as
        `user` (`id`, `displayName`, `avatarUrl`).
      operationId: getCharacterById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Character details
          content:
            application/json:
              schema:
                type: object
                properties:
                  character:
                    $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Characters
      summary: Update character
      description: |
        The owner may edit it. The DM of the character's campaign may edit it
        too, but only while the character's owner is still a member of that
        campaign. A spectator in the character's campaign may not edit it,
        even when it is their own.
        - `gameSystem` in the body is only compared with the character's
          current value: the same value is accepted and ignored, a different
          one (or null on a typed character) answers 400. A character's game
          system cannot change. This comparison happens before the permission
          check.
        - If the character has a `gameSystem`, `data` is validated against
          that system's sheet schema (after moving sheet fields from before
          version 1.3.0 to their current names) and stored as the schema's
          parsed output. `data` replaces the whole sheet; it is not merged.
        - If the character has no `gameSystem`, `data` is stored unvalidated.
        - If `name` is omitted, `data` is sent, the character has a game
          system, and the sheet's own name field (`characterName`, or
          `investigatorName` for `CALL_OF_CTHULHU_7E`) holds a non-blank value
          different from the stored `name`, the `name` column is set to that
          value, trimmed. An explicit `name` in the body always wins.
        - A new `tokenImageUrl` follows the rule on create (403 otherwise); the
          address already stored may be sent back unchanged.
        - Send `updatedAt` exactly as the character was loaded with, as a UTC
          ISO timestamp ending in `Z`, to have the save refused with 409 if the
          character has changed since, by another save or by a hit point or
          hit dice change made over the socket. Without it the save is made
          whatever changed in between. A 200 response carries the new
          `updatedAt` for the next save.
        - When the saved `tokenImageUrl` actually changes, every map token
          bound to this character (found by its `characterId`, in any
          campaign, not only this character's own) has its picture set to the
          new address, or to an empty string when it was cleared, except in a
          campaign where the caller is a spectator. The token's name is not
          touched. Each campaign whose tokens changed has its initiative
          state resent. A failure here is logged and does not fail the save.
        - If the character is in a campaign and its owner is still a member,
          the update broadcasts `character.updated` to that campaign with
          `characterId`, `character`, `userId` and `tokensChanged`, and also
          `character.hp.updated` with `characterId` and `hp` when the sheet's
          hit points changed. Any other campaign whose tokens were repainted
          gets `character.updated` with only `characterId` and
          `tokensChanged: true`, without the sheet.
      operationId: updateCharacter
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                data:
                  type: object
                  description: |
                    The character sheet. When `gameSystem` is set it is validated against that system's sheet schema and stored as parsed, so keys the schema does not declare are dropped. `themeColor` is accepted on every system: either empty, `#` followed by 6 hex digits, or a name starting with a letter and up to 39 more letters, digits or spaces.
                tokenImageUrl:
                  type: string
                  nullable: true
                  description: A bare asset id, or a full `/api/assets/<kind>/<id>` address; the address already stored may be sent back unchanged.
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  deprecated: true
                  description: Optional. If sent it must equal the character's current gameSystem (null for a flexible character), or the request answers 400. It is never written.
                updatedAt:
                  type: string
                  format: date-time
                  description: |
                    The character's `updatedAt` as the caller loaded it, as a UTC ISO timestamp ending in `Z`. Optional. When sent and the character has changed since, the save is refused with 409 and nothing is written.
      responses:
        '200':
          description: Character updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: >-
            The body fails its shape check (`name` empty or over 200
            characters, an unknown `gameSystem`, an `updatedAt` that is not a
            UTC ISO timestamp ending in `Z`), answered with `message` alone;
            `gameSystem` differs from the character's, answered with `error:
            Bad Request`; or `data` does not match the game system's sheet
            schema, answered with `validationErrors`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation Error
                  message:
                    type: string
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        code:
                          type: string
        '403':
          description: >-
            The caller is neither the owner nor the DM of the character's
            campaign (or is that DM but the owner has left the campaign), or is
            a spectator in the character's campaign, or `tokenImageUrl` names a
            picture the caller may not use.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The character changed after the `updatedAt` sent. Nothing was saved; load the character again and reapply the change.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Conflict
                  code:
                    type: string
                    example: CHARACTER_CHANGED
                  message:
                    type: string

    delete:
      tags:
        - Characters
      summary: Delete character
      description: >-
        Owner only. Deletes the character row. No event is broadcast, and map
        tokens placed from the character stay on their maps.
      operationId: deleteCharacter
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Character deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/characters/{id}/assign:
    post:
      tags:
        - Characters
      summary: Assign character to campaign, or unassign it
      description: |
        Owner only. The body is not schema-checked: `campaignId` is read from
        it as sent, and a value that is not a string answers 500.
        - Omitting `campaignId`, or sending it as `null` or `""`, unassigns the
          character: its `campaignId` column is cleared and it is removed from
          the caller's membership `characterIds` in its previous campaign, if
          it had one. No campaign membership is needed for this.
        - Sending a `campaignId` assigns the character to that campaign. The
          campaign must exist (404 otherwise) and the caller must already be a
          member of it (403 otherwise). The character's `gameSystem` must
          match the campaign's (both flexible, or the same typed system), or
          the request answers 400 and nothing changes. If the character was
          assigned to another campaign, it is removed from the caller's
          membership there first.
        - Assigning broadcasts `roster.updated` to the new campaign, with
          `action` set to `character.assigned` and `characterId`, `userId`
          and `campaignId`. Unassigning a character that had a campaign
          broadcasts `roster.updated` to that campaign, with `action` set to
          `character.unassigned` and `characterId` and `userId`.
      operationId: assignCharacterToCampaign
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                campaignId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Omit, or send null/"", to unassign instead of assign.
      responses:
        '200':
          description: >-
            Character assigned or unassigned. Its `campaign` is `{ id, name,
            gameSystem }`, or null after unassigning.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: >-
            `campaignId` names a campaign whose game system does not match the
            character's. Nothing is changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Game System Mismatch
                  message:
                    type: string
                    example: Cannot assign a DND_5E character to a flexible campaign. Character and campaign game systems must match.
        '403':
          description: >-
            The caller does not own the character, or (when assigning) is not
            a member of the target campaign.
        '404':
          description: >-
            The character does not exist, or (when assigning) no campaign
            exists with the given `campaignId`.

  /api/characters/{id}/validate:
    get:
      tags:
        - Characters
      summary: Validate character data against its game system schema
      description: |
        Re-runs the Zod schema for the character's `gameSystem` against its
        current `data` blob. Useful after editing a character to surface fields
        that no longer satisfy the schema (e.g. missing required ability
        scores after a game-system update).

        Returns `200 OK` with `isValid: false` and a list of field-level errors
        even when validation fails — this is not an error condition for the
        client. Only character owners can validate (prevents info leakage).
      operationId: validateCharacter
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CharacterId'
      responses:
        '200':
          description: "Validation result — note that an invalid character returns 200 with isValid=false (not an error)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    description: Present only when `isValid` is false. A problem at the top level of the sheet has `path` set to `root`.
                    items:
                      type: object
                      properties:
                        path: { type: string, example: 'stats.strength' }
                        message: { type: string, example: 'Invalid input: expected number, received string' }
                        code: { type: string, example: 'invalid_type' }
              examples:
                valid:
                  summary: All fields pass
                  value:
                    isValid: true
                invalid:
                  summary: Schema mismatch
                  value:
                    isValid: false
                    errors:
                      - path: 'stats.strength'
                        message: 'Invalid input: expected number, received string'
                        code: 'invalid_type'
        '400':
          description: Character has no game system assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: { type: boolean, example: false }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        message: { type: string }
                        code: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/characters/{id}/copy:
    post:
      tags:
        - Characters
      summary: Duplicate a character
      description: |
        Creates a copy of the character for the same owner, with the same
        `gameSystem`, sheet and `tokenImageUrl`. The copy is unassigned
        (`campaignId: null`), its name is the original's followed by a space
        and `(Copy)`, and the response carries no `campaign` object. Only the
        character's owner may copy it.
      operationId: copyCharacter
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CharacterId'
      responses:
        '201':
          description: Character copied successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Character copied successfully }
                  character:
                    $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # ASSETS
  # ============================================

  /api/assets:
    get:
      tags:
        - Assets
      summary: List assets
      description: >-
        List assets with filtering and pagination. With no `type`, documents
        are left out: they have their own section, and are fetched by asking
        for `type=DOCUMENT` explicitly.
      operationId: listAssets
      security:
        - cookieAuth: []
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT]
        - name: scope
          in: query
          schema:
            type: string
            enum: [GLOBAL, CAMPAIGN]
        - name: campaignId
          in: query
          schema:
            type: string
            format: uuid
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: usable
          in: query
          description: >-
            `true` lists only assets the caller may put on a map, token or
            creature: global ones, their own personal ones, and those of
            campaigns they belong to. Without it, a platform admin is listed
            every asset on the instance; for anyone else the two are the same.
          schema:
            type: boolean
      responses:
        '200':
          description: List of assets
          content:
            application/json:
              schema:
                type: object
                properties:
                  assets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
                  pagination:
                    type: object
                    properties:
                      page:
                        type: integer
                      limit:
                        type: integer
                      total:
                        type: integer
                      totalPages:
                        type: integer

  /api/assets/upload:
    post:
      tags:
        - Assets
      summary: Upload asset
      description: |
        Upload a new asset file. The file is validated by **magic-byte**
        inspection (not just MIME header or extension) and rejected if the
        detected type doesn't match the declared `type`.

        **File size limits** — set per type with the `MAX_<TYPE>_SIZE_MB`
        environment variables (defaults shown). The effective values are
        available from `GET /api/config`.
        | Type | Env var | Default limit |
        |------|---------|---------------|
        | MAP    | `MAX_MAP_SIZE_MB`    | 50 MB |
        | TOKEN  | `MAX_TOKEN_SIZE_MB`  | 5 MB |
        | AUDIO  | `MAX_AUDIO_SIZE_MB`  | 20 MB |
        | AVATAR | `MAX_AVATAR_SIZE_MB` | 2 MB |
        | DOCUMENT | `MAX_DOCUMENT_SIZE_MB` | 50 MB |

        Image assets generate a 512×512 thumbnail server-side.

        **Rate limit**: 30 uploads per minute per user (configurable via
        `ASSET_UPLOAD_RATE_LIMIT`). Sized to allow legitimate bulk-upload
        during campaign setup while blocking obvious abuse loops.
      operationId: uploadAsset
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
                - type
              properties:
                file:
                  type: string
                  format: binary
                type:
                  type: string
                  enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT]
                scope:
                  type: string
                  enum: [GLOBAL, USER, CAMPAIGN]
                  default: USER
                campaignId:
                  type: string
                  format: uuid
                  description: Required if scope is CAMPAIGN
                name:
                  type: string
                description:
                  type: string
                tags:
                  type: string
                  description: Comma-separated tags
      responses:
        '201':
          description: Asset uploaded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Asset uploaded successfully
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          description: |
            Validation failure — missing required field, file too large for
            its declared type, or magic-byte mismatch (file content does not
            match declared type).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

