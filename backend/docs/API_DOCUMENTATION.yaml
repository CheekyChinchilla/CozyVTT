  /api/assets/{id}/scope:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    patch:
      tags:
        - Assets
      summary: Change asset scope
      description: |
        Move an asset between the three scopes (`GLOBAL`, `USER`, `CAMPAIGN`).

        **Permission matrix:**
        | Move | Required role |
        |------|---------------|
        | Any move involving GLOBAL | Platform admin OR `globalAssetManager` |
        | USER → CAMPAIGN | Asset owner who is that campaign's DM; a player may move token art only; never a spectator |
        | CAMPAIGN → USER | Asset owner while a member of the source campaign, OR its DM |
        | CAMPAIGN → CAMPAIGN | Asset owner while a member of the source campaign, OR its DM |
        | USER → USER on a different account | Disallowed |

        When `scope: CAMPAIGN`, `campaignId` is required and the campaign must
        exist, and the same placement rule as an upload there applies. The
        asset's file does not move on disk — only the DB record's scope and
        `campaignId` are updated; the uploader stays as recorded.
      operationId: changeAssetScope
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scope:
                  type: string
                  enum: [GLOBAL, USER, CAMPAIGN]
                campaignId:
                  type: string
                  format: uuid
                  description: Required when scope is CAMPAIGN
              required: [scope]
            examples:
              userToCampaign:
                summary: Move from personal library to a campaign
                value:
                  scope: CAMPAIGN
                  campaignId: 7f4cda04-2b08-4f7d-9b6f-2c2d7d0d0a01
              promoteToGlobal:
                summary: Admin moves a campaign asset into the global library
                value:
                  scope: GLOBAL
      responses:
        '200':
          description: Asset moved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asset:
                    $ref: '#/components/schemas/Asset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

