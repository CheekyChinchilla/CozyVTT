openapi: 3.0.3
info:
  title: CozyVTT API
  description: |
    RESTful API for CozyVTT — a self-hosted, browser-based Virtual Tabletop platform.

    ## Authentication
    All endpoints (except `/health`, `/api/setup/*`, and public auth routes) require authentication via session cookies.
    Login via `/api/auth/login` to obtain a session cookie.

    ## MFA Flow
    If a user has MFA enabled, `/api/auth/login` returns `{ mfaRequired: true }` instead of a full session.
    The client must then call `/api/auth/mfa/verify-login` with a TOTP code or backup code to complete authentication.

    ## Authorization
    - **Platform roles**: `ADMIN` (full system access), `USER` (campaign access)
    - **Campaign roles**: `DM` (full campaign control), `PLAYER` (limited interaction), `SPECTATOR` (read-only)

    ## Rate Limiting
    - Global API limit: 300 requests per minute per IP (all `/api/*` routes)
    - Authentication endpoints: 5 requests per 15 minutes
    - MFA setup verification: 5 attempts per 15 minutes
    - MFA login verification: 5 attempts per 15 minutes (separate limit)
    - Asset uploads: 30 requests per minute per user (configurable via `ASSET_UPLOAD_RATE_LIMIT`)
    - Chat messages: 5 per minute (WebSocket)
    - Dice rolls: 30 per minute (WebSocket)
    - Token movement: 60 per second (WebSocket, throttled)

    Rate-limited responses return HTTP 429 with `RateLimit-*` standard headers.

    ## Real-time Events
    Real-time campaign features (token movement, dice, chat, initiative, etc.) use Socket.io.
    See the WebSocket section at the bottom of this document for the full event reference.

  version: 1.1.1
  contact:
    name: CozyVTT
    url: https://cozyvtt.com
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: https://cozyvtt.com/api
    description: Production (replace with your self-hosted instance URL)
  - url: http://localhost:4000
    description: Local development

# Default security — every endpoint requires the session cookie unless it
# explicitly overrides with `security: []` (used for public endpoints like
# /health, /api/setup/*, and the unauthenticated auth routes).
security:
  - cookieAuth: []

tags:
  - name: Health
    description: System health checks
  - name: Setup
    description: Initial system setup wizard
  - name: Authentication
    description: User authentication, password reset, and session management
  - name: MFA
    description: Multi-Factor Authentication (TOTP + backup codes)
  - name: Users
    description: User management endpoints
  - name: Campaigns
    description: Campaign management
  - name: Sessions
    description: Game session lifecycle management
  - name: Characters
    description: Character creation and management
  - name: Assets
    description: File upload and asset management
  - name: Maps
    description: Map management and token manipulation
  - name: Creatures
    description: Creature template library — SRD and custom creatures, favorites, seeding
  - name: Token Templates
    description: Reusable token configurations savable per-campaign and copyable across campaigns the DM owns
  - name: Walls & Lighting
    description: Per-map wall segments, light sources, and fog-of-war state (DM-only writes)
  - name: Invitations
    description: Campaign invitation lifecycle (send, list, accept, decline)
  - name: Campaign Export/Import
    description: Export and import campaigns as portable `.cozyvtt` archives
  - name: Messages
    description: Chat message history
  - name: Admin
    description: Admin-only platform management endpoints (requires ADMIN platform role)
  - name: WebSocket
    description: Real-time events via Socket.io

paths:
  /health:
    get:
      tags:
        - Health
      summary: Health check
      description: Check if the API server is running. Accessible before setup.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  timestamp:
                    type: string
                    format: date-time

  # ============================================
  # CLIENT CONFIG
  # ============================================

  /api/config:
    get:
      tags:
        - Health
      summary: Get public client configuration
      description: |
        Public endpoint — returns the upload size limits the server enforces,
        derived from the `MAX_<TYPE>_SIZE_MB` environment variables. The SPA is
        built ahead of time, so it reads the limits from here at runtime rather
        than baking them into the bundle. No authentication required.
      operationId: getClientConfig
      security: []
      responses:
        '200':
          description: Client configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadLimits:
                    type: object
                    description: Maximum upload size in bytes, per asset type
                    properties:
                      MAP:
                        type: integer
                      TOKEN:
                        type: integer
                      AUDIO:
                        type: integer
                      AVATAR:
                        type: integer
                  maxUploadBytes:
                    type: integer
                    description: Largest configured limit — the cap enforced before the asset type is known
              example:
                uploadLimits:
                  MAP: 52428800
                  TOKEN: 5242880
                  AUDIO: 20971520
                  AVATAR: 2097152
                maxUploadBytes: 52428800

  # ============================================
  # SETUP
  # ============================================

  /api/setup/status:
    get:
      tags:
        - Setup
      summary: Check setup status
      description: Check if the system setup wizard needs to be run. Accessible before setup.
      operationId: getSetupStatus
      security: []
      responses:
        '200':
          description: Setup status
          content:
            application/json:
              schema:
                type: object
                properties:
                  setupCompleted:
                    type: boolean
                  hasUsers:
                    type: boolean
                  needsSetup:
                    type: boolean

  /api/setup/init:
    post:
      tags:
        - Setup
      summary: Initialize system
      description: Create first admin account and complete setup wizard. Only works if setup is not yet complete.
      operationId: initializeSystem
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                displayName:
                  type: string
      responses:
        '201':
          description: Setup completed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ============================================
  # AUTHENTICATION
  # ============================================

  /api/auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Create a new user account. First user automatically becomes ADMIN. Rate limited (5/15min).
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - displayName
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 12
                displayName:
                  type: string
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/login:
    post:
      tags:
        - Authentication
      summary: Login
      description: |
        Authenticate user and create session. Rate limited (5/15min).
        If MFA is enabled, returns `{ mfaRequired: true }` and the client must call `/api/auth/mfa/verify-login`.
        If `mustChangePassword` is true in response, frontend should redirect to password change.
      operationId: loginUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                rememberMe:
                  type: boolean
                  default: false
                  description: Extends session to 30 days
            example:
              email: dm@example.com
              password: hunter2-correct-horse-battery
              rememberMe: true
      responses:
        '200':
          description: Login successful (or MFA required)
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      message:
                        type: string
                      user:
                        $ref: '#/components/schemas/User'
                      mustChangePassword:
                        type: boolean
                  - type: object
                    properties:
                      mfaRequired:
                        type: boolean
                        example: true
                      message:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/logout:
    post:
      tags:
        - Authentication
      summary: Logout
      description: Destroy session and clear cookie
      operationId: logoutUser
      responses:
        '200':
          description: Logout successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /api/auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Get currently authenticated user from session
      operationId: getCurrentUser
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/forgot-password:
    post:
      tags:
        - Authentication
      summary: Request password reset
      description: |
        Request a password reset email. Always returns 200 regardless of whether the email exists (prevents enumeration).
        If SMTP is not configured, returns a message to contact the administrator.
        Rate limited (5/15min).
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Response (always 200 to prevent enumeration)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/reset-password:
    post:
      tags:
        - Authentication
      summary: Reset password with token
      description: Reset password using a valid token from a password reset email. Token must not be expired or used. Rate limited (5/15min).
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
                - newPassword
              properties:
                token:
                  type: string
                  format: uuid
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/change-password:
    post:
      tags:
        - Authentication
      summary: Change own password
      description: Change password for the authenticated user. Requires current password verification. Sets mustChangePassword to false.
      operationId: changePassword
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - currentPassword
                - newPassword
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # MFA
  # ============================================

  /api/auth/mfa/setup:
    post:
      tags:
        - MFA
      summary: Begin MFA setup
      description: Generate TOTP secret and QR code for authenticator app. User must not already have MFA enabled.
      operationId: mfaSetup
      security:
        - cookieAuth: []
      responses:
        '200':
          description: MFA setup initiated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  qrCodeUrl:
                    type: string
                    description: Data URL of QR code image
                  secret:
                    type: string
                    description: TOTP secret for manual entry
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/mfa/verify:
    post:
      tags:
        - MFA
      summary: Complete MFA setup
      description: Verify TOTP code to complete MFA setup. Generates 10 backup codes (shown only once). Rate limited (5/15min).
      operationId: mfaVerifySetup
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code from authenticator app
      responses:
        '200':
          description: MFA enabled, backup codes returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
                    description: 10 backup codes in XXXX-XXXX format (shown only once)
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/verify-login:
    post:
      tags:
        - MFA
      summary: Verify MFA during login
      description: |
        Complete MFA verification during login flow. Requires a pending MFA session from `/api/auth/login`.
        Accepts either a TOTP token or a backup code (not both). Backup codes are consumed on use.
        Rate limited (5/15min, separate from setup verification).
      operationId: mfaVerifyLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: 6-digit TOTP code
                backupCode:
                  type: string
                  description: Backup code in XXXX-XXXX format
      responses:
        '200':
          description: MFA verified, fully authenticated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  mustChangePassword:
                    type: boolean
                  backupCodeUsed:
                    type: boolean
                  remainingBackupCodes:
                    type: integer
                  warning:
                    type: string
                    description: Warning when backup codes are running low (<=3)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'

  /api/auth/mfa/disable:
    post:
      tags:
        - MFA
      summary: Disable MFA
      description: Disable MFA for the authenticated user. Requires current password and a valid TOTP code. Admin accounts cannot disable MFA.
      operationId: mfaDisable
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
                - token
              properties:
                password:
                  type: string
                token:
                  type: string
                  description: 6-digit TOTP code
      responses:
        '200':
          description: MFA disabled
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Admin accounts cannot disable MFA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/mfa/backup-codes:
    post:
      tags:
        - MFA
      summary: Regenerate backup codes
      description: Generate new set of 10 backup codes. Requires current password. Replaces all existing codes.
      operationId: mfaRegenerateBackupCodes
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - password
              properties:
                password:
                  type: string
      responses:
        '200':
          description: New backup codes generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  backupCodes:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/account:
    delete:
      tags:
        - Authentication
      summary: Delete own account
      description: |
        Self-service permanent account deletion. Requires the current
        password as confirmation. Cascades to delete memberships, characters,
        and messages owned by the user.
      operationId: deleteOwnAccount
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  format: password
                  description: Current password (for confirmation)
              required: [password]
            example:
              password: hunter2-correct-horse-battery
      responses:
        '200':
          description: Account deleted; session destroyed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Account deleted successfully }
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: |
            Either not authenticated, or password did not match. The error message
            distinguishes the two cases.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/auth/registration-status:
    get:
      tags:
        - Authentication
      summary: Get registration availability
      description: |
        Public endpoint — returns whether public self-registration is currently
        enabled on this instance. Used by the frontend to show/hide the register
        link on the login page. No authentication required.
      operationId: getRegistrationStatus
      security: []
      responses:
        '200':
          description: Registration status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  allowRegistration:
                    type: boolean
                    description: |
                      `true` if anonymous users may register accounts via
                      `/api/auth/register`. `false` means an admin must
                      manually create accounts.
              example:
                allowRegistration: true

  /api/auth/appearance:
    get:
      tags:
        - Authentication
      summary: Get instance appearance settings
      description: |
        Public endpoint — returns the instance's theme, font, and branding
        URLs. The frontend calls this on every page load so the login and
        setup pages can paint with the correct theme before authentication.
        No authentication required.
      operationId: getAppearanceSettings
      security: []
      responses:
        '200':
          description: Appearance settings. On internal error, safe defaults are returned (still 200) so the login page is always renderable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppearanceSettings'
              example:
                instanceName: CozyVTT
                themeId: cozy-default
                customThemeColors: null
                fontId: default
                customLogoUrl: null
                customFaviconUrl: null
                customMascotUrl: null

  /api/auth/ping:
    get:
      tags:
        - Authentication
      summary: Session keepalive
      description: |
        Extends the rolling session cookie without fetching user data.
        Called periodically by the frontend during active gameplay so a long
        session doesn't expire mid-roll. Cheap — just touches the session.
      operationId: pingSession
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Session is alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================
  # USER MANAGEMENT
  # ============================================

  /api/users:
    get:
      tags:
        - Users
      summary: List all users
      description: Get list of all users (Admin only)
      operationId: listUsers
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/users/{id}:
    get:
      tags:
        - Users
      summary: Get user by ID
      description: Get specific user (own profile or admin)
      operationId: getUserById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user
      description: Update user profile (own profile or admin). Admin can change platformRole.
      operationId: updateUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:
                  type: string
                email:
                  type: string
                  format: email
                avatarUrl:
                  type: string
                platformRole:
                  type: string
                  enum: [ADMIN, USER]
                  description: Admin only
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Users
      summary: Delete user
      description: Delete user account (Admin only, cannot delete self)
      operationId: deleteUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/reset-password:
    post:
      tags:
        - Users
      summary: Admin reset user password
      description: Generate temporary password for user (Admin only). Sets mustChangePassword flag so user is forced to change on next login.
      operationId: adminResetUserPassword
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Password reset with temporary password
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  temporaryPassword:
                    type: string
                  mustChangePassword:
                    type: boolean
                    example: true
                  notice:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/preferences:
    get:
      tags:
        - Users
      summary: Get user preferences
      description: |
        Returns the user's per-user preferences blob (theme, font, dice color, sound effects, notifications).
        Returns an empty object if the user has not customized any preferences yet — the frontend layers
        these on top of the system defaults from `GET /api/auth/appearance`.
        Users can fetch their own preferences; admins can fetch any user's.
      operationId: getUserPreferences
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: User preferences
          content:
            application/json:
              schema:
                type: object
                properties:
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Users
      summary: Update user preferences (partial merge)
      description: |
        Partial-merge update of the user's preferences. Send any subset of fields and the server
        merges them into the stored JSON blob.
        Users can update their own preferences; admins can update any user's.
        Unknown fields are stripped silently. Empty payloads are rejected with 400.
      operationId: updateUserPreferences
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPreferences'
      responses:
        '200':
          description: Preferences updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  preferences:
                    $ref: '#/components/schemas/UserPreferences'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/users/{id}/send-reset-link:
    post:
      tags:
        - Users
      summary: Admin send password reset link
      description: |
        Send a password reset email to the user (Admin only).
        Invalidates any existing unused reset tokens and creates a new one (expires in 1 hour).
        Requires SMTP to be configured — returns 503 if SMTP is not set up.
      operationId: adminSendUserResetLink
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Reset email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Password reset email sent successfully
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: SMTP not configured
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Service Unavailable
                  message:
                    type: string
                    example: SMTP is not configured on this instance.

  # ============================================
  # CAMPAIGNS
  # ============================================

  /api/campaigns:
    get:
      tags:
        - Campaigns
      summary: List user campaigns
      description: Get all campaigns the user is a member of
      operationId: listCampaigns
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'

    post:
      tags:
        - Campaigns
      summary: Create campaign
      description: |
        Create a new campaign (creator automatically becomes DM). The optional
        `gameSystem` field is preferred but not required; it can be set later.
      operationId: createCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Optional game system for the campaign
      responses:
        '201':
          description: Campaign created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'

  /api/campaigns/{campaignId}:
    get:
      tags:
        - Campaigns
      summary: Get campaign details
      description: Get campaign with members, maps, and characters (requires campaign membership)
      operationId: getCampaignById
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign details
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Campaigns
      summary: Update campaign
      description: |
        Update campaign settings (DM only). Supports name, description, status,
        vibeSettings, spiritLayerEnabled, spiritLayerStyle, gameSystem.
        Note: Changing `gameSystem` after characters have been created logs a
        warning and returns it in the response, but the change is still allowed.
      operationId: updateCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [PREPARATION, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Game system for the campaign (warning logged if characters exist)
                vibeSettings:
                  type: object
                  description: Custom vibe periods with hues, filters, and audio
                spiritLayerEnabled:
                  type: boolean
                spiritLayerStyle:
                  type: string
                  enum: [wispy, ethereal, shadow, custom]
      responses:
        '200':
          description: Campaign updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaign:
                    $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags:
        - Campaigns
      summary: Delete campaign
      description: Delete campaign (owner or admin only)
      operationId: deleteCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/characters:
    get:
      tags:
        - Campaigns
      summary: List campaign roster
      description: |
        Returns all memberships for the campaign with each member's assigned
        characters. The response includes summarized character info — name,
        token image, game system, and extracted HP — but never raw character
        `data`. Requires campaign membership.
      operationId: listCampaignRoster
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Campaign roster.
          content:
            application/json:
              schema:
                type: object
                properties:
                  roster:
                    type: array
                    items:
                      type: object
                      properties:
                        userId: { type: string, format: uuid }
                        userName: { type: string }
                        userAvatar: { type: string, nullable: true }
                        role:
                          type: string
                          enum: [DM, PLAYER, SPECTATOR]
                        joinedAt: { type: string, format: date-time }
                        characters:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              name: { type: string }
                              tokenImageUrl: { type: string, nullable: true }
                              gameSystem: { type: string, nullable: true }
                              userId: { type: string, format: uuid }
                              hp:
                                type: object
                                nullable: true
                                properties:
                                  current: { type: integer }
                                  max: { type: integer }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/invitable-users:
    get:
      tags:
        - Campaigns
      summary: List users eligible to invite
      description: |
        Returns all users on the instance who are *not* already a member of
        the campaign and have no pending invitation to it. Used by the
        DM-side invite picker. DM only.
      operationId: listInvitableUsers
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Users available to invite.
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/campaigns/{campaignId}/invite:
    post:
      tags:
        - Campaigns
      summary: Invite user to campaign
      description: Add a user to the campaign as PLAYER (DM only)
      operationId: inviteUserToCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
              properties:
                userId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: User invited
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/members/{userId}:
    delete:
      tags:
        - Campaigns
      summary: Remove member
      description: Remove a member from campaign (DM only, cannot remove DM)
      operationId: removeMember
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/members/{userId}/role:
    put:
      tags:
        - Campaigns
      summary: Change member role
      description: Change a member's role (DM only, one DM per campaign enforced)
      operationId: changeMemberRole
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - role
              properties:
                role:
                  type: string
                  enum: [DM, PLAYER, SPECTATOR]
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/vibe:
    put:
      tags:
        - Campaigns
      summary: Update vibe/atmosphere
      description: Change the current vibe period for the campaign (DM only). Validates against campaign's vibeSettings.
      operationId: updateVibe
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - period
              properties:
                period:
                  type: string
                  description: Time period name (e.g., dawn, day, dusk, night)
      responses:
        '200':
          description: Vibe updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  currentVibe:
                    type: string
                  vibeData:
                    type: object
                    properties:
                      hue:
                        type: string
                      filter:
                        type: string
                      audio:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/admin/all:
    get:
      tags:
        - Campaigns
      summary: List all campaigns (Admin)
      description: Get all campaigns in the system (Admin only)
      operationId: listAllCampaigns
      security:
        - cookieAuth: []
      responses:
        '200':
          description: All campaigns
          content:
            application/json:
              schema:
                type: object
                properties:
                  campaigns:
                    type: array
                    items:
                      $ref: '#/components/schemas/Campaign'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # INVITATIONS
  # ============================================

  /api/invitations:
    get:
      tags:
        - Invitations
      summary: List my pending invitations
      description: |
        Returns the authenticated user's pending campaign invitations (status
        `PENDING`), ordered newest first, with the inviting campaign's summary
        info included so the UI can render an invitation card without
        additional fetches.
      operationId: listMyInvitations
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Pending invitations.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    campaignId: { type: string, format: uuid }
                    userId: { type: string, format: uuid }
                    status:
                      type: string
                      enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
                    createdAt: { type: string, format: date-time }
                    expiresAt: { type: string, format: date-time, nullable: true }
                    campaign:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        name: { type: string }
                        description: { type: string, nullable: true }
                        gameSystem: { type: string, nullable: true }
                        status:
                          type: string
                          enum: [PREPARATION, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
                        owner:
                          type: object
                          properties:
                            displayName: { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/invitations/{id}/accept:
    post:
      tags:
        - Invitations
      summary: Accept a campaign invitation
      description: |
        Accept the invitation and join the campaign as a `PLAYER`. Optionally
        assigns one or more of the accepting user's characters to the campaign
        in the same transaction.

        Validation:
        - The invitation must belong to the authenticated user and be `PENDING`.
        - Expired invitations are rejected.
        - All `characterIds` must belong to the user and not already be assigned
          to a campaign.
        - If the campaign has a `gameSystem` set, each character's `gameSystem`
          must either be null or match the campaign's.

        On success, also broadcasts a `roster.updated` event over the WebSocket
        to all current campaign members.
      operationId: acceptInvitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      requestBody:
        required: false
        description: |
          Optional list of characters to bring into the campaign. Omit or send
          `{ "characterIds": [] }` to join without assigning any characters.
        content:
          application/json:
            schema:
              type: object
              properties:
                characterIds:
                  type: array
                  items: { type: string, format: uuid }
            example:
              characterIds:
                - 4fbd7b27-c5cd-4d6f-9c80-0f7f30c75c2f
      responses:
        '200':
          description: Invitation accepted; campaign membership created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invitation accepted }
                  membership:
                    $ref: '#/components/schemas/CampaignMembership'
        '400':
          description: |
            Invitation already processed, expired, or character validation failed
            (not owned by user, already assigned, or game-system mismatch).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/invitations/{id}/decline:
    post:
      tags:
        - Invitations
      summary: Decline a campaign invitation
      description: |
        Marks the invitation as `DECLINED`. The invitation must belong to
        the authenticated user and currently be `PENDING`. Does not create
        any campaign membership.
      operationId: declineInvitation
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/InvitationId'
      responses:
        '200':
          description: Invitation declined.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invitation declined }
        '400':
          description: Invitation already processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  # ============================================
  # MESSAGES
  # ============================================

  /api/campaigns/{campaignId}/messages:
    get:
      tags:
        - Messages
      summary: Get message history
      description: Get paginated message history for a campaign (campaign member required). DICE_ROLL messages are excluded from chat history.
      operationId: getMessages
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: before
          in: query
          schema:
            type: string
            format: date-time
            description: Cursor-based pagination - get messages before this timestamp
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # SESSIONS
  # ============================================

  /api/campaigns/{campaignId}/sessions:
    post:
      tags:
        - Sessions
      summary: Start new session
      description: Start a new game session for the campaign (DM only). Auto-increments session number.
      operationId: startSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '201':
          description: Session started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    $ref: '#/components/schemas/Session'
        '400':
          description: Active session already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/sessions/{sessionId}/pause:
    put:
      tags:
        - Sessions
      summary: Pause session
      description: Pause an active game session (DM only)
      operationId: pauseSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session paused
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    $ref: '#/components/schemas/Session'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/sessions/{sessionId}/end:
    put:
      tags:
        - Sessions
      summary: End session
      description: End a game session and save the current game state (token positions, map, vibe, spirit layer). DM only.
      operationId: endSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Session ended with state saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    $ref: '#/components/schemas/Session'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/resume:
    put:
      tags:
        - Sessions
      summary: Resume last session
      description: Resume the most recently ended session, restoring saved game state (DM only)
      operationId: resumeSession
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      responses:
        '200':
          description: Session resumed with state restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  session:
                    $ref: '#/components/schemas/Session'
        '400':
          description: No ended session to resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ============================================
  # CHARACTERS
  # ============================================

  /api/characters:
    get:
      tags:
        - Characters
      summary: List user characters
      description: Get all characters owned by authenticated user
      operationId: listCharacters
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of characters
          content:
            application/json:
              schema:
                type: object
                properties:
                  characters:
                    type: array
                    items:
                      $ref: '#/components/schemas/Character'

    post:
      tags:
        - Characters
      summary: Create character
      description: |
        Create a new character.
        - If `campaignId` is provided and `gameSystem` is not specified, the
          character auto-inherits the campaign's `gameSystem`.
        - If `gameSystem` is provided, character data is validated against that
          system's Zod schema.
        - If `gameSystem` is null, no validation occurs (flexible character).
      operationId: createCharacter
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                gameSystem:
                  type: string
                  enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
                  nullable: true
                  description: Optional game system (auto-inherited from campaign if campaignId provided)
                campaignId:
                  type: string
                  format: uuid
                  nullable: true
                  description: Optional campaign to assign character to immediately
                data:
                  type: object
                  description: Flexible JSON data for character stats (validated if gameSystem is set)
                tokenImageUrl:
                  type: string
      responses:
        '201':
          description: Character created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: Validation error (invalid gameSystem or character data doesn't match schema)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation Error
                  message:
                    type: string
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        code:
                          type: string

  /api/characters/{id}:
    get:
      tags:
        - Characters
      summary: Get character
      description: Get character details (owner or campaign DM)
      operationId: getCharacterById
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Character details
          content:
            application/json:
              schema:
                type: object
                properties:
                  character:
                    $ref: '#/components/schemas/Character'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      tags:
        - Characters
      summary: Update character
      description: |
        Update character (owner or campaign DM).
        - `gameSystem` cannot be changed after character creation (returns 400 error).
        - If the character has a `gameSystem`, data updates are validated against
          that system's Zod schema.
        - If the character has no `gameSystem`, no validation occurs.
      operationId: updateCharacter
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                data:
                  type: object
                  description: Character data (validated if gameSystem is set)
                tokenImageUrl:
                  type: string
                gameSystem:
                  type: string
                  deprecated: true
                  description: DEPRECATED - Cannot change gameSystem after creation. Will return 400 error.
      responses:
        '200':
          description: Character updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
        '400':
          description: Validation error (trying to change gameSystem or data doesn't match schema)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Validation Error
                  message:
                    type: string
                  validationErrors:
                    type: array
                    items:
                      type: object
                      properties:
                        path:
                          type: string
                        message:
                          type: string
                        code:
                          type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      tags:
        - Characters
      summary: Delete character
      description: Delete character (owner only)
      operationId: deleteCharacter
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Character deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/characters/{id}/assign:
    post:
      tags:
        - Characters
      summary: Assign character to campaign
      description: |
        Assign character to a campaign (owner only, must be a campaign member).
        If `character.gameSystem !== campaign.gameSystem`, a warning is logged
        and returned in the response, but assignment is still allowed (DM decision).
      operationId: assignCharacterToCampaign
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaignId
              properties:
                campaignId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Character assigned (may include warning if game system mismatch)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  character:
                    $ref: '#/components/schemas/Character'
                  warning:
                    type: string
                    nullable: true
                    description: Warning message if character and campaign have different game systems
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/characters/{id}/validate:
    get:
      tags:
        - Characters
      summary: Validate character data against its game system schema
      description: |
        Re-runs the Zod schema for the character's `gameSystem` against its
        current `data` blob. Useful after editing a character to surface fields
        that no longer satisfy the schema (e.g. missing required ability
        scores after a game-system update).

        Returns `200 OK` with `isValid: false` and a list of field-level errors
        even when validation fails — this is not an error condition for the
        client. Only character owners can validate (prevents info leakage).
      operationId: validateCharacter
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CharacterId'
      responses:
        '200':
          description: "Validation result — note that an invalid character returns 200 with isValid=false (not an error)."
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid:
                    type: boolean
                  errors:
                    type: array
                    nullable: true
                    items:
                      type: object
                      properties:
                        path: { type: string, example: 'stats.strength' }
                        message: { type: string, example: 'Expected number, received string' }
                        code: { type: string, example: 'invalid_type' }
              examples:
                valid:
                  summary: All fields pass
                  value:
                    isValid: true
                invalid:
                  summary: Schema mismatch
                  value:
                    isValid: false
                    errors:
                      - path: 'stats.strength'
                        message: 'Expected number, received string'
                        code: 'invalid_type'
        '400':
          description: Character has no game system assigned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValid: { type: boolean, example: false }
                  errors:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        message: { type: string }
                        code: { type: string }
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/characters/{id}/copy:
    post:
      tags:
        - Characters
      summary: Duplicate a character
      description: |
        Creates a copy of the character owned by the same user. The copy is
        unassigned (`campaignId: null`) and its name is suffixed with `(Copy)`.
        Only the character owner may copy it.
      operationId: copyCharacter
      security:
        - cookieAuth: []
      parameters:
