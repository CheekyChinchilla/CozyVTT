      summary: Delete asset
      description: Delete asset. A personal asset, its owner or an admin; a campaign asset, its uploader while still a member of that campaign, the campaign's DM, or an admin; a global asset, an admin or the uploading global asset manager.
      operationId: deleteAsset
      security:
        - cookieAuth: []
