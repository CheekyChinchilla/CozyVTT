          description: List of token templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  templates:
                    type: array
                    items:
                      $ref: '#/components/schemas/TokenTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Token Templates]
      summary: Create token template
      description: Create a new token template (DM only).
      operationId: createTokenTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/token-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/CampaignId'
      - $ref: '#/components/parameters/TemplateId'
    get:
      tags: [Token Templates]
      summary: Get token template
      operationId: getTokenTemplate
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Token Templates]
      summary: Update token template
      operationId: updateTokenTemplate
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '200':
          description: Template updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Token Templates]
      summary: Delete token template
      operationId: deleteTokenTemplate
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Template deleted
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/campaigns/{campaignId}/token-templates/from-token:
    post:
      tags: [Token Templates]
      summary: Save token as template
      description: Create a token template from an existing map token's properties.
      operationId: saveTokenAsTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenTemplateInput'
      responses:
        '201':
          description: Template created from token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/campaigns/{campaignId}/token-templates/{id}/copy-to/{targetCampaignId}:
    post:
      tags: [Token Templates]
      summary: Copy template to another campaign
      description: |
        Copy a token template to another campaign. The authenticated user must
        be the DM of **both** the source and target campaigns.
      operationId: copyTokenTemplate
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - $ref: '#/components/parameters/TemplateId'
        - name: targetCampaignId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '201':
          description: Template copied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenTemplate'
        '400':
          description: Cannot copy a template to the same campaign.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================
  # CAMPAIGN EXPORT/IMPORT ENDPOINTS
  # ============================================

  /api/campaigns/{campaignId}/export:
    get:
      tags: [Campaign Export/Import]
      summary: Export campaign
      description: |
        Export a campaign as a .cozyvtt ZIP archive (DM only).
        Rate limited to 1 per 5 minutes per user.
      operationId: exportCampaign
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/CampaignId'
        - name: includeAudio
          in: query
          schema:
            type: boolean
            default: false
        - name: includeTokens
          in: query
          schema:
            type: boolean
            default: true
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '429':
          description: Rate limited

  /api/campaigns/import/preview:
    post:
      tags: [Campaign Export/Import]
      summary: Preview import archive
      description: Upload a .cozyvtt archive and return its manifest without creating anything.
      operationId: previewCampaignImport
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Archive preview
          content:
            application/json:
              schema:
                type: object
                properties:
                  preview:
                    $ref: '#/components/schemas/CampaignImportPreview'
        '400':
          description: Invalid archive

  /api/campaigns/import:
    post:
      tags: [Campaign Export/Import]
      summary: Import campaign
      description: |
        Upload a .cozyvtt archive and create a new campaign.
        Rate limited to 1 per 5 minutes per user.
      operationId: importCampaign
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                campaignName:
                  type: string
                importTokens:
                  type: string
                  enum: ['true', 'false']
                  default: 'true'
      responses:
        '201':
          description: Campaign imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  campaignId:
                    type: string
                  campaignName:
                    type: string
                  mapCount:
                    type: integer
                  tokenCount:
                    type: integer
                  creatureCount:
                    type: integer
                  tokenTemplateCount:
                    type: integer
        '400':
          description: Import failed
        '429':
          description: Rate limited

  # ============================================
  # ADMIN ENDPOINTS
  # ============================================

  /api/admin/stats:
    get:
      tags: [Admin]
      summary: Get system statistics
      description: Returns aggregate counts for users, campaigns, characters, maps, and asset storage broken down by type.
      operationId: adminGetStats
      security:
        - cookieAuth: []
      responses:
        '200':
          description: System statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  userCount:
                    type: integer
                  campaignCount:
                    type: integer
                  activeCampaignCount:
                    type: integer
                  totalStorageBytes:
                    type: integer
                  activeSessionCount:
                    type: integer
                  sessionCount:
                    type: integer
                  characterCount:
                    type: integer
                  mapCount:
                    type: integer
                  assetBreakdown:
                    type: array
                    items:
                      type: object
                      properties:
                        type:
                          type: string
                          enum: [MAP, TOKEN, AUDIO, AVATAR, DOCUMENT, OTHER]
                        count:
                          type: integer
                        sizeBytes:
                          type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/settings:
    get:
      tags: [Admin]
      summary: Get system settings
      operationId: adminGetSettings
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current system settings
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: object
                    properties:
                      id:
                        type: string
                      instanceName:
                        type: string
                      timezone:
                        type: string
                      allowRegistration:
                        type: boolean
                      requireAdminApproval:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [Admin]
      summary: Update system settings
      operationId: adminUpdateSettings
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                instanceName:
                  type: string
                  maxLength: 100
                timezone:
                  type: string
                  maxLength: 50
                allowRegistration:
                  type: boolean
                requireAdminApproval:
                  type: boolean
      responses:
        '200':
          description: Settings updated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/activity:
    get:
      tags: [Admin]
      summary: Get system activity
      description: Returns currently-online users (via session table), recent admin actions (SystemLog), 50 most recent registrations, and 20 most recent game sessions.
      operationId: adminGetActivity
      security:
        - cookieAuth: []
      responses:
        '200':
          description: System activity data
          content:
            application/json:
              schema:
                type: object
                properties:
                  onlineUsers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        email:
                          type: string
                        displayName:
                          type: string
                        platformRole:
                          type: string
                        lastLoginAt:
                          type: string
                          nullable: true
                        sessionExpiry:
                          type: string
                          nullable: true
                  recentLogs:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        level:
                          type: string
                          enum: [INFO, WARNING, ERROR, CRITICAL]
                        message:
                          type: string
                        userId:
                          type: string
                          nullable: true
                        context:
                          type: object
                          nullable: true
                        createdAt:
                          type: string
                  recentUsers:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  recentSessions:
                    type: array
                    items:
                      type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/config:
    get:
      tags: [Admin]
      summary: Get server configuration
      description: Returns read-only server configuration — upload size limits, session timeouts, and SMTP status (no credentials exposed).
      operationId: adminGetConfig
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Server configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  uploadLimits:
                    type: object
                    properties:
                      MAP:
                        type: integer
                        description: Max file size in bytes
                      TOKEN:
                        type: integer
                      AUDIO:
                        type: integer
                      AVATAR:
                        type: integer
                  sessionTimeoutMs:
                    type: integer
                  rememberMeTimeoutMs:
                    type: integer
                  smtp:
                    type: object
                    properties:
                      configured:
                        type: boolean
                      host:
                        type: string
                        nullable: true
                      port:
                        type: integer
                      user:
                        type: string
                        nullable: true
                      secure:
                        type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/users:
    post:
      tags: [Admin]
      summary: Create a new user
      description: Creates a user with a generated temporary password. The user must change their password on first login (`mustChangePassword` is set to true).
      operationId: adminCreateUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                displayName:
                  type: string
                  maxLength: 50
                platformRole:
                  type: string
                  enum: [USER, ADMIN]
                  default: USER
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  user:
                    $ref: '#/components/schemas/User'
                  temporaryPassword:
                    type: string
                    description: One-time temporary password — store securely and share with user
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Email already in use

  /api/admin/users/{id}/approve:
    post:
      tags: [Admin]
      summary: Approve a pending user registration
      description: Approves a user who registered while `requireAdminApproval` was enabled. Blocked users receive a 403 on login until approved.
      operationId: adminApproveUser
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: User approved
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/users/{id}/reset-mfa:
    post:
      tags: [Admin]
      summary: Reset MFA for a locked-out user
      description: Disables TOTP and clears backup codes for a user who is locked out. The user must re-enroll MFA on next login. Admin accounts will be forced to re-enroll on their next MFA-required action.
      operationId: adminResetUserMfa
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: MFA reset successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: MFA is not enabled for this user
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/smtp/test:
    post:
      tags: [Admin]
      summary: Send a test email to verify SMTP configuration
      operationId: adminTestSmtp
      description: Sends a test email to the calling admin's own email address. Returns 400 if SMTP is not configured via environment variables.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Test email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: SMTP is not configured (missing env vars)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Failed to send email (SMTP connection error)

  /api/admin/backups:
    post:
      tags: [Admin]
      summary: Trigger a database backup
      operationId: adminCreateBackup
      description: |
        Runs `pg_dump` to create a `.sql` backup file in the server's backup directory.
        **Requires `pg_dump` (postgresql-client) to be installed on the server.**
        Returns 500 with a helpful message if `pg_dump` is not found.
        Note: Full in-app backup (create → download as ZIP, restore via file upload) is planned for a future release.
      security:
        - cookieAuth: []
      responses:
        '201':
          description: Backup created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  filename:
                    type: string
                  sizeBytes:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: pg_dump not found or backup failed
    get:
      tags: [Admin]
      summary: List database backups
      operationId: adminListBackups
      description: Returns all `.sql` backup files in the server's backup directory with filename, size, and creation time.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of backups
          content:
            application/json:
              schema:
                type: object
                properties:
                  backups:
                    type: array
                    items:
                      type: object
                      properties:
                        filename:
                          type: string
                        sizeBytes:
                          type: integer
                        createdAt:
                          type: string
                          format: date-time
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/admin/backups/{filename}/download:
    get:
      tags: [Admin]
      summary: Download a backup file
      operationId: adminDownloadBackup
      description: Streams a backup `.sql` file as a download. Filename is strictly validated against `backup-YYYY-MM-DDTHH-MM-SS.sql` pattern to prevent path traversal.
      security:
        - cookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
          example: backup-2026-03-04T10-30-00.sql
      responses:
        '200':
          description: Backup file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          description: Invalid filename format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/admin/backups/{filename}:
    delete:
      tags: [Admin]
      summary: Delete a backup file
      operationId: adminDeleteBackup
      description: Deletes a backup `.sql` file from the server. Filename is strictly validated. Action is logged to SystemLog.
      security:
        - cookieAuth: []
      parameters:
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backup deleted
        '400':
          description: Invalid filename format
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

# ============================================
# WEBSOCKET EVENTS
# ============================================
#
# Real-time events are delivered via Socket.io (WebSocket/polling transport).
# Connect to the same server URL with a Socket.io client (withCredentials: true).
#
# ## Authentication Flow
# 1. Client connects with session cookie (same credential as REST API)
# 2. Server validates session and emits 'connected' event
# 3. Client emits 'authenticate' with { campaignId }
# 4. Server validates campaign membership and joins the campaign room
# 5. Server emits 'authenticated' event — client may now send campaign events
#
# ## Security Model
# - socket.campaignId is set server-side during authentication — never trust client-sent IDs
# - Events are broadcast only to sockets in the same campaign room
# - DM-only events are rejected with an error if called by a non-DM
# - Spirit layer tokens are role-filtered before broadcast (non-DMs only see visible tokens)
#
# ─────────────────────────────────────────────
# CLIENT → SERVER EVENTS
# ─────────────────────────────────────────────
#
# authenticate:
#   payload: { campaignId: string }
#   response: 'authenticated' event with { userId, campaignId, role, timestamp }
#   description: Join a campaign room. Must be called before any campaign events.
#
# ── Chat ────────────────────────────────────
#
# chat.message:
#   payload: { content: string, type: 'PLAYER' | 'DM' }
#   broadcast: 'chat.message' to all campaign members
#   rate limit: 5 per minute
#   description: Send a chat message. Message is saved to database.
#
# ── Dice ────────────────────────────────────
#
# dice.roll:
#   payload: { expression: string, characterName?: string, purpose?: string, secret?: boolean }
#   broadcast: 'dice.rolled' to all members (or only to roller + DM if secret: true)
#   rate limit: 30 per minute
#   description: Roll dice using standard notation (e.g. "1d20+5", "2d6", "4d6kh3").
#                Supports keep-highest (kh), keep-lowest (kl), advantage (2d20kh1), disadvantage (2d20kl1).
#                Roll is saved to database. Secret rolls are still saved for DM audit.
#
# dice.clearHistory:
#   payload: none
#   broadcast: 'dice.historyCleared' to all campaign members
#   permission: DM only
#   description: Clears the dice roll history in all connected clients' UI.
#
# ── Token Movement ───────────────────────────
#
# token.move.start:
#   payload: { tokenId: string, mapId: string }
#   broadcast: 'token.move.start' to campaign (role-filtered for spirit tokens)
#   description: Begin dragging a token. Validates move permission (DM = any, Player = controlled tokens only).
#
# token.move:
#   payload: { tokenId: string, mapId: string, x: number, y: number }
#   broadcast: 'token.moved' to campaign (role-filtered for spirit tokens)
#   rate limit: 60 per second (throttled via lodash)
#   description: Live position update during drag. Not saved to database.
#
# token.move.end:
#   payload: { tokenId: string, mapId: string, x: number, y: number }
#   broadcast: 'token.move.end' to all campaign members
#   description: Final token position. Saved to database.
#
# ── Map ─────────────────────────────────────
#
# map.change:
#   payload: { mapId: string }
#   broadcast: 'map.changed' to all campaign members with updated map data
#   description: Notifies all clients that map data has changed (e.g. after token add/remove/update).
#
# ── Spirit Layer ─────────────────────────────
#
# spirit_layer.toggle:
#   payload: { visible: boolean }
#   broadcast: 'spirit_layer.toggled' to all campaign members
#   permission: DM only
#   description: Show or hide the spirit layer for all players. Saved to campaign.
#
# spirit_layer.token.toggle:
#   payload: { mapId: string, tokenId: string, visible: boolean }
#   broadcast: 'spirit_layer.token.toggled' to campaign
#   permission: DM only
#   description: Toggle visibility of an individual spirit layer token.
#
# spirit_layer.style_change:
#   payload: { style: string }
#   broadcast: 'spirit_layer.style_changed' to all campaign members
#   permission: DM only
#   description: Change the visual style of the spirit layer overlay.
#                style is either "wispy" or "custom:#hexcolor" (e.g. "custom:#7c3aed").
#
# ── Vibe / Atmosphere ────────────────────────
#
# vibe.update:
#   payload: { period: string }
#   broadcast: 'vibe.updated' with { period, hue, filter, audio }
#   permission: DM only
#   description: Change the active time-of-day vibe. Validated against campaign.vibeSettings.periods.
#
# atmosphere.effect.set:
#   payload: { effect: string | null }
#   broadcast: 'atmosphere.effect.updated' with { effect }
#   permission: DM only
#   description: Set a visual overlay effect (e.g. "rain", "fog") or null to clear.
#
# atmosphere.audio.set:
#   payload: { audioUrl: string | null, volume?: number }
#   broadcast: 'atmosphere.audio.updated' with { audioUrl, volume }
#   permission: DM only
#   description: Set ambient background audio or null to stop. Volume is 0–1.
#
# ── Session ──────────────────────────────────
#
# session.start:
#   payload: { mapId?: string }
#   broadcast: 'session.started' with { sessionId, sessionNumber, startedAt }
#   permission: DM only
#   description: Start a new game session.
#
# session.pause:
#   payload: none
#   broadcast: 'session.paused' to all members
#   permission: DM only
#   description: Pause the active session. Saves current state to database.
#
# session.end:
#   payload: { saveState?: boolean }
#   broadcast: 'session.ended' to all members
#   permission: DM only
#   description: End the session. If saveState is true, token positions and map state are saved.
#
# session.resume:
#   (Handled via REST: PUT /api/campaigns/:id/resume — triggers 'session.resumed' broadcast)
#
# ── Character HP ─────────────────────────────
#
# character.hp.update:
#   payload: { characterId: string, delta: number }
#   broadcast: 'character.hp.updated' with { characterId, hp: { current, max, temp } }
#   description: Apply a HP delta to a character (positive = heal, negative = damage).
#                Character must belong to the campaign. Saved to database.
#
# ── Initiative Tracker ───────────────────────
#
# initiative.add:
#   payload: { tokenId: string, mapId: string }
#   broadcast: 'initiative.state' with full CombatState to all members
#   permission: DM only
#   description: Add a token to the initiative order.
#                Token's current initiative value (if set) is used automatically.
#
# initiative.remove:
#   payload: { tokenId: string }
#   broadcast: 'initiative.state' to all members
#   permission: DM only
#   description: Remove a token from the initiative order.
#                If this token had the active turn, advances to the next combatant.
#
# initiative.set:
#   payload: { tokenId: string, mapId: string, value: number | null }
#   broadcast: 'initiative.state' to all members
#   permission: DM only
#   description: Manually set a token's initiative value. Persists to token.initiative in database.
#                Combatants are re-sorted (descending, ties broken alphabetically).
#
# initiative.roll:
#   payload: { tokenId: string, mapId: string, expression: string, characterName?: string }
#   broadcast: 'dice.rolled' to all members + 'initiative.state' to all members
#   permission: DM only
#   description: Roll a dice expression for this token's initiative (e.g. "1d20+3").
#                Result is broadcast to dice log and saved to token.initiative.
#                Token is auto-added to initiative order if not already present.
#
# initiative.reorder:
#   payload: { orderedTokenIds: string[] }
#   broadcast: 'initiative.state' to all members
#   permission: DM only
#   description: Apply a custom turn order (overrides value-based sorting).
#
# initiative.start:
#   payload: none
#   broadcast: 'initiative.state' to all members
#   permission: DM only
#   description: Begin combat. Sets active=true, round=1, currentTokenId=first combatant.
#                Requires at least one combatant to be added first.
#
# initiative.next:
#   payload: none
#   broadcast: 'initiative.state' to all members
#   permission: DM only
#   description: Advance to the next combatant. Wraps to the first combatant and increments
#                the round counter when the last combatant's turn ends.
#
# initiative.end:
#   payload: none
#   broadcast: 'initiative.state' with empty/reset state to all members
#   permission: DM only
#   description: End combat and clear all initiative state.
#                Token initiative values remain in the database; only the combat order is cleared.
#
# initiative.request_state:
#   payload: none
#   response: 'initiative.state' sent to requesting socket only
#   description: Request the current CombatState. Called on mount and reconnect.
#
# ── Connection ───────────────────────────────
#
# sync.request:
#   payload: { lastEventId?: string }
#   response: 'sync.state' with full campaign state
#   description: Request full state sync (used for reconnection recovery).
#
# ping:
#   payload: none
#   response: 'pong'
#   description: Heartbeat to verify connection health.
#
# ─────────────────────────────────────────────
# SERVER → CLIENT EVENTS
# ─────────────────────────────────────────────
#
# connected:
#   payload: { userId: string, timestamp: string }
#   description: Initial connection established. Client should emit 'authenticate' next.
#
# authenticated:
#   payload: { userId: string, campaignId: string, role: string, timestamp: string }
#   description: Successfully joined campaign room. Client may now emit campaign events.
#
# user.joined:
#   payload: { userId: string, timestamp: string }
#   description: A campaign member connected.
#
# user.left:
#   payload: { userId: string, timestamp: string }
#   description: A campaign member disconnected.
#
# chat.message:
#   payload: { id, userId, userName, content, type, timestamp }
#   description: New chat or DM message.
#
# chat.system:
#   payload: { content: string, metadata?: object, timestamp: string }
#   description: System message (user joined/left, session started, etc.)
#
# dice.rolled:
#   payload: { userId, userName, characterName, expression, result, breakdown, purpose, timestamp, secret }
#   description: Dice roll result broadcast to all members.
#                breakdown contains individual die results, modifiers, and total.
#                secret rolls are still broadcast but only to the roller (and DM via dice.rolled.secret).
#
# dice.rolled.secret:
#   payload: { ...dice.rolled fields, originalRoller: string, isAuditView: true }
#   description: DM-only audit view of a secret roll made by another player.
#
# dice.historyCleared:
#   payload: none
#   description: DM cleared dice history. All clients should clear their local history.
#
# token.move.start:
#   payload: { tokenId, mapId, movedBy }
#   description: Another user began dragging a token.
#
# token.moved:
#   payload: { tokenId, mapId, x, y, movedBy }
#   description: Token position update during drag.
#
# token.move.end:
#   payload: { tokenId, mapId, x, y, movedBy }
#   description: Token drag complete. Position saved to database.
#
# map.changed:
#   payload: { mapId: string, mapData: object }
#   description: Map data updated (tokens added, removed, or modified).
#
# spirit_layer.toggled:
#   payload: { visible: boolean, toggledBy: string, timestamp: string }
#   description: Spirit layer visibility changed for this campaign.
#
# spirit_layer.token.toggled:
#   payload: { tokenId: string, visible: boolean, token?: object, toggledBy: string, timestamp: string }
#   description: Individual spirit token visibility changed.
#
# spirit_layer.style_changed:
#   payload: { style: string }
#   description: Spirit layer visual style changed.
#
# vibe.updated:
#   payload: { period: string, hue: string, filter: string, audio?: string }
#   description: Vibe/atmosphere period changed.
#
# atmosphere.effect.updated:
#   payload: { effect: string | null }
#   description: Visual atmosphere effect changed.
#
# atmosphere.audio.updated:
#   payload: { audioUrl: string | null, volume: number }
#   description: Ambient audio changed.
#
# session.started:
#   payload: { sessionId: string, sessionNumber: number, startedAt: string }
#   description: A new game session has started.
#
# session.paused:
#   payload: { timestamp: string }
#   description: Session paused by DM.
#
# session.ended:
#   payload: { message: string }
#   description: Session ended by DM.
#
# session.resumed:
#   payload: { sessionId: string, sessionNumber: number, startedAt: string }
#   description: Session resumed (state restored from saved snapshot).
#
# character.hp.updated:
#   payload: { characterId: string, hp: { current: number, max: number, temp: number } }
#   description: A character's HP was updated. Broadcast to all campaign members.
#
# character.updated:
#   payload: { characterId: string, character: object }
#   description: Full character data was updated (e.g. after sheet save).
#
# initiative.state:
#   payload:
#     active: boolean                     — combat is running
#     round: number                       — current round (0 if not started)
#     currentTokenId: string | null       — tokenId of the active combatant
#     combatants: array of:
#       tokenId: string
#       name: string
#       imageUrl: string
#       initiative: number | null
#       hp: { current, max, temp } | null
#       type: 'player' | 'npc' | 'object'
#       disposition: 'friendly' | 'neutral' | 'hostile' | null
#   description: Full initiative state broadcast after every DM mutation.
#                Also sent to requesting client on initiative.request_state.
#
# sync.state:
#   payload: { campaign, map, tokens, currentVibe, spiritLayerEnabled }
#   description: Full campaign state for reconnection recovery.
#
# error:
#   payload: { message: string }
#   description: An error occurred processing an event (permission denied, validation failure, etc.)
#
# pong:
#   payload: none
#   description: Heartbeat response.

# ============================================
# COMPONENTS
# ============================================

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: cozyvtt.sid
      description: Session cookie obtained via /api/auth/login

  parameters:
    CampaignId:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Campaign UUID
    MapId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Map UUID
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: User UUID
    CharacterId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Character UUID
    AssetId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Asset UUID
    TemplateId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Token template UUID
    WallId:
      name: sid
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Wall segment UUID
    LightId:
      name: lightId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Light source UUID
    InvitationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Invitation UUID
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-indexed)
    LimitParam:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Items per page (max 100)

  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        platformRole:
          type: string
          enum: [ADMIN, USER]
        mfaEnabled:
          type: boolean
        avatarUrl:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastLoginAt:
          type: string
          format: date-time
          nullable: true

    UserPreferences:
      type: object
      description: Per-user appearance preferences (theme + font). All fields optional; partial updates are merged into existing preferences.
      properties:
        themeId:
          type: string
          enum:
            - cozy-default
            - autumn-hearth
            - desert-sand
            - rose-garden
            - ocean-depths
            - northern-frost
            - enchanted-forest
            - twilight-vale
            - obsidian-night
            - shadow-realm
            - deep-dungeon
            - midnight-court
            - parchment-classic
            - slate-modern
            - dragonfire
            - arcane-storm
            - custom
          description: Preset theme identifier, or "custom" to use customThemeColors.
        customThemeColors:
          type: object
          nullable: true
          description: Required when themeId is "custom". Set to null to clear.
          properties:
            primary:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            accent:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            background:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
            text:
              type: string
              pattern: '^#[0-9a-fA-F]{6}$'
          required: [primary, accent, background, text]
        fontId:
          type: string
          enum:
            - default
            - medieval
            - elegant
            - modern
            - handwritten
            - clean
            - scholarly
            - gothic

    Campaign:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        gameSystem:
          type: string
          enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
          nullable: true
          description: Primary game system for this campaign (optional)
        ownerId:
          type: string
          format: uuid
        status:
          type: string
          enum: [PREPARATION, ACTIVE, PAUSED, COMPLETED, ARCHIVED]
          default: PREPARATION
        currentMapId:
          type: string
          format: uuid
          nullable: true
        vibeSettings:
          type: object
          description: Vibe periods with hues, filters, and audio
        currentVibe:
          type: string
          nullable: true
          description: Current time period name
        spiritLayerEnabled:
          type: boolean
          default: false
        spiritLayerStyle:
          type: string
          default: wispy
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        lastPlayedAt:
          type: string
          format: date-time
          nullable: true

    CampaignMembership:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        role:
          type: string
          enum: [DM, PLAYER, SPECTATOR]
        characterIds:
          type: array
          items:
            type: string
            format: uuid
        joinedAt:
          type: string
          format: date-time

    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        sessionNumber:
          type: integer
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
        savedState:
          type: object
          nullable: true
          description: Captured game state (token positions, map, vibe, spirit layer)
        notes:
          type: string
          nullable: true

    Character:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        gameSystem:
          type: string
          enum: [DND_5E, PATHFINDER_2E, SHADOWRUN_6E, CALL_OF_CTHULHU_7E]
          nullable: true
          description: Game system for this character (determines data structure)
        data:
          type: object
          description: Flexible JSON data for character stats (structure depends on gameSystem)
        tokenImageUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [MAP, TOKEN, AUDIO, AVATAR]
        scope:
          type: string
          enum: [GLOBAL, CAMPAIGN]
        uploadedById:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
          nullable: true
        filename:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        fileSize:
          type: integer
        filePath:
          type: string
        thumbnailPath:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time

    Map:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: string
        baseLayerUrl:
          type: string
        spiritLayerUrl:
          type: string
          nullable: true
          description: Hidden from non-DM users when spirit layer is disabled
        width:
          type: integer
        height:
          type: integer
        gridSize:
          type: integer
          default: 50
        tokens:
          type: array
          items:
            $ref: '#/components/schemas/Token'
          description: Filtered by role (spirit layer tokens hidden from players)
        annotations:
          type: array
          items:
            type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TokenHp:
      type: object
      properties:
        current:
          type: integer
        max:
          type: integer
        temp:
          type: integer

    Token:
      type: object
      properties:
        id:
          type: string
          format: uuid
        characterId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        imageUrl:
          type: string
        position:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
            y:
              type: number
        size:
          type: object
          required:
            - width
            - height
          properties:
            width:
              type: number
            height:
              type: number
        layer:
          type: string
          enum: [token, spirit]
          description: 'token = normal layer; spirit = spirit/astral layer (hidden from players by default)'
        visible:
          type: boolean
          description: If false, hidden from players (DM can still see)
        controlledBy:
          type: string
          format: uuid
          nullable: true
          description: User ID of the player who controls this token (null = DM-only)
        rotation:
          type: number
          default: 0
          description: Rotation in degrees
        conditions:
          type: array
          items:
            type: string
          description: Active status conditions (e.g. "Poisoned", "Prone")
        metadata:
          type: object
          description: Arbitrary custom data
        type:
          type: string
          enum: [player, npc, object]
          description: Token classification; affects context menu options and initiative behavior
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true
          description: NPC attitude toward the party
        hp:
          $ref: '#/components/schemas/TokenHp'
          nullable: true
          description: Hit points / health for this token
        showHpBar:
          type: boolean
          default: false
          description: Whether to display the HP bar on the map canvas
        notes:
          type: string
          description: DM-only notes for this token
        initiative:
          type: integer
          nullable: true
          description: Initiative roll result for combat turn ordering

    TokenInput:
      type: object
      required:
        - name
        - imageUrl
        - position
      properties:
        characterId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        imageUrl:
          type: string
        position:
          type: object
          required:
            - x
            - y
          properties:
            x:
              type: number
            y:
              type: number
        size:
          type: object
          properties:
            width:
              type: number
              default: 1
            height:
              type: number
              default: 1
        layer:
          type: string
          enum: [token, spirit]
          default: token
        visible:
          type: boolean
          default: true
        controlledBy:
          type: string
          format: uuid
          nullable: true
        rotation:
          type: number
          default: 0
        conditions:
          type: array
          items:
            type: string
        metadata:
          type: object
        type:
          type: string
          enum: [player, npc, object]
          default: npc
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true
        hp:
          $ref: '#/components/schemas/TokenHp'
          nullable: true
        showHpBar:
          type: boolean
          default: false
        notes:
          type: string
          default: ''
        initiative:
          type: integer
          nullable: true

    CombatantEntry:
      type: object
      description: A single combatant in the initiative order
      properties:
        tokenId:
          type: string
          format: uuid
        name:
          type: string
        imageUrl:
          type: string
        initiative:
          type: integer
          nullable: true
        hp:
          $ref: '#/components/schemas/TokenHp'
          nullable: true
        type:
          type: string
          enum: [player, npc, object]
        disposition:
          type: string
          enum: [friendly, neutral, hostile]
          nullable: true

    CombatState:
      type: object
      description: Current initiative tracker state for a campaign
      properties:
        active:
          type: boolean
          description: Whether combat is currently running
        round:
          type: integer
          description: Current round number (0 if combat not started)
        currentTokenId:
          type: string
          format: uuid
          nullable: true
          description: Token ID of the combatant whose turn it is
        combatants:
          type: array
          items:
            $ref: '#/components/schemas/CombatantEntry'
          description: Ordered list of combatants (descending by initiative, ties broken alphabetically)

    CreatureTemplate:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        gameSystem:
          type: string
          nullable: true
        source:
          type: string
          enum: [srd, custom]
          description: "'srd' = imported from Open5e (global, read-only), 'custom' = campaign-specific"
        challengeRating:
          type: string
          nullable: true
        creatureType:
          type: string
          nullable: true
        alignment:
          type: string
          nullable: true
        imageUrl:
          type: string
          nullable: true
        statBlock:
          type: object
          description: |
            Game-system-agnostic stat block. Common keys: `ac`, `hpMax`, `hitDice`,
            `speed`, `abilities`, `traits`, `actions`. `hpMax` seeds the hit points
            of tokens placed from this creature (defaults to 10 when absent, as on
            stat blocks saved before hit points were tracked).
        size:
          type: object
          properties:
            width:
              type: integer
              default: 1
            height:
              type: integer
              default: 1
        disposition:
          type: string
          enum: [hostile, friendly, neutral]
          default: hostile
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
          default: pog
        campaignId:
          type: string
          format: uuid
          nullable: true
          description: "null for SRD creatures (global), set for custom creatures"
        createdById:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
          nullable: true
        type:
          type: string
          enum: [PLAYER, DM, SYSTEM, DICE_ROLL, CHARACTER_ACTION]
        content:
          type: string
        metadata:
          type: object
          nullable: true
        createdAt:
          type: string
          format: date-time

    TokenTemplate:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
          nullable: true
        type:
          type: string
          enum: [npc, player, object]
        disposition:
          type: string
          nullable: true
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
        size:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        notes:
          type: string
          nullable: true
        hp:
          type: object
          nullable: true
          properties:
            current:
              type: integer
            max:
              type: integer
            temp:
              type: integer
        showHpBar:
          type: boolean
        statBlock:
          type: object
          nullable: true
        sightRadius:
          type: number
          nullable: true
        campaignId:
          type: string
        createdById:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TokenTemplateInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        imageUrl:
          type: string
        type:
          type: string
          enum: [npc, player, object]
        disposition:
          type: string
        displayMode:
          type: string
          enum: [pog, top-down, full-art]
        size:
          type: object
          properties:
            width:
              type: integer
            height:
              type: integer
        notes:
          type: string
        hp:
          type: object
          nullable: true
          properties:
            current:
              type: integer
            max:
              type: integer
            temp:
              type: integer
        showHpBar:
          type: boolean
        statBlock:
          type: object
          nullable: true
        sightRadius:
          type: number

    CampaignImportPreview:
      type: object
      properties:
        formatVersion:
          type: integer
        exportedAt:
          type: string
        exportedFrom:
          type: string
        campaignName:
          type: string
        gameSystem:
          type: string
        mapCount:
          type: integer
        tokenCount:
          type: integer
        creatureCount:
          type: integer
        tokenTemplateCount:
          type: integer
        assetCount:
          type: integer
        includesAudio:
          type: boolean
        totalSizeBytes:
          type: integer

    Error:
      type: object
      properties:
        error:
          type: string
          example: BadRequest
          description: Short machine-readable error identifier
        message:
          type: string
          example: One or more fields failed validation.
          description: Human-readable error description
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: Optional structured details (e.g. per-field Zod issues)

    Wall:
      type: object
      description: A wall segment that blocks vision (or a door/window variant).
      properties:
        id:
          type: string
          format: uuid
        x1:
          type: number
          description: Start X in map-space pixels (origin top-left)
          example: 240
        y1:
          type: number
          example: 180
        x2:
          type: number
          example: 400
        y2:
          type: number
          example: 180
        type:
          type: string
          enum: [wall, door-closed, door-open, door-locked, window]
          description: |
            * `wall` — blocks vision.
            * `door-closed` — blocks vision; clickable to open.
            * `door-open` — does not block vision.
            * `door-locked` — blocks vision; only DM can unlock.
            * `window` — does not block vision.
      required: [id, x1, y1, x2, y2, type]

    WallInput:
      type: object
      description: Wall segment without `id` (assigned server-side).
      properties:
        x1: { type: number }
        y1: { type: number }
        x2: { type: number }
        y2: { type: number }
        type:
          type: string
          enum: [wall, door-closed, door-open, door-locked, window]
      required: [x1, y1, x2, y2, type]

    LightSource:
      type: object
      description: A point light placed by the DM with separate bright and dim radii.
      properties:
        id:
          type: string
          format: uuid
        x:
          type: number
          description: X position in map-space pixels
          example: 320
        y:
          type: number
          example: 240
        brightRadius:
          type: number
          minimum: 0
          description: Full-visibility radius in grid squares
          example: 4
        dimRadius:
          type: number
          minimum: 0
          description: Dim-light radius in grid squares (must be ≥ brightRadius)
          example: 8
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
          example: '#ffcc66'
        enabled:
          type: boolean
          description: Toggle without deleting (e.g. extinguished torch)
          example: true
      required: [id, x, y, brightRadius, dimRadius, color, enabled]

    LightSourceInput:
      type: object
      description: Light source without `id` (assigned server-side).
      properties:
        x: { type: number }
        y: { type: number }
        brightRadius: { type: number, minimum: 0 }
        dimRadius: { type: number, minimum: 0 }
        color:
          type: string
          pattern: '^#[0-9a-fA-F]{6}$'
        enabled:
          type: boolean
          default: true
      required: [x, y, brightRadius, dimRadius, color]

    FogState:
      type: object
      description: |
        Fog-of-war state for a map. `revealed` is a flat boolean array;
        cell (col, row) maps to index `row * fogCols + col`.
      properties:
        fogCols:
          type: integer
          minimum: 1
          description: Number of fog cells horizontally
          example: 50
        fogRows:
          type: integer
          minimum: 1
          example: 30
        cellPx:
          type: integer
          minimum: 1
          description: Fog cell size in map pixels
          example: 32
        revealed:
          type: array
          items:
            type: boolean
          description: Length must equal `fogCols * fogRows`
      required: [fogCols, fogRows, cellPx, revealed]

    FogOperation:
      type: object
      description: A fog reveal/hide operation. The `op` field discriminates the variant.
      oneOf:
        - type: object
          properties:
            op: { type: string, enum: [reveal, hide] }
            cells:
              type: array
              items: { type: integer, minimum: 0 }
              description: Cell indices to flip
          required: [op, cells]
        - type: object
          properties:
            op: { type: string, enum: [reveal_all, hide_all] }
          required: [op]

    Invitation:
      type: object
      description: Pending campaign invitation.
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        campaignName:
          type: string
          example: The Lost Mines
        gameSystem:
          type: string
          nullable: true
          example: DND_5E
        role:
          type: string
          enum: [DM, PLAYER, SPECTATOR]
          example: PLAYER
        invitedBy:
          type: object
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        status:
          type: string
          enum: [PENDING, ACCEPTED, DECLINED, EXPIRED]
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true

    AppearanceSettings:
      type: object
      description: |
        Instance-wide appearance settings — used on public/unauthenticated pages
        and as the default for users who have not picked their own theme.
      properties:
        instanceName:
          type: string
          example: CozyVTT
        themeId:
          type: string
          example: cozy-default
        customThemeColors:
          type: object
          nullable: true
          properties:
            primary:    { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            accent:     { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            background: { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
            text:       { type: string, pattern: '^#[0-9a-fA-F]{6}$' }
        fontId:
          type: string
          example: default
        customLogoUrl:
          type: string
          nullable: true
        customFaviconUrl:
          type: string
          nullable: true
        customMascotUrl:
          type: string
          nullable: true

  responses:
    BadRequest:
      description: Bad Request - Invalid input or validation failure.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: BadRequest
            message: Required field "name" is missing.

    Unauthorized:
      description: Unauthorized - Not authenticated or MFA pending.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Unauthorized
            message: Authentication required.

    Forbidden:
      description: Forbidden - Authenticated but insufficient permissions.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Forbidden
            message: You do not have permission to perform this action.

    NotFound:
      description: Not Found - Resource does not exist or you cannot see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NotFound
            message: Campaign not found.

    Conflict:
      description: Conflict - Request conflicts with current resource state.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: Conflict
            message: A creature with this name already exists in this campaign.

    UnprocessableEntity:
      description: Unprocessable Entity - Schema-valid but semantically rejected.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UnprocessableEntity
            message: Character data does not match the campaign's game system schema.
            details:
              field: 'data.stats.strength'
              issue: 'Expected number, received string'

    RateLimited:
      description: |
        Too Many Requests - Rate limit exceeded. Response includes
        `RateLimit-Limit`, `RateLimit-Remaining`, and `RateLimit-Reset` headers.
      headers:
        RateLimit-Limit:
          schema: { type: integer }
          description: Maximum requests permitted in the current window
        RateLimit-Remaining:
          schema: { type: integer }
          description: Requests remaining in the current window
        RateLimit-Reset:
          schema: { type: integer }
          description: Seconds until the window resets
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: TooManyRequests
            message: Upload rate limit reached. Please slow down and try again in a minute.

    ServerError:
      description: Internal Server Error - Something went wrong on the server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: InternalServerError
            message: An unexpected error occurred. Please try again later.
