            format: uuid
      responses:
        '200':
          description: Audio stream
          content:
            audio/*:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content (range request)
        '404':
          $ref: '#/components/responses/NotFound'

  /api/assets/avatars/{userId}:
