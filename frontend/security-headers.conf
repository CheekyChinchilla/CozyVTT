# ============================================================================
# Security response headers for the CozyVTT app page.
#
# These belong on the response that carries the HTML, which is this container:
# a Content-Security-Policy on a JSON response governs nothing, so the policy
# helmet sets in backend/src/app.ts covers /api only and never reached the
# page. This file is what protects the page itself.
#
# **Included, not inherited.** An nginx `location` that sets any add_header of
# its own discards every add_header from the enclosing server block. Both
# blocks below set Cache-Control, and `try_files` internally redirects to
# `= /index.html`, so a server-level copy of these headers would reach nothing
# at all. Every location includes this file instead. If you add a location,
# include it there too.
#
# The policy is derived from what the app actually loads. Keep it in step with
# backend/src/app.ts, which describes the same application:
#
#   script-src 'self'          The built page has no inline script. This is the
#                              directive that stops injected markup executing,
#                              and it is worth keeping strict.
#   style-src  'unsafe-inline' Framer Motion and the theme switcher write style
#                              attributes; Tailwind ships a real stylesheet.
#   font-src 'self' data:      The typefaces are part of the app
#                              (frontend/src/assets/fonts); the build inlines
#                              the smallest files into the stylesheet.
#   img-src data: blob:        Canvas exports, and the avatar crop preview.
#   frame-src 'self'           The document reader shows a PDF from /api in a
#                              sandboxed iframe.
#   connect-src ws: wss:       Socket.io. The API and the live connection are
#                              served from the page's own address, so 'self'
#                              covers everything else the page fetches.
#
# Deliberately NOT set: upgrade-insecure-requests. CozyVTT is commonly served
# over plain HTTP on a home network, and that directive would rewrite every
# request on such an instance to https and break it.
#
# This file covers the production image only. The Vite dev server serves its
# own page with an inline module script for hot reload, so `script-src 'self'`
# would stop `npm run dev` working; a violation that only appears in
# production is the price of that, and the test in
# src/__tests__/securityHeaders.test.ts is what stands in for it.
# ============================================================================

# connect-src names the live table's socket on this host, on any port (the
# port is not always in the Host the proxy passes): a bare ws: or wss: allowed
# any host, and 'self' alone does not match ws: and wss: in every supported
# browser. As in backend/src/app.ts.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws://$host:* wss://$host:*; media-src 'self'; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# frame-ancestors already forbids framing; this is the same answer for anything
# that predates it.
add_header X-Frame-Options "DENY" always;

# Never let a browser second-guess a content type we set deliberately.
add_header X-Content-Type-Options "nosniff" always;

# A campaign URL carries its id. Send the origin to other sites, never the path.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# CozyVTT asks for none of these; say so rather than leaving it to the browser.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
