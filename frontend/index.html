<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary meta -->
    <meta name="description" content="CozyVTT — a self-hosted, browser-based Virtual Tabletop for cozy, narrative-driven RPG campaigns. Studio Ghibli-inspired aesthetics." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#5c6b3c" />

    <!-- Open Graph (renders a nice card if the URL is ever shared internally) -->

    <meta property="og:title"       content="CozyVTT" />
    <meta property="og:description" content="A self-hosted Virtual Tabletop for cozy, narrative-driven campaigns." />
    <meta property="og:site_name"   content="CozyVTT" />

    <!-- Fonts — preconnect first to start the DNS lookup immediately -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

    <title>CozyVTT</title>
  </head>
