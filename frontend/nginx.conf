server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Text is compressed on the way out: the app's scripts and styles shrink
    # to about a third. Pictures, sounds and fonts are compressed already.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary       on;
    gzip_types      text/css application/javascript application/json image/svg+xml text/plain;

    # Error pages and the Server header leave out the nginx version.
    server_tokens off;

    # Security headers. Included in every location rather than set once here:
    # a location with any add_header of its own drops the ones above it, and
    # both cache blocks below have one. See security-headers.conf.
    include /etc/nginx/security-headers.conf;

    # A redirect nginx makes itself is relative, so it keeps the address the
    # visitor used. Absolute, it names the host without the visitor's port, and
    # a visitor on port 8160 was sent to port 80. None is expected now that a
    # folder is no longer redirected to; this keeps a future one from doing it.
    absolute_redirect off;

    # SPA routing: any path that is not a file falls back to index.html.
    #
    # A path that names a folder is an app route too, not a listing. The build
    # has a folder called assets/ for its scripts and styles, which is also the
    # name of the Asset Library page (/assets). `$uri/` here matched that folder:
    # nginx redirected /assets to /assets/ and then refused to list the folder
    # (403 Forbidden), so reloading or bookmarking the page failed while
    # clicking to it worked. The folder's files are served as before, by the
    # locations below.
    location / {
        include /etc/nginx/security-headers.conf;
        if (-d $request_filename) {
            rewrite ^ /index.html last;
        }
        try_files $uri /index.html;
    }

    # Cache immutable static assets (hashed filenames from Vite build)
    location ~* \.(js|css|woff|woff2|ttf|eot)$ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Cache images but allow revalidation
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        include /etc/nginx/security-headers.conf;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Never cache the entry point
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }
}
